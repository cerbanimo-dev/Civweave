services:
  civweave:
    build:
      context: .
      dockerfile: Dockerfile.federated
    image: civweave/federated-node:local
    init: true
    restart: unless-stopped
    ports:
      - "${CIVWEAVE_PORT:-8787}:8787"
    environment:
      PUBLIC_HOST_URL: ${PUBLIC_HOST_URL:-http://localhost:8787}
      CIVWEAVE_NODE_NAME: ${CIVWEAVE_NODE_NAME:-Civweave Community Node}
      CIVWEAVE_NODE_DESCRIPTION: ${CIVWEAVE_NODE_DESCRIPTION:-A sovereign Civweave community node.}
      CIVWEAVE_FEDERATION_ADMIN_TOKEN: ${CIVWEAVE_FEDERATION_ADMIN_TOKEN:?Set CIVWEAVE_FEDERATION_ADMIN_TOKEN in .env.federated}
      CIVWEAVE_ALLOW_UNAUTHENTICATED_ADMIN: ${CIVWEAVE_ALLOW_UNAUTHENTICATED_ADMIN:-false}
      CIVWEAVE_NODE_CAPABILITIES: ${CIVWEAVE_NODE_CAPABILITIES:-release-distribution,node-discovery,federated-events,fellowfare.exchange,living-school.curricula,anarchadia.proposals,portable-proofs}
      CIVWEAVE_AUTO_ACCEPT_PEERS: ${CIVWEAVE_AUTO_ACCEPT_PEERS:-false}
      CIVWEAVE_MAX_FEDERATION_EVENTS: ${CIVWEAVE_MAX_FEDERATION_EVENTS:-5000}
      CIVWEAVE_MAX_PENDING_PEERS: ${CIVWEAVE_MAX_PENDING_PEERS:-256}
      HUB_TOKEN: ${HUB_TOKEN:-}
      DATA_DIR: /app/data
    volumes:
      - civweave_data:/app/data

  anchor:
    profiles: ["anchor"]
    image: civweave/federated-node:local
    init: true
    restart: unless-stopped
    depends_on:
      - civweave
    command:
      - node
      - scripts/civweave-hub-anchor-v1.mjs
      - --node
      - ${CIVWEAVE_CLOUD_NODE_ORIGIN:-}
      - --pair
      - ${CIVWEAVE_ANCHOR_PAIRING_GRANT:-}
      - --data-dir
      - /app/anchor-data
      - --interval-hours
      - ${CIVWEAVE_ANCHOR_SYNC_HOURS:-6}
    volumes:
      - civweave_anchor_data:/app/anchor-data

volumes:
  civweave_data:
  civweave_anchor_data: