[platformio]
default_envs = sticks3

[env:sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
framework = arduino
monitor_speed = 115200
lib_deps =
  M5Unified=https://github.com/m5stack/M5Unified
  M5PM1=https://github.com/m5stack/M5PM1
build_flags =
  -DESP32S3
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -mfix-esp32-psram-cache-issue
  -DBOARD_HAS_PSRAM
  -DCW_ENABLE_LORA=0

; Explicit opt-in: four predefined PUBLIC ESP-NOW game beacons.
; This does not enable LoRa and must not carry private plaintext.
[env:sticks3_espnow]
extends = env:sticks3
build_flags =
  ${env:sticks3.build_flags}
  -DCW_ENABLE_ESPNOW=1
