[platformio]
default_envs = sticks3

[env:sticks3]
platform = espressif32
board = m5stack-sticks3
framework = arduino
monitor_speed = 115200
lib_deps =
  m5stack/M5Unified
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DCW_ENABLE_LORA=0

[env:native]
platform = native
test_framework = unity
test_build_project_src = no
