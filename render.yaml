services:
  - type: web
    name: civweave-host-node
    runtime: node
    plan: free
    buildCommand: |
      npm install --omit=dev --no-audit --no-fund
      npm run onnxruntime:stage
      npm run check
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HUB_NAME
        value: Civweave Host Node
      - key: DATA_DIR
        value: ./data
      - key: MAX_ENVELOPES
        value: "5000"
