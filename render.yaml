services:
  - type: web
    name: commonweave-host-node
    runtime: node
    plan: free
    buildCommand: |
      npm install --no-audit --no-fund
      node scripts/stage-transformers-assets.mjs --force
      for attempt in 1 2 3 4 5; do
        if npm run model:pull; then
          break
        fi
        if [ "$attempt" = 5 ]; then
          echo 'MiniLM package could not be materialized after five attempts.' >&2
          exit 1
        fi
        sleep $((attempt * 8))
      done
      npm run model:check
      npm run check
      npm run build:install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HUB_NAME
        value: Commonweave Host Node
      - key: DATA_DIR
        value: ./data
      - key: MAX_ENVELOPES
        value: "5000"
