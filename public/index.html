<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061019">
  <title>Civweave</title>
  <link rel="icon" href="/app/logos/civweave-canonical.png" type="image/png">
  <style>html,body{width:100%;height:100%;margin:0;background:#061019}</style>
  <script src="/app/civweave-brand.js?v=1.0.58"></script>
  <script>
  (() => {
    'use strict';
    const VERSION='1.0.58';
    const params=new URLSearchParams(location.search);
    const installer=new URL('/app/index.html',location.origin);
    for(const [key,value] of params){if(key==='source')continue;installer.searchParams.append(key,value)}
    installer.searchParams.set('source','host-bootstrap');
    installer.searchParams.set('version',VERSION);
    installer.hash=location.hash;
    location.replace(installer.href);
  })();
  </script>
</head>
<body></body>
</html>
