<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061019">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Civweave</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#061019;color:#eaf8ff;font-family:system-ui,sans-serif}
    body{display:grid;place-items:center;padding:24px}
    #cw-root-status{max-width:34rem;padding:18px 20px;border:1px solid #8de5ef44;border-radius:16px;background:#0a1a25;color:#cfeef5;text-align:center;line-height:1.5}
  </style>
</head>
<body>
<main id="cw-root-status">Opening Civweave…</main>
<script>
(()=>{
'use strict';
const CANONICAL_ORIGIN='https://civweave.cc';
const STAGING_ORIGIN='https://civweave-staging.pages.dev';
const PREVIOUS_CANONICAL_ORIGIN='https://civweave.pages.dev';
const LEGACY_CANONICAL_ORIGIN='https://commonweave.pages.dev';
const HOST_NODE_ORIGIN='https://civweave-host-node.onrender.com';
const params=new URLSearchParams(location.search);
const localDevelopment=['localhost','127.0.0.1','::1'].includes(location.hostname);
const cloudflarePreview=location.hostname.endsWith('.pages.dev')&&location.hostname.split('.').length>3;
const standalone=()=>navigator.standalone===true||['standalone','fullscreen','minimal-ui','window-controls-overlay'].some(mode=>matchMedia(`(display-mode: ${mode})`).matches);
function copyParams(target,blocked=new Set()){for(const [key,value] of params)if(!blocked.has(key))target.searchParams.append(key,value);return target}
function stableInstaller(){
  let origin=location.origin;
  if(!localDevelopment&&(location.origin===HOST_NODE_ORIGIN||location.origin===PREVIOUS_CANONICAL_ORIGIN||location.origin===LEGACY_CANONICAL_ORIGIN||cloudflarePreview))origin=CANONICAL_ORIGIN;
  const target=new URL('/app/index.html',origin);copyParams(target,new Set(['install_origin']));target.searchParams.set('install_origin',cloudflarePreview?'host-production':'canonical');return target;
}
function installedStart(){
  const target=new URL('/app/pwa-start-v436.html',location.origin);
  target.searchParams.set('installed','1');
  target.searchParams.set('system',params.get('system')||'civweave');
  target.searchParams.set('source','root-worker-stable-v436');
  return target;
}
function workingCampus(){
  const target=new URL('/app/working-campus-v156.html',location.origin);
  copyParams(target,new Set(['install','installrequired','next','rescue_stay']));
  if(!target.searchParams.has('version'))target.searchParams.set('version','1.0.163');
  if(!target.searchParams.has('source'))target.searchParams.set('source','web-root-worker-stable-v436');
  return target;
}
try{
  if(params.get('install')==='required'||params.has('installrequired')){location.replace(stableInstaller().href);return}
  if(!localDevelopment&&(location.origin===HOST_NODE_ORIGIN||location.origin===PREVIOUS_CANONICAL_ORIGIN||location.origin===LEGACY_CANONICAL_ORIGIN||cloudflarePreview)){location.replace(stableInstaller().href);return}
  // Existing installed copies may still have / as their baked start_url. Never
  // register, unregister, update, or activate a worker from this root during a
  // standalone launch; move through the dedicated static doorway instead.
  if(standalone()||params.get('installed')==='1'){location.replace(installedStart().href);return}
  location.replace(workingCampus().href);
}catch(error){document.querySelector('#cw-root-status').textContent=`Civweave startup could not continue: ${error?.message||error}`}
globalThis.CivweaveRootRouterV436=Object.freeze({version:'root-worker-stable-v436',installedStart:()=>installedStart().href,workerMutationDuringLaunch:false});
})();
</script>
</body>
</html>
