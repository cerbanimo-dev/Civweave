<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07141f">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Commonweave Host Node</title>
  <link rel="icon" href="/app/logos/commonweave-icon-192.png">
  <style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#061019;font-family:Inter,system-ui,sans-serif}.host-world{position:fixed;inset:0}.host-world>img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}.host-hotspot{position:absolute;display:block;border:0;background:transparent;color:transparent;text-decoration:none;cursor:pointer}.host-hotspot:focus-visible{outline:4px solid rgba(255,241,166,.85);outline-offset:-4px}.host-install{left:20%;top:18%;width:60%;height:61%}.host-direct{right:2%;bottom:2%;width:25%;height:18%}.host-version{position:fixed;z-index:4;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));display:flex;align-items:center;gap:6px;padding:5px 9px 5px 5px;border:1px solid rgba(255,240,168,.42);border-radius:999px;background:rgba(4,17,24,.7);color:#fff0a8;font:800 .7rem ui-monospace,monospace;backdrop-filter:blur(10px)}.host-version img{width:30px;height:30px;object-fit:contain;border-radius:50%;background:#fff}.host-projection{position:fixed;z-index:3;left:50%;bottom:max(20px,calc(env(safe-area-inset-bottom) + 12px));transform:translateX(-50%);width:min(86vw,600px);padding:13px 18px;text-align:center;color:#effff7;text-shadow:0 1px 2px #001;background:radial-gradient(ellipse at center,rgba(29,174,184,.24),rgba(2,18,28,.78) 66%,transparent 98%);pointer-events:none}.host-projection strong{display:block;font-size:clamp(1rem,3vw,1.35rem);text-shadow:0 0 12px rgba(111,225,255,.72)}.host-projection span{display:block;margin-top:3px;color:#d1ebe3;font-size:.82rem}.host-dot{display:inline-block!important;width:8px;height:8px;margin-right:6px;border-radius:50%;background:#f4bf68}.host-dot.ok{background:#61ddb7;box-shadow:0 0 12px #61ddb7}@media(max-width:620px){.host-install{left:8%;top:15%;width:84%;height:68%}.host-direct{right:0;bottom:0;width:34%;height:20%}.host-projection{bottom:max(9px,env(safe-area-inset-bottom));width:94vw;padding:10px 12px}.host-projection span{font-size:.74rem}}</style>
</head>
<body>
<main class="host-world" aria-label="Commonweave host-node gateway">
  <img src="/app/assets/world/host-wave2.webp" alt="The Commonweave host hall." fetchpriority="high">
  <a class="host-hotspot host-install" href="/recover.html" aria-label="Retire old workers and enter the clean Commonweave shell">Recover and enter</a>
  <a class="host-hotspot host-direct" href="/loom/" aria-label="Enter the clean Commonweave shell directly">Enter clean shell</a>
</main>
<div class="host-version"><img src="/app/logos/commonweave.webp" alt=""><span>CLEAN-SLATE BUILD · v1.0.27</span></div>
<div class="host-projection" aria-live="polite"><strong><span id="dot" class="host-dot"></span><span id="status">Checking the host build…</span></strong><span>Touch the Quad to erase the old /app and /campus workers, then enter the service-worker-free /loom shell.</span></div>
<script>const status=document.querySelector('#status');Promise.allSettled([fetch('/api/health?gateway='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null),fetch('/api/boot-logs',{cache:'no-store'}).then(r=>r.ok?r.json():null)]).then(([health,logs])=>{const h=health.status==='fulfilled'?health.value:null,l=logs.status==='fulfilled'?logs.value:null;document.querySelector('#dot').classList.add('ok');status.textContent=`${h?.name||'Commonweave Host Node'} ready · ${h?.appVersion||'unknown'} · ${l?.count||0} boot events`}).catch(()=>status.textContent='Host node is starting · recovery remains available');</script>
</body>
</html>
