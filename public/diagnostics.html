<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta name="theme-color" content="#071923">
  <title>Civweave Diagnostics</title>
  <style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#061019;color:#effffb;font-family:system-ui,sans-serif}body{padding:18px}.wrap{width:min(1000px,100%);margin:auto;display:grid;gap:12px}.card{padding:16px;border:1px solid #7ee5ff55;border-radius:18px;background:#071923ee}header{display:flex;justify-content:space-between;gap:12px;align-items:start}h1,h2{margin:4px 0;font-family:Georgia,serif;font-weight:500}small{color:#efd176;font-weight:900;letter-spacing:.1em}.actions{display:flex;flex-wrap:wrap;gap:7px}button,a{min-height:40px;padding:8px 12px;border:1px solid #efd17677;border-radius:10px;background:#174b58;color:#fff;text-decoration:none;cursor:pointer}pre{max-height:65vh;overflow:auto;white-space:pre-wrap;word-break:break-word;padding:12px;border-radius:12px;background:#020b10;color:#bfeeff;font:11px/1.45 ui-monospace,monospace}.ok{color:#79e6bc}.warn{color:#ffcf73}</style>
</head>
<body>
<div class="wrap">
  <section class="card">
    <header><div><small>CIVWEAVE v1.0.27</small><h1>Clean-shell diagnostics</h1><p id="summary">Reading the host, workers, caches, and route state…</p></div><a href="/recover.html">Erase legacy workers</a></header>
    <div class="actions"><button id="refresh">Refresh</button><button id="copy">Copy report</button><button id="download">Download JSON</button><a href="/loom/">Open clean shell</a></div>
  </section>
  <section class="card"><h2>Technical report</h2><pre id="output"></pre></section>
</div>
<script>
const output=document.querySelector('#output'),summary=document.querySelector('#summary');let report={};
async function buildReport(){
  const registrations='serviceWorker'in navigator?await navigator.serviceWorker.getRegistrations():[];
  const cacheKeys='caches'in window?await caches.keys():[];
  const [healthResult,logsResult,versionResult,loomResult]=await Promise.allSettled([
    fetch('/api/health?diagnostics='+Date.now(),{cache:'no-store'}).then(response=>response.json()),
    fetch('/api/boot-logs?diagnostics='+Date.now(),{cache:'no-store'}).then(response=>response.json()),
    fetch('/loom/version.json?diagnostics='+Date.now(),{cache:'no-store'}).then(response=>response.json()),
    fetch('/loom/?diagnostics='+Date.now(),{cache:'no-store'}).then(async response=>({status:response.status,version:response.headers.get('x-civweave-version'),build:response.headers.get('x-civweave-build'),containsLegacy:(await response.text()).includes('1.0.21')}))
  ]);
  report={exportedAt:new Date().toISOString(),page:{href:location.href,referrer:document.referrer,displayMode:matchMedia('(display-mode: standalone)').matches?'standalone':'browser',userAgent:navigator.userAgent,online:navigator.onLine},markers:{hostBuild:localStorage.getItem('civweave.host-build'),recoveryCompleted:localStorage.getItem('civweave.recovery.completed')},serviceWorkers:{controller:navigator.serviceWorker?.controller?.scriptURL||null,registrations:registrations.map(reg=>({scope:reg.scope,active:reg.active?.scriptURL||null,activeState:reg.active?.state||null,waiting:reg.waiting?.scriptURL||null,installing:reg.installing?.scriptURL||null}))},caches:cacheKeys,health:healthResult.status==='fulfilled'?healthResult.value:{error:String(healthResult.reason)},version:versionResult.status==='fulfilled'?versionResult.value:{error:String(versionResult.reason)},loom:loomResult.status==='fulfilled'?loomResult.value:{error:String(loomResult.reason)},serverBootLogs:logsResult.status==='fulfilled'?logsResult.value:{error:String(logsResult.reason)}};
  output.textContent=JSON.stringify(report,null,2);
  const hostVersion=report.health?.appVersion,legacyScopes=report.serviceWorkers.registrations.filter(item=>{const path=new URL(item.scope).pathname;return path.startsWith('/app/')||path.startsWith('/campus/')||path.startsWith('/services/')});
  summary.innerHTML=hostVersion==='1.0.27'&&!report.loom?.containsLegacy&&legacyScopes.length===0?`<span class="ok">Host and /loom report v1.0.27 with no legacy worker scopes.</span>`:`<span class="warn">Host ${hostVersion||'unknown'} · legacy scopes ${legacyScopes.length} · legacy HTML ${Boolean(report.loom?.containsLegacy)}</span>`;
}
function download(){const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download=`civweave-v127-diagnostics-${new Date().toISOString().replace(/[:.]/g,'-')}.json`;anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.querySelector('#refresh').onclick=buildReport;document.querySelector('#copy').onclick=()=>navigator.clipboard.writeText(JSON.stringify(report,null,2));document.querySelector('#download').onclick=download;buildReport();
</script>
</body>
</html>
