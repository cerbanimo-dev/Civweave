<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071923">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Recover Commonweave</title>
  <style>
    *{box-sizing:border-box}html,body{min-height:100%;margin:0;background:#061019;color:#effffb;font-family:system-ui,sans-serif}body{display:grid;place-items:center;padding:22px}.card{width:min(560px,100%);padding:24px;border:1px solid #7ee5ff66;border-radius:22px;background:#071923ee;box-shadow:0 24px 80px #000b}.sigil{width:74px;height:74px;object-fit:contain;filter:drop-shadow(0 0 18px #7ee5ff77)}small{color:#efd176;font-weight:900;letter-spacing:.12em}h1{margin:10px 0 8px;font:500 clamp(30px,7vw,48px)/1 Georgia,serif}p{color:#c7dcda;line-height:1.55}.meter{height:9px;overflow:hidden;border-radius:999px;background:#ffffff12}.meter span{display:block;width:12%;height:100%;border-radius:inherit;background:#7ee5ff;transition:width .25s ease}.status{min-height:44px;margin-top:12px;color:#fff4c2}button,a{min-height:44px;display:grid;place-items:center;width:100%;margin-top:10px;border:1px solid #efd17677;border-radius:12px;background:#174b58;color:white;text-decoration:none;font-weight:750}button{cursor:pointer}.secondary{background:transparent}pre{max-height:180px;overflow:auto;white-space:pre-wrap;padding:10px;border-radius:10px;background:#020b10;color:#bfeeff;font:10px/1.4 ui-monospace,monospace}
  </style>
</head>
<body>
  <main class="card">
    <img class="sigil" src="/app/logos/commonweave.webp" alt="">
    <small>COMMONWEAVE SCOPE RECOVERY · v1.0.26</small>
    <h1>Leaving the old loop behind.</h1>
    <p>This gate retires every old <code>/app/</code> and realm worker, clears their caches, records each step, and opens Commonweave under the new isolated <code>/campus/</code> scope.</p>
    <div class="meter"><span id="bar"></span></div>
    <div id="status" class="status" role="status">Preparing recovery…</div>
    <pre id="trace"></pre>
    <button id="retry" hidden>Retry recovery</button>
    <a class="secondary" href="/campus/?recovered=1&v=1.0.26">Enter isolated campus without cleanup</a>
  </main>
<script>
const CURRENT_VERSION='1.0.26';
const CURRENT_BUILD='1.0.26-loop-diagnostics';
const status=document.querySelector('#status'),bar=document.querySelector('#bar'),retry=document.querySelector('#retry'),trace=document.querySelector('#trace');
const entries=[];
const report=(kind,detail={})=>{const entry={schema:'commonweave.boot-log.v1',time:new Date().toISOString(),version:CURRENT_VERSION,build:CURRENT_BUILD,kind:'recovery:'+kind,url:location.href,detail};entries.push(entry);trace.textContent=entries.map(item=>`${item.time} ${item.kind} ${JSON.stringify(item.detail)}`).join('\n');console.info('[CW-BOOT]',entry);fetch('/api/boot-log',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(entry),keepalive:true,cache:'no-store'}).catch(()=>{});return entry};
const say=(text,percent,kind,detail={})=>{status.textContent=text;bar.style.width=`${percent}%`;report(kind,detail)};
async function recover(){retry.hidden=true;try{
  say('Inspecting service-worker registrations…',10,'start',{controller:navigator.serviceWorker?.controller?.scriptURL||null});
  if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();report('registrations-found',{scopes:regs.map(reg=>reg.scope),scripts:regs.map(reg=>reg.active?.scriptURL||reg.waiting?.scriptURL||reg.installing?.scriptURL||null)});for(const reg of regs){const path=new URL(reg.scope).pathname;if(path.startsWith('/app/')||path.startsWith('/campus/')||/\/services\/(living-school|cerbanimo|fellowfare|anarchadia)\//.test(path)){const result=await reg.unregister();report('worker-unregistered',{scope:reg.scope,result})}}}
  say('Removing old campus and realm caches…',50,'cache-cleanup-start');
  if('caches' in window){const keys=await caches.keys();report('caches-found',{keys});for(const key of keys){if(key.startsWith('commonweave-pocket-campus-')||key.startsWith('commonweave-campus-')||/^(living-school|cerbanimo|fellowfare|anarchadia)-/.test(key)){const result=await caches.delete(key);report('cache-deleted',{key,result})}}}
  say('Locking the new build marker…',78,'marker-alignment',{build:CURRENT_BUILD});
  localStorage.setItem('commonweave.host-build',CURRENT_BUILD);
  localStorage.setItem('commonweave.recovery.completed',CURRENT_VERSION);
  localStorage.removeItem('commonweave.scope-migration.v126');
  sessionStorage.setItem('commonweave.recovery.entry',CURRENT_VERSION);
  say('Opening the isolated campus scope. No reload is scheduled.',100,'redirect',{target:'/campus/'});
  setTimeout(()=>location.replace(`/campus/?recovered=1&v=${CURRENT_VERSION}&t=${Date.now()}`),700);
}catch(error){say(`Recovery stopped: ${error.message||error}`,100,'failed',{message:error.message||String(error)});retry.hidden=false}}
retry.onclick=recover;recover();
</script>
</body>
</html>
