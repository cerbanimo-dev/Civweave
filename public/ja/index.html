<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07162f">
  <title>民織 シヴウィーヴ · 日本語</title>
  <style>html,body{margin:0;min-height:100%;background:#07162f;color:#eef7ff;font:16px/1.5 system-ui,-apple-system,"Yu Gothic UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}body{display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{text-align:center;max-width:520px}.brand{font-size:clamp(30px,8vw,54px);font-weight:900;letter-spacing:.08em}.kana{margin-top:4px;opacity:.82}.copy{margin-top:22px;opacity:.78}</style>
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="brand">民織</div>
    <div class="kana">シヴウィーヴ · Civweave</div>
    <p class="copy">日本語モードを開いています…</p>
    <noscript><p><a href="/app/working-campus-v156.html?lang=ja" style="color:#9ce8ff">日本語モードを開く</a></p></noscript>
  </main>
  <script>
  (()=>{
    try{localStorage.setItem('civweave.language.v1','ja')}catch{}
    const target=new URL('/app/working-campus-v156.html',location.origin);
    target.searchParams.set('lang','ja');
    target.searchParams.set('source','ja-share');
    const inbound=new URLSearchParams(location.search);
    const version=inbound.get('version');
    if(/^\d+\.\d+\.\d+$/.test(version||''))target.searchParams.set('version',version);
    location.replace(target.href);
  })();
  </script>
</body>
</html>
