<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061019">
  <title>Civweave</title>
  <link rel="icon" href="/app/logos/civweave-icon-192.png">
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#061019;color:#f5fbff}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#061019}body{display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 34%,#102e3c 0,#07141d 34%,#061019 68%)}.boot{width:min(100%,430px);display:grid;justify-items:center;text-align:center;gap:14px}.boot img{width:112px;height:112px;border-radius:28px;object-fit:cover;box-shadow:0 14px 44px #0008,0 0 30px #78deee22}.boot small{color:#8de5ef;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.boot h1{font-size:1.35rem;margin:0}.boot p{margin:0;color:#b8cad5;line-height:1.5}.pulse{width:42px;height:4px;border-radius:999px;background:#153849;overflow:hidden}.pulse::after{content:"";display:block;width:50%;height:100%;border-radius:inherit;background:#8de5ef;animation:cwboot 1.1s ease-in-out infinite alternate}@keyframes cwboot{from{transform:translateX(-80%)}to{transform:translateX(180%)}}.recovery{width:100%;display:grid;gap:9px;margin-top:4px}.recovery[hidden]{display:none!important}.recovery button,.recovery a{min-height:46px;width:100%;border-radius:14px;border:1px solid #8de5ef55;padding:11px 14px;font:inherit;font-weight:850;text-decoration:none;text-align:center;cursor:pointer}.recovery .primary{border:0;background:linear-gradient(135deg,#86e4ee,#f3d77d);color:#07131c}.recovery .secondary{background:#102431;color:#f5fbff}.recovery .ghost{background:transparent;color:#c6d5df;border-color:#ffffff22}.fine{font-size:.78rem;color:#8299a7}
  </style>
</head>
<body>
  <main class="boot" aria-live="polite">
    <img src="/app/logos/civweave-pwa-192-v247.png" alt="Civweave">
    <small>Installed campus</small>
    <h1 id="boot-title">Opening Civweave…</h1>
    <div class="pulse" aria-hidden="true"></div>
    <p id="boot-status">Starting from the local app shell.</p>
    <section id="boot-recovery" class="recovery" hidden aria-label="Startup recovery">
      <button id="boot-safe" class="primary" type="button">Open Working Campus safely</button>
      <a class="secondary" href="/app/recovery-v426.html?source=installed-entry">Open recovery tools</a>
      <button id="boot-retry" class="ghost" type="button">Retry startup</button>
      <p class="fine">Recovery never clears your saved work, downloaded models, knowledge packs, or local databases.</p>
    </section>
  </main>
  <script>
  (()=>{
    'use strict';
    const ATTEMPT_KEY='civweave.boot-recovery.attempt.v426';
    const SAFE_KEY='civweave.boot-recovery.safe.v426';
    const recovery=document.querySelector('#boot-recovery');
    const title=document.querySelector('#boot-title');
    const status=document.querySelector('#boot-status');
    const readAttempts=()=>{try{return Math.max(0,Number(localStorage.getItem(ATTEMPT_KEY)||0)||0)}catch{return 0}};
    const writeAttempts=value=>{try{localStorage.setItem(ATTEMPT_KEY,String(value))}catch{}};
    const clearAttempt=()=>{try{localStorage.removeItem(ATTEMPT_KEY)}catch{}};
    const showRecovery=(message='Startup is taking longer than it should.')=>{if(title)title.textContent='Civweave is still recoverable.';if(status)status.textContent=message;if(recovery)recovery.hidden=false;document.documentElement.dataset.cwBootState='recovery'};
    const setStatus=message=>{if(status)status.textContent=message};
    const markRouted=()=>{clearAttempt();document.documentElement.dataset.cwBootState='routed'};
    const attempts=readAttempts()+1;
    writeAttempts(attempts);
    if(attempts>=2)showRecovery('A previous launch did not finish. Safe startup is available immediately.');
    const watchdog=setTimeout(()=>showRecovery('The normal launcher did not finish quickly enough. You can enter the campus without reinstalling.'),4500);
    document.querySelector('#boot-safe')?.addEventListener('click',()=>{try{sessionStorage.setItem(SAFE_KEY,'1')}catch{}clearTimeout(watchdog);markRouted();const target=new URL('/app/working-campus-v156.html',location.origin);target.searchParams.set('installed','1');target.searchParams.set('recovery','safe');target.searchParams.set('launch','installed-entry-v426');location.replace(target.href)});
    document.querySelector('#boot-retry')?.addEventListener('click',()=>{clearAttempt();location.reload()});
    addEventListener('error',event=>showRecovery(`Startup hit an error before the campus opened${event?.message?`: ${event.message}`:'.'}`));
    addEventListener('unhandledrejection',()=>showRecovery('Startup hit an unexpected failure before the campus opened.'));
    globalThis.CivweaveBootRecoveryV426=Object.freeze({version:'boot-recovery-v426',showRecovery,setStatus,markRouted,clearAttempt,safeKey:SAFE_KEY});
  })();
  </script>
  <script src="/app/installed-entry-v146.js?v=1.0.131-boot-recovery-v426" defer></script>
  <noscript><p style="position:fixed;left:16px;right:16px;bottom:16px;text-align:center"><a href="/app/recovery-v426.html" style="color:#8de5ef">Open Civweave recovery</a></p></noscript>
</body>
</html>
