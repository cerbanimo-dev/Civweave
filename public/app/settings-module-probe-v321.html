<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SETTINGS_PROBE_LOADING</title>
  <style>body{font-family:system-ui;background:#0b1020;color:#eef;padding:16px}pre{white-space:pre-wrap;word-break:break-word}</style>
</head>
<body>
  <button id="launch" type="button">Open Settings</button>
  <pre id="out">waiting</pre>
  <script>
  (()=>{
    const stats={scriptAdds:0,scripts:[],gpuCalls:0,workers:0,observers:0,openedEvents:0,cancelEvents:0,readyEvents:0,syncOpenMs:null,lag250:null,lag1000:null,error:''};
    globalThis.__settingsProbeStats=stats;
    const nativeAppend=document.head.append.bind(document.head);
    document.head.append=(...nodes)=>{for(const node of nodes){if(node?.tagName==='SCRIPT'){stats.scriptAdds++;stats.scripts.push(node.src||'inline')}}return nativeAppend(...nodes)};
    try{Object.defineProperty(navigator,'gpu',{configurable:true,value:{requestAdapter:async()=>{stats.gpuCalls++;return null}}})}catch{}
    const NativeWorker=globalThis.Worker;
    if(NativeWorker)globalThis.Worker=class extends NativeWorker{constructor(...args){stats.workers++;super(...args)}};
    const NativeMO=globalThis.MutationObserver;
    if(NativeMO)globalThis.MutationObserver=class extends NativeMO{constructor(cb){stats.observers++;super(cb)}};
    addEventListener('civweave:model-settings-opened',()=>stats.openedEvents++);
    addEventListener('civweave:local-inference-cancel-requested',()=>stats.cancelEvents++);
    addEventListener('civweave:settings-ready',()=>stats.readyEvents++);
    globalThis.__finishSettingsProbe=()=>{
      const api=globalThis.CivweaveSettingsV320,layer=document.getElementById('cw-settings-v320');
      document.title=`SETTINGS_PROBE_api${api?1:0}_layer${layer&&!layer.hidden?1:0}_scripts${stats.scriptAdds}_gpu${stats.gpuCalls}_workers${stats.workers}_obs${stats.observers}_cancel${stats.cancelEvents}_lag${stats.lag250??-1}`;
      document.getElementById('out').textContent=JSON.stringify(stats,null,2);
    };
  })();
  </script>
  <script src="/app/settings-gateway-v317.js?probe=settings-module-v321"></script>
  <script>
  setTimeout(()=>{
    const stats=globalThis.__settingsProbeStats;
    try{
      const start=performance.now();
      globalThis.CivweaveSettingsV320.open(document.getElementById('launch'));
      stats.syncOpenMs=Math.round((performance.now()-start)*10)/10;
      const t250=performance.now()+250;
      setTimeout(()=>{stats.lag250=Math.round(performance.now()-t250)},250);
      const t1000=performance.now()+1000;
      setTimeout(()=>{stats.lag1000=Math.round(performance.now()-t1000);globalThis.__finishSettingsProbe()},1000);
    }catch(error){stats.error=String(error?.stack||error);globalThis.__finishSettingsProbe()}
  },200);
  </script>
</body>
</html>
