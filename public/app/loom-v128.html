<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#04131d">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Commonweave</title>
  <link rel="icon" href="/app/logos/commonweave-icon-192.png?v=dark-r1">
  <link rel="manifest" href="/app/manifest.webmanifest?v=1.0.30-icon-r1">
  <link rel="stylesheet" href="/app/loom-v128.css?v=1.0.30">
  <link rel="stylesheet" href="/app/weaveling-hologram-v133.css?v=heart-r8">
  <link rel="stylesheet" href="/app/model-settings-v133.css?v=smollm2-r6">
  <link rel="stylesheet" href="/app/v130-cabinet-launcher.css?v=1.0.30">
  <link rel="stylesheet" href="/app/pwa-v130.css?v=1.0.30">
</head>
<body>
<main class="cw127-app" id="cw127-app">
  <section class="cw127-scene" aria-label="Commonweave campus hub">
    <img class="cw127-scene-bg" src="/app/assets/world/town-square-home.webp" alt="The Commonweave campus, with Living School, Cerbanimo, FellowFare, Anarchadia, and the central Quad." fetchpriority="high">
    <button class="cw127-hotspot cw127-living" data-realm="living-school" aria-label="Enter Living School"><span>Living School</span></button>
    <button class="cw127-hotspot cw127-cerbanimo" data-realm="cerbanimo" aria-label="Enter Cerbanimo"><span>Cerbanimo</span></button>
    <button class="cw127-hotspot cw127-fellowfare" data-realm="fellowfare" aria-label="Enter FellowFare"><span>FellowFare</span></button>
    <button class="cw127-hotspot cw127-anarchadia" data-realm="anarchadia" aria-label="Enter Anarchadia"><span>Anarchadia</span></button>
    <button class="cw127-hotspot cw127-quad" data-action="chat" aria-label="Talk with Weaveling at the Quad"><span>Weaveling</span></button>
    <button class="cw127-weaveling" data-action="chat" aria-label="Chat with Weaveling"><img src="/app/assets/ai/weaveling.png" alt="Weaveling hologram"><b id="cw127-context-label">Reflect</b></button>
    <div class="cw127-status" id="cw127-status">v1.0.30 · Offline-first local campus</div>
  </section>
</main>
<header class="cw127-topbar">
  <button class="cw127-version" data-action="version" aria-label="Commonweave version 1.0.30"><img src="/app/logos/commonweave-icon-192.png?v=dark-r1" alt=""><span>v1.0.30</span></button>
  <nav class="cw127-tools" aria-label="Commonweave tools">
    <button data-action="info" aria-label="Campus information"><span class="cw127-info-glyph">i</span></button>
    <button data-action="chat" aria-label="Chat with Weaveling"><img src="/app/assets/generated/commonweave-navigation-icons/weaveling-compass.png" alt=""></button>
    <button data-action="lite" aria-label="Open Commonweave Lite"><img src="/app/assets/generated/commonweave-navigation-icons/commonweave-realms.png" alt=""></button><button data-action="settings" aria-label="Universal AI settings"><img src="/app/assets/generated/commonweave-navigation-icons/commonweave-ai-config.png" alt=""></button>
  </nav>
</header>
<nav class="cw127-nav" aria-label="Commonweave navigation">
  <button data-action="home"><img src="/app/assets/generated/commonweave-navigation-icons/commonweave-home.png" alt=""><span>Home</span></button>
  <button data-action="intentions"><img src="/app/assets/generated/commonweave-navigation-icons/commonweave-route.png" alt=""><span>Intentions</span></button>
  <button data-action="chat"><img src="/app/assets/generated/commonweave-navigation-icons/weaveling-compass.png" alt=""><span>Weaveling</span></button>
  <button data-action="realms"><img src="/app/assets/generated/commonweave-navigation-icons/commonweave-realms.png" alt=""><span>Realms</span></button>
  <button data-action="settings"><img src="/app/assets/generated/commonweave-navigation-icons/commonweave-ai-config.png" alt=""><span>AI settings</span></button>
</nav>
<div class="cw127-toast" id="cw127-toast" hidden></div>
<script src="/app/shared/commonweave-parity-runtime.js?v=1.0.30" defer></script>
<script src="/app/shared/commonweave-model-runtime.js?v=1.0.30-antigravity" defer></script>
<script src="/app/smollm2-fallback-runtime-v134.js?v=smollm2-r6" defer></script>
<script src="/app/model-settings-v133.js?v=smollm2-r6" defer></script>
<script src="/app/smollm2-small-model-v136.js?v=contract-r1" defer></script>
<script src="/app/loom-v128.js?v=1.0.30" defer></script>
<script src="/app/assistant-runtime-v133.js?v=smollm2-r6" defer></script>
<script src="/app/v130-cabinet-launcher.js?v=1.0.30" defer></script>
<script src="/app/pwa-v130.js?v=1.0.30" defer></script>
</body>
</html>
