<!doctype html>
<html lang="en" data-civweave-screen="chat">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07131f">
<title>Civweave guide chat</title>
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="stylesheet" href="/app/common.css">
<link rel="stylesheet" href="/app/chat.css">
<script src="/app/shared/civweave-model-runtime.js" defer></script>
<script type="module" src="/app/customization-loader.js"></script>
<script type="module" src="/app/chat.js"></script>
</head>
<body>
<main class="chat-screen">
<header class="chat-head"><a class="chat-back" id="chat-back" href="/app/campus.html">←</a><img id="chat-avatar" src="/app/assets/ai/weaveling.png" alt=""><div><small class="cw-kicker" id="chat-system">CIVWEAVE</small><h1 id="chat-name">Weaveling</h1><p id="chat-role">Central mirror and planner</p></div><a class="cw-button" href="/app/settings.html">Settings</a></header>
<nav class="chat-guides" aria-label="Guide chats"><a href="?guide=weaveling">Weaveling</a><a href="?guide=moss">Moss</a><a href="?guide=kamiya">Kamiya</a><a href="?guide=rook">Rook</a><a href="?guide=merlin">Merlin</a></nav>
<section id="chat-log" class="chat-log" role="log" aria-live="polite"></section>
<form id="chat-form" class="chat-form"><label class="sr-only" for="chat-input">Message</label><textarea id="chat-input" rows="2" maxlength="12000" required placeholder="Message"></textarea><button type="submit">Send</button><small id="chat-status">Opening or typing here does not start MiniLM or a generative model.</small></form>
</main>
</body>
</html>
