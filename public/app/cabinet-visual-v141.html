<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#02080d">
  <title>Commonweave Visual Cabinet</title>
  <link rel="icon" href="/app/logos/commonweave-icon-192.png?v=tight-r2">
  <link rel="manifest" href="/app/manifest.webmanifest?v=1.0.31-icon-r2">
  <link rel="stylesheet" href="/app/cabinet-visual-v141.css?v=1.0.31">
</head>
<body>
<main class="cv141-stage">
  <section class="cv141-shell" id="cv141-shell" aria-label="Commonweave visual cabinet">
    <img class="cv141-art" id="cv141-art" alt="" draggable="false">
    <iframe class="cv141-screen" id="cv141-screen" title="Commonweave cabinet screen"></iframe>
    <nav class="cv141-controls" id="cv141-controls" aria-label="Switch Commonweave realm"></nav>
    <button class="cv141-back" id="cv141-back" type="button" aria-label="Return to previous Commonweave view">×</button>
    <div class="cv141-title"><small>CANONICAL VISUAL MODE</small><b id="cv141-title">Opening cabinet…</b></div>
  </section>
</main>
<div class="cv141-error" id="cv141-error" hidden></div>
<script src="/app/local-first-policy-v131.js?v=1.0.31" defer></script>
<script src="/app/shared/commonweave-parity-runtime.js?v=1.0.31" defer></script>
