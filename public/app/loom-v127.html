<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#04131d">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Civweave</title>
  <link rel="manifest" href="/app/manifest.webmanifest?v=1.0.27-identity-ai-2">
  <link rel="icon" href="/app/logos/civweave-icon-192.png">
  <link rel="stylesheet" href="/app/loom-v127.css?v=1.0.27-identity-ai-2">
</head>
<body>
<main class="cw127-app" id="cw127-app">
  <section class="cw127-scene" aria-label="Civweave campus">
    <img class="cw127-scene-bg" src="/app/assets/world/town-square-home.webp" alt="The Civweave campus, with Living School, Cerbanimo, FellowFare, Anarchadia, and the central Quad." fetchpriority="high">
    <img class="cw127-campus-brand cw127-campus-living" src="/app/logos/living-school-v2.webp" alt="Living School">
    <img class="cw127-campus-brand cw127-campus-fellowfare" src="/app/logos/fellowfare-v2.webp" alt="FellowFare">
    <img class="cw127-campus-brand cw127-campus-anarchadia" src="/app/logos/anarchadia-v2.webp" alt="Anarchadia">
    <button class="cw127-hotspot cw127-living" data-realm="living-school" aria-label="Enter Living School"><span>Living School</span></button>
    <button class="cw127-hotspot cw127-cerbanimo" data-realm="cerbanimo" aria-label="Enter Cerbanimo"><span>Cerbanimo</span></button>
    <button class="cw127-hotspot cw127-fellowfare" data-realm="fellowfare" aria-label="Enter FellowFare"><span>FellowFare</span></button>
    <button class="cw127-hotspot cw127-anarchadia" data-realm="anarchadia" aria-label="Enter Anarchadia"><span>Anarchadia</span></button>
    <button class="cw127-hotspot cw127-quad" data-action="chat" aria-label="Talk with Weaveling at the Quad"><span>Weaveling</span></button>
    <button class="cw127-weaveling" data-action="chat" aria-label="Chat with Weaveling"><img src="/app/assets/ai/weaveling.png" alt="Weaveling"><b id="cw127-context-label">Reflect</b></button>
    <div class="cw127-status" id="cw127-status">Clean-slate campus · identity and AI controls repaired</div>
  </section>
</main>
<header class="cw127-topbar">
  <button class="cw127-version" data-action="version" aria-label="Civweave version 1.0.27"><img src="/app/logos/civweave.webp" alt=""><span>v1.0.27</span></button>
  <nav class="cw127-tools" aria-label="Civweave tools">
    <button data-action="info" aria-label="Campus information"><span class="cw127-info-glyph">i</span><span class="cw127-tool-label">Info</span></button>
    <button data-action="chat" aria-label="Chat with Weaveling"><img src="/app/assets/generated/civweave-navigation-icons/weaveling-compass.png" alt=""><span class="cw127-tool-label">Weaveling</span></button>
    <button data-action="settings" aria-label="Universal AI settings"><img src="/app/assets/generated/civweave-navigation-icons/civweave-ai-config.png" alt=""><span class="cw127-tool-label">AI settings</span></button>
  </nav>
</header>
<nav class="cw127-nav" aria-label="Civweave navigation">
  <button data-action="home"><img src="/app/assets/generated/civweave-navigation-icons/civweave-home.png" alt=""><span>Home</span></button>
  <button data-action="intentions"><img src="/app/assets/generated/civweave-navigation-icons/civweave-route.png" alt=""><span>Intentions</span></button>
  <button data-action="chat"><img src="/app/assets/generated/civweave-navigation-icons/weaveling-compass.png" alt=""><span>Weaveling</span></button>
  <button data-action="realms"><img src="/app/assets/generated/civweave-navigation-icons/civweave-realms.png" alt=""><span>Realms</span></button>
  <button data-action="settings"><img src="/app/assets/generated/civweave-navigation-icons/civweave-ai-config.png" alt=""><span>AI settings</span></button>
</nav>
<div class="cw127-toast" id="cw127-toast" hidden></div>
<script src="/app/loom-v127.js?v=1.0.27-identity-ai-2" defer></script>
</body>
</html>
