<!doctype html>
<html lang="en" data-system="civweave" data-civweave-system="civweave" data-build="civweave-guild-quest-embed-v1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Civweave Guild Quest Tracker</title>
<link rel="stylesheet" href="/app/realm-console-v140.css?v=canonical-r1">
<link rel="stylesheet" href="/app/cerbanimo-intention-landscape-v1.css?v=civweave-owner-r1">
<style>
html,body{margin:0;min-height:0;background:transparent;color:#f8f1df;overflow:hidden}body{padding:0}[hidden]{display:none!important}#rc-app.rc-app,#rc-app .rc-shell{min-height:0!important;margin:0!important;padding:0!important;background:transparent!important}#rc-app .rc-top,#rc-app .rc-bottom,#rc-app .rc-shell>footer,#rc-app .rc-foot,#rc-app .rc-footer{display:none!important}#cerbanimo-intention-landscape{margin:0!important;border:0!important;border-radius:0!important;min-height:680px!important;width:100%!important}.rc-loading{padding:28px 18px;color:#aebbd0;text-align:center;font:700 12px/1.4 system-ui,sans-serif}
</style>
</head>
<body>
<main id="rc-app" class="rc-app" tabindex="-1">
  <div class="rc-loading">Opening Guilds…</div>
</main>
<div id="rc-toast" class="rc-toast" hidden></div>
<script src="/app/shared/civweave-parity-runtime.js?v=direct-r36"></script>
<script src="/app/realm-console-v140.js?v=civweave-guild-quest-embed-r1"></script>
<script src="/app/cerbanimo-intention-landscape-v1.js?v=civweave-owner-r1"></script>
<script>
(()=>{
'use strict';
const MIN_HEIGHT=680;
let frame=window.frameElement||null,queued=false;
function syncHeight(){
  queued=false;
  if(!frame)frame=window.frameElement||null;
  if(!frame)return;
  const root=document.getElementById('cerbanimo-intention-landscape');
  const height=Math.max(MIN_HEIGHT,Math.ceil(root?.getBoundingClientRect().height||0),document.documentElement.scrollHeight,document.body.scrollHeight);
  frame.style.height=`${height}px`;
}
function queueSync(){if(queued)return;queued=true;requestAnimationFrame(syncHeight)}
if('ResizeObserver'in globalThis){const observer=new ResizeObserver(queueSync);observer.observe(document.body);observer.observe(document.documentElement)}
new MutationObserver(queueSync).observe(document.body,{subtree:true,childList:true,attributes:true});
addEventListener('load',queueSync,{once:true});
addEventListener('resize',queueSync,{passive:true});
queueSync();
})();
</script>
</body>
</html>
