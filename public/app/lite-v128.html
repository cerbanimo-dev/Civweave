<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07141f">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Commonweave Lite</title>
  <link rel="icon" href="/app/logos/commonweave-icon-192.png">
  <link rel="stylesheet" href="/app/lite-v128.css?v=1.0.28">
</head>
<body>
<header class="lite-header">
  <a class="lite-brand" href="/lite/"><img src="/app/logos/commonweave.webp" alt=""><span><b>Commonweave Lite</b><small>same campus · lighter renderer · v1.0.28</small></span></a>
  <nav aria-label="Renderer controls"><a id="visual-link" href="/loom/">Open Visual</a><button id="lite-settings" type="button">Model settings</button></nav>
</header>
<div class="lite-layout">
  <aside class="lite-systems" aria-label="Systems"><div id="system-list"></div></aside>
  <aside class="lite-rooms" aria-label="Rooms"><div id="room-list"></div></aside>
  <main id="lite-main" tabindex="-1"><div class="lite-loading">Reading the parity ledger…</div></main>
</div>
<dialog id="source-dialog"><form method="dialog"><header><div><small>WORKING SOURCE SURFACE</small><h2 id="source-title">Open tool</h2></div><button aria-label="Close">×</button></header><p id="source-copy"></p><iframe id="source-frame" title="Commonweave source application"></iframe><menu><a id="source-new-tab" target="_blank" rel="noopener">Open separately</a><button>Close</button></menu></form></dialog>
<div id="lite-toast" role="status" hidden></div>
<script src="/app/shared/commonweave-parity-runtime.js?v=1.0.28" defer></script>
<script src="/app/lite-v128.js?v=1.0.28" defer></script>
</body>
</html>
