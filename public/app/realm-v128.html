<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Opening Commonweave Cabinet Mode</title>
  <script>
    (()=>{
      const parts=location.pathname.split('/').filter(Boolean);
      const realmIndex=parts.indexOf('realm');
      const system=realmIndex>=0&&parts[realmIndex+1]?parts[realmIndex+1]:'commonweave';
      const current=new URLSearchParams(location.search);
      const target=new URL('/app/cabinet-mode-v142.html',location.origin);
      target.searchParams.set('system',system);
      target.searchParams.set('from','legacy-realm');
      for(const key of ['room','capability']){
        const value=current.get(key);
        if(value)target.searchParams.set(key,value);
      }
      target.hash=location.hash;
      location.replace(target.href);
    })();
  </script>
</head>
<body>Opening Cabinet Mode…</body>
</html>
