<!doctype html>
<html lang="en" data-fellowfare-renderer="marketplace-v2">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#153849">
  <meta name="description" content="FellowFare live local-first marketplace for products, services, learning, tutoring, resources, needs, and collective exchange.">
  <meta name="color-scheme" content="light">
  <link rel="stylesheet" href="/app/fellowfare-parchment-type-v266.css?v=parchment-type-r1">
  <link rel="stylesheet" href="marketplace-v2.css?v=live-market-v2">
  <title>FellowFare Marketplace</title>
</head>
<body class="ff-cabinet-embedded">
  <a class="skip-link" href="#main" style="position:absolute;left:-10000px;top:auto">Skip to market</a>
  <div id="app" class="app-shell">
    <header class="topbar" aria-hidden="true"></header>
    <main id="main" tabindex="-1" aria-live="polite"></main>
    <button data-civweave-return class="ff-scene-back" aria-label="Return to Civweave" hidden></button>
    <nav class="bottom-nav" aria-label="FellowFare marketplace tools">
      <button data-route="market" class="bottom-link is-active" aria-current="page">Market</button>
      <button data-route="loom" class="bottom-link">Sell</button>
      <button data-route="assemblies" class="bottom-link">Orders</button>
      <button data-route="inbox" class="bottom-link">Wallet<span id="inboxBadge" class="badge" hidden></span></button>
      <button data-route="profile" class="bottom-link">You</button>
    </nav>
  </div>
  <script src="/app/cw-reward-ledger-v2.js"></script>
  <script src="/app/cerbanimo-commerce-distribution-v1.js"></script>
  <script src="/app/civweave-live-data.js"></script>
  <script src="marketplace-v2.js?v=live-market-v2"></script>
  <script src="cabinet-bridge.js?v=marketplace-v2"></script>
  <script src="civweave-handoff-consumer.js" data-system="fellowfare"></script>
</body>
</html>
