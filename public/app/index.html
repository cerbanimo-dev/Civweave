<!doctype html>
<html lang="en" data-civweave-runtime="core" data-version="1.0.74">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07162f">
  <meta name="description" content="Civweave local-first working core">
  <title>Civweave</title>
  <link rel="manifest" href="/app/manifest.webmanifest">
  <link rel="icon" href="/app/logos/civweave-symbol.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app/core.css">
</head>
<body>
  <main class="shell" id="app-shell">
    <header class="topbar">
      <a class="brand" href="/app/" aria-label="Civweave home">
        <img src="/app/logos/civweave-symbol.svg" alt="">
        <span><small>LOCAL-FIRST CORE</small><strong>Civweave</strong></span>
      </a>
      <div class="top-actions">
        <span class="runtime-chip" id="runtime-chip">core · v1.0.74</span>
        <button class="ghost" id="install-button" type="button" hidden>Install</button>
        <button class="ghost" id="settings-button" type="button">Settings</button>
      </div>
    </header>

    <section class="realm-grid" aria-label="Civweave systems">
      <button class="realm" data-system="living-school" type="button">
        <img src="/app/assets/ai/moss.png" alt="">
        <span><small>Moss</small><strong>Living School</strong><em>Learn what the intention requires.</em></span>
      </button>
      <button class="realm" data-system="cerbanimo" type="button">
        <img src="/app/assets/ai/kamiya.png" alt="">
        <span><small>Kamiya</small><strong>Cerbanimo</strong><em>Turn the route into skilled work.</em></span>
      </button>
      <button class="realm" data-system="fellowfare" type="button">
        <img src="/app/assets/ai/rook.png" alt="">
        <span><small>Rook</small><strong>FellowFare</strong><em>Find materials, services, and help.</em></span>
      </button>
      <button class="realm" data-system="anarchadia" type="button">
        <img src="/app/assets/ai/merlin.png" alt="">
        <span><small>Merlin</small><strong>Anarchadia</strong><em>Store consent, roles, and review.</em></span>
      </button>
    </section>

    <section class="workspace-grid">
      <aside class="guide" aria-label="Weaveling guide">
        <div class="guide-head">
          <img src="/app/assets/ai/weaveling.png" alt="Weaveling">
          <div><small>CENTRAL MIRROR</small><h1>Weaveling</h1><p>Wish → weave → realms</p></div>
        </div>
        <div class="conversation" id="conversation" aria-live="polite"></div>
        <form id="wish-form" class="wish-form">
          <label for="wish-input">Message Weaveling</label>
          <textarea id="wish-input" rows="3" maxlength="8000" placeholder="What is your wish?" required></textarea>
          <button class="primary" type="submit">Weave it</button>
        </form>
      </aside>

      <section class="work" aria-labelledby="work-title">
        <header><div><small>ACTIVE WEAVE</small><h2 id="work-title">Your route</h2></div><button class="ghost" id="clear-plan" type="button">Clear</button></header>
        <div id="workspace" class="workspace"></div>
      </section>
    </section>
  </main>

  <dialog id="settings-dialog">
    <form method="dialog" class="settings-card">
      <header><div><small>RUNTIME SETTINGS</small><h2>AI and device</h2></div><button class="icon" value="close" aria-label="Close">×</button></header>
      <label>Default reasoning lane
        <select id="provider-select">
          <option value="deterministic">Deterministic / local</option>
          <option value="local-model">Downloaded local model</option>
          <option value="gemini">Gemini</option>
        </select>
      </label>
      <label>Gemini API key
        <input id="gemini-key" type="password" autocomplete="off" placeholder="Optional">
      </label>
      <label class="check"><input id="remember-key" type="checkbox"> Remember key on this device</label>
      <p class="note">The core does not load provider runtimes until a feature asks for them.</p>
      <footer><button class="primary" id="save-settings" value="close">Save</button></footer>
    </form>
  </dialog>

  <template id="empty-template">
    <div class="empty"><strong>What is your wish?</strong><p>The core will make a small reviewable route and hand each part to the appropriate realm. Nothing activates automatically.</p></div>
  </template>

  <script type="module" src="/app/core.js"></script>
</body>
</html>
