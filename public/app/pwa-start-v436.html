<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061019">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Civweave</title>
<link rel="icon" type="image/png" sizes="192x192" href="/app/logos/civweave-branded-heart-192-v449.png">
<link rel="preload" as="image" href="/app/logos/civweave-branded-heart-512-v449.png">
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#061019;color:#f4fbff}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#061019}body{display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 34%,#123243 0,#07141d 36%,#061019 70%)}main{width:min(100%,460px);display:grid;justify-items:center;gap:11px;text-align:center}.mark{width:72px;height:72px;border:1px solid #8de5ef55;border-radius:22px;background:radial-gradient(circle,#1d4657,#0a1821 70%);box-shadow:0 14px 42px #0008,0 0 28px #8de5ef18}.mark::after{content:"◈";display:grid;place-items:center;width:100%;height:100%;font-size:34px;color:#a5edf4}small{color:#8de5ef;font-weight:900;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font-size:1.35rem}p{margin:0;color:#b9ccd7;line-height:1.5}.pulse{width:44px;height:4px;border-radius:999px;overflow:hidden;background:#143545}.pulse::after{content:"";display:block;width:50%;height:100%;border-radius:inherit;background:#8de5ef;animation:cwstart 1s ease-in-out infinite alternate}@keyframes cwstart{from{transform:translateX(-80%)}to{transform:translateX(180%)}}a{display:none;min-height:46px;width:100%;place-items:center;padding:10px 14px;border:1px solid #8de5ef55;border-radius:13px;background:#102431;color:#f4fbff;text-decoration:none;font-weight:850}html[data-cw-pwa-start="recovery"] a{display:grid}
/* Decorative launch-stage battle only; never implies a real task outcome. */
.cw-launch-logo{display:block;width:clamp(146px,42vw,216px);height:auto;aspect-ratio:1;margin:0 auto 0;border-radius:25%;box-shadow:0 14px 55px #0005,0 0 36px #f65cb42a;object-fit:cover}
.cw-launch-battle{--cw-guide-accent:#8af5d2;position:relative;width:min(100%,440px);height:210px;margin:0 auto;border-radius:20px;border:1px solid #a7c3ff36;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 50% 94%,#2b527a77,transparent 60%),linear-gradient(125deg,#090e2b,#271b45 55%,#0a2535);box-shadow:inset 0 0 40px #121735,0 16px 42px #0007}
.cw-launch-battle::after{content:"";position:absolute;left:7%;right:7%;bottom:29px;height:1px;background:linear-gradient(90deg,transparent,#8af5d283,transparent)}
.cw-launch-caption{position:absolute;z-index:4;bottom:8px;left:0;right:0;font:700 10px/1.3 system-ui,sans-serif;letter-spacing:.05em;color:#d0ecf6;text-align:center}
.cw-launch-stage-name{position:absolute;top:12px;z-index:3;font:750 12px/1.2 system-ui,sans-serif;text-shadow:0 2px 8px #000e}
.cw-launch-stage-name--hero{left:15px;color:var(--cw-guide-accent)}
.cw-launch-stage-name--lari{right:15px;color:#ffc2e7}
.cw-launch-fighter,.cw-launch-lari{position:absolute;bottom:25px;z-index:2;background-repeat:no-repeat;filter:drop-shadow(0 7px 9px #0008);will-change:transform,background-position}
.cw-launch-fighter{left:0;width:50%;height:170px;background-image:var(--cw-guide-sheet);background-size:300% 200%;background-position:0% 0%}
.cw-launch-lari{right:1%;width:42%;height:160px;background-image:url('/app/assets/ai/lari-review-sprites-v1.png');background-size:200% 200%;background-position:0% 0%}
.cw-launch-spark{position:absolute;top:49%;left:50%;z-index:3;font-size:32px;line-height:1;color:#fbdd88;text-shadow:0 0 15px #ffa0fa;opacity:0}
.cw-launch-battle[data-playing="true"] .cw-launch-fighter{animation:cw-launch-dash 3.3s ease-in-out both,cw-launch-guide-poses 3.3s steps(1,end) both}
.cw-launch-battle[data-playing="true"] .cw-launch-lari{animation:cw-launch-lari-dodge 3.3s ease-in-out both,cw-launch-lari-poses 3.3s steps(1,end) both}
.cw-launch-battle[data-playing="true"] .cw-launch-spark{animation:cw-launch-spark 3.3s ease-out both}
@keyframes cw-launch-dash{0%,14%{transform:none}36%{transform:translateX(12%) rotate(-4deg)}55%{transform:translate(22%,-10%)}75%{transform:translateX(5%)}100%{transform:none}}
@keyframes cw-launch-lari-dodge{0%,20%{transform:none}36%{transform:translateX(-10%) rotate(5deg)}60%{transform:translate(4%,-8%)}100%{transform:none}}
@keyframes cw-launch-guide-poses{0%,14%{background-position:0% 0%}15%,32%{background-position:50% 0%}33%,48%{background-position:100% 0%}49%,65%{background-position:0% 100%}66%,100%{background-position:50% 100%}}
@keyframes cw-launch-lari-poses{0%,24%{background-position:0% 0%}25%,54%{background-position:100% 0%}55%,100%{background-position:0% 100%}}
@keyframes cw-launch-spark{0%,38%{opacity:0;transform:translateX(-28px) scale(.2)}52%{opacity:1;transform:scale(1.45) rotate(22deg)}80%,100%{opacity:0;transform:translateX(40px) scale(.45)}}
@media(max-width:390px){.cw-launch-battle{height:175px}.cw-launch-fighter{height:146px}.cw-launch-lari{height:140px}.cw-launch-logo{width:158px}}
@media(prefers-reduced-motion:reduce){.cw-launch-battle *{animation:none!important;transition:none!important}.cw-launch-spark{display:none}.cw-launch-fighter,.cw-launch-lari{will-change:auto}}

</style>
</head>
<body>
<main>
  <img class="cw-launch-logo" src="/app/logos/civweave-branded-heart-512-v449.png" alt="Civweave" width="216" height="216" fetchpriority="high">
  <small>Installed Civweave</small>
  <div class="cw-launch-battle" id="cw-launch-battle" aria-hidden="true" data-playing="false">
    <span class="cw-launch-stage-name cw-launch-stage-name--hero" id="cw-launch-fighter-name">Weaveling</span>
    <span class="cw-launch-stage-name cw-launch-stage-name--lari">Lari the Lyrebird</span>
    <span class="cw-launch-fighter" id="cw-launch-fighter" style="--cw-guide-sheet:url('/app/assets/ai/weaveling-review-sprites-v1.png')"></span>
    <span class="cw-launch-lari"></span>
    <span class="cw-launch-spark">✦</span>
    <span class="cw-launch-caption">A little imagination while the Commons opens</span>
  </div>
  <h1>Opening Civweave…</h1>
  <div class="pulse" aria-hidden="true"></div>
  <p id="status">Refreshing the app shell, then opening the requested system directly.</p>
  <a id="recover" href="/app/working-campus-v440.html?installed=1&source=pwa-start-recovery&settingsRecovery=v339">Open Civweave directly</a>
</main>
<script>
(()=>{
'use strict';
const stage=document.getElementById('cw-launch-battle');
if(!stage)return;
const fighter=document.getElementById('cw-launch-fighter');
const name=document.getElementById('cw-launch-fighter-name');
const CAST=Object.freeze([
  {name:'Weaveling',sheet:'/app/assets/ai/weaveling-review-sprites-v1.png',accent:'#8af5d2'},
  {name:'Moss',sheet:'/app/assets/ai/moss-review-sprites-v1.png',accent:'#aeea57'},
  {name:'Kamiya',sheet:'/app/assets/ai/kamiya-review-sprites-v1.png',accent:'#e8a1ff'},
  {name:'Rook',sheet:'/app/assets/ai/rook-review-sprites-v1.png',accent:'#efb452'},
  {name:'Merlin',sheet:'/app/assets/ai/merlin-review-sprites-v1.png',accent:'#ff80b4'}
]);
const reduced=globalThis.matchMedia?.('(prefers-reduced-motion: reduce)');
let bag=[],current=-1,timer=0,closed=false;
function shuffle(){
  bag=CAST.map((_,i)=>i);
  for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}
  if(bag.at(-1)===current&&bag.length>1)[bag[bag.length-1],bag[0]]=[bag[0],bag[bag.length-1]];
}
function choose(){
  if(!bag.length)shuffle();
  current=bag.pop();
  const item=CAST[current];
  name.textContent=item.name;
  fighter.style.setProperty('--cw-guide-sheet',`url("${item.sheet}")`);
  stage.style.setProperty('--cw-guide-accent',item.accent);
  stage.dataset.guide=item.name.toLowerCase();
  stage.dataset.playing='false';
  if(!reduced?.matches&&document.visibilityState!=='hidden'){
    void stage.offsetWidth; // Restart the purely decorative sprite choreography.
    stage.dataset.playing='true';
  }
}
function stop(){if(timer)clearInterval(timer);timer=0}
function start(){if(closed)return;stop();choose();if(!reduced?.matches&&document.visibilityState!=='hidden')timer=setInterval(choose,3400)}
function visibility(){if(document.visibilityState==='hidden'){stop();stage.dataset.playing='false'}else start()}
document.addEventListener('visibilitychange',visibility);
reduced?.addEventListener?.('change',start);
globalThis.addEventListener('pagehide',()=>{closed=true;stop();document.removeEventListener('visibilitychange',visibility);reduced?.removeEventListener?.('change',start)},{once:true});
start();
})();
</script>
<script>
(()=>{
'use strict';
const VERSION='1.0.163';
const START_REVISION='pwa-start-v448-settings-v339-exact-worker-generation';
const LAUNCH_SESSION_KEY='civweave.pwa.launch-session.v1';
const BOOT_KEY='civweave.install-boundary.boot.v228';
const SHELL_WORKER_PATH='/service-worker-v203.js';
const SHELL_WORKER_URL='/service-worker-v203.js?v=1.0.163&revision=settings-v339-saved-state-first-r1';
const WORKER_SETTLE_MS=6000;
const params=new URLSearchParams(location.search);
const status=document.querySelector('#status');
const ROUTES=Object.freeze({
  civweave:['/app/working-campus-v440.html',{}],
  'living-school':['/app/cabinets/living-school/index.html',{cabinet:'1'}],
  cerbanimo:['/app/realm-console-v140.html',{system:'cerbanimo',cabinet:'1'}],
  fellowfare:['/app/fellowfare-cabinet-v144.html',{cabinet:'1'}],
  anarchadia:['/app/anarchadia-console-v139.html',{cabinet:'1'}]
});
const installedDisplay=()=>navigator.standalone===true||['standalone','fullscreen','minimal-ui','window-controls-overlay'].some(mode=>matchMedia(`(display-mode: ${mode})`).matches);
const workerURL=worker=>{try{return new URL(worker?.scriptURL||'',location.href).href}catch{return''}};
const expectedWorkerURL=()=>new URL(SHELL_WORKER_URL,location.origin).href;
function rememberLaunch(){try{sessionStorage.setItem(LAUNCH_SESSION_KEY,'1');sessionStorage.setItem(BOOT_KEY,'1');sessionStorage.removeItem('civweave.working-campus.return-recovery.v425')}catch{}}
function installer(){const url=new URL('/app/index.html',location.origin);url.searchParams.set('install','required');url.searchParams.set('source',START_REVISION+'-browser');return url}
function destination(){
  const requested=String(params.get('system')||'civweave').toLowerCase(),row=ROUTES[requested]||ROUTES.civweave,url=new URL(row[0],location.origin);
  for(const [key,value] of Object.entries(row[1]))url.searchParams.set(key,value);
  url.searchParams.set('installed','1');url.searchParams.set('version',VERSION);url.searchParams.set('source',START_REVISION);url.searchParams.set('navigation','five-system-direct-navigation-v1');url.searchParams.set('settingsRecovery','v339');
  return url;
}
function fail(message){document.documentElement.dataset.cwPwaStart='recovery';if(status)status.textContent=message}
function waitForWorkerGeneration(registration){
  const expected=expectedWorkerURL();
  if(workerURL(registration?.active)===expected&&workerURL(navigator.serviceWorker.controller)===expected)return Promise.resolve(true);
  return new Promise(resolve=>{
    let done=false;
    const finish=value=>{if(done)return;done=true;clearTimeout(timer);navigator.serviceWorker.removeEventListener('controllerchange',onController);registration?.removeEventListener?.('updatefound',onUpdateFound);resolve(value)};
    const check=()=>{
      if(workerURL(registration?.waiting)===expected){try{registration.waiting.postMessage({type:'SKIP_WAITING'})}catch{}}
      if(workerURL(navigator.serviceWorker.controller)===expected||workerURL(registration?.active)===expected)return finish(true);
      return false;
    };
    const watchInstalling=worker=>{if(!worker)return;worker.addEventListener('statechange',check)};
    const onController=()=>check();
    const onUpdateFound=()=>{watchInstalling(registration.installing);check()};
    navigator.serviceWorker.addEventListener('controllerchange',onController);
    registration?.addEventListener?.('updatefound',onUpdateFound);
    watchInstalling(registration?.installing);
    const timer=setTimeout(()=>finish(check()===true),WORKER_SETTLE_MS);
    check();
  });
}
async function refreshShellWorker(){
  if(!('serviceWorker'in navigator))return false;
  const expected=expectedWorkerURL();
  let registration=await navigator.serviceWorker.register(SHELL_WORKER_URL,{scope:'/',updateViaCache:'none'});
  if(workerURL(registration.active)!==expected&&workerURL(registration.waiting)!==expected&&workerURL(registration.installing)!==expected){
    await registration.update();
  }
  try{if(workerURL(registration.waiting)===expected)registration.waiting.postMessage({type:'SKIP_WAITING'})}catch{}
  await waitForWorkerGeneration(registration);
  return workerURL(navigator.serviceWorker.controller)===expected||workerURL(registration.active)===expected;
}
async function launch(){
  if(!installedDisplay()){location.replace(installer().href);return}
  rememberLaunch();
  try{if(status)status.textContent='Refreshing Settings v339 and bounded navigation…';await refreshShellWorker()}catch(error){console.warn('[Civweave PWA start] Exact v339 worker refresh failed; continuing to the v339-pinned campus.',error)}
  const target=destination(),watchdog=setTimeout(()=>fail('Startup did not leave this doorway. Open Civweave directly.'),7000);addEventListener('pagehide',()=>clearTimeout(watchdog),{once:true});location.replace(target.href);
}
launch().catch(error=>fail(`Startup could not continue: ${error?.message||error}`));
globalThis.CivweavePwaStartV436=Object.freeze({version:VERSION,revision:START_REVISION,installedDisplay,rememberLaunch,destination,refreshShellWorker,shellWorkerPath:SHELL_WORKER_PATH,shellWorkerUrl:SHELL_WORKER_URL,expectedWorkerURL,canonicalCampusPath:'/app/working-campus-v440.html',freshCampusPath:'/app/working-campus-v440.html',settingsRecovery:'v339',exactWorkerGeneration:true});
})();
</script>
</body>
</html>
