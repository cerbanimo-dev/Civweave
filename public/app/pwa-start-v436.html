<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061019">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Civweave</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#061019;color:#f4fbff}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#061019}body{display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 34%,#123243 0,#07141d 36%,#061019 70%)}main{width:min(100%,420px);display:grid;justify-items:center;gap:14px;text-align:center}.mark{width:72px;height:72px;border:1px solid #8de5ef55;border-radius:22px;background:radial-gradient(circle,#1d4657,#0a1821 70%);box-shadow:0 14px 42px #0008,0 0 28px #8de5ef18}.mark::after{content:"◈";display:grid;place-items:center;width:100%;height:100%;font-size:34px;color:#a5edf4}small{color:#8de5ef;font-weight:900;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font-size:1.35rem}p{margin:0;color:#b9ccd7;line-height:1.5}.pulse{width:44px;height:4px;border-radius:999px;overflow:hidden;background:#143545}.pulse::after{content:"";display:block;width:50%;height:100%;border-radius:inherit;background:#8de5ef;animation:cwstart 1s ease-in-out infinite alternate}@keyframes cwstart{from{transform:translateX(-80%)}to{transform:translateX(180%)}}a{display:none;min-height:46px;width:100%;place-items:center;padding:10px 14px;border:1px solid #8de5ef55;border-radius:13px;background:#102431;color:#f4fbff;text-decoration:none;font-weight:850}html[data-cw-pwa-start="recovery"] a{display:grid}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"></div>
  <small>Installed Civweave</small>
  <h1>Opening Civweave…</h1>
  <div class="pulse" aria-hidden="true"></div>
  <p id="status">Refreshing the app shell, then opening the requested system directly.</p>
  <a id="recover" href="/app/working-campus-v156.html?installed=1&source=pwa-start-recovery">Open Civweave directly</a>
</main>
<script>
(()=>{
'use strict';
const VERSION='1.0.163';
const START_REVISION='pwa-start-v442-canonical-five-system';
const LAUNCH_SESSION_KEY='civweave.pwa.launch-session.v1';
const BOOT_KEY='civweave.install-boundary.boot.v228';
const SHELL_WORKER_PATH='/service-worker-v203.js';
const SHELL_WORKER_URL='/service-worker-v203.js?v=1.0.163&revision=five-system-pages-v1-exact-realm-owner';
const WORKER_SETTLE_MS=2200;
const params=new URLSearchParams(location.search);
const status=document.querySelector('#status');
const ROUTES=Object.freeze({
  civweave:['/app/working-campus-v156.html',{}],
  'living-school':['/app/cabinets/living-school/index.html',{cabinet:'1'}],
  cerbanimo:['/app/realm-console-v140.html',{system:'cerbanimo',cabinet:'1'}],
  fellowfare:['/app/fellowfare-cabinet-v144.html',{cabinet:'1'}],
  anarchadia:['/app/anarchadia-console-v139.html',{cabinet:'1'}]
});
const installedDisplay=()=>navigator.standalone===true||['standalone','fullscreen','minimal-ui','window-controls-overlay'].some(mode=>matchMedia(`(display-mode: ${mode})`).matches);
const workerPath=worker=>{try{return new URL(worker?.scriptURL||'',location.href).pathname}catch{return''}};
function rememberLaunch(){try{sessionStorage.setItem(LAUNCH_SESSION_KEY,'1');sessionStorage.setItem(BOOT_KEY,'1');sessionStorage.removeItem('civweave.working-campus.return-recovery.v425')}catch{}}
function installer(){const url=new URL('/app/index.html',location.origin);url.searchParams.set('install','required');url.searchParams.set('source',START_REVISION+'-browser');return url}
function destination(){
  const requested=String(params.get('system')||'civweave').toLowerCase(),row=ROUTES[requested]||ROUTES.civweave,url=new URL(row[0],location.origin);
  for(const [key,value] of Object.entries(row[1]))url.searchParams.set(key,value);
  url.searchParams.set('installed','1');url.searchParams.set('version',VERSION);url.searchParams.set('source',START_REVISION);url.searchParams.set('navigation','five-system-direct-navigation-v1');
  return url;
}
function fail(message){document.documentElement.dataset.cwPwaStart='recovery';if(status)status.textContent=message}
async function refreshShellWorker(){
  if(!('serviceWorker'in navigator))return false;
  let registration=await navigator.serviceWorker.getRegistration('/').catch(()=>null);
  const controllerBefore=workerPath(navigator.serviceWorker.controller);
  const controllerChange=new Promise(resolve=>{
    let done=false;const finish=value=>{if(done)return;done=true;clearTimeout(timer);resolve(value)};const timer=setTimeout(()=>finish(false),WORKER_SETTLE_MS);navigator.serviceWorker.addEventListener('controllerchange',()=>finish(true),{once:true});
  });
  if(!registration||workerPath(registration.active)!==SHELL_WORKER_PATH)registration=await navigator.serviceWorker.register(SHELL_WORKER_URL,{scope:'/',updateViaCache:'none'});else await registration.update();
  try{registration.waiting?.postMessage({type:'SKIP_WAITING'})}catch{}
  if(registration.installing||registration.waiting||controllerBefore!==SHELL_WORKER_PATH)await controllerChange;
  return workerPath(navigator.serviceWorker.controller)===SHELL_WORKER_PATH;
}
async function launch(){
  if(!installedDisplay()){location.replace(installer().href);return}
  rememberLaunch();
  try{if(status)status.textContent='Refreshing the five-system navigation runtime…';await refreshShellWorker()}catch(error){console.warn('[Civweave PWA start] Shell worker refresh failed; continuing to the exact requested system.',error)}
  const target=destination(),watchdog=setTimeout(()=>fail('Startup did not leave this doorway. Open Civweave directly.'),5000);addEventListener('pagehide',()=>clearTimeout(watchdog),{once:true});location.replace(target.href);
}
launch().catch(error=>fail(`Startup could not continue: ${error?.message||error}`));
globalThis.CivweavePwaStartV436=Object.freeze({version:VERSION,revision:START_REVISION,installedDisplay,rememberLaunch,destination,refreshShellWorker,shellWorkerPath:SHELL_WORKER_PATH,canonicalCampusPath:'/app/working-campus-v156.html'});
})();
</script>
</body>
</html>
