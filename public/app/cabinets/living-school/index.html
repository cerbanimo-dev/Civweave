<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173a2d"><title>Living School Cabinet</title><style>
:root{color-scheme:dark;--ink:#10251d;--deep:#173a2d;--moss:#386b47;--teal:#4fb5a3;--paper:#f1e6c7;--sun:#e7bd45;--cream:#fff8df}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#091510;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--cream)}button,input,textarea,select{font:inherit}.app{height:100%;display:grid;grid-template-rows:54px 1fr 54px;background:radial-gradient(circle at 50% 0,#315f49,#173a2d 48%,#0a1912)}header{display:grid;grid-template-columns:44px 1fr 100px 44px;align-items:center;gap:6px;padding:5px 7px;background:linear-gradient(#1d4637,#10271e);border-bottom:2px solid #89b36a;z-index:4}.icon{width:39px;height:39px;border-radius:50%;border:2px solid #b8cf91;background:#274f3d;color:var(--paper);font-weight:900}.title small{display:block;color:#b9d79e;font-size:.6rem;letter-spacing:.13em}.title strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.progress{font-size:.65rem}.progress i{display:block;height:8px;border:1px solid #63856d;border-radius:10px;overflow:hidden;background:#07130e}.progress b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--sun));transition:width .25s}.scene{position:relative;overflow:hidden;background:linear-gradient(#aac5b8 0 28%,#54765d 28% 62%,#1b3929 62%);isolation:isolate}.scene:before{content:"";position:absolute;left:-8%;bottom:-2%;width:40%;height:87%;background:radial-gradient(ellipse at 40% 18%,#789d59 0 26%,transparent 27%),radial-gradient(ellipse at 65% 30%,#436d45 0 31%,transparent 32%),linear-gradient(90deg,transparent 42%,#5d402b 43% 62%,transparent 63%);z-index:-1}.room{position:absolute;inset:0;padding:4% 5%;display:grid;align-content:end;gap:10px}.heading{max-width:76%;margin-left:auto;padding:11px 14px;background:#163526e8;border:2px solid #9ab477;border-radius:18px 18px 8px 18px;box-shadow:0 9px 24px #0008}.heading small{color:#e6ca64;letter-spacing:.08em}.heading h1{font-size:clamp(1.15rem,5vw,1.9rem);margin:.1em 0}.heading p{margin:0;line-height:1.3;font-size:.85rem}.objects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.object{min-height:95px;padding:9px;border:0;color:#17301f;text-align:left;position:relative;box-shadow:0 8px 16px #0008;clip-path:polygon(5% 8%,92% 1%,100% 88%,93% 100%,2% 94%,0 15%);background:linear-gradient(145deg,#f6eccd,#cfbd8c)}.object[data-kind=forge]{background:linear-gradient(145deg,#f0dd9e,#b27b39)}.object[data-kind=lesson]{background:linear-gradient(145deg,#e8e0b8,#86b78d)}.object[data-kind=review]{background:linear-gradient(145deg,#d9e8d2,#72a8a1)}.object[data-kind=practice]{background:linear-gradient(145deg,#e7caa1,#9e6540)}.object[data-kind=credential]{background:linear-gradient(145deg,#f2e1a1,#d4a52f)}.object span{font-size:1.5rem;display:block}.object b,.object small{display:block}.object small{line-height:1.2}.object[disabled]{filter:grayscale(.7) brightness(.65)}.object.next:after{content:"NEXT";position:absolute;right:4px;top:4px;padding:3px 6px;border-radius:7px;background:#173a2d;color:#fff4b8;font-size:.55rem;font-weight:900}.moss,.compass{position:absolute;z-index:3}.moss{left:3%;bottom:2%;border:0;background:transparent;color:#fff;display:grid;justify-items:center}.moss span{display:grid;place-items:center;width:52px;height:61px;border-radius:50% 50% 42% 42%;background:radial-gradient(circle at 50% 38%,#f2d56e 0 11%,#5e8552 12% 55%,#284b35 56%);border:3px solid #d8c77e}.moss b{background:#173a2ddd;padding:2px 7px;border-radius:8px}.compass{right:4%;top:4%;width:46px;height:46px;border-radius:50%;border:2px solid #c7e3ca;background:radial-gradient(circle,#edf8db,#64b6a5 45%,#234f43 46%);color:#173a2d;font-size:1.4rem;box-shadow:0 0 20px #8ef2d099}.tray{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:3px;background:#0b1d16;border-top:2px solid #78956b}.tray button{border:0;background:#173429;color:#dce9cf;padding:3px 1px;font-size:.61rem}.tray button span{display:block;font-size:1rem}.tray button[aria-current=page]{background:#3f6a49;color:#fff4b1}dialog{border:0;padding:0;background:transparent;color:var(--ink);width:min(94vw,650px);max-height:88vh}dialog::backdrop{background:#06100ddd;backdrop-filter:blur(3px)}.paper{max-height:88vh;overflow:auto;padding:20px;border:4px solid #755236;border-radius:18px;background:linear-gradient(100deg,#f7efcf,#e2d2a8)}.close{float:right;position:sticky;top:0;width:36px;height:36px;border-radius:50%;border:2px solid #5b3c27;background:#f8e9c3;color:#4b291a;font-size:1.3rem}.paper h2{color:#284b35}.form{display:grid;gap:10px}.form label{display:grid;gap:4px;font-weight:800}.form input,.form textarea,.form select{width:100%;padding:9px;border:2px solid #78906b;border-radius:9px;background:#fffdf0;color:#152a20}.form textarea{min-height:75px}.primary,.secondary{border:0;border-radius:10px;padding:10px 13px;font-weight:900}.primary{background:#2e6a4b;color:#fff}.secondary{background:#d9be6c;color:#2d321f}.callout{padding:9px;border-left:5px solid #489c89;background:#dcebd8;border-radius:8px}.receipt{white-space:pre-wrap;font-family:ui-monospace,monospace;background:#172f25;color:#dff2d4;padding:10px;border-radius:9px;overflow-wrap:anywhere}.drawer{position:fixed;inset:0 0 0 auto;width:min(82vw,350px);padding:16px;background:#10271f;z-index:20;box-shadow:-12px 0 35px #000}.drawer button{width:100%;text-align:left;margin:5px 0;padding:10px;border:0;border-radius:9px;background:#315a46;color:#fff}.stars{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.star{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;font-size:.55rem;background:radial-gradient(circle,#fff5b3 0 10%,#5bb4a2 11% 35%,#193d32 36%);box-shadow:0 0 calc(5px + 18px * var(--s)) #d6f4b8}@media(max-height:620px){.room{gap:5px}.object{min-height:72px}.heading{padding:7px 10px}.moss span{width:42px;height:48px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="app"><header><button id="home" class="icon" aria-label="Pathway Desk">⌂</button><div class="title"><small>LIVING SCHOOL</small><strong id="title">Pathway Desk</strong></div><div class="progress"><span id="pct">0%</span><i><b id="bar"></b></i></div><button id="actions" class="icon" aria-label="Room actions">☰</button></header><section class="scene"><div id="room" class="room"></div><button id="moss" class="moss" aria-label="Talk to Moss"><span>◉</span><b>Moss</b></button><button id="compass" class="compass" aria-label="Commonweave compass">✦</button></section><nav class="tray" aria-label="Living School navigation"><button data-room="desk"><span>⌂</span>Path</button><button data-room="forge"><span>✎</span>Forge</button><button data-room="lesson"><span>▤</span>Learn</button><button data-room="observatory"><span>✧</span>Review</button><button data-room="workshop"><span>⚒</span>Practice</button></nav></main><dialog id="dialog"><form method="dialog" class="paper"><button class="close" value="close" aria-label="Close">×</button><div id="dialog-content"></div></form></dialog><aside id="drawer" class="drawer" hidden><button id="drawer-close">Close actions</button><h2>Room actions</h2><div id="action-list"></div></aside><script>
(()=>{'use strict';const KEY='commonweave.living-school.cabinet.v150',VERSION='1.0.31-ls-r1',$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),now=()=>new Date().toISOString(),uid=p=>p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6);const fresh=()=>({version:1,room:'desk',school:null,diagnostic:null,module:{lessonComplete:false,assessmentPassed:false},practicum:null,bridgeReceipt:null,finalPassed:false,credential:null,events:[],guided:true});let state;try{state={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=fresh()}const rooms={desk:['Pathway Desk','Your learning route','Begin a capability, continue the active school, or follow the glowing thread to the next useful instrument.'],forge:['Curriculum Forge','Build a learning path','Turn an observable capability into a compact, reviewable school with learning, assessment, practice, and proof.'],lesson:['Lesson Atelier','Learn and make meaning','Read, test an idea, and leave evidence that changes your learner record.'],observatory:['Constellation Observatory','See what you know','Inspect concept strength, due review, evidence, and the next gap worth repairing.'],workshop:['Practicum Workshop','Practice in the world','Convert learning into a bounded project, then send its proof request across the Cerbanimo bridge.'],credential:['Credential Forge','Portable proof','Issue a credential only after learning, practice, accepted evidence, and a final check.']};function next(){if(!state.school)return'forge';if(!state.module.lessonComplete||!state.module.assessmentPassed)return'lesson';if(!state.practicum||state.bridgeReceipt?.status!=='accepted')return'workshop';if(!state.finalPassed||!state.credential)return'credential';return'observatory'}function progress(){return(state.school?15:0)+(state.diagnostic?10:0)+(state.module.lessonComplete?20:0)+(state.module.assessmentPassed?20:0)+(state.practicum?10:0)+(state.bridgeReceipt?.status==='accepted'?10:0)+(state.finalPassed?10:0)+(state.credential?5:0)}function save(type,detail={}){state.events=[...(state.events||[]),{id:uid('evt'),type,at:now(),detail}].slice(-100);localStorage.setItem(KEY,JSON.stringify(state));render()}function objs(){const n=next(),mark=r=>state.guided&&n===r;if(state.room==='desk')return[{i:'✎',l:state.school?'Revise school':'Start a learning path',c:state.school?.capability||'Name something you want to become capable of doing.',k:'forge',r:'forge',n:mark('forge')},{i:'▤',l:'Continue learning',c:state.school?state.school.title:'Create a school first.',k:'lesson',r:'lesson',x:!state.school,n:mark('lesson')},{i:'✧',l:'Learner constellation',c:'Inspect strength, evidence, and review timing.',k:'review',r:'observatory',x:!state.school},{i:'⚒',l:'Practice and proof',c:'Create a practicum and cross the Cerbanimo bridge.',k:'practice',r:'workshop',x:!state.module.assessmentPassed,n:mark('workshop')},{i:'◆',l:'Credential forge',c:'Complete the final gate and issue portable proof.',k:'credential',r:'credential',x:state.bridgeReceipt?.status!=='accepted',n:mark('credential')}];if(state.room==='forge')return[{i:'✎',l:state.school?'Edit active school':'Forge a school',c:'Capability, current level, desired practice, and proof.',k:'forge',a:'forge',n:mark('forge')},{i:'⌁',l:'Run diagnostic',c:'Record the starting point without pretending certainty.',k:'review',a:'diagnostic',x:!state.school}];if(state.room==='lesson')return[{i:'▤',l:'Open lesson',c:state.module.lessonComplete?'Lesson completed. Reopen any time.':'Read the first lesson and complete its exercise.',k:'lesson',a:'lesson',n:mark('lesson')},{i:'?',l:'Take assessment',c:state.module.assessmentPassed?'Assessment passed.':'A deterministic check with visible criteria.',k:'review',a:'assessment',x:!state.module.lessonComplete}];if(state.room==='observatory')return[{i:'✧',l:'Open constellation',c:'Concept strength comes from completed evidence.',k:'review',a:'constellation'},{i:'↻',l:'Review due concepts',c:state.module.assessmentPassed?'No fragile concept is due.':'The core concept needs another pass.',k:'lesson',r:'lesson'}];if(state.room==='workshop')return[{i:'⚒',l:state.practicum?'Edit practicum':'Create practicum',c:'Define an artifact, proof requirement, and completion condition.',k:'practice',a:'practicum',n:mark('workshop')},{i:'⇄',l:'Cerbanimo bridge',c:state.bridgeReceipt?'Receipt: '+state.bridgeReceipt.status:'Send the practicum as a skilled-labor quest.',k:'credential',a:'bridge',x:!state.practicum}];return[{i:'◇',l:'Final competency check',c:state.finalPassed?'Final check passed.':'Unlocked by a valid accepted Cerbanimo receipt.',k:'review',a:'final',x:state.bridgeReceipt?.status!=='accepted',n:mark('credential')},{i:'◆',l:'Issue credential',c:state.credential?'Credential stored locally and exportable.':'Create portable proof from the completed evidence chain.',k:'credential',a:'credential',x:!state.finalPassed}]}
function render(){const rm=rooms[state.room]||rooms.desk,o=objs(),p=progress();$('#title').textContent=rm[0];$('#pct').textContent=p+'%';$('#bar').style.width=p+'%';document.querySelectorAll('[data-room]').forEach(b=>b.setAttribute('aria-current',b.dataset.room===state.room?'page':'false'));$('#room').innerHTML='<div class="heading"><small>'+esc(rm[1])+'</small><h1>'+esc(rm[0])+'</h1><p>'+esc(rm[2])+'</p></div><div class="objects">'+o.map((v,i)=>'<button class="object '+(v.n?'next':'')+'" data-object="'+i+'" data-kind="'+v.k+'" '+(v.x?'disabled':'')+'><span>'+v.i+'</span><b>'+esc(v.l)+'</b><small>'+esc(v.c)+'</small></button>').join('')+'</div>';$('#action-list').innerHTML=o.map((v,i)=>'<button data-action="'+i+'" '+(v.x?'disabled':'')+'>'+esc(v.l)+' · '+esc(v.c)+'</button>').join('')}function go(r){if(rooms[r]){state.room=r;save('room.opened',{room:r})}}function open(h){$('#dialog-content').innerHTML=h;$('#dialog').showModal()}function forge(){open('<h2>'+(state.school?'Revise':'Forge')+' a learning path</h2><p>Define an observable capability. This cabinet creates a complete lesson, assessment, practicum, evidence gate, and credential path.</p><form id="f" class="form"><label>Capability<input name="capability" required value="'+esc(state.school?.capability||'')+'"></label><label>Current level<select name="level"><option>New to this</option><option>Some experience</option><option>Practiced</option></select></label><label>How should practice happen?<textarea name="practice" required>'+esc(state.school?.practice||'Build a small real artifact that demonstrates the capability.')+'</textarea></label><label>What counts as proof?<textarea name="proof" required>'+esc(state.school?.proof||'A reviewable artifact plus an explanation of the decisions made.')+'</textarea></label><button class="primary">Forge reviewable school</button></form>');$('#f').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));state.school={id:state.school?.id||uid('school'),title:'A Path to '+d.capability,...d,updatedAt:now()};state.module={lessonComplete:false,assessmentPassed:false};state.diagnostic=state.practicum=state.bridgeReceipt=state.credential=null;state.finalPassed=false;$('#dialog').close();state.room='lesson';save('school.forged',{capability:d.capability})}}function diagnostic(){open('<h2>Starting-point diagnostic</h2><p>This is a routing clue, not a verdict.</p><form id="d" class="form"><label>I can explain the core idea<select name="a"><option value="0">Not yet</option><option value="1">Partly</option><option value="2">Clearly</option></select></label><label>I have used it in practice<select name="b"><option value="0">Not yet</option><option value="1">With help</option><option value="2">Independently</option></select></label><button class="primary">Record starting point</button></form>');$('#d').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));state.diagnostic={score:+d.a + +d.b,at:now()};$('#dialog').close();save('diagnostic.completed',state.diagnostic)}}function lesson(){open('<h2>Lesson 1 · Make the capability observable</h2><p>A capability becomes learnable when it can be seen in action. Separate <strong>principle, application, evidence, and consequence</strong>.</p><div class="callout">Proof contract: '+esc(state.school?.proof||'')+'</div><form id="l" class="form"><label>Write one observable action<textarea name="reflection" required placeholder="A learner demonstrates this when…"></textarea></label><button class="primary">Complete lesson</button></form>');$('#l').onsubmit=e=>{e.preventDefault();state.module.lessonComplete=true;state.module.reflection=new FormData(e.currentTarget).get('reflection');$('#dialog').close();save('lesson.completed')}}function assessment(){open('<h2>Module assessment</h2><p>Which creates the strongest evidence boundary?</p><form id="q" class="form"><label><input type="radio" name="a" value="a" required> The learner says they understand.</label><label><input type="radio" name="a" value="b"> The learner produces an inspectable artifact and explains its decisions.</label><label><input type="radio" name="a" value="c"> The learner spends enough time in the lesson.</label><button class="primary">Submit assessment</button></form>');$('#q').onsubmit=e=>{e.preventDefault();if(new FormData(e.currentTarget).get('a')==='b'){state.module.assessmentPassed=true;state.module.assessmentAt=now();$('#dialog').close();state.room='workshop';save('assessment.passed')}else{$('#dialog-content').insertAdjacentHTML('beforeend','<div class="callout">Not yet. Time or confidence alone cannot verify capability.</div>')}}}function constellation(){const a=state.module.assessmentPassed?1:state.module.lessonComplete?.55:.2;open('<h2>Learner constellation</h2><p>Stars brighten only when an event leaves evidence.</p><div class="stars"><div class="star" style="--s:'+a+'">Principle</div><div class="star" style="--s:'+(state.module.lessonComplete?.6:.15)+'">Application</div><div class="star" style="--s:'+(state.practicum?.7:.1)+'">Practice</div><div class="star" style="--s:'+(state.bridgeReceipt?1:.1)+'">Evidence</div><div class="star" style="--s:'+(state.credential?1:.08)+'">Credential</div></div>')}function practicum(){open('<h2>Create practicum</h2><form id="p" class="form"><label>Artifact to build<textarea name="artifact" required>'+esc(state.practicum?.artifact||state.school?.practice||'')+'</textarea></label><label>Evidence required<textarea name="evidence" required>'+esc(state.practicum?.evidence||state.school?.proof||'')+'</textarea></label><label>Completion condition<textarea name="completion" required>'+esc(state.practicum?.completion||'Another person can inspect the artifact and trace the major decisions.')+'</textarea></label><button class="primary">Save practicum</button></form>');$('#p').onsubmit=e=>{e.preventDefault();state.practicum={id:state.practicum?.id||uid('practicum'),...Object.fromEntries(new FormData(e.currentTarget)),updatedAt:now()};$('#dialog').close();save('practicum.saved')}}function bridge(){const accepted=state.bridgeReceipt?.status==='accepted';open('<h2>Cerbanimo bridge</h2><p>This first slice records a signed local test receipt using the same evidence boundary the connected bridge will require.</p><div class="receipt">'+esc(JSON.stringify({capability:state.school?.capability,artifact:state.practicum?.artifact,evidence:state.practicum?.evidence,status:state.bridgeReceipt?.status||'not-sent'},null,2))+'</div>'+(accepted?'<div class="callout">Accepted evidence receipt is present. Final check unlocked.</div>':'<button id="send" class="primary">Send quest and record accepted test receipt</button>'));if(!accepted)$('#send').onclick=()=>{state.bridgeReceipt={id:uid('cerb-receipt'),status:'accepted',questId:uid('quest'),practicumId:state.practicum.id,evidence:[state.practicum.artifact,state.practicum.evidence],acceptedAt:now(),mode:'local-cabinet-test'};$('#dialog').close();state.room='credential';save('cerbanimo.quest.accepted')}}function finalCheck(){open('<h2>Final competency check</h2><p>Which chain is required before issuing a capability credential?</p><form id="z" class="form"><label><input type="radio" name="a" value="a" required> Lesson only</label><label><input type="radio" name="a" value="b"> Lesson, assessment, practicum, and accepted evidence receipt</label><label><input type="radio" name="a" value="c"> A model-generated compliment</label><button class="primary">Submit final check</button></form>');$('#z').onsubmit=e=>{e.preventDefault();if(new FormData(e.currentTarget).get('a')==='b'){state.finalPassed=true;$('#dialog').close();save('final.passed')}else $('#dialog-content').insertAdjacentHTML('beforeend','<div class="callout">The complete evidence chain is required.</div>')}}function credential(){if(!state.credential){state.credential={id:uid('credential'),type:'Living School capability credential',capability:state.school.capability,schoolId:state.school.id,lessonEvidence:state.module.reflection,assessmentAt:state.module.assessmentAt,practicumId:state.practicum.id,cerbanimoReceiptId:state.bridgeReceipt.id,issuedAt:now(),version:VERSION};save('credential.issued')}open('<h2>Credential issued</h2><div class="receipt">'+esc(JSON.stringify(state.credential,null,2))+'</div><button id="export" class="secondary">Export credential JSON</button>');$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state.credential,null,2)],{type:'application/json'}));a.download='living-school-credential-'+state.credential.id+'.json';a.click()}}function act(o){if(o.x)return;if(o.r)return go(o.r);({forge,diagnostic,lesson,assessment,constellation,practicum,bridge,final:finalCheck,credential}[o.a]||(()=>{}))()}document.addEventListener('click',e=>{const r=e.target.closest('[data-room]');if(r)return go(r.dataset.room);const o=e.target.closest('[data-object]');if(o)return act(objs()[+o.dataset.object]);const a=e.target.closest('[data-action]');if(a){$('#drawer').hidden=true;act(objs()[+a.dataset.action])}});$('#home').onclick=()=>go('desk');$('#actions').onclick=()=>$('#drawer').hidden=false;$('#drawer-close').onclick=()=>$('#drawer').hidden=true;$('#moss').onclick=()=>open('<h2>Moss</h2><p>'+(state.school?'Your active capability is <strong>'+esc(state.school.capability)+'</strong>. The next useful room is <strong>'+rooms[next()][0]+'</strong>.':'What do you want to become capable of doing? Start at the Curriculum Forge.')+'</p><button id="route" class="primary">Follow the learning thread</button>');$('#compass').onclick=()=>open('<h2>Commonweave compass</h2><p>'+(state.school?'Active learning intention: <strong>'+esc(state.school.capability)+'</strong>.':'No learning intention is confirmed yet.')+'</p><button id="route" class="primary">Follow the thread</button>');$('#dialog').addEventListener('click',e=>{if(e.target.id==='route'){$('#dialog').close();go(next())}});render();globalThis.LivingSchoolCabinet={version:VERSION,getState:()=>structuredClone(state),reset:()=>{localStorage.removeItem(KEY);state=fresh();render()}}})();
</script></body></html>
