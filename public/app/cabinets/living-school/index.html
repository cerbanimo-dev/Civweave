<!doctype html>
<html lang="en" data-living-school-cabinet="v151">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173a2d">
  <title>Living School Cabinet</title>
  <link rel="stylesheet" href="/app/cabinets/living-school/living-school-cabinet-v151.css?v=feature-wave-2">
  <link rel="stylesheet" href="/app/intention-ui-v138.css?v=weave-r1">
  <link rel="stylesheet" href="/app/assistant-runtime-v141.css?v=orchestration-r1">
</head>
<body>
  <main class="ls-app" id="app">
    <header class="ls-header">
      <button class="ls-round" id="home" type="button" aria-label="Return to Pathway Desk">⌂</button>
      <div class="ls-title">
        <small>LIVING SCHOOL</small>
        <strong id="room-title">Pathway Desk</strong>
      </div>
      <div class="ls-progress" aria-label="Learning path progress">
        <span id="progress-label">0%</span>
        <i><b id="progress-bar"></b></i>
      </div>
      <button class="ls-round" id="actions" type="button" aria-label="Open room actions">☰</button>
    </header>

    <section class="ls-stage" id="stage" aria-live="polite">
      <div class="ls-scene-art" aria-hidden="true"><span class="ls-tree"></span><span class="ls-window"></span><span class="ls-floor"></span></div>
      <div class="ls-room" id="room"></div>
      <button class="ls-moss" id="moss" type="button" aria-label="Talk to Moss"><span aria-hidden="true">◉</span><b>Moss</b></button>
      <button class="ls-compass" id="compass" type="button" aria-label="Open Commonweave route"><span aria-hidden="true">✦</span></button>
    </section>

    <nav class="ls-tray" aria-label="Living School cabinet navigation">
      <button data-room="desk" type="button"><span>⌂</span>Path</button>
      <button data-room="forge" type="button"><span>✎</span>Forge</button>
      <button data-room="map" type="button"><span>⌘</span>Map</button>
      <button data-room="observatory" type="button"><span>✧</span>Review</button>
      <button data-room="systems" type="button"><span>⚙</span>Systems</button>
    </nav>
  </main>

  <dialog id="instrument-dialog">
    <section class="ls-instrument" aria-labelledby="instrument-title">
      <button class="ls-close" id="instrument-close" type="button" aria-label="Close instrument">×</button>
      <div id="instrument-content"></div>
    </section>
  </dialog>

  <aside class="ls-drawer" id="drawer" hidden aria-label="Room actions">
    <button id="drawer-close" type="button">Close actions</button>
    <h2>Room actions</h2>
    <div id="action-list"></div>
  </aside>

  <div class="ls-toast" id="toast" role="status" hidden></div>
  <script src="/app/local-first-policy-v131.js?v=1.0.31" defer></script>
  <script src="/app/shared/commonweave-model-runtime.js?v=1.0.31-antigravity" defer></script>
  <script src="/app/minilm-reflex-runtime-v138.js?v=reflex-r1" defer></script>
  <script src="/app/intention-planner-v141.js?v=orchestration-r1" defer></script>
  <script src="/app/intention-ui-v138.js?v=weave-r1" defer></script>
  <script src="/app/guide-contracts-v141.js?v=orchestration-r1" defer></script>
  <script src="/app/assistant-runtime-v141.js?v=orchestration-r1" defer></script>
  <script src="/app/core-loop-v152.js?v=restoration-r1"></script>
  <script src="/app/guide-chat-v153.js?v=five-system-chat-r1"></script>
  <script src="/app/capability-readiness-v154.js?v=intention-studio-r1"></script>
  <script type="module" src="/app/cabinets/living-school/living-school-cabinet-v151.mjs?v=feature-wave-2"></script>
</body>
</html>
