</style></head><body><h1>Avatar expression QA v344</h1><p class="sub">All five guides, all poses, rendered from the exact offline RLE path. Inspect pose labels, clipping, transparency, reconstruction, and scaling at desktop and 390px mobile widths.</p><div class="toolbar"><button data-jump="desktop">Desktop grid</button><button data-jump="mobile">Mobile grid</button><span id="status">Loading atlas…</span></div><main id="root"></main><script src="/app/avatar-expression-director-v343.js?v=1.0.1-avatar-v344"></script><script>
(async()=>{const status=document.getElementById('status'),root=document.getElementById('root');for(let i=0;i<80&&!globalThis.CivweaveAvatarExpressionDirectorV343;i++)await new Promise(r=>setTimeout(r,50));const api=globalThis.CivweaveAvatarExpressionDirectorV343;if(!api){status.textContent='Director failed to load';return}const systems={civweave:'Weaveling','living-school':'Moss',cerbanimo:'Kamiya',fellowfare:'Rook',anarchadia:'Merlin'};let bad=0,total=0;for(const mode of ['desktop','mobile']){const frame=document.createElement('section');frame.className=`frame ${mode}`;frame.id=mode;const inside=document.createElement('div');inside.className='inside';inside.innerHTML=`<h2>${mode==='desktop'?'Desktop 1180px':'Mobile 390px'}</h2>`;frame.append(inside);root.append(frame);for(const [system,name] of Object.entries(systems)){const sec=document.createElement('section');sec.className='system';sec.innerHTML=`<h2>${name} · ${system}</h2>`;const grid=document.createElement('div');grid.className='grid';sec.append(grid);inside.append(sec);for(const expression of api.expressions[system]){total++;const tile=document.createElement('article');tile.className='tile';tile.innerHTML=`<div class="sprite"><img alt="${name} ${expression}"></div><div class="label">${expression}</div><div class="meta">pending</div>`;grid.append(tile);try{const src=await api.materialize(system,expression),img=tile.querySelector('img');img.src=src;await img.decode?.();const ok=img.naturalWidth===128&&img.naturalHeight===108;tile.classList.add(ok?'good':'bad');if(!ok)bad++;tile.querySelector('.meta').textContent=`${img.naturalWidth}×${img.naturalHeight} · lossless PNG · contain`;}catch(error){bad++;tile.classList.add('bad');tile.querySelector('.meta').textContent=`ERROR: ${error?.message||error}`}}}}status.textContent=`${total-bad}/${total} render checks clean${bad?` · ${bad} flagged`:''}`;document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.jump)?.scrollIntoView({behavior:'smooth'}));})();
