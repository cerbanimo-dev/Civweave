<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061019">
<title>Civweave</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#061019}
body{position:fixed;inset:0;padding:0!important}
#cw-family-stage{position:fixed;z-index:1;left:0;right:0;top:0;bottom:calc(var(--cw-themed-nav-height,74px) + env(safe-area-inset-bottom) + 14px);width:100%;height:auto;border:0;background:#061019}
#cw-family-stage[aria-busy="true"]{opacity:.985}
#cw-themed-system-nav{z-index:2147483640!important}
#cw-themed-system-nav-menu{z-index:2147483641!important}
#cw-themed-system-nav .cw-themed-system-avatar{position:relative;overflow:hidden;background:none!important}
#cw-themed-system-nav .cw-shell-sprite{position:absolute;display:block;max-width:none!important;width:500%;height:400%;left:calc(var(--sprite-col,0) * -100%);top:calc(var(--sprite-row,0) * -100%);object-fit:fill;pointer-events:none;user-select:none}
#cw-themed-system-nav .cw-shell-sprite.is-fallback{width:100%;height:100%;left:0;top:0;object-fit:cover}
</style>
<script src="/app/install-boundary-v146.js"></script>
<script src="/app/system-routes-v227.js?v=1.0.163-five-system-route-contract-v227"></script>
<script>
(()=>{
'use strict';
const SHELL_REVISION='persistent-family-shell-v1';
const SYSTEMS=new Set(['civweave','living-school','cerbanimo','fellowfare','anarchadia']);
const SPRITES=Object.freeze({
  civweave:'/Civweave-weaveling-sprites.png',
  'living-school':'/Living-School-moss-sprites.png',
  cerbanimo:'/Cerbanimo-kamiya-sprites.png',
  fellowfare:'/FellowFare-rook-sprites.png',
  anarchadia:'/Anarchadia-merlin-sprites.png'
});
const FACES=Object.freeze({
  civweave:'/app/assets/ai/chat/weaveling-face-v255.webp',
  'living-school':'/app/assets/ai/chat/moss-face-v255.webp',
  cerbanimo:'/app/assets/ai/chat/kamiya-face-v255.webp',
  fellowfare:'/app/assets/ai/chat/rook-face-v255.webp',
  anarchadia:'/app/assets/ai/chat/merlin-face-v255.webp'
});
const params=()=>new URLSearchParams(location.search);
const requested=()=>SYSTEMS.has(params().get('system'))?params().get('system'):'civweave';
let activeSystem=requested();
let pendingFeature=String(params().get('feature')||'');
let featureAttempts=0;
function frame(){return document.getElementById('cw-family-stage')}
function routeApi(){return globalThis.CivweaveSystemRoutesV227||null}
function routeOptions(feature=''){
  const q=params(),options={origin:location.origin,version:q.get('version')||'1.0.163',source:SHELL_REVISION,direct:true};
  if(q.get('developer')==='1')options.developer=true;
  if(q.get('recovery'))options.recovery=q.get('recovery');
  if(feature)options.feature=feature;
  return options;
}
function directUrl(system,feature=''){
  const api=routeApi();
  if(api?.directUrlFor)return api.directUrlFor(system,routeOptions(feature));
  const fallback={civweave:'/app/working-campus-v156.html','living-school':'/app/cabinets/living-school/index.html',cerbanimo:'/app/realm-console-v140.html',fellowfare:'/app/fellowfare-cabinet-v144.html',anarchadia:'/app/anarchadia-console-v139.html'};
  const url=new URL(fallback[system]||fallback.civweave,location.origin);url.searchParams.set('installed','1');if(system==='living-school'||system==='fellowfare'||system==='anarchadia')url.searchParams.set('cabinet','1');if(system==='cerbanimo'){url.searchParams.set('system','cerbanimo');url.searchParams.set('cabinet','1')}if(feature)url.searchParams.set('feature',feature);return url;
}
function shellHistory(system,mode='push'){
  const url=new URL(location.href);url.searchParams.set('installed','1');url.searchParams.set('system',system);url.searchParams.set('shell',SHELL_REVISION);url.searchParams.delete('feature');
  const state={...(history.state||{}),civweaveSystem:system,civweaveShell:SHELL_REVISION};
  if(mode==='replace')history.replaceState(state,'',`${url.pathname}${url.search}${url.hash}`);else if(mode==='push')history.pushState(state,'',`${url.pathname}${url.search}${url.hash}`);
}
function syncNavigation(system){
  globalThis.CivweaveFamilyNavigationV178?.syncCurrentSelection?.(system);
  try{dispatchEvent(new CustomEvent('civweave:system-route-changed',{detail:{system,shell:SHELL_REVISION}}))}catch{}
}
function removeEmbeddedRail(){
  try{
    const doc=frame()?.contentDocument;if(!doc)return;
    doc.getElementById('cw-themed-system-nav')?.remove();doc.getElementById('cw-themed-system-nav-menu')?.remove();doc.getElementById('cw-themed-system-nav-style')?.remove();
    doc.documentElement.classList.remove('cw-themed-system-nav-active');delete doc.documentElement.dataset.cwThemedCurrent;doc.body?.style.removeProperty('padding-bottom');
  }catch{}
}
function reveal(doc,target){
  if(!target)return false;let node=target;if(node.matches?.('details'))node.open=true;for(let parent=node.parentElement;parent;parent=parent.parentElement)if(parent.matches?.('details'))parent.open=true;
  requestAnimationFrame(()=>{target.scrollIntoView?.({behavior:'smooth',block:'start'});const focusable=target.matches?.('button,a,input,select,textarea,summary,[tabindex]')?target:target.querySelector?.('button,a,input,select,textarea,summary,[tabindex]');focusable?.focus?.({preventScroll:true})});return true;
}
function activateFeature(system,feature){
  if(!feature)return true;
  const shellFrame=frame();let win,doc;try{win=shellFrame?.contentWindow;doc=shellFrame?.contentDocument}catch{return false}if(!win||!doc)return false;
  if(feature==='chat'){
    const chat=win.CivweaveGuideChatSurfaceV350||win.CivweavePersistentGuideChatV215;try{return Boolean(chat?.open?.({guide:system,focus:true}))}catch{return false}
  }
  if(system==='civweave'){
    if(feature==='settings'){const settings=win.CivweaveSettingsV320||win.CivweaveSettingsGatewayV317;try{if(settings?.open){settings.open(doc.activeElement);return true}}catch{}return false}
    const target=feature==='weave'||feature==='progress'?'quest':feature,campus=win.CivweaveWorkingCampusV156;try{return Boolean(campus?.openView?.(target))}catch{return false}
  }
  if(system==='living-school'){
    let target=null;
    if(feature==='continue')target=doc.querySelector('.lsc218-lesson')||doc.querySelector('.lsc218-module-rail')||doc.querySelector('.lsc218-hero');
    if(feature==='path')target=doc.querySelector('details[data-cw-pd-id="living-path-setup"]')||[...doc.querySelectorAll('.lsc218-panel')].find(panel=>/choose or define the path/i.test(panel.textContent||''));
    if(feature==='modules')target=doc.querySelector('.lsc218-module-rail')||doc.querySelector('.lsc218-lesson');
    if(feature==='practicum')target=doc.querySelector('details[data-cw-pd-id="living-practicum"]')||[...doc.querySelectorAll('.lsc218-panel')].find(panel=>/apply learning in the world/i.test(panel.textContent||''));
    return reveal(doc,target);
  }
  if(system==='cerbanimo'){
    const control=doc.querySelector(`[data-dashboard-room="${feature}"],[data-room="${feature}"]`);if(control){control.click();return true}return false;
  }
  if(system==='fellowfare'){
    const control=doc.querySelector(`[data-ffc-command="${feature}"]`);if(control){control.click();return true}return false;
  }
  if(system==='anarchadia'){
    if(feature==='passport'){doc.querySelector('[data-screen-target="home"]')?.click();return reveal(doc,doc.querySelector('.ac-passport'))}
    if(feature==='governance'){const control=doc.querySelector('[data-ag145-open]');if(control){control.click();return true}return false}
    const control=doc.querySelector(`[data-screen-target="${feature}"]`);if(control){control.click();return true}return false;
  }
  return false;
}
function consumePendingFeature(){
  if(!pendingFeature)return;
  if(activateFeature(activeSystem,pendingFeature)){pendingFeature='';featureAttempts=0;return}
  if(featureAttempts<5){featureAttempts+=1;setTimeout(consumePendingFeature,220*featureAttempts)}
}
function navigate(system,{feature='',historyMode='push',force=false}={}){
  if(!SYSTEMS.has(system))system='civweave';
  const shellFrame=frame();if(!shellFrame)return false;
  const same=system===activeSystem;
  activeSystem=system;pendingFeature=String(feature||'');featureAttempts=0;
  if(historyMode!=='none')shellHistory(system,historyMode);
  syncNavigation(system);
  globalThis.CivweaveFamilyNavigationV178?.closeQuickMenu?.({restoreFocus:false});
  if(same&&!force){consumePendingFeature();return true}
  shellFrame.setAttribute('aria-busy','true');shellFrame.src=directUrl(system,pendingFeature).href;return true;
}
function repairAvatars(){
  const nav=document.getElementById('cw-themed-system-nav');if(!nav)return false;
  for(const link of nav.querySelectorAll('a[data-system]')){
    const system=String(link.dataset.system||''),avatar=link.querySelector('.cw-themed-system-avatar');if(!avatar||!SPRITES[system]||avatar.querySelector('.cw-shell-sprite'))continue;
    const image=document.createElement('img');image.className='cw-shell-sprite';image.alt='';image.draggable=false;image.decoding='async';image.src=SPRITES[system];
    image.addEventListener('error',()=>{if(image.dataset.fallbackActive==='1')return;image.dataset.fallbackActive='1';image.classList.add('is-fallback');image.src=FACES[system]},{once:true});avatar.append(image);
  }
  return true;
}
function setup(){
  const shellFrame=frame();if(!shellFrame)return;
  shellHistory(activeSystem,'replace');
  shellFrame.addEventListener('load',()=>{shellFrame.setAttribute('aria-busy','false');removeEmbeddedRail();consumePendingFeature();try{dispatchEvent(new CustomEvent('civweave:persistent-family-stage-ready',{detail:{system:activeSystem,shell:SHELL_REVISION}}))}catch{}});
  shellFrame.src=directUrl(activeSystem,pendingFeature).href;
  const observer=new MutationObserver(()=>{if(repairAvatars())observer.disconnect()});observer.observe(document.body,{childList:true,subtree:true});
  repairAvatars();setTimeout(repairAvatars,120);setTimeout(repairAvatars,800);
  try{dispatchEvent(new CustomEvent('civweave:persistent-family-shell-ready',{detail:{system:activeSystem,shell:SHELL_REVISION}}))}catch{}
}
document.addEventListener('click',event=>{
  const quick=event.target.closest?.('#cw-themed-system-nav-menu [data-cw-nav-feature]');
  if(quick){event.preventDefault();event.stopImmediatePropagation();navigate(String(quick.dataset.cwNavSystem||activeSystem),{feature:String(quick.dataset.cwNavFeature||'')});return}
  const link=event.target.closest?.('#cw-themed-system-nav a[data-system]');if(!link)return;
  if(event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
  if(link.classList.contains('is-menu-open')||link.getAttribute('aria-expanded')==='true')return;
  event.preventDefault();event.stopImmediatePropagation();link.focus?.({preventScroll:true});navigate(String(link.dataset.system||'civweave'));
},true);
addEventListener('popstate',()=>{const system=requested();if(system!==activeSystem)navigate(system,{historyMode:'none',force:true});else syncNavigation(system)});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup,{once:true});else setup();
globalThis.CivweavePersistentFamilyShellV1=Object.freeze({revision:SHELL_REVISION,get system(){return activeSystem},navigate:(system,options={})=>navigate(system,options),frame:()=>frame(),repairAvatars});
})();
</script>
<script src="/app/themed-system-nav-v178.js?v=1.0.163-five-system-navigation-v227"></script>
</head>
<body>
<iframe id="cw-family-stage" title="Civweave system" aria-busy="true" allow="microphone;camera;geolocation;clipboard-read;clipboard-write;fullscreen"></iframe>
</body>
</html>
