<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Civweave chat-open smoke</title>
<style>body{font-family:system-ui,sans-serif;padding:20px;background:#08111d;color:#eef7ff}pre{white-space:pre-wrap;background:#0006;padding:12px;border-radius:10px}</style>
</head>
<body data-civweave-system="civweave">
<h1>Chat-open smoke</h1>
<p id="state">loading</p>
<pre id="result"></pre>
<script src="/app/guide-chat-surface-v350.js?smoke=v351"></script>
<script src="/app/shared-chat-face-icons-v255.js?smoke=v351"></script>
<script>
(()=>{
  const state=document.getElementById('state'),result=document.getElementById('result');
  const started=performance.now();
  let openedAt=0,timeoutExpected=0;
  function write(extra={}){
    const scripts=[...document.scripts].map(node=>node.src||'').filter(Boolean);
    const packet={
      schema:'civweave.chat-open-smoke.v351',
      ready:Boolean(globalThis.CivweaveGuideChatSurfaceV350),
      root:Boolean(document.getElementById('cw-persistent-guide-chat-v215')),
      openReturnMs:Math.round(openedAt-started),
      eventLoopLagMs:Math.max(0,Math.round(performance.now()-timeoutExpected)),
      expressionDirectorLoaded:scripts.some(src=>src.includes('/app/avatar-expression-director-v345.js')),
      miniLmLoaded:scripts.some(src=>src.includes('/app/minilm-context-router-v344.js')),
      faceRuntimeVersion:globalThis.CivweaveSharedChatFaceIconsV255?.version||null,
      heavyRuntimeOnOpen:globalThis.CivweaveSharedChatFaceIconsV255?.heavyRuntimeOnOpen,
      expressionRuntimeTrigger:globalThis.CivweaveSharedChatFaceIconsV255?.expressionRuntimeTrigger||null,
      ...extra
    };
    packet.pass=packet.ready&&packet.root&&packet.expressionDirectorLoaded===false&&packet.miniLmLoaded===false&&packet.heavyRuntimeOnOpen===false&&packet.eventLoopLagMs<250;
    state.textContent=packet.pass?'PASS':'FAIL';
    result.textContent=JSON.stringify(packet,null,2);
  }
  setTimeout(()=>{
    try{
      const before=performance.now();
      globalThis.CivweaveGuideChatSurfaceV350?.open?.({guide:'civweave',focus:false});
      openedAt=performance.now();
      timeoutExpected=openedAt+600;
      setTimeout(()=>write({openSynchronousMs:Math.round(openedAt-before)}),600);
    }catch(error){
      openedAt=performance.now();timeoutExpected=openedAt;write({error:String(error?.stack||error)});
    }
  },100);
})();
</script>
</body>
</html>
