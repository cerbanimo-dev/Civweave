#cw-persistent-system-loading[hidden]{display:none}
#cw-persistent-system-error{position:fixed;z-index:30;left:16px;right:16px;bottom:calc(var(--cw-persistent-nav-space) + 14px);display:none;padding:12px 14px;border:1px solid #ffb86677;border-radius:12px;background:#17111df2;color:#fff;font:14px/1.4 system-ui,sans-serif}
#cw-persistent-system-error[data-open="1"]{display:block}

<iframe id="cw-persistent-system-stage" title="Civweave system" src="about:blank" allow="clipboard-read; clipboard-write; geolocation; microphone"></iframe>
<div id="cw-persistent-system-loading">OPENING SYSTEM…</div>
<div id="cw-persistent-system-error" role="alert"></div>
<script id="cw-persistent-first-frame-rescue-v1">
/* Independent first-frame boot: works even if the shared navigation JS or optional AI/settings assets fail to load. */
(()=>{
'use strict';
const routes={
  civweave:['/app/working-campus-v440.html',{}],
  'living-school':['/app/cabinets/living-school/index.html',{cabinet:'1'}],
  cerbanimo:['/app/realm-console-v140.html',{system:'cerbanimo',cabinet:'1'}],
  fellowfare:['/app/fellowfare-cabinet-v144.html',{cabinet:'1'}],
  anarchadia:['/app/anarchadia-console-v139.html',{cabinet:'1'}]
};
const query=new URLSearchParams(location.search),requested=String(query.get('system')||'civweave').toLowerCase();
const system=Object.prototype.hasOwnProperty.call(routes,requested)?requested:'civweave';
const [pathname,params]=routes[system],target=new URL(pathname,location.origin);
for(const [key,value] of Object.entries(params))target.searchParams.set(key,value);
target.searchParams.set('installed','1');target.searchParams.set('embed','1');target.searchParams.set('persistentShell','1');
if(query.get('feature'))target.searchParams.set('feature',query.get('feature'));
const host=document.getElementById('cw-persistent-system-stage');
const loading=document.getElementById('cw-persistent-system-loading');
const error=document.getElementById('cw-persistent-system-error');
const normalizedPath=url=>url.pathname.replace(/\/index\.html$/,'/').replace(/\.html$/,'');
function currentTarget(){try{return new URL(host?.dataset.cwExpectedHref||target.href,location.href)}catch{return target}}
function currentSystem(expected=currentTarget()){return Object.entries(routes).find(([,entry])=>normalizedPath(new URL(entry[0],location.origin))===normalizedPath(expected))?.[0]||system}
function validDocument(){
  try{
    const doc=host.contentDocument,href=host.contentWindow.location.href,actual=new URL(href,location.href),expected=currentTarget();
    return Boolean(doc?.body&&doc.contentType==='text/html'&&doc.documentElement?.dataset.civweaveSystem===currentSystem(expected)&&actual.origin===expected.origin&&normalizedPath(actual)===normalizedPath(expected)
      &&actual.search===expected.search&&actual.hash===expected.hash&&actual.searchParams.get('embed')==='1'&&actual.searchParams.get('persistentShell')==='1');
  }catch{return false}
}
function fail(message){
  if(!loading||!error)return false;
  loading.hidden=true;error.replaceChildren();
  const title=document.createElement('strong');title.textContent='System launch failed';
  const detail=document.createElement('p');detail.textContent=String(message||'The system could not be opened.');detail.style.margin='8px 0';
  const actions=document.createElement('div');actions.style.cssText='display:flex;gap:8px;flex-wrap:wrap';
  const retry=document.createElement('button');retry.type='button';retry.textContent='Retry system';retry.style.cssText='padding:9px 12px;border-radius:9px;cursor:pointer';
  retry.addEventListener('click',()=>location.reload());
  const standalone=document.createElement('a');standalone.href=currentTarget().href;standalone.textContent='Open system content directly';standalone.style.cssText='display:inline-flex;padding:9px 12px;border:1px solid #9edcff;border-radius:9px;color:#9edcff';
  const diagnostic=document.createElement('small');diagnostic.style.cssText='display:block;margin-top:8px;opacity:.8;overflow-wrap:anywhere';
  let framePath='unavailable';try{framePath=host?.contentWindow?.location?.pathname?.slice(0,160)||'unavailable'}catch{}
  diagnostic.textContent='System: '+currentSystem()+' · Frame: '+framePath;
  actions.append(retry,standalone);error.append(title,detail,actions,diagnostic);
  error.dataset.open='1';document.documentElement.dataset.cwFirstFrame='failed';
  return true;
}
globalThis.CivweaveShellRescueV1=Object.freeze({version:'1.1-current-frame',fail,get target(){return currentTarget().href},validDocument});
host.dataset.cwBootstrapHref=target.href;
host.src=target.href;
document.documentElement.dataset.cwFirstFrame='requested';
host.addEventListener('load',()=>{
  if(globalThis.CivweavePersistentSystemShellV1?.current?.())return;
  if(validDocument()){loading.hidden=true;error.dataset.open='0';document.documentElement.dataset.cwFirstFrame='embedded-ready'}
  else fail('The embedded system returned an invalid document or redirected away from the requested system.');
});
setTimeout(()=>{
  if(loading.hidden||error.dataset.open==='1')return;
  if(validDocument()){loading.hidden=true;document.documentElement.dataset.cwFirstFrame='embedded-ready';return}
  fail('The system did not respond within 8 seconds. The shared boot runtime or cached system assets may be unavailable.');
},8000);
})();
</script>
