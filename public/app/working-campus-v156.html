<!doctype html>
<html lang="en" data-commonweave-system="commonweave" data-build="working-campus-v160-dark-review">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07162f">
<title>Commonweave Working Campus</title>
<script src="/app/install-boundary-v146.js"></script>
<link rel="stylesheet" href="/app/working-campus-v156.css?v=weaveling-chat-r1">
<link rel="stylesheet" href="/app/system-interface-v157.css?v=inner-ui-r1">
<link rel="stylesheet" href="/app/platform-experience-v160.css?v=dark-review-r1">
</head>
<body>
<main class="app">
  <header class="top">
    <button class="brand" id="brand-home" style="border:0;background:transparent;color:inherit;text-align:left"><img src="/app/logos/commonweave.webp" alt=""><span><small>LOCAL WORKING CAMPUS</small><b>Commonweave</b></span></button>
    <button class="pill active" id="guided-mode">Guided rails</button>
    <button class="pill" id="roam-mode">Free roam</button>
    <button class="pill" id="settings-button">AI settings</button>
  </header>
  <section class="campus" aria-label="Commonweave realms">
    <button class="realm-node" data-realm="living-school" style="--accent:var(--living)"><b class="badge" data-badge="living-school" hidden></b><img src="/app/assets/ai/moss.png" alt=""><small>Moss</small><strong>Living School</strong><span>Learn what the intention requires.</span></button>
    <button class="realm-node" data-realm="cerbanimo" style="--accent:var(--cerb)"><b class="badge" data-badge="cerbanimo" hidden></b><img src="/app/assets/ai/kamiya.png" alt=""><small>Kamiya</small><strong>Cerbanimo</strong><span>Turn the route into skilled work.</span></button>
    <button class="realm-node" data-realm="fellowfare" style="--accent:var(--fare)"><b class="badge" data-badge="fellowfare" hidden></b><img src="/app/assets/ai/rook.png" alt=""><small>Rook</small><strong>FellowFare</strong><span>Find materials, services, and help.</span></button>
    <button class="realm-node" data-realm="anarchadia" style="--accent:var(--an)"><b class="badge" data-badge="anarchadia" hidden></b><img src="/app/assets/ai/merlin.png" alt=""><small>Merlin</small><strong>Anarchadia</strong><span>Store consent, roles, and review.</span></button>
  </section>
  <section class="main">
    <aside class="guide">
      <div class="guide-head"><img src="/app/assets/ai/weaveling.png" alt="Weaveling"><div><small class="muted">CENTRAL MIRROR</small><h1>Weaveling</h1><span class="muted">Wish → weave → realms</span></div></div>
      <div class="conversation" id="conversation" aria-live="polite"></div>
      <form class="weaveling-chat-form" id="weaveling-chat-form">
        <label for="weaveling-chat-input">Message Weaveling</label>
        <textarea id="weaveling-chat-input" name="message" rows="3" maxlength="8000" placeholder="Tell Weaveling your wish, ask a question, or revise the route." required></textarea>
        <button class="btn primary" id="weaveling-chat-send" type="submit">Send</button>
        <small id="weaveling-chat-status" class="muted">Local history · shared model settings</small>
      </form>
      <div class="guide-foot"><button class="btn" id="model-chip">Model settings</button><button class="btn" id="export-button">Export</button></div>
    </aside>
    <section class="work"><header class="work-head"><b id="view-title">Your weave</b><span class="muted" id="state-label">Local draft</span></header><div class="workspace" id="workspace"></div></section>
  </section>
</main>
<nav class="bottom"><button class="active" data-view="weave">Weave</button><button data-view="progress">Progress</button><button data-view="library">Library</button><button data-view="campus">Campus</button></nav>
<div class="toast" id="toast" hidden></div>
<script src="/app/platform-experience-v160.js?v=dark-review-r1"></script>
<script src="/app/family-ai-loader-v105.js?v=unified-settings-r1"></script>
<script src="/app/merlinites-semantic-planner-v164.js?v=merlinites-r1"></script>
<script src="/app/working-campus-v156.js?v=weaveling-chat-r1"></script>
</body>
</html>
