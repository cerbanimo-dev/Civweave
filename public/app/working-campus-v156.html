<!doctype html>
<html lang="en" data-civweave-system="civweave" data-build="interface-runtime-v1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07162f">
<title>Civweave Working Campus · v1.0.160</title>
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" type="image/png" href="/app/logos/civweave-app-icon.png">
<link rel="stylesheet" href="/app/working-campus-v156.css?v=interface-runtime-v1">
<link rel="stylesheet" href="/app/system-interface-v157.css?v=interface-runtime-v1">
<link rel="stylesheet" href="/app/platform-experience-v160.css?v=interface-runtime-v1">
</head>
<body>
<main class="app">
  <header class="top" aria-label="Civweave campus controls">
    <button class="brand" id="brand-home" type="button"><img src="/app/logos/civweave-symbol.svg" alt="Civweave"><span class="brand-copy"><small>LOCAL WORKING CAMPUS <b class="version-chip">v1.0.160</b></small><strong>Civweave</strong></span></button>
    <button class="pill settings-pill" id="settings-button" type="button" data-open-unified-ai-settings><span aria-hidden="true">⚙</span><span>Settings</span></button>
    <a class="pill" href="/app/index.html?manage=downloads"><span aria-hidden="true">⇩</span><span>Downloads</span></a>
  </header>

  <section class="campus" aria-label="Civweave realms">
    <button class="realm-node" data-realm="living-school" style="--accent:var(--living)"><img src="/app/assets/ai/moss.png" alt=""><small>Moss</small><strong>Living School</strong><span>Learn what the intention requires.</span></button>
    <button class="realm-node" data-realm="cerbanimo" style="--accent:var(--cerb)"><img src="/app/assets/ai/kamiya.png" alt=""><small>Kamiya</small><strong>Cerbanimo</strong><span>Turn the route into skilled work.</span></button>
    <button class="realm-node" data-realm="fellowfare" style="--accent:var(--fare)"><img src="/app/assets/ai/rook.png" alt=""><small>Rook</small><strong>FellowFare</strong><span>Find materials, services, and help.</span></button>
    <button class="realm-node" data-realm="anarchadia" style="--accent:var(--an)"><img src="/app/assets/ai/merlin.png" alt=""><small>Merlin</small><strong>Anarchadia</strong><span>Store consent, roles, and review.</span></button>
  </section>

  <section class="main">
    <aside class="guide">
      <div class="guide-head"><img src="/app/assets/ai/weaveling.png" alt="Weaveling"><div><small class="muted">CENTRAL MIRROR</small><h1>Weaveling</h1><span class="muted">Wish → weave → realms</span></div></div>
      <div class="conversation" id="conversation" aria-live="polite"></div>
      <form class="weaveling-chat-form" id="weaveling-chat-form">
        <label for="weaveling-chat-input">Message Weaveling</label>
        <textarea id="weaveling-chat-input" name="message" rows="3" maxlength="8000" placeholder="Tell Weaveling your wish, ask a question, or revise the route." required></textarea>
        <button class="btn primary" id="weaveling-chat-send" type="submit">Send</button>
        <small id="weaveling-chat-status" class="muted">Local history · generative AI starts only when you send a message</small>
      </form>
      <div class="guide-foot"><button class="btn" id="model-chip" type="button" data-open-unified-ai-settings>Settings</button></div>
    </aside>
    <section class="work"><header class="work-head"><b>Your weave</b><span class="muted">Local state</span></header><div class="workspace" id="workspace"></div></section>
  </section>
</main>

<nav class="bottom"><button class="active" data-view="weave">Weave</button><button data-view="progress">Progress</button><button data-view="library">Library</button><button data-view="campus">Campus</button></nav>
<script src="/app/model-settings-controller-v173.js?activate=1&v=1.0.160-interface-runtime-v1"></script>
<script src="/app/language-settings-v1.js?v=interface-runtime-v1"></script>
<script src="/app/settings-gateway-v317.js?v=interface-runtime-v1"></script>
<script src="/app/system-routes-v227.js?v=1.0.160-five-system-route-contract-v227"></script>
<script src="/app/family-ai-loader-v105.js?v=interface-runtime-v1"></script>
<script src="/app/working-campus-v156.js?v=1.0.160-interface-runtime-v1"></script>
</body>
</html>
