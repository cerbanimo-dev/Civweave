Deterministic</button><button class="btn" id="export-button">Export</button></div></aside><section class="work"><header class="work-head"><b id="view-title">Your weave</b><span class="muted" id="state-label">Local draft</span></header><div class="workspace" id="workspace"></div></section></section></main><nav class="bottom"><button class="active" data-view="weave">Weave</button><button data-view="progress">Progress</button><button data-view="library">Library</button><button data-view="campus">Campus</button></nav><dialog id="settings"><h2>Shared AI route</h2><p class="muted">Gemini is prefilled for conversation. Antigravity can be tested separately for agentic work. Secrets remain in this session only.</p><div class="field-grid"><div class="field"><label>Route</label><select id="model-route"><option value="deterministic">Deterministic local</option><option value="gemini">Google Gemini</option><option value="browser">Browser model</option><option value="local-api">Local API / Ollama</option><option value="gguf">GGUF bridge</option><option value="manual">Manual handoff</option><option value="hosted">Hosted allowance</option></select></div><div class="field"><label>Model</label><input id="model-name" placeholder="gemini-3.5-flash-lite"></div><div class="field full"><label>Endpoint</label><input id="model-endpoint" placeholder="https://generativelanguage.googleapis.com/v1beta"></div><div class="field full"><label>API key or bearer token</label><input id="model-key" type="password" autocomplete="off" placeholder="Session-only Gemini key"></div><div class="field full" id="gemini-options"><label><input id="remote-consent" type="checkbox"> Allow prompts to leave this device for Gemini.</label><label><input id="agentic-enabled" type="checkbox"> Use Antigravity for agentic work.</label><label>Agentic model<input id="agentic-model" value="antigravity" readonly></label></div></div><div class="actions"><button class="btn" id="test-gemini" type="button">Test Gemini</button><butto
