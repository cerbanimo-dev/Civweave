<script id="working-campus-planner-v199">
(()=>{
'use strict';
const VERSION='1.1.0-working-campus-planner-v199-ai-request-only';
const K='civweave.working-campus.v1';
const parse=(value,fallback)=>{try{return JSON.parse(value)??fallback}catch{return fallback}};
const clean=(value,max=12000)=>String(value??'').trim().slice(0,max);
function profileFromForm(existing={}){
  return{skill:document.querySelector('#skill-level')?.value||existing.skill||'new',learning:document.querySelector('#learning-mode')?.value||existing.learning||'practice',collaboration:document.querySelector('#collaboration-mode')?.value||existing.collaboration||'solo',hours:document.querySelector('#weekly-hours')?.value||existing.hours||'3-5',constraints:clean(document.querySelector('#constraints')?.value||existing.constraints,3000)};
}
function setStatus(message){const status=document.querySelector('#weaveling-chat-status');if(status)status.textContent=message}
function showError(error){const toast=document.querySelector('#toast');if(toast){toast.textContent=`AI Quest generation could not start: ${clean(error?.message||error,280)}`;toast.hidden=false;setTimeout(()=>{toast.hidden=true},5000)}}
function questRequest(current,profile){
  const wish=clean(current?.wish,6000);if(!wish)return'';
  const details=[`Generate a reviewable Quest for this intention: ${wish}`,`Current skill level: ${profile.skill}.`,`Learning mode: ${profile.learning}.`,`Collaboration: ${profile.collaboration}.`,`Weekly availability: ${profile.hours}.`,profile.constraints?`Additional context and constraints: ${profile.constraints}`:''].filter(Boolean);
  return details.join('\n');
}
async function buildPlan(){
  const current=parse(localStorage.getItem(K),{}),profile=profileFromForm(current.profile||{}),message=questRequest(current,profile);if(!message)throw new Error('Tell Weaveling what you want to do before generating a Quest.');
  const form=document.querySelector('#weaveling-chat-form'),input=document.querySelector('#weaveling-chat-input');if(!form||!input)throw new Error('Weaveling chat is not ready yet.');
  input.value=message;setStatus('Sending this Quest request to the selected AI model…');
  const submit=new Event('submit',{bubbles:true,cancelable:true}),cancelled=!form.dispatchEvent(submit);if(!cancelled)throw new Error('The Weaveling AI authoring runtime is still loading. Try again in a moment.');
  return true;
}
function syncButton(){const button=document.querySelector('#build-plan');if(button){button.textContent='Generate Quest with AI';button.dataset.questAuthoring='ai-required'}}
document.addEventListener('click',event=>{const button=event.target.closest?.('#build-plan');if(!button)return;event.preventDefault();event.stopImmediatePropagation();void buildPlan().catch(error=>{showError(error);setStatus('No Quest was created. AI generation is required.')})},true);
addEventListener('civweave:guide-workspace-ready',syncButton);addEventListener('pageshow',syncButton);new MutationObserver(syncButton).observe(document.documentElement,{subtree:true,childList:true});syncButton();
globalThis.CivweaveWorkingCampusPlannerV199=Object.freeze({version:VERSION,buildPlan,aiQuestOnly:true,deterministicQuestCreation:false,persistenceAuthority:false});
try{dispatchEvent(new CustomEvent('civweave:working-campus-planner-ready',{detail:{version:VERSION,aiQuestOnly:true,deterministicQuestCreation:false}}))}catch{}
})();
</script>
