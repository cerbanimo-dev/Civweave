<body>
<a class="skip-link" href="#lite-main">Skip to workstation content</a>
<main class="cabinet-stage" id="cabinet-stage">
  <section class="cabinet-shell" id="cabinet-shell" aria-label="Civweave cabinet workstation">
    <img id="cabinet-art" class="cabinet-art" alt="" draggable="false">
    <section class="cabinet-screen" id="cabinet-screen">
      <header class="screen-header">
        <div class="screen-identity"><img id="screen-logo" alt=""><div><small id="screen-guide"></small><h1 id="screen-system"></h1></div></div>
        <div class="screen-actions"><a id="cabinet-link" href="/app/cabinet-mode-v142.html">Cabinet mode</a><button id="lite-settings" type="button">Settings</button></div>
      </header>
      <nav class="room-strip" id="room-list" aria-label="Rooms"></nav>
      <section class="screen-status" id="screen-status" aria-live="polite"></section>
      <main class="screen-scroll" id="lite-main" tabindex="-1"><div class="lite-loading">Reading the parity ledger…</div></main>
    </section>
    <nav class="cabinet-controls" id="cabinet-controls" aria-label="Switch Civweave system"></nav>
  </section>
</main>
<div id="lite-toast" role="status" hidden></div>
