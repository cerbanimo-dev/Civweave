<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07141f">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Commonweave Cabinet Workstations</title>
  <link rel="icon" href="/app/logos/commonweave-icon-192.png">
  <link rel="stylesheet" href="/app/lite-v129-base.css?v=1.0.29">
  <link rel="stylesheet" href="/app/lite-v129-components.css?v=1.0.29">
  <link rel="stylesheet" href="/app/lite-v129-themes.css?v=1.0.29">
</head>
<body>
<a class="skip-link" href="#lite-main">Skip to workstation content</a>
<main class="cabinet-stage" id="cabinet-stage">
  <section class="cabinet-shell" id="cabinet-shell" aria-label="Commonweave cabinet workstation">
    <img id="cabinet-art" class="cabinet-art" alt="" draggable="false">
    <section class="cabinet-screen" id="cabinet-screen">
      <header class="screen-header">
        <div class="screen-identity">
          <img id="screen-logo" alt="">
          <div><small id="screen-guide"></small><h1 id="screen-system"></h1></div>
        </div>
        <div class="screen-actions">
          <a id="visual-link" href="/loom/">Visual</a>
          <button id="lite-settings" type="button">Settings</button>
        </div>
      </header>
      <nav class="room-strip" id="room-list" aria-label="Rooms"></nav>
      <section class="screen-status" id="screen-status" aria-live="polite"></section>
      <main class="screen-scroll" id="lite-main" tabindex="-1"><div class="lite-loading">Reading the parity ledger…</div></main>
    </section>
    <nav class="cabinet-controls" id="cabinet-controls" aria-label="Switch Commonweave system"></nav>
  </section>
</main>
<div id="lite-toast" role="status" hidden></div>
<script src="/app/shared/commonweave-parity-runtime.js?v=1.0.29" defer></script>
<script src="/app/lite-v129-core.js?v=1.0.29" defer></script>
<script src="/app/lite-v129-native.js?v=1.0.29" defer></script>
<script src="/app/lite-v129-app.js?v=1.0.29" defer></script>
</body>
</html>
