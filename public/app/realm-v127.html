<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#04131d">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Commonweave Realm</title>
  <link rel="icon" href="/app/logos/commonweave-icon-192.png">
  <link rel="stylesheet" href="/app/loom-v127.css?v=1.0.27">
</head>
<body class="cw127-realm">
<main class="cw127-app" id="cw127-realm-app">
  <section class="cw127-scene" aria-label="Commonweave realm">
    <img class="cw127-scene-bg" id="cw127-realm-scene" alt="" fetchpriority="high">
    <img class="cw127-realm-logo" id="cw127-realm-logo" alt="">
    <button class="cw127-realm-guide" id="cw127-realm-guide" data-action="guide" aria-label="Talk to this realm's guide"><img alt=""></button>
    <div class="cw127-status" id="cw127-realm-status">Loading isolated realm…</div>
  </section>
</main>
<button class="cw127-back" data-action="back">← Commonweave</button>
<header class="cw127-topbar">
  <button class="cw127-version" data-action="version"><img src="/app/logos/commonweave.webp" alt=""><span>v1.0.27</span></button>
  <nav class="cw127-tools" aria-label="Realm tools">
    <button data-action="info" aria-label="Realm information"><span class="cw127-info-glyph">i</span></button>
    <button data-action="guide" aria-label="Chat with realm guide"><img id="cw127-guide-artifact" alt=""></button>
    <button data-action="settings" aria-label="Universal AI settings"><img src="/app/assets/generated/commonweave-navigation-icons/commonweave-ai-config.png" alt=""></button>
  </nav>
</header>
<nav class="cw127-nav cw127-realm-nav" id="cw127-realm-nav" aria-label="Realm navigation"></nav>
<div class="cw127-toast" id="cw127-toast" hidden></div>
<script src="/app/realm-v127.js?v=1.0.27" defer></script>
</body>
</html>
