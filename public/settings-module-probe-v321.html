<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SETTINGS_ENV_PROBE_LOADING</title></head><body><div id="surface"></div><button id="launch" type="button" data-open-unified-ai-settings>Open Settings</button><pre id="out">waiting</pre><script>
(async()=>{
const params=new URLSearchParams(location.search),surfaceMode=params.get('surface')||'blank',listeners=params.get('listeners')==='1',source=params.get('source')||'staging';
const stats={mode:'real-click',surface:surfaceMode,listeners,source,scriptAdds:0,scripts:[],gpuCalls:0,workers:0,observers:0,openedEvents:0,cancelEvents:0,readyEvents:0,errors:[],syncClickMs:null,lag250:null,lag1000:null,beforeOpen:null,afterOpen:null};
const nativeAppend=document.head.append.bind(document.head);document.head.append=(...nodes)=>{for(const n of nodes){if(n?.tagName==='SCRIPT'){stats.scriptAdds++;stats.scripts.push(n.src||'inline')}}return nativeAppend(...nodes)};
try{Object.defineProperty(navigator,'gpu',{configurable:true,value:{requestAdapter:async()=>{stats.gpuCalls++;return null}}})}catch{}
const NW=globalThis.Worker;if(NW)globalThis.Worker=class extends NW{constructor(...args){stats.workers++;super(...args)}};
const NMO=globalThis.MutationObserver;if(NMO)globalThis.MutationObserver=class extends NMO{constructor(cb){stats.observers++;super(cb)}};
addEventListener('error',event=>stats.errors.push(String(event.error?.stack||event.message||event.error||'error').slice(0,500)));
addEventListener('unhandledrejection',event=>stats.errors.push(String(event.reason?.stack||event.reason||'rejection').slice(0,500)));
addEventListener('civweave:model-settings-opened',()=>stats.openedEvents++);addEventListener('civweave:local-inference-cancel-requested',()=>stats.cancelEvents++);addEventListener('civweave:settings-ready',()=>stats.readyEvents++);
function snapshot(){return{scriptAdds:stats.scriptAdds,gpuCalls:stats.gpuCalls,workers:stats.workers,observers:stats.observers,openedEvents:stats.openedEvents,cancelEvents:stats.cancelEvents,errors:stats.errors.length}}
function load(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.async=false;s.onload=resolve;s.onerror=()=>reject(new Error(`load failed: ${src}`));document.head.append(s)})}
if(surfaceMode==='campus'){
 const css=document.createElement('link');css.rel='stylesheet';css.href='/app/working-campus-v156.css?probe=surface';document.head.append(css);
 document.getElementById('surface').innerHTML=`<main class="app"><header class="top"><button class="brand"><img src="/app/logos/civweave-symbol.svg"><span class="brand-copy"><small>LOCAL WORKING CAMPUS</small><strong>Civweave</strong></span></button><div class="mode-switch"><button class="pill active">Guided rails</button><button class="pill">Free roam</button></div><button class="pill settings-pill">Settings</button></header><section class="campus">${['moss','kamiya','rook','merlin'].map((n,i)=>`<button class="realm-node" style="--accent:${['#aeea57','#e85dff','#efb452','#ff4f9b'][i]}"><img src="/app/assets/ai/${n}.png"><small>Guide</small><strong>Realm ${i+1}</strong><span>Representative campus surface.</span></button>`).join('')}</section><section class="main"><aside class="guide"><div class="guide-head"><img src="/app/assets/ai/weaveling.png"><div><small class="muted">CENTRAL MIRROR</small><h1>Weaveling</h1></div></div><div class="conversation">${'<div class="message">Representative conversation content.</div>'.repeat(12)}</div></aside><section class="work"><header class="work-head"><b>Your weave</b></header><div class="workspace">${'<article class="card"><h2>Quest card</h2><p>Representative working-campus content for compositing.</p></article>'.repeat(6)}</div></section></section></main><nav class="bottom"><button class="active">Weave</button><button>Progress</button><button>Library</button><button>Campus</button></nav>`;
}
try{
 if(listeners){await load('/app/mobile-ai-hardening-v302.js?probe=settings-env');await load('/app/gemini-task-tier-router-v213.js?probe=settings-env')}
 const settingsSrc=source==='prod'?'https://civweave.cc/app/settings-gateway-v317.js?probe=settings-env-prod':'/app/settings-gateway-v317.js?probe=settings-env-staging';
 await load(settingsSrc);
 stats.beforeOpen=snapshot();
 const start=performance.now();document.getElementById('launch').click();stats.syncClickMs=Math.round((performance.now()-start)*10)/10;
 const t250=performance.now()+250;setTimeout(()=>{stats.lag250=Math.round(performance.now()-t250)},250);
 const t1000=performance.now()+1000;setTimeout(()=>{stats.lag1000=Math.round(performance.now()-t1000);stats.afterOpen=snapshot();const layer=document.getElementById('cw-settings-v320');document.title=`SETTINGS_ENV_${source}_${surfaceMode}_listeners${listeners?1:0}_layer${layer&&!layer.hidden?1:0}_opened${stats.openedEvents}_newScripts${stats.afterOpen.scriptAdds-stats.beforeOpen.scriptAdds}_gpu${stats.gpuCalls}_workers${stats.workers}_obs${stats.observers}_cancel${stats.cancelEvents}_lag${stats.lag250??-1}`;document.getElementById('out').textContent=JSON.stringify(stats,null,2)},1000);
}catch(error){stats.errors.push(String(error?.stack||error));document.title='SETTINGS_ENV_ERROR';document.getElementById('out').textContent=JSON.stringify(stats,null,2)}
})();
</script></body></html>
