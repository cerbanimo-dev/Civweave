<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SETTINGS_CLICK_PROBE_LOADING</title></head><body><button id="launch" type="button" data-open-unified-ai-settings>Open Settings</button><pre id="out">waiting</pre><script>
const stats={mode:'real-click',scriptAdds:0,scripts:[],gpuCalls:0,workers:0,observers:0,openedEvents:0,cancelEvents:0,readyEvents:0,syncClickMs:null,lag250:null,lag1000:null,error:''};
const nativeAppend=document.head.append.bind(document.head);document.head.append=(...nodes)=>{for(const n of nodes){if(n?.tagName==='SCRIPT'){stats.scriptAdds++;stats.scripts.push(n.src||'inline')}}return nativeAppend(...nodes)};
try{Object.defineProperty(navigator,'gpu',{configurable:true,value:{requestAdapter:async()=>{stats.gpuCalls++;return null}}})}catch{}
const NW=globalThis.Worker;if(NW)globalThis.Worker=class extends NW{constructor(...args){stats.workers++;super(...args)}};
const NMO=globalThis.MutationObserver;if(NMO)globalThis.MutationObserver=class extends NMO{constructor(cb){stats.observers++;super(cb)}};
addEventListener('civweave:model-settings-opened',()=>stats.openedEvents++);addEventListener('civweave:local-inference-cancel-requested',()=>stats.cancelEvents++);addEventListener('civweave:settings-ready',()=>stats.readyEvents++);
function finish(){const api=globalThis.CivweaveSettingsV320,layer=document.getElementById('cw-settings-v320');document.title=`SETTINGS_CLICK_api${api?1:0}_layer${layer&&!layer.hidden?1:0}_opened${stats.openedEvents}_scripts${stats.scriptAdds}_gpu${stats.gpuCalls}_workers${stats.workers}_obs${stats.observers}_cancel${stats.cancelEvents}_lag${stats.lag250??-1}`;document.getElementById('out').textContent=JSON.stringify(stats,null,2)}
</script><script src="/app/settings-gateway-v317.js?probe=settings-click-v321"></script><script>
setTimeout(()=>{try{const start=performance.now();document.getElementById('launch').click();stats.syncClickMs=Math.round((performance.now()-start)*10)/10;const a=performance.now()+250;setTimeout(()=>{stats.lag250=Math.round(performance.now()-a)},250);const b=performance.now()+1000;setTimeout(()=>{stats.lag1000=Math.round(performance.now()-b);finish()},1000)}catch(e){stats.error=String(e?.stack||e);finish()}},200);
</script></body></html>
