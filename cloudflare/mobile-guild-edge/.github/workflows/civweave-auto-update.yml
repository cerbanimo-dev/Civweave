name: Civweave Guild partner-release policy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-decentralized-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Verify Guild release relay has no scheduled central upstream
        run: node scripts/test-mobile-guild-auto-update-v1.mjs
