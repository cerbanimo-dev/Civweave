services:
  - type: web
    name: civweave-node-hub
    runtime: node
    rootDir: node-hub
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HUB_NAME
        value: Civweave Node Hub
