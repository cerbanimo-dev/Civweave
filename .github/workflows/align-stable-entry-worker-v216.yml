name: Align stable entry worker v216

on:
  push:
    branches: [agent/stable-entry-worker-v216]
    paths:
      - scripts/align-stable-entry-worker-v216.mjs
      - .github/workflows/align-stable-entry-worker-v216.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stable-entry-worker-v216
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align compatibility labels
        run: |
          node scripts/align-stable-entry-worker-v216.mjs
          git show origin/main:public/service-worker.js > public/service-worker.js
      - name: Validate aligned workers
        run: |
          node --check public/install-v130.js
          node --check public/service-worker-core-v208.js
          node --check public/service-worker-v203.js
          node --check public/service-worker.js
          grep -q "const BUILD = 'lightweight-shell-v208'" public/service-worker-v203.js
          grep -q "revision=\${WORKER_SCRIPT_REVISION}" public/install-v130.js
          grep -q "LEGACY_ENTRY_PATHS" public/service-worker-v203.js
      - name: Commit alignment
        run: |
          git config user.name "cerbanimo-dev"
          git config user.email "cerbanimo@gmail.com"
          git add public/install-v130.js public/service-worker-core-v208.js public/service-worker-v203.js public/service-worker.js
          if git diff --cached --quiet; then
            echo "Compatibility alignment is already current."
            exit 0
          fi
          git commit -m "Preserve v208 worker compatibility while refreshing the entry route"
          git push origin HEAD:agent/stable-entry-worker-v216
