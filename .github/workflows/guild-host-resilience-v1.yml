name: Guild host resilience
on:
  pull_request:
    paths:
      - 'public/app/index.html'
      - 'public/host-setup.html'
      - 'public/host-local-anchor.html'
      - 'public/app/shared/guild-host-resilience-v1.mjs'
      - 'public/app/pocket-guild-node-v1.mjs'
      - 'public/app/guild-host-onboarding-v1.mjs'
      - 'public/app/mobile-guild-create-v1.mjs'
      - 'public/app/emergency-ai-host-v1.mjs'
      - 'public/app/emergency-ai-mesh-v1.mjs'
      - 'public/app/emergency-ai-host-control-v1.mjs'
      - 'public/app/node-ai-operator-v1.html'
      - 'public/app/host-node-session-v1.js'
      - 'public/app/offline-package-v208.json'
      - 'lib/emergency-ai-share-v1.mjs'
      - 'cloudflare/node-cloud/src/capacity-guildkeeper-v1.mjs'
      - 'cloudflare/node-cloud/src/server-ai-entry-v6.mjs'
      - 'cloudflare/node-cloud/wrangler.jsonc'
      - 'cloudflare/mobile-guild-edge/**'
      - 'scripts/test-guild-host-resilience-v1.mjs'
      - 'scripts/test-guild-host-onboarding-v1.mjs'
      - 'scripts/test-mobile-guild-create-v1.mjs'
      - 'scripts/test-emergency-ai-mesh-v1.mjs'
      - 'scripts/test-guildkeeper-capacity-v1.mjs'
  push:
    branches: [staging]
    paths:
      - 'public/app/index.html'
      - 'public/host-setup.html'
      - 'public/host-local-anchor.html'
      - 'public/app/shared/guild-host-resilience-v1.mjs'
      - 'public/app/pocket-guild-node-v1.mjs'
      - 'public/app/guild-host-onboarding-v1.mjs'
      - 'public/app/mobile-guild-create-v1.mjs'
      - 'public/app/emergency-ai-host-v1.mjs'
      - 'public/app/emergency-ai-mesh-v1.mjs'
      - 'public/app/emergency-ai-host-control-v1.mjs'
      - 'public/app/node-ai-operator-v1.html'
      - 'public/app/host-node-session-v1.js'
      - 'public/app/offline-package-v208.json'
      - 'lib/emergency-ai-share-v1.mjs'
      - 'cloudflare/node-cloud/src/capacity-guildkeeper-v1.mjs'
      - 'cloudflare/node-cloud/src/server-ai-entry-v6.mjs'
      - 'cloudflare/node-cloud/wrangler.jsonc'
      - 'cloudflare/mobile-guild-edge/**'
      - 'scripts/test-guild-host-resilience-v1.mjs'
      - 'scripts/test-guild-host-onboarding-v1.mjs'
      - 'scripts/test-mobile-guild-create-v1.mjs'
      - 'scripts/test-emergency-ai-mesh-v1.mjs'
      - 'scripts/test-guildkeeper-capacity-v1.mjs'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check public/app/shared/guild-host-resilience-v1.mjs
      - run: node --check public/app/pocket-guild-node-v1.mjs
      - run: node --check public/app/guild-host-onboarding-v1.mjs
      - run: node --check public/app/mobile-guild-create-v1.mjs
      - run: node --check public/app/emergency-ai-host-v1.mjs
      - run: node --check public/app/emergency-ai-mesh-v1.mjs
      - run: node --check public/app/emergency-ai-host-control-v1.mjs
      - run: node --check public/app/host-node-session-v1.js
      - run: node --check lib/emergency-ai-share-v1.mjs
      - run: node --check cloudflare/node-cloud/src/capacity-guildkeeper-v1.mjs
      - run: node --check cloudflare/node-cloud/src/server-ai-entry-v6.mjs
      - run: node --check cloudflare/mobile-guild-edge/src/index.mjs
      - name: Install mobile Guild edge deployment dependencies
        run: npm install --prefix cloudflare/mobile-guild-edge --no-audit --no-fund
      - name: Dry-run standalone mobile Guild edge deployment
        run: npm --prefix cloudflare/mobile-guild-edge run deploy -- --dry-run --outdir "$RUNNER_TEMP/mobile-guild-edge-dry-run"
        env:
          CIVWEAVE_GUILD_CLAIM_TOKEN: ci-placeholder-not-used-by-dry-run-12345678901234567890
      - run: node scripts/test-guild-host-resilience-v1.mjs
      - run: node scripts/test-guild-host-onboarding-v1.mjs
      - run: node scripts/test-mobile-guild-create-v1.mjs
      - run: node scripts/test-emergency-ai-mesh-v1.mjs
      - run: node scripts/test-guildkeeper-capacity-v1.mjs
