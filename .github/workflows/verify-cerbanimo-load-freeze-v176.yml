name: Verify Cerbanimo Load Freeze v176

on:
  pull_request:
    paths:
      - 'public/service-worker-v203.js'
      - 'public/service-worker-release-coherence-v220.js'
      - 'public/service-worker-five-system-pages-v1.js'
      - 'public/service-worker-direct-shell-retirement-v1.js'
      - 'public/app/realm-console-v140.html'
      - 'public/app/realm-console-v140.js'
      - 'public/app/shared/civweave-parity-runtime.js'
      - 'public/app/cerbanimo-nav-stability-v1.js'
      - 'public/app/cerbanimo-quest-engine-v144.js'
      - 'public/app/cerbanimo-quest-path-v266.js'
      - 'public/app/cerbanimo-learning-packs-v1.js'
      - 'public/app/cerbanimo-video-task-contract-v1.mjs'
      - 'public/app/cerbanimo-proof-attachments-v165.js'
      - 'scripts/verify-cerbanimo-load-freeze-v176.mjs'
      - '.github/workflows/verify-cerbanimo-load-freeze-v176.yml'
  push:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  verify-cerbanimo-load-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check Cerbanimo boot runtimes
        run: |
          node --check public/service-worker-v203.js
          node --check public/service-worker-release-coherence-v220.js
          node --check public/service-worker-five-system-pages-v1.js
          node --check public/service-worker-direct-shell-retirement-v1.js
          node --check public/app/realm-console-v140.js
          node --check public/app/shared/civweave-parity-runtime.js
          node --check public/app/cerbanimo-nav-stability-v1.js
          node --check public/app/cerbanimo-quest-engine-v144.js
          node --check public/app/cerbanimo-quest-path-v266.js
          node --check public/app/cerbanimo-learning-packs-v1.js
          node --check public/app/cerbanimo-video-task-contract-v1.mjs
          node --check public/app/cerbanimo-proof-attachments-v165.js
          node --check scripts/verify-cerbanimo-load-freeze-v176.mjs
      - name: Verify Cerbanimo bounded navigation contract
        run: node scripts/verify-cerbanimo-load-freeze-v176.mjs
