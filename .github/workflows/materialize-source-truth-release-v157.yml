name: Materialize source-truth release v1.0.157

on:
  push:
    branches:
      - agent/eradicate-runtime-static-rewrites
    paths:
      - '.github/workflows/materialize-source-truth-release-v157.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out complete branch
        uses: actions/checkout@v4
        with:
          ref: agent/eradicate-runtime-static-rewrites
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Advance release version
        shell: bash
        run: |
          set -euo pipefail
          printf '1.0.157\n' > VERSION
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'package.json';
          const pkg = JSON.parse(await readFile(path, 'utf8'));
          pkg.version = '1.0.157';
          await writeFile(path, `${JSON.stringify(pkg, null, 2)}\n`, 'utf8');
          NODE

      - name: Run canonical release materializer
        run: node scripts/materialize-canonical-release.mjs

      - name: Verify generated metadata is current
        run: node scripts/generate-prelive-metadata-v281.mjs --check

      - name: Commit generated release artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Release materializer produced no changes.'
            exit 0
          fi
          git commit -m 'Materialize Civweave 1.0.157 source-truth release'
          git push origin HEAD:agent/eradicate-runtime-static-rewrites
