name: Recover Spotify playlist context v147

on:
  push:
    branches:
      - agent/spotify-playlist-track-links-v2
    paths:
      - '.github/workflows/recover-spotify-playlist-context-v147.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/spotify-playlist-track-links-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore feature onto current mainline
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=03465eeb121c9a51b44fa569e55ad95a9512304c
          BASE="https://raw.githubusercontent.com/cerbanimo-dev/Civweave/$SOURCE"
          for file in \
            public/app/radio-track-suggestions-v240.js \
            public/app/radio-track-map-v241.json \
            scripts/sync-radio-track-map-v241.mjs \
            scripts/verify-system-radio-v233.mjs \
            .github/workflows/verify-system-radio-v233.yml
          do
            mkdir -p "$(dirname "$file")"
            curl --fail --silent --show-error --location "$BASE/$file" --output "$file"
          done

          python <<'PY'
          from pathlib import Path
          import re

          old_radio="v240-local-station-directory-random-pull-labels"
          new_radio="v241-playlist-context-track-links"
          for name in [
              "public/app/install-boundary-v146.js",
              "scripts/verify-five-system-navigation-v227.mjs",
              "scripts/verify-canonical-core-only-v226.mjs",
          ]:
              path=Path(name)
              text=path.read_text()
              if old_radio not in text and new_radio not in text:
                  raise SystemExit(f"Expected radio revision marker missing from {name}")
              path.write_text(text.replace(old_radio,new_radio))

          sync=Path("scripts/sync-release-version-assets.mjs")
          text=sync.read_text()
          runtime_fix=".replace(/version:'\\d+\\.\\d+\\.\\d+-chat-convergence-v250'/g,`version:'${version}-chat-convergence-v250'`)"
          if runtime_fix not in text:
              anchor=".replace(/const FALLBACK_VERSION='\\d+\\.\\d+\\.\\d+'/g,`const FALLBACK_VERSION='${version}'`)"
              if anchor not in text:
                  raise SystemExit("Installed-entry FALLBACK_VERSION release-sync anchor missing")
              text=text.replace(anchor,anchor+"\n    "+runtime_fix,1)
              sync.write_text(text)

          Path("VERSION").write_text("1.0.47\n")
          package=Path("package.json")
          ptext=package.read_text()
          ptext,count=re.subn(r'(\"version\"\s*:\s*\")\d+\.\d+\.\d+(\")',r'\g<1>1.0.47\2',ptext,count=1)
          if count != 1:
              raise SystemExit("package.json version field was not updated exactly once")
          package.write_text(ptext)
          PY

          node scripts/sync-release-version-assets.mjs
          node scripts/sync-release-coherence-v220.mjs
          node --check public/app/radio-track-suggestions-v240.js
          node --check scripts/sync-radio-track-map-v241.mjs
          node --check scripts/verify-system-radio-v233.mjs
          node scripts/verify-system-radio-v233.mjs
          node scripts/verify-five-system-navigation-v227.mjs
          node scripts/verify-canonical-core-only-v226.mjs
          git diff --check

      - name: Commit recovered release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/recover-spotify-playlist-context-v147.yml
          if git diff --cached --quiet; then
            echo "No recovery changes to commit."
            exit 0
          fi
          git commit -m "Restore Spotify playlist-context track links for Civweave 1.0.47"
          git push
