name: Refresh peer compute onto latest main

on:
  push:
    branches:
      - agent/peer-local-plan-borrow-validation-rewards-current
    paths:
      - '.github/workflows/refresh-peer-compute-onto-main-v1.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'cerbanimo-dev/Civweave'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/peer-local-plan-borrow-validation-rewards-current
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Merge latest main, preserving main on conflicts
        run: |
          git fetch origin main
          git config user.name 'civweave-refresh-bot'
          git config user.email 'actions@users.noreply.github.com'
          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e
          if [ $merge_status -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ -z "$conflicts" ]; then
              echo 'Merge failed without ordinary file conflicts.' >&2
              exit $merge_status
            fi
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              echo "Resolving generated/concurrent conflict from latest main: $file"
              git checkout --theirs -- "$file"
              git add "$file"
            done <<< "$conflicts"
          fi
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo 'Unresolved conflicts remain.' >&2
            git diff --name-only --diff-filter=U
            exit 1
          fi
      - name: Assign next Civweave patch release
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const current=fs.readFileSync('VERSION','utf8').trim();
          const [major,minor,patch]=current.split('.').map(Number);
          const next=`${major}.${minor}.${patch+1}`;
          fs.writeFileSync('VERSION',next+'\n');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.version=next;
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          console.log(`Refreshing feature as Civweave ${next}`);
          NODE
      - name: Materialize refreshed canonical release
        run: node scripts/materialize-canonical-release.mjs
      - name: Verify feature and release
        run: |
          node scripts/verify-peer-compute-validation-governance-v1.mjs
          node scripts/verify-canonical-launch-release.mjs
          node scripts/verify-release-version-sync.mjs
          node scripts/verify-release-contract.mjs
          node scripts/verify-hub-map-locality-ledger-v1.mjs
      - name: Remove one-shot helper and commit refresh
        run: |
          rm -f .github/workflows/refresh-peer-compute-onto-main-v1.yml
          git add -A
          git commit -m 'Refresh peer compute governance onto latest main'
          git push origin HEAD:agent/peer-local-plan-borrow-validation-rewards-current
