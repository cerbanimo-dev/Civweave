name: Materialize MiniLM release v348

on:
  push:
    branches:
      - agent/minilm-first-clarification-v348
    paths:
      - '.github/workflows/materialize-minilm-release-v348.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/minilm-first-clarification-v348
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Align package metadata to VERSION
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const version=(await readFile('VERSION','utf8')).trim();
          const pkg=JSON.parse(await readFile('package.json','utf8'));
          pkg.version=version;
          await writeFile('package.json',`${JSON.stringify(pkg,null,2)}\n`);
          const lock=JSON.parse(await readFile('package-lock.json','utf8'));
          lock.version=version;
          if(lock.packages?.[''])lock.packages[''].version=version;
          await writeFile('package-lock.json',`${JSON.stringify(lock,null,2)}\n`);
          NODE
      - name: Materialize canonical release
        run: node scripts/materialize-canonical-release.mjs
      - name: Refresh canonical hashes
        run: node scripts/sync-canonical-release-hashes.mjs
      - name: Commit generated release state
        run: |
          git config user.name 'civweave-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Materialize Civweave 1.0.161 release'
          git push origin HEAD:agent/minilm-first-clarification-v348
