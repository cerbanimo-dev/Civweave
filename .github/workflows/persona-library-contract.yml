name: Persona Library Contract

on:
  pull_request:
    paths:
      - 'public/app/shared/persona-library-v1.mjs'
      - 'scripts/test-persona-library-v1.mjs'
      - 'scripts/test-persona-scene-bridge-v1.mjs'
      - 'scripts/test-persona-performance-lab-v1.mjs'
      - 'scripts/test-persona-campaign-v1.mjs'
      - 'public/app/shared/persona-campaign-v1.mjs'
      - 'public/app/shared/persona-chat-turn-v1.mjs'
      - 'public/app/shared/persona-chat-controls-v1.mjs'
      - 'public/app/shared/persona-multiplayer-gateway-v1.mjs'
      - 'public/app/guide-chat-surface-v350.js'
      - 'scripts/test-persona-chat-turn-v1.mjs'
      - 'scripts/test-persona-dual-override-v1.mjs'
      - 'scripts/test-persona-chat-surface-v1.mjs'
      - 'scripts/test-persona-multiplayer-gateway-v1.mjs'
      - 'public/app/tools/worldweaver-performance-lab-v1.mjs'
      - 'public/app/tools/worldweaver-performance-lab.html'
      - 'public/app/shared/persona-scene-bridge-v1.mjs'
      - '.github/workflows/persona-library-contract.yml'
  push:
    branches: [staging]
    paths:
      - 'public/app/shared/persona-library-v1.mjs'
      - 'scripts/test-persona-library-v1.mjs'
      - '.github/workflows/persona-library-contract.yml'

jobs:
  persona-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canon and improv contract
        run: node --test scripts/test-persona-library-v1.mjs scripts/test-persona-scene-bridge-v1.mjs scripts/test-persona-performance-lab-v1.mjs scripts/test-persona-campaign-v1.mjs scripts/test-persona-chat-turn-v1.mjs scripts/test-persona-dual-override-v1.mjs scripts/test-persona-chat-surface-v1.mjs scripts/test-persona-multiplayer-gateway-v1.mjs
      - name: Syntax-check Worldweaver rehearsal module
        run: |
          node --check public/app/tools/worldweaver-performance-lab-v1.mjs
          node --check public/app/guide-chat-surface-v350.js
          node --check public/app/shared/persona-chat-controls-v1.mjs
