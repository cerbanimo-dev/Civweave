name: Materialize installed launch v292

on:
  push:
    branches:
      - agent/fix-installed-pwa-launch-loop
    paths:
      - '.github/workflows/materialize-installed-launch-v292.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fix-installed-pwa-launch-loop
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Materialize Civweave 1.0.92
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = "1.0.92"
          node scripts/materialize-canonical-release.mjs
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path='config/release-contract.json';
          const contract=JSON.parse(await readFile(path,'utf8'));
          contract.canonical.current={version:'1.0.92',path:'releases/1.0.92',status:'current'};
          await writeFile(path,`${JSON.stringify(contract,null,2)}\n`,'utf8');
          NODE
          node scripts/verify-canonical-launch-release.mjs
          node scripts/verify-release-version-sync.mjs
      - name: Commit canonical snapshot
        run: |
          set -euo pipefail
          git config user.name 'civweave-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/materialize-installed-launch-v292.yml
          git add -A
          git commit -m 'Materialize Civweave 1.0.92 canonical release'
          git push origin HEAD:agent/fix-installed-pwa-launch-loop
