name: Verify System Radio

on:
  pull_request:
    paths:
      - 'public/app/system-radio-agent-v233.js'
      - 'public/app/radio-track-suggestions-v240.js'
      - 'public/app/radio-track-map-v241.json'
      - 'public/app/radio-directory-v240/**'
      - 'public/app/cabinets/living-school/index.html'
      - 'public/app/install-boundary-v146.js'
      - 'public/app/core-interface-runtime-v1.js'
      - 'public/app/experience-orchestrator-v232.js'
      - 'public/service-worker-radio-core-v305.js'
      - 'public/service-worker-v203.js'
      - 'scripts/build-service-worker-v211.mjs'
      - 'scripts/verify-system-radio-v233.mjs'
      - 'scripts/verify-living-school-radio-v252.mjs'
      - 'scripts/verify-radio-bootstrap-priority-v267.mjs'
      - 'scripts/verify-radio-shell-guarantee-v305.mjs'
      - '.github/workflows/verify-system-radio.yml'
      - 'VERSION'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'public/app/system-radio-agent-v233.js'
      - 'public/app/radio-track-suggestions-v240.js'
      - 'public/app/radio-track-map-v241.json'
      - 'public/app/radio-directory-v240/**'
      - 'public/app/cabinets/living-school/index.html'
      - 'public/app/install-boundary-v146.js'
      - 'public/app/core-interface-runtime-v1.js'
      - 'public/app/experience-orchestrator-v232.js'
      - 'public/service-worker-radio-core-v305.js'
      - 'public/service-worker-v203.js'
      - 'scripts/build-service-worker-v211.mjs'
      - 'scripts/verify-system-radio-v233.mjs'
      - 'scripts/verify-living-school-radio-v252.mjs'
      - 'scripts/verify-radio-bootstrap-priority-v267.mjs'
      - 'scripts/verify-radio-shell-guarantee-v305.mjs'
      - '.github/workflows/verify-system-radio.yml'
      - 'VERSION'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check runtime syntax
        run: |
          node --check public/app/system-radio-agent-v233.js
          node --check public/app/radio-track-suggestions-v240.js
          node --check public/app/install-boundary-v146.js
          node --check public/app/core-interface-runtime-v1.js
          node --check public/service-worker-radio-core-v305.js
          node --check scripts/build-service-worker-v211.mjs
          node --check scripts/verify-system-radio-v233.mjs
          node --check scripts/verify-living-school-radio-v252.mjs
          node --check scripts/verify-radio-bootstrap-priority-v267.mjs
          node --check scripts/verify-radio-shell-guarantee-v305.mjs
      - name: Verify radio contract
        run: |
          node scripts/verify-system-radio-v233.mjs
          node scripts/verify-living-school-radio-v252.mjs
          node scripts/verify-radio-bootstrap-priority-v267.mjs
          node scripts/verify-radio-shell-guarantee-v305.mjs
