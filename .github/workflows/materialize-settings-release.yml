name: Materialize Settings Release 1.0.161

on:
  push:
    branches:
      - agent/single-canonical-settings-menu-current-main
    paths:
      - VERSION
      - .github/workflows/materialize-settings-release.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/single-canonical-settings-menu-current-main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Materialize canonical release
        run: |
          set -euo pipefail
          npm version 1.0.161 --no-git-tag-version
          npm run release:materialize
          node scripts/sync-release-coherence-v220.mjs
          node scripts/sync-canonical-release-hashes.mjs

      - name: Commit generated release artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialization changes."
            exit 0
          fi
          git commit -m "Materialize canonical release 1.0.161"
          git push origin HEAD:agent/single-canonical-settings-menu-current-main

# One-shot release materializer; remove after the generated commit lands.
