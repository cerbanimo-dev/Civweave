name: Repair manual-first installer CI v304

on:
  push:
    branches:
      - fix/manual-first-installer-v304

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manual-first-installer-v304
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update recovery and verifier contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path)
              s=p.read_text()
              if old not in s:
                  raise SystemExit(f'expected block not found in {path}: {old[:100]!r}')
              p.write_text(s.replace(old,new))

          replace(
            'public/service-worker-installer-state-v280.js',
            "const INSTALLER_STATE_ASSETS = [\n  '/app/installer-state-machine-v280.js',\n  '/app/offline-campus-status-v210.js'\n];",
            "const INSTALLER_STATE_ASSETS = [\n  '/app/installer-state-machine-v280.js',\n  '/app/installer-storage-guard-v281.js',\n  '/app/offline-campus-status-v210.js'\n];"
          )
          replace(
            'public/service-worker-installer-state-v280.js',
            "revision: 'installer-state-machines-v300-interaction-first'",
            "revision: 'installer-state-machines-v304-manual-first'"
          )
          replace(
            'scripts/verify-release-version-sync.mjs',
            "`Install Civweave v${version}. The campus downloads automatically.`,",
            "`Install the shell. Open Civweave immediately. Download offline files only when you choose.`,"
          )
          replace(
            'scripts/verify-knowledge-school-seeds-v1.mjs',
            "assertIncludes(index,['knowledge-school-list','knowledge-school-seeds-v1.js','knowledge-school-installer-v1.js','Download once. Keep it through updates.'],'installer page');",
            "assertIncludes(index,['knowledge-school-list','knowledge-school-seeds-v1.js','knowledge-school-installer-v1.js','data-lazy-offline-tools','Optional tools are dormant until this section is used.'],'installer page');"
          )
          replace(
            'scripts/verify-knowledge-school-seeds-v1.mjs',
            "assertIncludes(installerStateWorker,[\"'/app/installer-storage-guard-v281.js'\",\"'/app/required-campus-autostart-v1.js'\",'shellRequired: true'],'installer state worker');",
            "assertIncludes(installerStateWorker,[\"'/app/installer-storage-guard-v281.js'\",'shellRequired: true','campusAutostartRequired: false'],'installer state worker');\nif(installerStateWorker.includes(\"'/app/required-campus-autostart-v1.js'\"))throw new Error('Disabled campus autostart must not be pinned into the installer shell.');"
          )
          replace(
            'scripts/verify-recovery-asset-lockboard-v239.mjs',
            "  ['old installer-wide mutation observer is gone',()=>{\n    assert.doesNotMatch(autostart,/new MutationObserver/);\n    assert.match(autostart,/civweave:offline-campus-status/);\n  }],\n  ['required campus remains independent from PWA install availability',()=>{\n    assert.match(autostart,/function keepInstallIndependent\\(\\)/);\n    assert.match(autostart,/classList\\.remove\\('cw-campus-waiting'\\)/);\n    assert.doesNotMatch(autostart,/Waiting for campus files…/);\n    assert.doesNotMatch(autostart,/button\\.disabled\\s*=\\s*true/);\n    assert.doesNotMatch(autostart,/civweave\\.pwa\\.install-accepted/);\n  }],\n  ['asset lockboard link is runtime assembled to avoid crawl expansion',()=>{\n    assert.match(autostart,/\\['\\/app','asset-lockboard-v239\\.html'\\]\\.join\\('\\/'\\)/);\n  }],",
            "  ['legacy campus autostart path is an inert compatibility shim',()=>{\n    assert.doesNotMatch(autostart,/new MutationObserver/);\n    assert.match(autostart,/disabled:true/);\n    assert.match(autostart,/explicit-user-opt-in-only/);\n    assert.doesNotMatch(autostart,/\\.click\\(\\)/);\n    assert.doesNotMatch(autostart,/DOWNLOAD_OFFLINE_PACKAGE/);\n  }],\n  ['required campus remains independent from PWA install availability',()=>{\n    assert.doesNotMatch(autostart,/button\\.disabled\\s*=\\s*true/);\n    assert.doesNotMatch(autostart,/civweave\\.pwa\\.install-accepted/);\n  }],\n  ['asset lockboard remains independent from the retired autostart shim',()=>{\n    assert.doesNotMatch(autostart,/asset-lockboard-v239\\.html/);\n  }],"
          )
          replace(
            'scripts/verify-shared-review-surface-v234.mjs',
            "assert.match(installer,/setInterval\\s*\\(\\s*renderProgress\\s*,\\s*750\\s*\\)/,'Installer may use a bounded low-frequency fallback refresh.');",
            "assert.match(installer,/setInterval\\s*\\(\\s*renderProgress\\s*,\\s*(?:750|1000)\\s*\\)/,'Installer may use a bounded low-frequency fallback refresh.');"
          )
          PY
      - name: Regenerate shell and storage metadata
        run: node scripts/generate-prelive-metadata-v281.mjs
      - name: Run targeted installer and recovery tests
        run: |
          node scripts/smoke-installer-hardening-v281.mjs
          node scripts/smoke-installer-recovery-v206.mjs
          node scripts/verify-release-version-sync.mjs
          node scripts/verify-knowledge-school-seeds-v1.mjs
          node scripts/verify-recovery-asset-lockboard-v239.mjs
          node scripts/verify-shared-review-surface-v234.mjs
          node scripts/verify-release-contract.mjs
          node scripts/verify-canonical-launch-release.mjs
      - name: Install Chromium harness
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove manual-first behavior in Chromium
        run: node scripts/browser-installer-gauntlet-v281.mjs
      - name: Commit repaired contracts and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-manual-first-ci-v304.yml
          git add -A
          git commit -m "Verify v1.0.104 explicit-opt-in installer"
          git push origin HEAD:fix/manual-first-installer-v304
