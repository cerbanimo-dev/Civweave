name: Verify PWA Install + Campus Completion

on:
  pull_request:
    paths:
      - 'public/app/index.html'
      - 'public/app/pwa-install-prompt-v249.js'
      - 'public/app/pwa-install-prompt-v250.js'
      - 'public/install-v130.js'
      - 'public/app/installer-repair-only-v1.js'
      - 'public/app/installer-repair-only-v2.js'
      - 'public/app/host-steward-reminder-v1.js'
      - 'public/app/offline-campus-status-v210.js'
      - 'public/app/offline-campus-status-v211.js'
      - 'public/app/required-campus-autostart-v1.js'
      - 'public/service-worker-v203.js'
      - 'public/service-worker-shell-assets-v1.js'
      - 'public/service-worker-shell-repair-v293.js'
      - 'public/service-worker-campus-completion-v246.js'
      - 'scripts/verify-installer-front-door-v1.mjs'
      - 'scripts/verify-pwa-install-campus-v246.mjs'
      - 'scripts/verify-fresh-install-paths-v1.mjs'
      - '.github/workflows/verify-pwa-install-campus-v246.yml'
  push:
    branches: [main, staging]
    paths:
      - 'public/app/index.html'
      - 'public/app/pwa-install-prompt-v249.js'
      - 'public/app/pwa-install-prompt-v250.js'
      - 'public/install-v130.js'
      - 'public/app/installer-repair-only-v1.js'
      - 'public/app/installer-repair-only-v2.js'
      - 'public/app/host-steward-reminder-v1.js'
      - 'public/app/offline-campus-status-v210.js'
      - 'public/app/offline-campus-status-v211.js'
      - 'public/app/required-campus-autostart-v1.js'
      - 'public/service-worker-v203.js'
      - 'public/service-worker-shell-assets-v1.js'
      - 'public/service-worker-shell-repair-v293.js'
      - 'public/service-worker-campus-completion-v246.js'
      - 'scripts/verify-installer-front-door-v1.mjs'
      - 'scripts/verify-pwa-install-campus-v246.mjs'
      - 'scripts/verify-fresh-install-paths-v1.mjs'
      - '.github/workflows/verify-pwa-install-campus-v246.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --check public/app/pwa-install-prompt-v249.js
      - run: node --check public/app/pwa-install-prompt-v250.js
      - run: node --check public/install-v130.js
      - run: node --check public/app/installer-repair-only-v1.js
      - run: node --check public/app/installer-repair-only-v2.js
      - run: node --check public/app/host-steward-reminder-v1.js
      - run: node --check public/app/offline-campus-status-v210.js
      - run: node --check public/app/offline-campus-status-v211.js
      - run: node --check public/app/required-campus-autostart-v1.js
      - run: node --check public/service-worker-v203.js
      - run: node --check public/service-worker-shell-assets-v1.js
      - run: node --check public/service-worker-shell-repair-v293.js
      - run: node --check public/service-worker-campus-completion-v246.js
      - run: node scripts/verify-installer-front-door-v1.mjs
      - run: node scripts/verify-pwa-install-campus-v246.mjs
      - run: node scripts/verify-fresh-install-paths-v1.mjs
