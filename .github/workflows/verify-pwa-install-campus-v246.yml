name: Verify PWA Install + Campus Completion v246

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check public/app/pwa-install-prompt-v246.js
      - run: node --check public/app/pwa-install-prompt-v247.js
      - run: node --check public/app/pwa-install-prompt-v248.js
      - run: node --check public/app/pwa-install-prompt-v249.js
      - run: node --check public/install-v130.js
      - run: node --check public/app/host-steward-reminder-v1.js
      - run: node --check public/app/offline-campus-status-v210.js
      - run: node --check public/app/offline-campus-status-v211.js
      - run: node --check public/app/required-campus-autostart-v1.js
      - run: node --check public/service-worker-campus-completion-v246.js
      - run: node scripts/verify-installer-front-door-v1.mjs
      - run: node scripts/verify-pwa-install-campus-v246.mjs
      - run: node scripts/verify-fresh-install-paths-v1.mjs
