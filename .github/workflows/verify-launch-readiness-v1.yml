name: Launch Readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      public_launch:
        description: Require every public-launch evidence gate to pass
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: launch-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch-gate:
    name: Launch readiness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install repository dependencies
        run: npm ci --ignore-scripts
      - name: Run code-readiness gate
        run: node scripts/run-launch-gate-v1.mjs
      - name: Dry-run Cloudflare node Worker bundle
        run: npx --yes wrangler deploy --dry-run --config cloudflare/node-cloud/wrangler.jsonc --outdir /tmp/civweave-node-cloud
      - name: Dry-run Cloudflare account-edge Worker bundle
        run: npx --yes wrangler deploy --dry-run --config cloudflare/account-edge/wrangler.jsonc --outdir /tmp/civweave-account-edge
      - name: Require public-launch evidence when explicitly requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.public_launch }}
        run: node scripts/verify-public-launch-readiness-v1.mjs --public
