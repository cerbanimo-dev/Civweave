name: Kingdom Pocket Scribe M4 — Android debug APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pocket-scribe/m4/**'
      - '.github/workflows/pocket-scribe-m4-android.yml'
  push:
    branches:
      - pocket-scribe/m4-kokoro-qwen-build
    paths:
      - 'pocket-scribe/m4/**'
      - '.github/workflows/pocket-scribe-m4-android.yml'
jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extract isolated Pocket Scribe source
        run: |
          mkdir -p pocket-scribe/m4/workspace
          tar -xzf pocket-scribe/m4/source.tar.gz -C pocket-scribe/m4/workspace
          tar -xzf pocket-scribe/m4/import-fix-0.4.1.tar.gz -C pocket-scribe/m4/workspace
          (cd pocket-scribe/m4/workspace && xz -dc ../qwen-runtime-fix-0.4.2.diff.xz | patch -p1 --fuzz=0)
          echo '{"type":"commonjs"}' > pocket-scribe/m4/workspace/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Fetch and checksum pinned inference libraries
        run: bash pocket-scribe/m4/workspace/android/scripts/prepare-android-deps.sh
      - name: Run workflow and audio contract tests
        working-directory: pocket-scribe/m4/workspace
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -q
          node tests/js/test_envelope.cjs
      - name: Compile ARM64 debug APKs (normal and side-by-side diagnostic)
        working-directory: pocket-scribe/m4/workspace/android
        run: |
          mkdir -p ../../apk-artifacts
          gradle :app:assembleDebug --no-daemon --stacktrace --max-workers=2
          cp app/build/outputs/apk/debug/app-debug.apk ../../apk-artifacts/PocketScribe-0.4.2-normal-debug.apk
          gradle :app:assembleDebug -PpocketDiagnostic=true --no-daemon --stacktrace --max-workers=2
          cp app/build/outputs/apk/debug/app-debug.apk ../../apk-artifacts/PocketScribe-0.4.2-import-test.apk
          MAIN_ID=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging ../../apk-artifacts/PocketScribe-0.4.2-normal-debug.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          TEST_ID=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging ../../apk-artifacts/PocketScribe-0.4.2-import-test.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          echo "Normal package: $MAIN_ID; diagnostic: $TEST_ID"
          test "$MAIN_ID" = 'org.kingdom.pocketscribe'
          test "$TEST_ID" = 'org.kingdom.pocketscribe.runtimetest'
      - uses: actions/upload-artifact@v4
        with:
          name: kingdom-pocket-scribe-0.4.2-apks
          path: pocket-scribe/m4/apk-artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
