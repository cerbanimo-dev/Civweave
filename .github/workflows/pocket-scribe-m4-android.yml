name: Kingdom Pocket Scribe M4 — Android debug APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pocket-scribe/m4/**'
      - '.github/workflows/pocket-scribe-m4-android.yml'
  push:
    branches:
      - pocket-scribe/m4-kokoro-qwen-build
    paths:
      - 'pocket-scribe/m4/**'
      - '.github/workflows/pocket-scribe-m4-android.yml'
jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extract isolated Pocket Scribe source
        run: |
          mkdir -p pocket-scribe/m4/workspace
          tar -xzf pocket-scribe/m4/source.tar.gz -C pocket-scribe/m4/workspace
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK, NDK and CMake
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Fetch and checksum pinned inference libraries
        run: bash pocket-scribe/m4/workspace/android/scripts/prepare-android-deps.sh
      - name: Run workflow and audio contract tests
        working-directory: pocket-scribe/m4/workspace
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -q
          node tests/js/test_envelope.cjs
      - name: Compile ARM64 debug APK
        working-directory: pocket-scribe/m4/workspace/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: kingdom-pocket-scribe-m4-kokoro-qwen-debug-apk
          path: pocket-scribe/m4/workspace/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
