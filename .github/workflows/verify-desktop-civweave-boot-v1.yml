name: Verify desktop Civweave boot

on:
  pull_request:
    paths:
      - 'public/service-worker-v203.js'
      - 'public/service-worker-shell-assets-v1.js'
      - 'scripts/build-service-worker-v211.mjs'
      - 'scripts/verify-desktop-civweave-boot-v1.mjs'
      - 'public/app/pwa-install-prompt-v250.js'
      - 'public/app/working-campus-v156.html'
      - 'public/app/pwa-start-v436.html'
      - 'public/app/index.html'
      - 'public/guild-release-recovery.html'
      - 'public/service-worker.js'
      - 'public/service-worker-campus-completion-v246.js'
      - 'public/service-worker-release-generation-v1.js'
      - 'scripts/test-installer-observer-quiescence-v1.mjs'
      - 'scripts/test-pwa-start-bounded-launch-v1.mjs'
      - 'scripts/test-release-storage-boundary-v1.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify-desktop-civweave-boot-v1.yml'
  push:
    branches: [staging, main]
    paths:
      - 'public/service-worker-v203.js'
      - 'public/service-worker-shell-assets-v1.js'
      - 'scripts/build-service-worker-v211.mjs'
      - 'scripts/verify-desktop-civweave-boot-v1.mjs'
      - 'public/app/pwa-install-prompt-v250.js'
      - 'public/app/working-campus-v156.html'
      - 'public/app/pwa-start-v436.html'
      - 'public/app/index.html'
      - 'public/guild-release-recovery.html'
      - 'public/service-worker.js'
      - 'public/service-worker-campus-completion-v246.js'
      - 'public/service-worker-release-generation-v1.js'
      - 'scripts/test-installer-observer-quiescence-v1.mjs'
      - 'scripts/test-pwa-start-bounded-launch-v1.mjs'
      - 'scripts/test-release-storage-boundary-v1.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify-desktop-civweave-boot-v1.yml'

permissions:
  contents: read

jobs:
  desktop-civweave-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check public/service-worker-v203.js
      - run: node --check public/service-worker-shell-assets-v1.js
      - run: node --check scripts/build-service-worker-v211.mjs
      - run: npm run test:desktop-pwa
