name: Luddite Mode contract

on:
  pull_request:
    paths:
      - 'public/app/content-provenance-v1.js'
      - 'public/app/luddite-*.js'
      - 'public/app/luddite-*.html'
      - 'public/app/luddite-*.json'
      - 'public/app/fast-interactive-runtime-v192.js'
      - 'public/app/family-ai-loader-v105.js'
      - 'public/service-worker-luddite-package-v1.js'
      - 'public/service-worker-v203.js'
      - 'scripts/build-service-worker-v211.mjs'
      - 'scripts/test-luddite-mode-v1.mjs'
      - 'config/system-ownership.json'
      - '.github/workflows/luddite-mode-contract.yml'
  push:
    branches:
      - staging
    paths:
      - 'public/app/content-provenance-v1.js'
      - 'public/app/luddite-*.js'
      - 'public/app/luddite-*.html'
      - 'public/app/luddite-*.json'
      - 'public/app/fast-interactive-runtime-v192.js'
      - 'public/app/family-ai-loader-v105.js'
      - 'public/service-worker-luddite-package-v1.js'
      - 'public/service-worker-v203.js'
      - 'scripts/build-service-worker-v211.mjs'
      - 'scripts/test-luddite-mode-v1.mjs'
      - 'config/system-ownership.json'
      - '.github/workflows/luddite-mode-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check Luddite runtime
        run: |
          node --check public/app/content-provenance-v1.js
          node --check public/app/luddite-mode-v1.js
          node --check public/app/luddite-manual-authoring-v1.js
          node --check public/app/luddite-installer-v1.js
          node --check public/app/fast-interactive-runtime-v192.js
          node --check public/app/family-ai-loader-v105.js
          node --check public/service-worker-luddite-package-v1.js
      - name: Verify no-AI package and provenance contracts
        run: node --test scripts/test-luddite-mode-v1.mjs
