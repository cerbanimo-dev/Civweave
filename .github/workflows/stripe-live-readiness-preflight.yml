name: Stripe Live Readiness Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civweave-stripe-live-readiness-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STRIPE_LIVE_SECRET_KEY: ${{ secrets.STRIPE_LIVE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install pinned production Stripe SDK
        run: npm install --prefix cloudflare/core --omit=dev --no-audit --no-fund
      - name: Confirm preflight script is read-only
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'webhookEndpoints\.(create|update|del)|checkout\.sessions\.create|refunds\.create|accounts\.create|accountLinks\.create' scripts/verify-stripe-live-readiness-preflight.mjs; then
            echo 'Refusing live preflight because the checker contains Stripe mutations.'
            exit 2
          fi
          echo 'LIVE_PREFLIGHT_MUTATIONS=NONE'
      - name: Verify live Stripe prerequisites without mutations
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-stripe-live-readiness-preflight.mjs
