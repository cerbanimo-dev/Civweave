name: One-shot finalize retired surfaces v350

on:
  push:
    branches: [fix/purge-retired-views-v350]

permissions:
  contents: write

concurrency:
  group: one-shot-finalize-retired-v350
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[v350 finalized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/purge-retired-views-v350
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply durable retired-surface purge
        run: node scripts/retire-presentation-surfaces-v350.mjs
      - name: Rebuild worker and shell metadata
        run: |
          node scripts/build-service-worker-v211.mjs
          node scripts/generate-prelive-metadata-v281.mjs
      - name: Refresh canonical release hashes
        run: node scripts/refresh-current-release-hashes-v350.mjs
      - name: Verify active presentation inventory
        run: |
          node scripts/verify-active-screen-surface-v350.mjs
          node scripts/verify-guide-workspace-v242.mjs
          node scripts/verify-fullscreen-family-v104.mjs
          node scripts/verify-canonical-launch-release.mjs
      - name: Commit final purge and self-remove
        run: |
          rm .github/workflows/one-shot-finalize-retired-v350.yml
          git config user.name "civweave-release-bot"
          git config user.email "civweave-release-bot@users.noreply.github.com"
          git add -A
          git commit -m "Finalize retired presentation purge v350 [v350 finalized]"
          git push origin HEAD:fix/purge-retired-views-v350
