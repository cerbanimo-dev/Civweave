name: Verify Server AI Commerce v301

on:
  pull_request:
    paths:
      - 'public/app/server-ai-*.js'
      - 'public/app/node-ai-mesh-v1.js'
      - 'public/app/fast-interactive-runtime-v192.js'
      - 'cloudflare/node-cloud/**'
      - 'cloudflare/account-edge/**'
      - 'scripts/test-cloudflare-host-capacity-v1.mjs'
      - 'scripts/test-community-compute-dividend-v1.mjs'
      - 'scripts/verify-server-ai-commerce-v301.mjs'
      - '.github/workflows/verify-server-ai-commerce-v301.yml'
  push:
    branches: [main]
    paths:
      - 'public/app/server-ai-*.js'
      - 'public/app/node-ai-mesh-v1.js'
      - 'public/app/fast-interactive-runtime-v192.js'
      - 'cloudflare/node-cloud/**'
      - 'cloudflare/account-edge/**'
      - 'scripts/test-cloudflare-host-capacity-v1.mjs'
      - 'scripts/test-community-compute-dividend-v1.mjs'
      - 'scripts/verify-server-ai-commerce-v301.mjs'
      - '.github/workflows/verify-server-ai-commerce-v301.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check server AI and community capacity paths
        run: |
          node --check public/app/server-ai-router-v301.js
          node --check public/app/server-ai-settings-v301.js
          node --check public/app/node-ai-mesh-v1.js
          node --check public/app/fast-interactive-runtime-v192.js
          node --check cloudflare/node-cloud/src/server-ai-entry-v1.mjs
          node --check cloudflare/node-cloud/src/server-ai-entry-v3.mjs
          node --check cloudflare/node-cloud/src/capacity.mjs
          node --check cloudflare/node-cloud/src/capacity-community-extension-v1.mjs
          node --check cloudflare/node-cloud/src/cloud-node-membership-v1.mjs
          node --check cloudflare/node-cloud/src/membership-prejoin-v1.mjs
          node --check cloudflare/node-cloud/src/membership-resident-v1.mjs
          node --check cloudflare/account-edge/src/index.mjs
      - name: Verify community compute capacity arithmetic
        run: node scripts/test-cloudflare-host-capacity-v1.mjs
      - name: Exercise community dividend settlement behavior
        run: node scripts/test-community-compute-dividend-v1.mjs
      - name: Verify ordered routing and commerce entry points
        run: node scripts/verify-server-ai-commerce-v301.mjs
