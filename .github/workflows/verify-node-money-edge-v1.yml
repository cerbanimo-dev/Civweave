name: Verify Node Money Edge v1

on:
  pull_request:
    paths:
      - 'lib/node-money-edge-*.mjs'
      - 'lib/node-ai-live-commerce-v1.mjs'
      - 'lib/ai-wallet-http-v1.mjs'
      - 'lib/ai-wallet-service-v1.mjs'
      - 'public/app/node-ai-live-*.js'
      - 'public/app/node-ai-operator-v1.html'
      - 'public/app/federation-finder-local-v269.html'
      - 'scripts/test-node-money-edge-v1.mjs'
      - 'scripts/test-node-money-edge-registration-v1.mjs'
      - 'scripts/test-node-ai-live-commerce-v1.mjs'
      - 'scripts/verify-node-money-edge-surface-v1.mjs'
      - '.github/workflows/verify-node-money-edge-v1.yml'
  push:
    branches: [main]
    paths:
      - 'lib/node-money-edge-*.mjs'
      - 'lib/node-ai-live-commerce-v1.mjs'
      - 'lib/ai-wallet-http-v1.mjs'
      - 'lib/ai-wallet-service-v1.mjs'
      - 'public/app/node-ai-live-*.js'
      - 'scripts/test-node-money-edge-v1.mjs'
      - 'scripts/test-node-money-edge-registration-v1.mjs'
      - 'scripts/test-node-ai-live-commerce-v1.mjs'
      - 'scripts/verify-node-money-edge-surface-v1.mjs'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Syntax check live node money path
        run: |
          node --check lib/node-money-edge-stripe-v1.mjs
          node --check lib/node-money-edge-v1.mjs
          node --check lib/node-money-edge-http-v1.mjs
          node --check lib/node-ai-live-commerce-v1.mjs
          node --check lib/ai-wallet-http-v1.mjs
          node --check lib/ai-wallet-service-v1.mjs
          node --check public/app/node-ai-live-marketplace-v1.js
          node --check public/app/node-ai-live-operator-v1.js
      - name: Exercise money edge and node trust boundary
        run: |
          node --test scripts/test-node-money-edge-v1.mjs
          node --test scripts/test-node-money-edge-registration-v1.mjs
          node --test scripts/test-node-ai-live-commerce-v1.mjs
          node scripts/verify-node-money-edge-surface-v1.mjs
      - name: Preserve existing node-economy safety gates
        run: |
          node --test scripts/test-node-ai-marketplace-v1.mjs
          node --test scripts/test-node-ai-trial-commerce-v1.mjs
          node --test scripts/test-node-ai-debt-availability-v1.mjs
          node --test scripts/test-node-ai-network-replay-v1.mjs
