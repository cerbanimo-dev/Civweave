name: Audit Japanese visible copy v3

on:
  push:
    branches:
      - fix/japanese-localization-v3-coverage
  pull_request:
    paths:
      - 'public/**'
      - 'scripts/audit-japanese-visible-copy-v3.mjs'
      - '.github/workflows/audit-japanese-visible-copy-v3.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --check scripts/audit-japanese-visible-copy-v3.mjs
      - name: Audit visible English
        run: node scripts/audit-japanese-visible-copy-v3.mjs | tee japanese-visible-copy-audit.txt
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: japanese-visible-copy-audit-v3
          path: japanese-visible-copy-audit.txt
          if-no-files-found: error
