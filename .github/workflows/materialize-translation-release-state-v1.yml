name: Materialize translation release state v1
on:
  push:
    branches:
      - agent/offline-translation-packs-v1-current
    paths:
      - '.github/workflows/materialize-translation-release-state-v1.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/offline-translation-packs-v1-current
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize canonical release state
        run: |
          node scripts/sync-release-version-assets.mjs
          node scripts/build-service-worker-v211.mjs
          node scripts/sync-release-coherence-v220.mjs
          node scripts/generate-prelive-metadata-v281.mjs
      - name: Commit generated release state
        run: |
          git config user.name 'civweave-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public scripts releases
          if git diff --cached --quiet; then
            echo 'Release state already synchronized.'
            exit 0
          fi
          git commit -m 'sync complete 1.0.147 release state'
          git push origin HEAD:agent/offline-translation-packs-v1-current
