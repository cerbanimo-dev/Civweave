name: Verify Shared Guide + Floating UI v236

on:
  pull_request:
    paths:
      - 'public/app/install-boundary-v146.js'
      - 'public/app/shared-guide-surface-v236.js'
      - 'public/app/fellowfare-shared-guide-bridge-v236.js'
      - 'public/app/themed-system-nav-v178.js'
      - 'public/app/system-radio-agent-v233.js'
      - 'scripts/verify-shared-guide-floating-v236.mjs'
      - 'package.json'
      - 'VERSION'
      - '.github/workflows/verify-shared-guide-floating-v236.yml'
  push:
    branches: [main]
    paths:
      - 'public/app/install-boundary-v146.js'
      - 'public/app/shared-guide-surface-v236.js'
      - 'public/app/fellowfare-shared-guide-bridge-v236.js'
      - 'public/app/themed-system-nav-v178.js'
      - 'public/app/system-radio-agent-v233.js'
      - 'scripts/verify-shared-guide-floating-v236.mjs'
      - 'package.json'
      - 'VERSION'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check runtime syntax
        run: |
          node --check public/app/shared-guide-surface-v236.js
          node --check public/app/fellowfare-shared-guide-bridge-v236.js
          node --check public/app/themed-system-nav-v178.js
          node --check public/app/install-boundary-v146.js
          node --check scripts/verify-shared-guide-floating-v236.mjs
      - name: Verify shared guide and floating UI contract
        run: node scripts/verify-shared-guide-floating-v236.mjs
