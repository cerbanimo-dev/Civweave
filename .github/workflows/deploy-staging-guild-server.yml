name: Deploy Staging Guild Server

on:
  push:
    branches:
      - staging
    paths:
      - cloudflare/node-cloud/src/**
      - cloudflare/node-cloud/wrangler.staging.jsonc
      - .github/workflows/deploy-staging-guild-server.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civweave-staging-guild-server
  cancel-in-progress: true

env:
  STAGING_WORKER: civweave-node-cloud-staging
  STAGING_ORIGIN: https://civweave-node-cloud-staging.cerbanimo.workers.dev
  STAGING_CORE_ORIGIN: https://civweave-core-staging.cerbanimo.workers.dev
  STAGING_NODE_ID: civweave-node-cloud-staging
  STAGING_COMMUNITY_SEAT_LIMIT: "4"
  STAGING_PAID_SEAT_LIMIT: "4"
  STAGING_MAX_MEMBERS: "8"

jobs:
  deploy:
    name: Deploy isolated Guild transaction sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://civweave-node-cloud-staging.cerbanimo.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Verify staging-only worker contract
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/node-cloud/src/staging-entry-v1.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const raw = readFileSync('cloudflare/node-cloud/wrangler.staging.jsonc', 'utf8');
          const config = JSON.parse(raw.split('\n').filter(line => !line.trim().startsWith('//')).join('\n'));
          if (config.name !== 'civweave-node-cloud-staging') throw new Error('Refusing non-staging Worker target.');
          if (config.name === 'civweave-node-cloud') throw new Error('Refusing production Worker target.');
          if (config.main !== 'src/staging-entry-v1.mjs') throw new Error('Staging Worker must use staging-entry-v1.mjs.');
          if (Array.isArray(config.services) && config.services.length) throw new Error('Staging Guild server must not bind production services.');
          if (config.vars?.CIVWEAVE_ENVIRONMENT !== 'staging') throw new Error('Staging environment marker is required.');
          if (config.vars?.CIVWEAVE_PAYMENT_ENVIRONMENT !== 'stripe-test') throw new Error('Staging payment environment must be stripe-test.');
          if (config.vars?.CIVWEAVE_CORE_ORIGIN !== 'https://civweave-core-staging.cerbanimo.workers.dev') throw new Error('Staging Guild must use the isolated staging money edge.');
          if (/civweave-core\.cerbanimo\.workers\.dev/.test(String(config.vars?.CIVWEAVE_CORE_ORIGIN || ''))) throw new Error('Refusing production money edge from staging.');
          if (config.vars?.NODE_DOMAIN !== 'nodes.civweave.invalid') throw new Error('Staging fabric routing must remain on the reserved .invalid namespace; membership return routing is overridden only in the staging entry wrapper.');
          NODE

      - name: Verify Cloudflare authentication
        run: npx wrangler whoami

      - name: Deploy isolated Worker and Durable Objects
        run: npx wrangler deploy --config cloudflare/node-cloud/wrangler.staging.jsonc

      - name: Preserve session authority and ensure Guild shadow exists
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 12); do
            status="$(curl -sS -o /tmp/staging-capacity.json -w '%{http_code}' "$STAGING_ORIGIN/api/fabric/capacity" || true)"
            if [ "$status" = '200' ]; then break; fi
            sleep 2
          done
          test "${status:-}" = '200'

          secrets_json="$(npx wrangler secret list --config cloudflare/node-cloud/wrangler.staging.jsonc --format json)"
          has_session="$(printf '%s' "$secrets_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);const rows=Array.isArray(x)?x:(x.result||x.secrets||[]);process.stdout.write(rows.some(r=>(r.name||r.key)==='NODE_FABRIC_SESSION_SECRET')?'1':'0')})")"
          if [ "$has_session" != '1' ]; then
            session_secret="$(node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))")"
            printf '%s\n' "$session_secret" | npx wrangler secret put NODE_FABRIC_SESSION_SECRET --config cloudflare/node-cloud/wrangler.staging.jsonc
          fi

          registered="$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const capacity = JSON.parse(readFileSync('/tmp/staging-capacity.json', 'utf8'));
          process.stdout.write(Array.isArray(capacity.hostNodeIds) && capacity.hostNodeIds.includes(process.env.STAGING_NODE_ID) ? '1' : '0');
          NODE
          )"
          if [ "$registered" != '1' ]; then
            operator_secret="$(node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))")"
            printf '%s\n' "$operator_secret" | npx wrangler secret put NODE_FABRIC_OPERATOR_TOKEN --config cloudflare/node-cloud/wrangler.staging.jsonc
            curl --fail-with-body --silent --show-error \
              -X POST "$STAGING_ORIGIN/api/fabric/nodes/$STAGING_NODE_ID" \
              -H "authorization: Bearer $operator_secret" \
              -H 'content-type: application/json' \
              --data "{\"displayName\":\"Civweave Staging Guild\",\"operatorId\":\"civweave-staging-shadow\",\"publicOrigin\":\"$STAGING_ORIGIN\"}" \
              > /tmp/staging-register.json
          fi

      - name: Verify isolated community and paid-test capacity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error "$STAGING_ORIGIN/api/fabric/capacity?nodeId=$STAGING_NODE_ID" > /tmp/staging-capacity.json
          curl --fail-with-body --silent --show-error "$STAGING_ORIGIN/n/$STAGING_NODE_ID/api/ai/node/manifest" > /tmp/staging-manifest.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const capacity = JSON.parse(readFileSync('/tmp/staging-capacity.json', 'utf8'));
          const manifestEnvelope = JSON.parse(readFileSync('/tmp/staging-manifest.json', 'utf8'));
          const manifest = manifestEnvelope.manifest || manifestEnvelope;
          if (!Array.isArray(capacity.hostNodeIds) || !capacity.hostNodeIds.includes(process.env.STAGING_NODE_ID)) throw new Error('Staging Guild shadow was not registered.');
          if (capacity.environment !== 'staging' || capacity.stagingIsolatedGuildServer !== true) throw new Error('Capacity response is not staging-isolated.');
          if (capacity.stagingPaymentMode !== 'stripe-sandbox-only') throw new Error('Staging payment mode is not sandbox-only.');
          if (capacity.communitySeatLimit !== Number(process.env.STAGING_COMMUNITY_SEAT_LIMIT)) throw new Error(`Expected ${process.env.STAGING_COMMUNITY_SEAT_LIMIT} community seats, got ${capacity.communitySeatLimit}.`);
          if (capacity.paidExpansionSeatLimit !== Number(process.env.STAGING_PAID_SEAT_LIMIT)) throw new Error(`Expected ${process.env.STAGING_PAID_SEAT_LIMIT} paid test seats, got ${capacity.paidExpansionSeatLimit}.`);
          if (capacity.maxMembers !== Number(process.env.STAGING_MAX_MEMBERS)) throw new Error(`Expected max ${process.env.STAGING_MAX_MEMBERS} staging members, got ${capacity.maxMembers}.`);
          if (manifest.nodeId !== process.env.STAGING_NODE_ID) throw new Error(`Staging Guild manifest resolved ${manifest.nodeId || 'nothing'} instead of ${process.env.STAGING_NODE_ID}.`);
          console.log(JSON.stringify({
            ok: true,
            worker: 'civweave-node-cloud-staging',
            nodeId: manifest.nodeId,
            communitySeatLimit: capacity.communitySeatLimit,
            paidTestSeatLimit: capacity.paidExpansionSeatLimit,
            paidTestSeatsRemaining: capacity.paidExpansionSeatsRemaining,
            stagingMembers: capacity.nodeMembers,
            productionIsolation: true,
          }, null, 2));
          NODE
