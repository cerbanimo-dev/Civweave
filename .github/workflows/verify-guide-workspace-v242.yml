name: Verify Guide Workspace v242

on:
  pull_request:
    paths:
      - 'public/app/guide-workspace-v242.js'
      - 'public/app/install-boundary-v146.js'
      - 'public/app/working-campus-v156.css'
      - 'scripts/verify-guide-workspace-v242.mjs'
      - 'VERSION'
      - 'package.json'
      - '.github/workflows/verify-guide-workspace-v242.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check workspace syntax
        run: |
          node --check public/app/guide-workspace-v242.js
          node --check scripts/verify-guide-workspace-v242.mjs
      - name: Verify five-window local chat contract
        run: node scripts/verify-guide-workspace-v242.mjs