name: Verify FellowFare Fulfillment + Direct Commerce v2

on:
  pull_request:
    paths:
      - 'public/app/services/fellowfare/fulfillment-economy-v1.js'
      - 'public/app/services/fellowfare/fulfillment-economy-v2.js'
      - 'public/app/services/fellowfare/marketplace-v2-symbols.js'
      - 'public/app/services/fellowfare/jurisdiction-policy-v1.js'
      - 'public/app/services/fellowfare/seller-method-types-v1.js'
      - 'public/app/services/fellowfare/seller-methods-v1.js'
      - 'public/app/services/fellowfare/seller-direct-transactions-v1.js'
      - 'public/app/services/fellowfare/tax-records-v1.js'
      - 'public/app/services/fellowfare/tax-record-bridge-v1.js'
      - 'public/app/services/fellowfare/seller-record-export-v1.js'
      - 'public/app/services/fellowfare/cabinet.html'
      - 'public/app/services/fellowfare/app.js'
      - 'public/app/fellowfare-cabinet-v144.html'
      - 'public/app/cerbanimo-commerce-distribution-v1.js'
      - 'cloudflare/core/migrations/0008_fellowfare_service_fees.sql'
      - 'cloudflare/core/migrations/0009_territory_stewardship.sql'
      - 'cloudflare/core/src/commerce-edge.mjs'
      - 'cloudflare/core/src/fellowfare-direct-commerce-v1.mjs'
      - 'cloudflare/core/src/fellowfare-service-fee-v1.mjs'
      - 'cloudflare/core/src/territory-stewardship-v1.mjs'
      - 'cloudflare/core/src/money-edge-with-memberships.mjs'
      - 'cloudflare/core/src/stripe-connect-v2-entry.mjs'
      - 'cloudflare/core/src/origin-entry.mjs'
      - 'scripts/verify-live-marketplace-payments-v1.mjs'
      - 'scripts/verify-fellowfare-direct-commerce-v2.mjs'
      - 'scripts/verify-fellowfare-seller-direct-guardrails-v1.mjs'
      - 'scripts/verify-cerbanimo-commerce-distribution-v1.mjs'
      - 'scripts/verify-territory-stewardship-v1.mjs'
      - 'scripts/verify-fellowfare-marketplace-v2.mjs'
      - 'scripts/verify-stripe-live-readiness-preflight.mjs'
      - 'docs/finance/fellowfare-fulfillment-economy-v1.md'
      - 'docs/finance/cerbanimo-commerce-distribution-v1.md'
      - 'docs/finance/territory-stewardship-economy-v1.md'
      - 'docs/finance/cross-node-commerce-host-fee-v1.md'
      - 'docs/finance/node-money-edge-launch-v1.md'
      - 'docs/finance/live-money-human-gate.md'
      - 'docs/finance/live-money-machine-readiness.md'
      - 'docs/legal/stewardship/**'
      - '.github/workflows/verify-live-marketplace-payments-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify FellowFare fulfillment and payment boundaries
        run: |
          node --check cloudflare/core/src/origin-entry.mjs
          node --check cloudflare/core/src/stripe-connect-v2-entry.mjs
          node --check cloudflare/core/src/money-edge-with-memberships.mjs
          node --check cloudflare/core/src/fellowfare-direct-commerce-v1.mjs
          node --check cloudflare/core/src/fellowfare-service-fee-v1.mjs
          node --check cloudflare/core/src/territory-stewardship-v1.mjs
          node --check public/app/cerbanimo-commerce-distribution-v1.js
          node --check public/app/services/fellowfare/fulfillment-economy-v2.js
          node --check public/app/services/fellowfare/jurisdiction-policy-v1.js
          node --check public/app/services/fellowfare/seller-method-types-v1.js
          node --check public/app/services/fellowfare/seller-methods-v1.js
          node --check public/app/services/fellowfare/seller-direct-transactions-v1.js
          node --check public/app/services/fellowfare/tax-records-v1.js
          node --check public/app/services/fellowfare/tax-record-bridge-v1.js
          node --check public/app/services/fellowfare/seller-record-export-v1.js
          node --check scripts/verify-stripe-live-readiness-preflight.mjs
          node --check scripts/verify-fellowfare-seller-direct-guardrails-v1.mjs
          node --check scripts/verify-territory-stewardship-v1.mjs
          node scripts/verify-fellowfare-direct-commerce-v2.mjs
          node scripts/verify-live-marketplace-payments-v1.mjs
          node scripts/verify-fellowfare-seller-direct-guardrails-v1.mjs
          node scripts/verify-cerbanimo-commerce-distribution-v1.mjs
          node scripts/verify-territory-stewardship-v1.mjs
          node scripts/verify-fellowfare-marketplace-v2.mjs
