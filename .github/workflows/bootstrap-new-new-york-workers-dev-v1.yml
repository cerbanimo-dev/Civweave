name: Bootstrap New New York workers.dev v1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-new-new-york-workers-dev-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  bootstrap-workers-dev:
    name: Register New New York workers.dev namespace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.NEW_NEW_YORK_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.NEW_NEW_YORK_CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Require New New York Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing NEW_NEW_YORK_CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing NEW_NEW_YORK_CLOUDFLARE_ACCOUNT_ID'; exit 2; }

      - name: Ensure workers.dev account subdomain exists
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const accountId = String(process.env.CLOUDFLARE_ACCOUNT_ID || '').trim();
          const token = String(process.env.CLOUDFLARE_API_TOKEN || '').trim();
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(accountId)}/workers/subdomain`;
          const headers = {
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json',
          };

          const readPacket = async response => response.json().catch(() => ({}));
          const currentResponse = await fetch(endpoint, { headers });
          const currentPacket = await readPacket(currentResponse);
          let subdomain = String(currentPacket?.result?.subdomain || '').trim();

          if (!currentResponse.ok && currentResponse.status !== 404) {
            throw new Error(`Could not read workers.dev subdomain: ${JSON.stringify(currentPacket.errors || currentPacket)}`);
          }

          if (!subdomain) {
            const suffix = accountId.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 10);
            const desired = `new-new-york-${suffix}`.slice(0, 63).replace(/-+$/g, '');
            const createResponse = await fetch(endpoint, {
              method: 'PUT',
              headers,
              body: JSON.stringify({ subdomain: desired }),
            });
            const createPacket = await readPacket(createResponse);
            if (!createResponse.ok || createPacket.success !== true) {
              throw new Error(`Could not create workers.dev subdomain ${desired}: ${JSON.stringify(createPacket.errors || createPacket)}`);
            }
            subdomain = String(createPacket?.result?.subdomain || desired).trim();
            console.log(`Created ${subdomain}.workers.dev for New New York.`);
          } else {
            console.log(`Existing workers.dev namespace: ${subdomain}.workers.dev`);
          }

          const verifyResponse = await fetch(endpoint, { headers, cache: 'no-store' });
          const verifyPacket = await readPacket(verifyResponse);
          if (!verifyResponse.ok || verifyPacket.success !== true || String(verifyPacket?.result?.subdomain || '').trim() !== subdomain) {
            throw new Error(`workers.dev namespace verification failed: ${JSON.stringify(verifyPacket.errors || verifyPacket)}`);
          }
          console.log(`Verified ${subdomain}.workers.dev.`);
          NODE

      - name: Dispatch New New York territory deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const endpoint = `https://api.github.com/repos/${process.env.REPOSITORY}/actions/workflows/deploy-new-new-york-territory-host-v1.yml/dispatches`;
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ ref: 'main' }),
          });
          if (response.status !== 204) {
            const body = await response.text();
            throw new Error(`Could not dispatch New New York deployment: HTTP ${response.status} ${body}`);
          }
          console.log('Dispatched deploy-new-new-york-territory-host-v1.yml on main.');
          NODE
