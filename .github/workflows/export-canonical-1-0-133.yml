name: Export canonical 1.0.133 materialization

on:
  push:
    branches:
      - agent/free-user-ai-gateway-fallback
    paths:
      - '.github/workflows/export-canonical-1-0-133.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/free-user-ai-gateway-fallback
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Materialize canonical release
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          npm pkg set version="$VERSION"
          node scripts/materialize-canonical-release.mjs
          node scripts/sync-release-coherence-v220.mjs
          node scripts/generate-prelive-metadata-v281.mjs
          git diff --binary > /tmp/canonical.patch
          git diff --name-only > /tmp/changed-files.txt
          tar -czf /tmp/canonical-tree.tgz package.json public scripts "releases/$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-1.0.133
          path: |
            /tmp/canonical.patch
            /tmp/changed-files.txt
            /tmp/canonical-tree.tgz
          if-no-files-found: error
          retention-days: 1
