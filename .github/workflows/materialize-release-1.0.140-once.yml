name: Materialize Civweave 1.0.140 Once

on:
  push:
    branches:
      - fix/release-1.0.140-materialization
    paths:
      - '.github/workflows/materialize-release-1.0.140-once.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-1.0.140-materialization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align package metadata and materialize canonical release
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "1.0.140"
          npm version 1.0.140 --no-git-tag-version --allow-same-version
          node scripts/materialize-canonical-release.mjs
          test -f releases/1.0.140/release.json
          node scripts/verify-canonical-launch-release.mjs
      - name: Commit generated release and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'civweave-release-bot'
          git config user.email 'release-bot@users.noreply.github.com'
          git rm .github/workflows/materialize-release-1.0.140-once.yml
          git add -A
          git diff --cached --stat
          git commit -m 'Materialize canonical release 1.0.140'
          git push origin HEAD:fix/release-1.0.140-materialization
