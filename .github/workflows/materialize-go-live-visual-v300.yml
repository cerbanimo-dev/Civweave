name: Materialize go-live visual release v300

on:
  push:
    branches:
      - go-live/realm-visual-pass-2026-08-12

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: go-live/realm-visual-pass-2026-08-12
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Advance release identity
        run: |
          printf '1.0.107\n' > VERSION
          npm version 1.0.107 --no-git-tag-version
      - name: Refresh go-live visual cache key
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const paths=[
            'public/app/working-campus-v156.html',
            'public/app/cabinets/living-school/index.html',
            'public/app/realm-console-v140.html',
            'public/app/fellowfare-cabinet-v144.html',
            'public/app/anarchadia-console-v139.html',
            'public/app/platform-experience-v160.js'
          ];
          for(const path of paths){
            const before=fs.readFileSync(path,'utf8');
            const after=before.replace(/platform-experience-v160\.css\?v=[^"'`\s)]+/g,'platform-experience-v160.css?v=1.0.107-go-live-v300');
            if(after===before)throw new Error(`Missing platform experience cache key in ${path}`);
            fs.writeFileSync(path,after);
          }
          NODE
      - name: Materialize canonical release
        run: |
          node scripts/materialize-canonical-release.mjs
          node scripts/build-service-worker-v211.mjs
          node scripts/generate-prelive-metadata-v281.mjs
      - name: Advance canonical current release
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path='config/release-contract.json';
          const contract=JSON.parse(fs.readFileSync(path,'utf8'));
          contract.canonical.current={version:'1.0.107',path:'releases/1.0.107',status:'current'};
          fs.writeFileSync(path,JSON.stringify(contract,null,2)+'\n');
          NODE
      - name: Verify release contracts
        run: |
          node scripts/verify-canonical-launch-release.mjs
          node scripts/verify-release-contract.mjs
          node scripts/verify-release-version-sync.mjs
          CHANGED_FILES="$(git diff --name-only origin/main...HEAD; git diff --name-only)" node scripts/verify-version-policy.mjs 1.0.106 1.0.107
      - name: Commit generated release and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-go-live-visual-v300.yml
          git add -A
          git commit -m "Materialize Civweave 1.0.107 go-live visual release"
          git push origin HEAD:go-live/realm-visual-pass-2026-08-12
