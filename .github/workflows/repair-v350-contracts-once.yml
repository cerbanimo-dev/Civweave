name: Repair V350 Contracts Once

on:
  push:
    branches:
      - fix/v350-hub-telemetry-release-1.0.162

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'Complete V350 canonical chat migration')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply source-first V350 migration
        run: |
          python3 scripts/repair-v350-contracts-once.py
          python3 scripts/repair-v350-chat-convergence-once.py
      - name: Refresh 1.0.162 canonical materialization
        run: |
          npm run release:materialize
          node scripts/sync-release-coherence-v220.mjs
          node scripts/sync-canonical-release-hashes.mjs
      - name: Verify migrated contracts
        run: |
          node --check public/app/guide-chat-surface-v350.js
          node --check public/app/guide-identity-integrity-v216.js
          node --check public/app/family-ai-loader-v105.js
          node --check public/app/weaveling-hub-v233.js
          node --check public/app/unified-chat-system-v1.js
          node scripts/verify-guide-identity-integrity-v216.mjs
          node scripts/verify-regression-fixes-v243.mjs
          node scripts/verify-working-campus-mvp-v155.mjs
          node scripts/verify-radio-bootstrap-priority-v267.mjs
          node scripts/verify-installer-front-door-v1.mjs
          node scripts/verify-recovery-asset-lockboard-v239.mjs
          node scripts/verify-working-campus-topbar-v243.mjs
          node scripts/verify-weaveling-hub-v233.mjs
          node scripts/verify-knowledge-school-seeds-v1.mjs
          node scripts/verify-hub-node-access-v1.mjs
          node scripts/verify-chat-convergence-v250.mjs
          npm run check:release-discipline
          npm run check
          git diff --check
      - name: Run real-browser installer gauntlet
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
          node scripts/browser-installer-gauntlet-v281.mjs
      - name: Commit source-first migration
        shell: bash
        run: |
          git checkout -- .civweave-gateway-v132.loader.mjs .civweave-canonical-gateway.entry.mjs .civweave-gateway-v131.runtime.mjs
          git rm .github/workflows/repair-v350-contracts-once.yml scripts/repair-v350-contracts-once.py scripts/repair-v350-chat-convergence-once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete V350 canonical chat migration'
          git push origin HEAD:fix/v350-hub-telemetry-release-1.0.162
