name: Verify Civweave Systems Mesh v251

on:
  pull_request:
    paths:
      - 'public/app/civweave-systems-mesh-v251.js'
      - 'public/app/install-boundary-v146.js'
      - 'public/app/system-routes-v227.js'
      - 'public/app/offline-package-v208.json'
      - 'scripts/verify-civweave-systems-mesh-v251.mjs'
      - 'scripts/verify-five-system-navigation-v227.mjs'
      - '.github/workflows/verify-civweave-systems-mesh-v251.yml'
  push:
    branches: [main]
    paths:
      - 'public/app/civweave-systems-mesh-v251.js'
      - 'public/app/install-boundary-v146.js'
      - 'public/app/system-routes-v227.js'
      - 'public/app/offline-package-v208.json'
      - 'scripts/verify-civweave-systems-mesh-v251.mjs'
      - 'scripts/verify-five-system-navigation-v227.mjs'
  workflow_dispatch:

jobs:
  verify-systems-mesh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check systems mesh runtime
        run: |
          node --check public/app/civweave-systems-mesh-v251.js
          node --check public/app/install-boundary-v146.js
          node --check public/app/system-routes-v227.js
          node --check scripts/verify-civweave-systems-mesh-v251.mjs
          node --check scripts/verify-five-system-navigation-v227.mjs
      - name: Verify five-system mesh contract and privilege boundary
        run: node scripts/verify-civweave-systems-mesh-v251.mjs
