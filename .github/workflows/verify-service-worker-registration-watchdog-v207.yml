name: Verify service worker registration watchdog v207

on:
  pull_request:
    paths:
      - public/index.html
      - public/install-v130.js
      - public/app/install-boundary-v146.js
      - public/app/pwa-update-controller-v204.js
      - public/service-worker-v203.js
      - public/service-worker-update-v204.js
      - scripts/apply-service-worker-registration-watchdog-v207.mjs
      - scripts/align-service-worker-registration-watchdog-smoke-v207.mjs
      - scripts/smoke-service-worker-registration-watchdog-v207.mjs
      - scripts/verify-knowledge-school-seeds-v1.mjs
      - .github/workflows/verify-service-worker-registration-watchdog-v207.yml
  push:
    branches:
      - agent/service-worker-registration-watchdog-v207
    paths:
      - ops/triggers/service-worker-registration-watchdog-v207.trigger

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'agent/service-worker-registration-watchdog-v207' || '' }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize deterministic watchdog repair
        if: github.event_name == 'push'
        run: |
          node scripts/apply-service-worker-registration-watchdog-v207.mjs
          node scripts/align-service-worker-registration-watchdog-smoke-v207.mjs
      - name: Check watchdog JavaScript syntax
        run: |
          node --check public/install-v130.js
          node --check public/app/pwa-update-controller-v204.js
          node --check public/app/install-boundary-v146.js
          node --check public/service-worker-v203.js
          node --check public/service-worker-update-v204.js
          node --check scripts/apply-service-worker-registration-watchdog-v207.mjs
          node --check scripts/align-service-worker-registration-watchdog-smoke-v207.mjs
          node --check scripts/smoke-service-worker-registration-watchdog-v207.mjs
          node --check scripts/verify-knowledge-school-seeds-v1.mjs
      - name: Simulate stalled registration and update promises
        run: node scripts/smoke-service-worker-registration-watchdog-v207.mjs
      - name: Re-run package and worker contracts
        run: |
          node scripts/verify-knowledge-school-seeds-v1.mjs
          node scripts/verify-service-worker-evaluation-v189.mjs
          node scripts/verify-critical-package-completion-v200.mjs
          node scripts/smoke-installer-recovery-v206.mjs
      - name: Commit materialized watchdog repair
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/index.html \
            public/install-v130.js \
            public/app/install-boundary-v146.js \
            public/app/pwa-update-controller-v204.js \
            public/service-worker-v203.js \
            public/service-worker-update-v204.js \
            scripts/smoke-service-worker-registration-watchdog-v207.mjs \
            scripts/verify-knowledge-school-seeds-v1.mjs
          if git diff --cached --quiet; then
            echo 'Registration watchdog already materialized.'
            exit 0
          fi
          git commit -m 'Add service worker registration watchdog'
          git push origin HEAD:agent/service-worker-registration-watchdog-v207
