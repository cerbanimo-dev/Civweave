name: Verify stable app entry v215

on:
  pull_request:
    branches: [main]
    paths:
      - public/_redirects
      - public/app/index.html
      - public/app/manifest.webmanifest
      - scripts/verify-stable-app-entry-v215.mjs
      - .github/workflows/verify-stable-app-entry-v215.yml
  push:
    branches: [main]
    paths:
      - public/_redirects
      - public/app/index.html
      - public/app/manifest.webmanifest
      - scripts/verify-stable-app-entry-v215.mjs
      - .github/workflows/verify-stable-app-entry-v215.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify stable app routing
        run: node scripts/verify-stable-app-entry-v215.mjs
