name: Guide Artifact Lifecycle

on:
  pull_request:
    paths:
      - 'public/app/cerbanimo-quest-engine-v144.js'
      - 'public/app/cerbanimo-quest-engine-v144.css'
      - 'public/app/assets/ai/*-review-sprites-v1.png'
      - 'scripts/test-cerbanimo-visual-feedback-v1.mjs'
      - 'public/app/shared/guide-outcome-scene-v1.js'
      - 'public/app/shared/guide-outcome-scene-v1.css'
      - 'public/app/cw-reward-ledger-v2.js'
      - 'scripts/test-guide-outcome-scene-v1.mjs'
      - 'scripts/test-visual-feedback-integration-v1.mjs'
      - 'scripts/test-canonical-reward-grant-notification-v1.mjs'
      - 'public/app/cerbanimo-ai-validator-v159.js'
      - 'public/app/realm-console-v140.html'
      - 'public/app/guide-contracts-v141.js'
      - 'scripts/test-guide-artifact-lifecycle-v1.mjs'
      - '.github/workflows/guide-artifact-lifecycle.yml'
  push:
    branches: [main, staging]
    paths:
      - 'public/app/cerbanimo-quest-engine-v144.js'
      - 'public/app/cerbanimo-quest-engine-v144.css'
      - 'public/app/assets/ai/*-review-sprites-v1.png'
      - 'scripts/test-cerbanimo-visual-feedback-v1.mjs'
      - 'public/app/shared/guide-outcome-scene-v1.js'
      - 'public/app/shared/guide-outcome-scene-v1.css'
      - 'public/app/cw-reward-ledger-v2.js'
      - 'scripts/test-guide-outcome-scene-v1.mjs'
      - 'scripts/test-visual-feedback-integration-v1.mjs'
      - 'scripts/test-canonical-reward-grant-notification-v1.mjs'
      - 'public/app/cerbanimo-ai-validator-v159.js'
      - 'public/app/realm-console-v140.html'
      - 'public/app/guide-contracts-v141.js'
      - 'scripts/test-guide-artifact-lifecycle-v1.mjs'
      - '.github/workflows/guide-artifact-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify guide artifact creation, revision, approval, completion, and reopening
        run: node --test scripts/test-guide-artifact-lifecycle-v1.mjs scripts/test-cerbanimo-visual-feedback-v1.mjs scripts/test-guide-outcome-scene-v1.mjs scripts/test-canonical-reward-grant-notification-v1.mjs scripts/test-visual-feedback-integration-v1.mjs
