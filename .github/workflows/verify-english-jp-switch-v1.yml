name: Verify English JP switch v1

on:
  push:
    paths:
      - 'public/app/civweave-brand.js'
      - 'scripts/verify-english-jp-switch-v1.mjs'
      - '.github/workflows/verify-english-jp-switch-v1.yml'
  pull_request:
    paths:
      - 'public/app/civweave-brand.js'
      - 'scripts/verify-english-jp-switch-v1.mjs'
      - '.github/workflows/verify-english-jp-switch-v1.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify reciprocal language switch
        run: node scripts/verify-english-jp-switch-v1.mjs
