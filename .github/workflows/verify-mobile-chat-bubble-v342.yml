name: Verify mobile chat bubble v342

on:
  pull_request:
    paths:
      - 'public/app/shared-chat-face-icons-v255.js'
      - 'scripts/verify-mobile-chat-bubble-anchor-v342.mjs'
      - '.github/workflows/verify-mobile-chat-bubble-v342.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-mobile-chat-bubble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check launcher runtime
        run: node --check public/app/shared-chat-face-icons-v255.js
      - name: Verify anchored circular mobile launcher
        run: node scripts/verify-mobile-chat-bubble-anchor-v342.mjs
