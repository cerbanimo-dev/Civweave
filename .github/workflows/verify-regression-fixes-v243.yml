name: Verify regression fixes v243

on:
  pull_request:
    paths:
      - 'public/app/regression-fixes-v243.js'
      - 'public/app/guide-workspace-v242.js'
      - 'public/app/shared-guide-surface-v236.js'
      - 'public/app/assets/ai/kamiya-welcoming-v243.png'
      - 'public/app/knowledge-school-runtime-v243.mjs'
      - 'public/app/living-school-*-v243.mjs'
      - 'public/app/cabinets/living-school/index.html'
      - 'public/app/cabinets/living-school/living-school-cleanroom-v218.mjs'
      - 'public/app/cabinets/living-school/living-school-cleanroom-render-v218.mjs'
      - 'public/app/unified-chat-system-v1.js'
      - 'public/app/ai-capability-broker-v268.js'
      - 'public/app/gemini-task-tier-router-v213.js'
      - 'scripts/verify-regression-fixes-v243.mjs'
      - 'scripts/verify-living-school-model-authority-v1.mjs'
      - 'package.json'
      - '.github/workflows/verify-regression-fixes-v243.yml'
  push:
    branches: [main]
    paths:
      - 'public/app/regression-fixes-v243.js'
      - 'public/app/guide-workspace-v242.js'
      - 'public/app/shared-guide-surface-v236.js'
      - 'public/app/assets/ai/kamiya-welcoming-v243.png'
      - 'public/app/knowledge-school-runtime-v243.mjs'
      - 'public/app/living-school-*-v243.mjs'
      - 'public/app/cabinets/living-school/index.html'
      - 'public/app/cabinets/living-school/living-school-cleanroom-v218.mjs'
      - 'public/app/cabinets/living-school/living-school-cleanroom-render-v218.mjs'
      - 'public/app/unified-chat-system-v1.js'
      - 'public/app/ai-capability-broker-v268.js'
      - 'public/app/gemini-task-tier-router-v213.js'
      - 'scripts/verify-regression-fixes-v243.mjs'
      - 'scripts/verify-living-school-model-authority-v1.mjs'
      - 'package.json'

permissions:
  contents: read

jobs:
  regression-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse changed runtimes
        run: |
          node --check public/app/regression-fixes-v243.js
          node --check public/app/guide-workspace-v242.js
          node --check public/app/shared-guide-surface-v236.js
          node --check public/app/knowledge-school-runtime-v243.mjs
          node --check public/app/living-school-local-research-v243.mjs
          node --check public/app/living-school-cleanroom-actions-v243.mjs
          node --check public/app/cabinets/living-school/living-school-cleanroom-v218.mjs
          node --check public/app/cabinets/living-school/living-school-cleanroom-render-v218.mjs
          node --check public/app/unified-chat-system-v1.js
          node --check scripts/verify-regression-fixes-v243.mjs
          node --check scripts/verify-living-school-model-authority-v1.mjs
      - name: Verify regression contracts
        run: |
          node scripts/verify-regression-fixes-v243.mjs
          node scripts/verify-living-school-model-authority-v1.mjs
