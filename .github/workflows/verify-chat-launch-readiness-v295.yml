name: Verify chat launch readiness v295

on:
  push:
    branches:
      - main
      - 'launch/**'
    paths:
      - 'public/app/experience-orchestrator-v232.js'
      - 'public/app/*-v295.js'
      - 'public/app/mobile-ai-hardening-v302.js'
      - 'public/service-worker-chat-repair-v245.js'
      - 'scripts/verify-chat-launch-readiness-v295.mjs'
      - '.github/workflows/verify-chat-launch-readiness-v295.yml'
  pull_request:
    paths:
      - 'public/app/experience-orchestrator-v232.js'
      - 'public/app/*-v295.js'
      - 'public/app/mobile-ai-hardening-v302.js'
      - 'public/service-worker-chat-repair-v245.js'
      - 'scripts/verify-chat-launch-readiness-v295.mjs'
      - '.github/workflows/verify-chat-launch-readiness-v295.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check chat runtime
        run: |
          node --check public/app/chat-fullscreen-v295.js
          node --check public/app/mobile-ai-hardening-v302.js
          node --check scripts/verify-chat-launch-readiness-v295.mjs
      - name: Verify chat main-thread quiescence contract
        run: node scripts/verify-chat-launch-readiness-v295.mjs
