name: Verify Charterkeeper v1

on:
  push:
    branches:
      - staging
      - agent/charterkeeper-20260818
    paths:
      - cloudflare/core/migrations/0012_charterkeepers.sql
      - cloudflare/core/migrations/0013_charterkeeper_guards.sql
      - cloudflare/core/src/charterkeeper-v1.mjs
      - cloudflare/core/src/charterkeeper-entry-v1.mjs
      - cloudflare/core/src/territory-stewardship-with-charterkeepers-v1.mjs
      - cloudflare/core/src/money-edge-with-memberships.mjs
      - cloudflare/core/src/origin-entry.mjs
      - lib/node-ai-live-commerce-v1.mjs
      - public/app/node-ai-charterkeeper-v1.js
      - public/app/node-ai-operator-v1.html
      - public/app/mobile-guild-create-v1.mjs
      - scripts/verify-charterkeeper-v1.mjs
      - .github/workflows/verify-charterkeeper-v1.yml
  pull_request:
    paths:
      - cloudflare/core/migrations/0012_charterkeepers.sql
      - cloudflare/core/migrations/0013_charterkeeper_guards.sql
      - cloudflare/core/src/charterkeeper-v1.mjs
      - cloudflare/core/src/charterkeeper-entry-v1.mjs
      - cloudflare/core/src/territory-stewardship-with-charterkeepers-v1.mjs
      - cloudflare/core/src/money-edge-with-memberships.mjs
      - cloudflare/core/src/origin-entry.mjs
      - lib/node-ai-live-commerce-v1.mjs
      - public/app/node-ai-charterkeeper-v1.js
      - public/app/node-ai-operator-v1.html
      - public/app/mobile-guild-create-v1.mjs
      - scripts/verify-charterkeeper-v1.mjs
      - .github/workflows/verify-charterkeeper-v1.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check cloudflare/core/src/charterkeeper-v1.mjs
          node --check cloudflare/core/src/charterkeeper-entry-v1.mjs
          node --check cloudflare/core/src/territory-stewardship-with-charterkeepers-v1.mjs
          node --check cloudflare/core/src/money-edge-with-memberships.mjs
          node --check cloudflare/core/src/origin-entry.mjs
          node --check lib/node-ai-live-commerce-v1.mjs
          node --check public/app/node-ai-charterkeeper-v1.js
          node --check public/app/mobile-guild-create-v1.mjs
      - name: Charterkeeper contract
        run: node scripts/verify-charterkeeper-v1.mjs
