name: Materialize translation prelive v1
on:
  push:
    branches:
      - agent/offline-translation-packs-v1-current
    paths:
      - '.github/workflows/materialize-translation-prelive-v1.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/offline-translation-packs-v1-current
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate synchronized shell metadata
        run: |
          node scripts/sync-release-version-assets.mjs
          node scripts/build-service-worker-v211.mjs
          node scripts/generate-prelive-metadata-v281.mjs
      - name: Commit generated prelive metadata
        run: |
          git config user.name 'civweave-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/app/shell-integrity-v281.json public/app/offline-package-v208.json
          if git diff --cached --quiet; then
            echo 'Prelive metadata already current.'
            exit 0
          fi
          git commit -m 'sync 1.0.147 prelive metadata'
          git push origin HEAD:agent/offline-translation-packs-v1-current
