name: Verify Settings AI Fleet

on:
  push:
    branches: [staging, main]
    paths:
      - public/app/settings-local-models-direct-v325.js
      - public/app/shared/civweave-ai-fleet-v1.js
      - public/app/settings-local-route-v325.js
      - public/app/settings-local-route-v327.js
      - public/service-worker-settings-v325-override.js
      - public/service-worker-v203.js
      - public/service-worker.js
      - scripts/verify-settings-v325-direct-local-models.mjs
      - scripts/test-ai-fleet-v1.mjs
      - scripts/verify-settings-v325-stale-worker-bridge.mjs
      - scripts/verify-settings-registered-worker-boundary-v338.mjs
      - .github/workflows/verify-settings-v325-direct-local-models.yml
  pull_request:
    branches: [staging, main]
    paths:
      - public/app/settings-local-models-direct-v325.js
      - public/app/shared/civweave-ai-fleet-v1.js
      - public/app/settings-local-route-v325.js
      - public/app/settings-local-route-v327.js
      - public/service-worker-settings-v325-override.js
      - public/service-worker-v203.js
      - public/service-worker.js
      - scripts/verify-settings-v325-direct-local-models.mjs
      - scripts/test-ai-fleet-v1.mjs
      - scripts/verify-settings-v325-stale-worker-bridge.mjs
      - scripts/verify-settings-registered-worker-boundary-v338.mjs
      - .github/workflows/verify-settings-v325-direct-local-models.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-settings-v325-direct-local-models-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  direct-local-models:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check public/app/shared/civweave-ai-fleet-v1.js
          node --check public/app/settings-local-models-direct-v325.js
          node --check public/app/settings-local-route-v325.js
          node --check public/app/settings-local-route-v327.js
          node --check public/service-worker-settings-v325-override.js
          node --check public/service-worker-v203.js
          node --check public/service-worker.js
          node --check scripts/verify-settings-v325-direct-local-models.mjs
          node --check scripts/verify-settings-v325-stale-worker-bridge.mjs
          node --check scripts/verify-settings-registered-worker-boundary-v338.mjs
      - name: Verify device-filtered AI Fleet and legacy browser boundaries
        run: |
          node --test scripts/test-ai-fleet-v1.mjs
          node scripts/verify-settings-v325-direct-local-models.mjs
          node scripts/verify-settings-v325-stale-worker-bridge.mjs
          node scripts/verify-settings-registered-worker-boundary-v338.mjs
