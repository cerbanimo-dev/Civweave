name: Verify Living School Quiz Contract v263

on:
  pull_request:
    paths:
      - 'public/app/living-school-quiz-contract-guard-v263.mjs'
      - 'public/app/cabinets/living-school/living-school-cleanroom-v218.mjs'
      - 'public/app/cabinets/living-school/index.html'
      - 'public/app/living-school-cleanroom-actions-v243.mjs'
      - 'scripts/verify-living-school-quiz-contract-v263.mjs'
      - '.github/workflows/verify-living-school-quiz-contract-v263.yml'
  push:
    branches: [main]
    paths:
      - 'public/app/living-school-quiz-contract-guard-v263.mjs'
      - 'public/app/cabinets/living-school/living-school-cleanroom-v218.mjs'
      - 'public/app/cabinets/living-school/index.html'
      - 'public/app/living-school-cleanroom-actions-v243.mjs'
      - 'scripts/verify-living-school-quiz-contract-v263.mjs'
      - '.github/workflows/verify-living-school-quiz-contract-v263.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify quiz contract
        run: node scripts/verify-living-school-quiz-contract-v263.mjs
