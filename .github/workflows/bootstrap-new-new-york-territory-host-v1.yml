name: Bootstrap New New York Territory Host v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-new-new-york-territory-host-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: Dispatch New New York deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start isolated territory-host deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run deploy-new-new-york-territory-host-v1.yml
          --repo "${{ github.repository }}"
          --ref main
