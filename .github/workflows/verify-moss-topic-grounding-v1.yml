name: Verify Moss topic-grounded Learning Journeys
on:
  push:
    branches: [staging, main]
    paths:
      - public/app/unified-chat-system-v1.js
      - public/app/local-ai/native-server-guide-fastpath-v1.js
      - scripts/verify-moss-topic-grounding-v1.mjs
      - .github/workflows/verify-moss-topic-grounding-v1.yml
  pull_request:
    paths:
      - public/app/unified-chat-system-v1.js
      - public/app/local-ai/native-server-guide-fastpath-v1.js
      - scripts/verify-moss-topic-grounding-v1.mjs
      - .github/workflows/verify-moss-topic-grounding-v1.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check public/app/unified-chat-system-v1.js
      - run: node scripts/verify-moss-topic-grounding-v1.mjs
      - run: node scripts/verify-moss-native-server-goal-pin-v1.mjs
