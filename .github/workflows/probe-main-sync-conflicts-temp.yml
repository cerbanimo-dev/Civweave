name: Probe Main Sync Conflicts Temp

on:
  push:
    branches:
      - agent/general-knowledge-video-packs-v1
    paths:
      - .github/workflows/probe-main-sync-conflicts-temp.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Report merge conflicts
        run: |
          set +e
          git config user.name sync-probe
          git config user.email sync-probe@users.noreply.github.com
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          status=$?
          echo "MERGE_STATUS=$status"
          echo 'CONFLICTS_BEGIN'
          git diff --name-only --diff-filter=U
          echo 'CONFLICTS_END'
          git merge --abort >/dev/null 2>&1 || true
          exit 0
