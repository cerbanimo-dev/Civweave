name: Verify Kamiya Gemini quota failover

on:
  push:
    branches: [staging]
    paths:
      - 'public/app/cerbanimo-chat-quest-capability-v1.js'
      - 'scripts/verify-cerbanimo-gemini-quota-failover-v1.mjs'
      - '.github/workflows/verify-cerbanimo-gemini-quota-failover-v1.yml'
  pull_request:
    paths:
      - 'public/app/cerbanimo-chat-quest-capability-v1.js'
      - 'scripts/verify-cerbanimo-gemini-quota-failover-v1.mjs'
      - '.github/workflows/verify-cerbanimo-gemini-quota-failover-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-cerbanimo-kamiya-quest-chat-v1.mjs
      - run: node scripts/verify-cerbanimo-gemini-quota-failover-v1.mjs
