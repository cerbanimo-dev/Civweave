name: Enable main protection once

on:
  push:
    branches:
      - ops/enable-main-protection-v1
    paths:
      - .github/workflows/enable-main-protection-once.yml

permissions:
  contents: read

jobs:
  protect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Launch readiness on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/protection.json <<'JSON'
          {
            "required_status_checks": {
              "strict": true,
              "contexts": ["Launch readiness"]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": null,
            "restrictions": null
          }
          JSON
          code="$(curl --silent --show-error --output /tmp/protection-response.json --write-out '%{http_code}' \
            --request PUT \
            --url "https://api.github.com/repos/${REPO}/branches/main/protection" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/protection.json)"
          cat /tmp/protection-response.json
          if [ "$code" != "200" ]; then
            echo "GitHub branch-protection API returned HTTP $code; this token does not have the required repository administration authority."
            exit 3
          fi
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const data=JSON.parse(readFileSync('/tmp/protection-response.json','utf8'));
          const contexts=data?.required_status_checks?.contexts||[];
          if(!contexts.includes('Launch readiness'))throw new Error('Protection response did not require Launch readiness.');
          if(data?.enforce_admins?.enabled!==true)throw new Error('Protection response did not enforce protection for admins.');
          console.log(JSON.stringify({ok:true,requiredStatus:'Launch readiness',strict:true,enforceAdmins:true}));
          NODE
