name: Verify local model cache integrity v271

on:
  pull_request:
    paths:
      - 'VERSION'
      - 'package.json'
      - 'public/app/manifest.webmanifest'
      - 'public/app/local-ai/cache-integrity-v271.js'
      - 'public/app/local-ai/runtime-v266.js'
      - 'public/app/local-ai/worker-v266.js'
      - 'public/app/local-ai/bootstrap-v266.js'
      - 'public/service-worker-local-model-download-v267.js'
      - 'public/service-worker-v203.js'
      - 'scripts/verify-local-model-cache-integrity-v271.mjs'
      - 'scripts/verify-local-model-cache-loader-v270.mjs'
      - '.github/workflows/verify-local-model-cache-integrity-v271.yml'
  push:
    branches:
      - main
    paths:
      - 'VERSION'
      - 'package.json'
      - 'public/app/manifest.webmanifest'
      - 'public/app/local-ai/cache-integrity-v271.js'
      - 'public/app/local-ai/runtime-v266.js'
      - 'public/app/local-ai/worker-v266.js'
      - 'public/app/local-ai/bootstrap-v266.js'
      - 'public/service-worker-local-model-download-v267.js'
      - 'public/service-worker-v203.js'
      - 'scripts/verify-local-model-cache-integrity-v271.mjs'
      - 'scripts/verify-local-model-cache-loader-v270.mjs'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check public/app/local-ai/cache-integrity-v271.js
          node --check public/app/local-ai/runtime-v266.js
          node --check public/app/local-ai/worker-v266.js
          node --check public/app/local-ai/bootstrap-v266.js
          node --check public/service-worker-local-model-download-v267.js
          node --check public/service-worker-v203.js
          node --check scripts/verify-local-model-cache-integrity-v271.mjs
      - name: Release surfaces
        run: |
          test "$(cat VERSION)" = "$(node -p "require('./package.json').version")"
          node -e "const fs=require('fs');const v=fs.readFileSync('VERSION','utf8').trim();const m=JSON.parse(fs.readFileSync('public/app/manifest.webmanifest','utf8'));if(m.name!==\`Civweave v${v}\`)process.exit(1)"
      - name: Empty JSON cache regression
        run: node scripts/verify-local-model-cache-integrity-v271.mjs
      - name: Cache loader compatibility
        run: node scripts/verify-local-model-cache-loader-v270.mjs
      - name: Existing local model contract
        run: node scripts/verify-local-model-download-v267.mjs
