name: One-shot materialize v1.0.160

on:
  push:
    branches: [fix/purge-retired-views-v350]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[v160 materialized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/purge-retired-views-v350
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Materialize canonical release
        run: node scripts/materialize-canonical-release.mjs
      - name: Commit generated release and self-remove
        run: |
          rm .github/workflows/one-shot-materialize-v160.yml
          git config user.name "civweave-release-bot"
          git config user.email "civweave-release-bot@users.noreply.github.com"
          git add -A
          git commit -m "Materialize canonical release 1.0.160 [v160 materialized]"
          git push origin HEAD:fix/purge-retired-views-v350
