name: Verify system ownership v317

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'config/system-ownership.json'
      - 'docs/architecture/systems-of-practice.md'
      - 'public/app/settings-gateway-v317.js'
      - 'public/app/model-settings-controller-v173.js'
      - 'public/app/document-lifecycle-v221.js'
      - 'public/app/experience-orchestrator-v232.js'
      - 'public/app/install-boundary-v146.js'
      - 'public/app/family-shell-v104.js'
      - 'public/app/family-ai-loader-v105.js'
      - 'public/app/settings-parity-v295.js'
      - 'public/app/settings-delegation-v175.js'
      - 'public/app/ai-settings-bind-guard-v230.js'
      - 'public/app/ai-settings-device-repair-v229.js'
      - 'public/app/device-credential-persistence-v211.js'
      - 'public/app/anarchadia-runtime-stability-v159.js'
      - 'public/app/civweave-brand.js'
      - 'public/app/working-campus-v156.html'
      - 'public/app/working-campus-v156.part5.txt'
      - 'public/app/cabinets/living-school/index.html'
      - 'public/app/realm-console-v140.html'
      - 'public/app/fellowfare-cabinet-v144.html'
      - 'public/app/anarchadia-console-v139.html'
      - 'public/service-worker-code-coherence-v288.js'
      - 'public/service-worker-local-ai-coherence-v307.js'
      - 'public/service-worker-critical-v199.js'
      - 'scripts/verify-system-ownership-v317.mjs'
      - 'scripts/verify-settings-freeze-recovery-v296.mjs'
      - 'scripts/verify-living-school-settings-owner-v310.mjs'
      - 'scripts/verify-mobile-local-settings-v315.mjs'
      - 'scripts/verify-ai-settings-entry-runtime-spine-v269.mjs'
      - 'scripts/verify-document-lifecycle-v221.mjs'
      - 'scripts/verify-device-credential-persistence-v211.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/verify-system-ownership-v317.mjs
      - run: node scripts/verify-living-school-settings-owner-v310.mjs
      - run: node scripts/verify-mobile-local-settings-v315.mjs
      - run: node scripts/verify-settings-freeze-recovery-v296.mjs
      - run: node scripts/verify-ai-settings-entry-runtime-spine-v269.mjs
      - run: node scripts/verify-device-credential-persistence-v211.mjs
