name: Deploy Civweave Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civweave-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy civweave.cc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CIVWEAVE_RECOVERY_ZONE: ${{ vars.CIVWEAVE_RECOVERY_ZONE }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Pages build dependencies
        run: npm install --ignore-scripts

      - name: Verify access to canonical Pages project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing repository secret CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing repository secret CLOUDFLARE_ACCOUNT_ID'; exit 2; }
          node --input-type=module <<'NODE'
          const project = 'civweave';
          const account = encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID);
          const response = await fetch(
            'https://api.cloudflare.com/client/v4/accounts/' + account + '/pages/projects/' + encodeURIComponent(project),
            { headers: { Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN } },
          );
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || payload.success !== true || payload.result?.name !== project) {
            const errors = Array.isArray(payload.errors) ? JSON.stringify(payload.errors) : response.statusText;
            console.error('Cloudflare token/account cannot access Pages project "' + project + '": ' + errors);
            process.exit(3);
          }
          console.log('Verified access to canonical Pages project "' + project + '".');
          NODE

      - name: Refuse the wrong Cloudflare Pages account
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler pages deployment list \
            --project-name civweave \
            --environment production \
            --json > /tmp/civweave-pages-deployments.json
          node scripts/verify-cloudflare-pages-account-target-v1.mjs \
            /tmp/civweave-pages-deployments.json civweave

      - name: Ensure civweave.cc is active before canonical cutover
        shell: bash
        run: node scripts/ensure-cloudflare-pages-domain-v1.mjs --project civweave --domain civweave.cc

      - name: Resolve canonical recovery relay endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' > /tmp/workers-account-subdomain.json
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('/tmp/workers-account-subdomain.json', 'utf8'));
          const subdomain = String(payload?.result?.subdomain || '').trim();
          if (!payload?.success || !/^[a-z0-9-]{1,63}$/i.test(subdomain)) {
            throw new Error(`Could not resolve this Cloudflare account's workers.dev subdomain: ${JSON.stringify(payload?.errors || payload)}`);
          }
          const relay = `https://civweave-recovery-relay.${subdomain}.workers.dev`;
          appendFileSync(process.env.GITHUB_ENV, `RECOVERY_RELAY_URL=${relay}\nWORKERS_ACCOUNT_SUBDOMAIN=${subdomain}\n`);
          console.log(JSON.stringify({ ok: true, recoveryRelay: relay }));
          NODE

      - name: Resolve owned recovery-email zone
        shell: bash
        run: node scripts/resolve-cloudflare-recovery-zone-v1.mjs --output /tmp/civweave-recovery-zone.json

      - name: Provision optional account Worker and starter nodes
        id: provision_account_edge
        continue-on-error: true
        run: >-
          node scripts/provision-cloudflare-account-edge-v1.mjs
          --host-id civweave
          --strict
          --output /tmp/civweave-account-edge.json

      - name: Verify live starter-node dashboards
        if: steps.provision_account_edge.outcome == 'success'
        run: node scripts/verify-cloudflare-account-edge-live-v1.mjs /tmp/civweave-account-edge.json

      - name: Build canonical Pages package
        run: node scripts/build-cloudflare-pages.mjs

      - name: Record canonical host deployment and recovery relay
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          const target = '.cloudflare-pages/app/host-deployment-v1.json';
          let accountEdge;
          try {
            accountEdge = JSON.parse(readFileSync('/tmp/civweave-account-edge.json', 'utf8'));
          } catch {
            accountEdge = {
              schema: 'civweave.cloudflare-account-edge.v1',
              capability: 'worker-plus-three-starter-nodes',
              status: 'pending',
              requiredStarterNodes: 3,
              requiredPermissions: ['Account > Workers Scripts > Edit'],
              accountResourceScope: 'Include the Cloudflare account that owns this host',
            };
          }
          let recoveryZone;
          try { recoveryZone = JSON.parse(readFileSync('/tmp/civweave-recovery-zone.json', 'utf8')); }
          catch { recoveryZone = { status: 'pending', reason: 'recovery-zone-resolution-unavailable' }; }
          mkdirSync('.cloudflare-pages/app', { recursive: true });
          writeFileSync(target, `${JSON.stringify({
            schema: 'civweave.host-deployment.v1',
            role: 'canonical',
            hostId: 'civweave',
            pagesProject: 'civweave',
            pagesOrigin: 'https://civweave.pages.dev',
            publicOrigin: 'https://civweave.cc',
            canonicalOrigin: 'https://civweave.cc',
            accountEdge,
            localAnchorRecommended: true,
            localAnchorRequired: false,
            sourceCommit: process.env.GITHUB_SHA,
            generatedAt: new Date().toISOString(),
          }, null, 2)}\n`, 'utf8');
          writeFileSync('.cloudflare-pages/app/recovery-relay-v1.json', `${JSON.stringify({
            schema: 'civweave.recovery-relay-discovery.v1',
            url: process.env.RECOVERY_RELAY_URL,
            mailbox: process.env.RECOVERY_MAILBOX || null,
            mailboxStatus: recoveryZone.status || 'pending',
            mailboxReason: recoveryZone.reason || null,
            sourceCommit: process.env.GITHUB_SHA,
            generatedAt: new Date().toISOString(),
          }, null, 2)}\n`, 'utf8');
          NODE

      - name: Deploy production Pages project
        shell: bash
        run: |
          set -euo pipefail
          commit_message="$(git log -1 --pretty=%s)"
          npx wrangler pages deploy .cloudflare-pages \
            --project-name civweave \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$commit_message" \
            --commit-dirty=true 2>&1 | tee /tmp/civweave-pages-deploy.log
          grep -Eqi 'https://[^[:space:]]*civweave\.pages\.dev' /tmp/civweave-pages-deploy.log || {
            echo 'Cloudflare reported a deployment outside civweave.pages.dev. Refusing a false-green deploy.'
            cat /tmp/civweave-pages-deploy.log
            exit 3
          }

      - name: Verify stable production origin
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const expectedCommit = process.env.GITHUB_SHA;
          const origin = 'https://civweave.cc';
          const expectedMailbox = process.env.RECOVERY_MAILBOX || null;
          let lastFailure = 'Production marker did not become current.';
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const markerResponse = await fetch(`${origin}/app/host-deployment-v1.json?verify=${encodeURIComponent(expectedCommit)}&attempt=${attempt}`, { headers: { 'Cache-Control': 'no-cache' } });
              if (!markerResponse.ok) throw new Error(`marker HTTP ${markerResponse.status}`);
              const marker = await markerResponse.json();
              const relayResponse = await fetch(`${origin}/app/recovery-relay-v1.json?verify=${encodeURIComponent(expectedCommit)}&attempt=${attempt}`, { headers: { 'Cache-Control': 'no-cache' } });
              if (!relayResponse.ok) throw new Error(`relay discovery HTTP ${relayResponse.status}`);
              const relay = await relayResponse.json();
              if (marker.pagesProject === 'civweave' && marker.pagesOrigin === 'https://civweave.pages.dev' && marker.publicOrigin === origin && marker.canonicalOrigin === origin && marker.sourceCommit === expectedCommit && relay.schema === 'civweave.recovery-relay-discovery.v1' && relay.sourceCommit === expectedCommit && relay.url === process.env.RECOVERY_RELAY_URL && relay.mailbox === expectedMailbox) {
                console.log(`Verified ${origin} at source commit ${expectedCommit} with recovery relay ${relay.url} and mailbox ${relay.mailbox || 'pending-owned-zone'}.`);
                process.exit(0);
              }
              lastFailure = `attempt ${attempt}: marker=${marker.sourceCommit || 'missing'} relay=${relay.sourceCommit || 'missing'} url=${relay.url || 'missing'} mailbox=${relay.mailbox || 'pending'}`;
            } catch (error) {
              lastFailure = `attempt ${attempt}: ${error.message}`;
            }
            if (attempt < 12) await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          console.error(`Stable production verification failed: ${lastFailure}`);
          process.exit(4);
          NODE

      - name: Report optional account-edge provisioning
        if: success() && steps.provision_account_edge.outcome == 'failure'
        shell: bash
        run: |
          echo '::warning::The OG Pages host deployed without the optional account Worker/starter nodes. Add Account > Workers Scripts > Edit to this token to enable that layer; Pages hosting remains online.'
