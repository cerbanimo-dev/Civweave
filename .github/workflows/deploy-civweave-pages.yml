name: Deploy Civweave Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civweave-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy civweave.pages.dev + starter nodes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare secrets are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing repository secret CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing repository secret CLOUDFLARE_ACCOUNT_ID'; exit 2; }

      - name: Refuse the wrong Cloudflare Pages account
        shell: bash
        run: |
          set -euo pipefail
          # Do not use `wrangler whoami` here. Scoped API tokens can deploy
          # Pages/Workers without permission to enumerate user memberships.
          # This account-scoped Pages request is both the auth probe and the
          # project/account-affinity check.
          npx wrangler pages deployment list \
            --project-name civweave \
            --environment production \
            --json > /tmp/civweave-pages-deployments.json
          node scripts/verify-cloudflare-pages-account-target-v1.mjs \
            /tmp/civweave-pages-deployments.json civweave

      - name: Provision account Worker and three starter nodes
        run: >-
          node scripts/provision-cloudflare-account-edge-v1.mjs
          --host-id civweave
          --strict
          --output /tmp/civweave-account-edge.json

      - name: Build canonical Pages package
        run: node scripts/build-cloudflare-pages.mjs

      - name: Record canonical host deployment
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          const target = '.cloudflare-pages/app/host-deployment-v1.json';
          const accountEdge = JSON.parse(readFileSync('/tmp/civweave-account-edge.json', 'utf8'));
          if (accountEdge.status !== 'ready' || accountEdge.starterNodeIds?.length !== 3) {
            throw new Error('Canonical Cloudflare account edge is not fully provisioned.');
          }
          mkdirSync('.cloudflare-pages/app', { recursive: true });
          writeFileSync(target, `${JSON.stringify({
            schema: 'civweave.host-deployment.v1',
            role: 'canonical',
            hostId: 'civweave',
            pagesProject: 'civweave',
            publicOrigin: 'https://civweave.pages.dev',
            canonicalOrigin: 'https://civweave.pages.dev',
            accountEdge,
            localAnchorRecommended: true,
            localAnchorRequired: false,
            sourceCommit: process.env.GITHUB_SHA,
            generatedAt: new Date().toISOString(),
          }, null, 2)}\n`, 'utf8');
          NODE

      - name: Deploy production Pages project
        shell: bash
        run: |
          set -euo pipefail
          commit_message="$(git log -1 --pretty=%s)"
          npx wrangler pages deploy .cloudflare-pages \
            --project-name civweave \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$commit_message" \
            --commit-dirty=true 2>&1 | tee /tmp/civweave-pages-deploy.log
          grep -Eqi 'https://[^[:space:]]*civweave\.pages\.dev' /tmp/civweave-pages-deploy.log || {
            echo 'Cloudflare reported a deployment outside civweave.pages.dev. Refusing a false-green deploy.'
            cat /tmp/civweave-pages-deploy.log
            exit 3
          }
