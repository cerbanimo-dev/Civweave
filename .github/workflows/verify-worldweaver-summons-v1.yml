name: Verify Worldweaver summon and call controls

on:
  pull_request:
    paths:
      - 'public/app/shared/worldweaver-summon-*.mjs'
      - 'public/app/shared/worldweaver-hand-gestures-v1.mjs'
      - 'public/app/starling-lounge-v1.mjs'
      - 'scripts/test-worldweaver-summons-v1.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check public/app/shared/worldweaver-summon-v1.mjs
      - run: node --check public/app/shared/worldweaver-summon-ui-v1.mjs
      - run: node --check public/app/shared/worldweaver-hand-gestures-v1.mjs
      - run: node --check public/app/starling-lounge-v1.mjs
      - run: node --test scripts/test-worldweaver-summons-v1.mjs
