name: Verify Living School freeze v196

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  reader-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse freeze repair
        run: |
          node --check public/app/cabinets/living-school/living-school-mutation-guard-v196.js
          node --check public/app/cabinets/living-school/living-school-two-agent-relay-v165.js
          node --check public/app/cabinets/living-school/living-school-paths-v213.js
          node --check public/app/cabinets/living-school/living-school-interactions-v213.js
          node --check public/app/cabinets/living-school/living-school-flat-loader-v213.js
          node --check public/service-worker-v156.js
          node --check public/app/pwa-v130.js
          node --check scripts/verify-living-school-freeze-v196.mjs
      - name: Verify reader mutation loop is cut
        run: node scripts/verify-living-school-freeze-v196.mjs
