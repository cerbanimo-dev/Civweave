name: Verify Living School freeze v196

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: write

jobs:
  prelaunch-materialize:
    if: github.ref == 'refs/heads/agent/prelaunch-repo-discipline' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/prelaunch-repo-discipline
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Materialize prelaunch discipline pass
        run: |
          set -euo pipefail
          node scripts/migrations/prelaunch-repo-discipline-v2.mjs
          node scripts/sync-release-version-assets.mjs
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          rm -f .github/workflows/materialize-prelaunch-repo-discipline.yml
          rm -f ops/triggers/prelaunch-repo-discipline.trigger
          git show origin/main:.github/workflows/verify-living-school-freeze-v196.yml > .github/workflows/verify-living-school-freeze-v196.yml
          sed -i 's#actions/checkout@v4#actions/checkout@v5#g; s#actions/setup-node@v4#actions/setup-node@v5#g' .github/workflows/verify-living-school-freeze-v196.yml
          node scripts/verify-release-contract.mjs
          node scripts/verify-root-hygiene.mjs
          node scripts/verify-version-policy.mjs --self-test
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Harden prelaunch repository discipline'
          git push origin HEAD:agent/prelaunch-repo-discipline
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Run repository checks
        run: npm run check

  reader-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Parse freeze repair
        run: |
          node --check public/app/cabinets/living-school/living-school-mutation-guard-v196.js
          node --check public/app/cabinets/living-school/living-school-two-agent-relay-v165.js
          node --check public/app/cabinets/living-school/living-school-paths-v213.js
          node --check public/app/cabinets/living-school/living-school-interactions-v213.js
          node --check public/app/cabinets/living-school/living-school-flat-loader-v213.js
          node --check public/service-worker-v156.js
          node --check public/app/pwa-v130.js
          node --check scripts/verify-living-school-freeze-v196.mjs
      - name: Verify reader mutation loop is cut
        run: node scripts/verify-living-school-freeze-v196.mjs
