name: Materialize Reload Settings v294 Temp

on:
  push:
    branches: [fix/reload-ai-settings-v294]

permissions:
  contents: write

concurrency:
  group: materialize-reload-settings-v294-temp
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/reload-ai-settings-v294
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Align package release version
        shell: bash
        run: npm pkg set "version=$(tr -d '[:space:]' < VERSION)"
      - name: Materialize canonical release
        run: node scripts/materialize-canonical-release.mjs
      - name: Commit generated release state
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'Canonical release is already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize canonical Civweave 1.0.95 release'
          git push origin HEAD:fix/reload-ai-settings-v294
