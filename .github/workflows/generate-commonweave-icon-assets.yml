name: Generate Commonweave icon assets

on:
  push:
    branches:
      - fix/smollm2-benchmark-contract-and-icon
    paths:
      - scripts/generate-commonweave-icons.mjs
      - .github/workflows/generate-commonweave-icon-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message || '', 'Generate dark Commonweave icon assets') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/smollm2-benchmark-contract-and-icon
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install image generator only
        run: npm install --no-save --no-package-lock --ignore-scripts sharp@0.35.3
      - name: Generate dark icon family
        run: node scripts/generate-commonweave-icons.mjs
      - name: Verify generated PWA icons
        run: |
          test -s public/app/logos/commonweave-icon-192.png
          test -s public/app/logos/commonweave-icon-512.png
          test -s public/app/logos/commonweave-icon-maskable-192.png
          test -s public/app/logos/commonweave-icon-maskable-512.png
          file public/app/logos/commonweave-icon-192.png | grep -q '192 x 192'
          file public/app/logos/commonweave-icon-512.png | grep -q '512 x 512'
          grep -q 'dark-centered-thread-mark' public/app/logos/commonweave-icon-generation.json
      - name: Commit generated icon assets
        run: |
          git config user.name 'commonweave-asset-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/app/logos/commonweave-*.png public/app/logos/commonweave-icon-generation.json
          if git diff --cached --quiet; then
            echo 'Icon assets already match the generator.'
            exit 0
          fi
          git commit -m 'Generate dark Commonweave icon assets [skip ci]'
          git push origin HEAD:fix/smollm2-benchmark-contract-and-icon
