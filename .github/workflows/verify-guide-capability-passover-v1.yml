name: Verify Guide Capability Passover

on:
  pull_request:
    paths:
      - 'public/app/guide-capability-passover-v1.js'
      - 'public/app/guide-chat-response-integrity-v1.js'
      - 'public/app/unified-chat-system-v1.js'
      - 'public/app/shared-guide-surface-v236.js'
      - 'public/app/shared-guide-surface-v236-core-v244.js'
      - 'public/app/guide-chat-surface-v350.js'
      - 'public/app/guide-workspace-v242.js'
      - 'public/app/guide-identity-integrity-v216.js'
      - 'public/app/new-user-onboarding-v1.js'
      - 'public/app/assets/ai/profiles.json'
      - 'config/guide-artifact-language-v1.json'
      - 'docs/contracts/guide-artifact-language-v1.md'
      - 'docs/architecture/systems-of-practice.md'
      - 'scripts/verify-guide-capability-passover-v1.mjs'
      - 'scripts/verify-guide-chat-response-integrity-v1.mjs'
      - '.github/workflows/verify-guide-capability-passover-v1.yml'
  push:
    branches: ['**']
    paths:
      - 'public/app/guide-capability-passover-v1.js'
      - 'public/app/guide-chat-response-integrity-v1.js'
      - 'public/app/unified-chat-system-v1.js'
      - 'public/app/shared-guide-surface-v236.js'
      - 'public/app/shared-guide-surface-v236-core-v244.js'
      - 'public/app/guide-chat-surface-v350.js'
      - 'public/app/guide-workspace-v242.js'
      - 'public/app/guide-identity-integrity-v216.js'
      - 'public/app/new-user-onboarding-v1.js'
      - 'public/app/assets/ai/profiles.json'
      - 'config/guide-artifact-language-v1.json'
      - 'docs/contracts/guide-artifact-language-v1.md'
      - 'docs/architecture/systems-of-practice.md'
      - 'scripts/verify-guide-capability-passover-v1.mjs'
      - 'scripts/verify-guide-chat-response-integrity-v1.mjs'
      - '.github/workflows/verify-guide-capability-passover-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check canonical guide runtime syntax
        run: |
          node --check public/app/guide-capability-passover-v1.js
          node --check public/app/guide-chat-response-integrity-v1.js
          node --check public/app/guide-chat-surface-v350.js
          node --check public/app/shared-guide-surface-v236.js
          node --check public/app/shared-guide-surface-v236-core-v244.js
          node --check public/app/guide-identity-integrity-v216.js
          node --check public/app/new-user-onboarding-v1.js
          node --check scripts/verify-guide-capability-passover-v1.mjs
          node --check scripts/verify-guide-chat-response-integrity-v1.mjs
      - name: Verify canonical guide artifact ownership and passover
        run: node scripts/verify-guide-capability-passover-v1.mjs
      - name: Verify guide chat response integrity
        run: node scripts/verify-guide-chat-response-integrity-v1.mjs
