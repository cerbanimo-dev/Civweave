name: Verify Worldweaver Core
on:
  pull_request:
    paths:
      - 'public/app/shared/worldweaver-core-v1.mjs'
      - 'public/app/shared/worldweaver-screen-v1.mjs'
      - 'public/app/shared/worldweaver-map-2d-v1.mjs'
      - 'public/app/shared/worldweaver-opensim-geometry-v1.mjs'
      - 'public/app/shared/worldweaver-3d-preview-v1.mjs'
      - 'public/app/shared/worldweaver-visual-scene-v1.mjs'
      - 'public/app/tools/worldweaver-geometry-lab.html'
      - 'public/app/tools/worldweaver-geometry-lab-v1.mjs'
      - 'scripts/test-worldweaver-opensim-geometry-v1.mjs'
      - 'scripts/test-worldweaver-map-2d-v1.mjs'
      - 'public/app/tools/worldweaver-map-lab.html'
      - 'public/app/tools/worldweaver-map-lab-v1.mjs'
      - 'public/app/shared/worldweaver-lab-draft-v1.mjs'
      - 'public/app/shared/worldweaver-lab-media-v1.mjs'
      - 'scripts/test-worldweaver-labs-hardening-v1.mjs'
      - 'scripts/test-worldweaver-screens-v1.mjs'
      - 'public/app/tools/worldweaver-screen-lab.html'
      - 'public/app/tools/worldweaver-screen-lab-v1.mjs'
      - 'scripts/test-worldweaver-core-v1.mjs'
      - 'scripts/test-worldweaver-avatar-rigs-v1.mjs'
      - 'public/app/shared/worldweaver-avatar-v1.mjs'
      - 'public/app/shared/worldweaver-avatar-pilot-v1.mjs'
      - 'public/app/shared/worldweaver-starling-bridge-v1.mjs'
      - 'public/app/tools/worldweaver-avatar-lab.html'
      - 'public/app/tools/worldweaver-avatar-lab-v1.mjs'
      - 'config/system-ownership.json'
      - 'docs/contracts/worldweaver-microspaces-v1.md'
      - '.github/workflows/verify-worldweaver-core.yml'
  push:
    branches: [staging]
    paths:
      - 'public/app/shared/worldweaver-core-v1.mjs'
      - 'scripts/test-worldweaver-core-v1.mjs'
      - 'config/system-ownership.json'
      - 'docs/contracts/worldweaver-microspaces-v1.md'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check public/app/shared/worldweaver-core-v1.mjs && node --check public/app/shared/worldweaver-opensim-geometry-v1.mjs && node --check public/app/shared/worldweaver-3d-preview-v1.mjs && node --check public/app/shared/worldweaver-visual-scene-v1.mjs && node --check public/app/tools/worldweaver-geometry-lab-v1.mjs && node --check public/app/shared/worldweaver-map-2d-v1.mjs && node --check public/app/tools/worldweaver-map-lab-v1.mjs && node --check public/app/shared/worldweaver-screen-v1.mjs && node --check public/app/tools/worldweaver-screen-lab-v1.mjs && node --check public/app/tools/worldweaver-avatar-lab-v1.mjs
      - run: npm run test:worldweaver
