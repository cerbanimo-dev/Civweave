name: One-shot Settings release v316

on:
  push:
    branches:
      - 'agent/fix-settings-freeze-v316'
    paths:
      - '.github/workflows/one-shot-settings-release-v316.yml'
      - 'VERSION'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fix-settings-freeze-v316
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Materialize Civweave 1.0.125 once
        shell: bash
        run: |
          set -euo pipefail
          current="$(tr -d '[:space:]' < VERSION)"
          if [ "$current" != "1.0.124" ]; then
            echo "Release already advanced to $current; nothing to do."
            exit 0
          fi
          printf '1.0.125\n' > VERSION
          node - <<'NODE'
          const fs=require('node:fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.version='1.0.125';
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          const contract=JSON.parse(fs.readFileSync('config/release-contract.json','utf8'));
          contract.canonical.current={version:'1.0.125',path:'releases/1.0.125',status:'current'};
          fs.writeFileSync('config/release-contract.json',JSON.stringify(contract,null,2)+'\n');
          NODE
          node scripts/materialize-canonical-release.mjs
          node scripts/sync-release-coherence-v220.mjs
          node scripts/build-service-worker-v211.mjs
          node scripts/generate-prelive-metadata-v281.mjs
          node scripts/verify-release-version-sync.mjs
          node scripts/verify-canonical-launch-release.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION package.json config/release-contract.json public releases/1.0.125
          if git diff --cached --quiet; then
            echo 'No release changes to commit.'
            exit 0
          fi
          git commit -m 'Bump Civweave to 1.0.125 for Settings freeze repair'
          git push origin HEAD:agent/fix-settings-freeze-v316
