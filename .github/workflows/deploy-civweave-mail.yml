name: Deploy Civweave Mail

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/mail/**'
      - 'cloudflare/account-edge/src/recovery-entry-v11.mjs'
      - 'cloudflare/account-edge/wrangler.jsonc'
      - 'scripts/test-civweave-mail-v1.mjs'
      - '.github/workflows/deploy-civweave-mail.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civweave-mail-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MAIL_ZONE: civweave.cc
      MAIL_BUCKET: civweave-mail-blobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned mail parser
        run: npm install --prefix cloudflare/mail --ignore-scripts --no-audit --no-fund

      - name: Verify production mail contracts
        run: node scripts/test-civweave-mail-v1.mjs

      - name: Resolve owned mail zone and protect existing MX
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 2; }
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const api='https://api.cloudflare.com/client/v4';
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const zoneName=process.env.MAIL_ZONE;
          const headers={Authorization:`Bearer ${token}`,'Content-Type':'application/json'};
          async function cf(path){const r=await fetch(api+path,{headers});const p=await r.json().catch(()=>({}));if(!r.ok||p.success!==true)throw new Error(`${path}: ${JSON.stringify(p.errors||p)}`);return p.result}
          const zones=await cf(`/zones?name=${encodeURIComponent(zoneName)}&account.id=${encodeURIComponent(account)}&status=active&per_page=50`);
          if(!Array.isArray(zones)||zones.length!==1)throw new Error(`Expected exactly one active owned ${zoneName} zone; found ${Array.isArray(zones)?zones.length:0}.`);
          const zoneId=zones[0].id;
          const mx=await cf(`/zones/${zoneId}/dns_records?type=MX&name=${encodeURIComponent(zoneName)}&per_page=100`);
          const foreign=(mx||[]).filter(record=>!String(record.content||'').toLowerCase().endsWith('.mx.cloudflare.net'));
          if(foreign.length)throw new Error(`Refusing to replace existing non-Cloudflare MX records: ${foreign.map(r=>r.content).join(', ')}`);
          appendFileSync(process.env.GITHUB_ENV,`MAIL_ZONE_ID=${zoneId}\n`);
          console.log(JSON.stringify({ok:true,zone:zoneName,zoneId,existingMx:(mx||[]).map(r=>r.content)}));
          NODE

      - name: Ensure private raw-mail R2 bucket
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const api='https://api.cloudflare.com/client/v4';
          const token=process.env.CLOUDFLARE_API_TOKEN, account=process.env.CLOUDFLARE_ACCOUNT_ID, bucket=process.env.MAIL_BUCKET;
          const headers={Authorization:`Bearer ${token}`,'Content-Type':'application/json'};
          let response=await fetch(`${api}/accounts/${account}/r2/buckets/${bucket}`,{headers});
          if(response.status===404){
            response=await fetch(`${api}/accounts/${account}/r2/buckets`,{method:'POST',headers,body:JSON.stringify({name:bucket,storageClass:'Standard'})});
          }
          const payload=await response.json().catch(()=>({}));
          if(!response.ok)throw new Error(`R2 bucket provisioning failed: ${JSON.stringify(payload.errors||payload)}`);
          console.log(JSON.stringify({ok:true,bucket,private:true}));
          NODE

      - name: Deploy Hub mail claim verifier first
        run: npx --yes wrangler@latest deploy --config cloudflare/account-edge/wrangler.jsonc

      - name: Deploy Civweave Mail Worker and custom domain
        run: npx --yes wrangler@latest deploy --config cloudflare/mail/wrangler.jsonc

      - name: Enable apex Email Routing and route catch-all to Mail
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const api='https://api.cloudflare.com/client/v4';
          const token=process.env.CLOUDFLARE_API_TOKEN, zoneId=process.env.MAIL_ZONE_ID, zoneName=process.env.MAIL_ZONE;
          const headers={Authorization:`Bearer ${token}`,'Content-Type':'application/json'};
          async function request(path,init={},allow404=false){
            const r=await fetch(api+path,{...init,headers:{...headers,...(init.headers||{})}});const p=await r.json().catch(()=>({}));
            if(allow404&&r.status===404)return {r,p};
            if(!r.ok||p.success!==true)throw new Error(`${path}: ${JSON.stringify(p.errors||p)}`);return {r,p};
          }
          const state=await request(`/zones/${zoneId}/email/routing/dns`,{},true);
          const text=JSON.stringify(state.p?.result||{});
          if(state.r.status===404||state.p?.success!==true||!text.includes(zoneName)){
            await request(`/zones/${zoneId}/email/routing/dns`,{method:'POST',body:JSON.stringify({name:zoneName})});
          }
          const body={name:'Civweave Mail catch-all',enabled:true,matchers:[{type:'all'}],actions:[{type:'worker',value:['civweave-mail']}],source:'api'};
          const saved=await request(`/zones/${zoneId}/email/routing/rules/catch_all`,{method:'PUT',body:JSON.stringify(body)});
          const rule=saved.p.result;
          if(rule?.enabled!==true||!(rule.actions||[]).some(action=>action.type==='worker'&&(action.value||[]).includes('civweave-mail')))throw new Error('Civweave Mail catch-all did not become active.');
          console.log(JSON.stringify({ok:true,zone:zoneName,catchAllWorker:'civweave-mail',ruleId:rule.id||null}));
          NODE

      - name: Probe live Civweave Mail
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 2 --retry-all-errors https://mail.civweave.cc/api/health | tee /tmp/mail-health.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const packet=JSON.parse(readFileSync('/tmp/mail-health.json','utf8'));
          if(packet.ok!==true||packet.schema!=='civweave.mail.v2'||packet.domain!=='civweave.cc'||packet.internalDelivery!==true)throw new Error(`Unexpected mail health: ${JSON.stringify(packet)}`);
          console.log(JSON.stringify(packet));
          NODE
