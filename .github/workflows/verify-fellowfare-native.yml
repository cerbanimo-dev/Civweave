name: Verify FellowFare Native

on:
  pull_request:
    paths:
      - 'public/app/fellowfare-cabinet-v144.html'
      - 'public/app/fellowfare-native-v208.css'
      - 'public/app/fellowfare-native-scroll-v208.js'
      - 'scripts/verify-fellowfare-native-v208.mjs'
      - 'scripts/verify-fellowfare-active-v203.mjs'
      - '.github/workflows/verify-fellowfare-native.yml'
  push:
    branches: [main]
    paths:
      - 'public/app/fellowfare-cabinet-v144.html'
      - 'public/app/fellowfare-native-v208.css'
      - 'public/app/fellowfare-native-scroll-v208.js'
      - 'scripts/verify-fellowfare-native-v208.mjs'
      - 'scripts/verify-fellowfare-active-v203.mjs'
      - '.github/workflows/verify-fellowfare-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check native runtime syntax
        run: |
          node --check public/app/fellowfare-native-scroll-v208.js
          node --check scripts/verify-fellowfare-native-v208.mjs
          node --check scripts/verify-fellowfare-active-v203.mjs
      - name: Verify current FellowFare native contract
        run: |
          node scripts/verify-fellowfare-native-v208.mjs
          node scripts/verify-fellowfare-active-v203.mjs
