name: Apply Living School Structured Output v254

on:
  push:
    branches:
      - fix/living-school-structured-output-v254

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply structured-output repair
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const runtimePath='public/app/shared/civweave-model-runtime.js';
          let runtime=fs.readFileSync(runtimePath,'utf8');
          const repairedLine='          const repaired = await invokeAdapter({ ...config, stream: false }, repairMessages(messages, outputText, validationErrors), { ...request, maxRepairAttempts: 0 }, context, controller.signal);';
          const replacement=[
            '          const finishReason = safeString(raw?.payload?.candidates?.[0]?.finishReason || raw?.payload?.finishReason || "", 80).toUpperCase();',
            '          const truncated = ["MAX_TOKENS", "MAX_OUTPUT_TOKENS"].includes(finishReason);',
            '          const repairConfig = truncated',
            '            ? { ...config, stream: false, maxTokens: Math.min(65536, Math.max(config.maxTokens * 2, 16384)) }',
            '            : { ...config, stream: false };',
            '          if (truncated) emit(context, "repairing", { attempt: repairAttempts, reason: "structured-output-truncated", finishReason, maxTokens: repairConfig.maxTokens });',
            '          const repaired = await invokeAdapter(repairConfig, repairMessages(messages, outputText, validationErrors), { ...request, maxRepairAttempts: 0 }, context, controller.signal);',
          ].join('\n');
          if(!runtime.includes(repairedLine)) throw new Error('Shared model runtime repair call did not match expected main.');
          runtime=runtime.replace(repairedLine,replacement);
          fs.writeFileSync(runtimePath,runtime);

          const livingPath='public/app/cabinets/living-school/living-school-cleanroom-core-v218.mjs';
          let living=fs.readFileSync(livingPath,'utf8');
          const oldCall="    const result=await runtime.generate({purpose:'living-school-research-grounded-curriculum-v218.1',executionProfile:'interactive',config,schema:curriculumSchema(),context:";
          const newCall="    const curriculumConfig={...config,maxTokens:Math.max(Number(config.maxTokens)||0,16384),temperature:Math.min(Number(config.temperature)||0.2,0.3)};\n    const result=await runtime.generate({purpose:'living-school-research-grounded-curriculum-v218.1',executionProfile:'interactive',config:curriculumConfig,schema:curriculumSchema(),context:";
          if(!living.includes(oldCall)) throw new Error('Living School curriculum model call did not match expected main.');
          living=living.replace(oldCall,newCall);
          fs.writeFileSync(livingPath,living);

          fs.writeFileSync('scripts/verify-structured-output-repair-v254.mjs',`import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const runtime=fs.readFileSync(new URL('../public/app/shared/civweave-model-runtime.js',import.meta.url),'utf8');
          const living=fs.readFileSync(new URL('../public/app/cabinets/living-school/living-school-cleanroom-core-v218.mjs',import.meta.url),'utf8');

          assert.match(runtime,/responseMimeType: "application\\/json"/, 'Gemini structured calls must request JSON MIME mode.');
          assert.match(runtime,/responseJsonSchema: schema/, 'Gemini structured calls must attach the sanitized JSON schema when accepted.');
          assert.match(runtime,/function stripCodeFence\\(text\\)/, 'Structured output must retain conservative fenced-JSON cleanup.');
          assert.match(runtime,/function firstBalancedJson\\(text\\)/, 'Structured output must retain bounded JSON extraction.');
          assert.match(runtime,/request\\.maxRepairAttempts \\?\\? 1/, 'Structured output must default to one corrective retry.');
          assert.match(runtime,/\\["MAX_TOKENS", "MAX_OUTPUT_TOKENS"\\]\\.includes\\(finishReason\\)/, 'Structured repair must recognize provider truncation.');
          assert.match(runtime,/Math\\.max\\(config\\.maxTokens \\* 2, 16384\\)/, 'A truncated structured repair must receive a larger bounded output budget.');
          assert.match(runtime,/reason: "structured-output-truncated"/, 'Truncation repair must be observable in runtime events.');
          assert.match(living,/required:\\['title','capability','proof','modules'\\]/, 'Living School curriculum schema must remain strict.');
          assert.match(living,/maxTokens:Math\\.max\\(Number\\(config\\.maxTokens\\)\\|\\|0,16384\\)/, 'Living School full curriculum generation must reserve enough structured-output budget.');
          assert.match(living,/config:curriculumConfig,schema:curriculumSchema\\(\\)/, 'Living School must use the larger curriculum budget without bypassing its schema.');

          console.log('Structured Output Repair v254: JSON mode, strict schema, fenced extraction, one bounded repair, and truncation-aware curriculum budget verified.');
          `);

          fs.writeFileSync('.github/workflows/verify-structured-output-repair-v254.yml',`name: Verify Structured Output Repair v254

          on:
            pull_request:
              paths:
                - 'public/app/shared/civweave-model-runtime.js'
                - 'public/app/cabinets/living-school/living-school-cleanroom-core-v218.mjs'
                - 'scripts/verify-structured-output-repair-v254.mjs'
                - '.github/workflows/verify-structured-output-repair-v254.yml'
            push:
              branches: [main]
              paths:
                - 'public/app/shared/civweave-model-runtime.js'
                - 'public/app/cabinets/living-school/living-school-cleanroom-core-v218.mjs'
                - 'scripts/verify-structured-output-repair-v254.mjs'
                - '.github/workflows/verify-structured-output-repair-v254.yml'

          jobs:
            verify:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                - run: node --check public/app/shared/civweave-model-runtime.js
                - run: node --check public/app/cabinets/living-school/living-school-cleanroom-core-v218.mjs
                - run: node scripts/verify-structured-output-repair-v254.mjs
                - run: node scripts/verify-living-school-cleanroom-v218.mjs
          `);

          fs.writeFileSync('VERSION','1.0.50\n');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.version='1.0.50';
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          NODE
      - name: Materialize release identity
        run: |
          node scripts/sync-release-version-assets.mjs
          node scripts/sync-release-coherence-v220.mjs
      - name: Verify focused contracts
        run: |
          node --check public/app/shared/civweave-model-runtime.js
          node --check public/app/cabinets/living-school/living-school-cleanroom-core-v218.mjs
          node scripts/verify-structured-output-repair-v254.mjs
          node scripts/verify-living-school-cleanroom-v218.mjs
          node scripts/verify-release-version-sync.mjs
          node scripts/verify-release-coherence-v220.mjs
          node scripts/verify-chat-convergence-v250.mjs
          git diff --check
      - name: Commit materialized repair
        run: |
          rm .github/workflows/apply-living-school-structured-output-v254.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix truncated Living School structured curriculum output'
          git push origin HEAD:fix/living-school-structured-output-v254
