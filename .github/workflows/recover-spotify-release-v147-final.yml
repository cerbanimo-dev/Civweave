name: Recover Spotify release v147 final

on:
  push:
    branches:
      - agent/spotify-playlist-track-links-v2
    paths:
      - '.github/workflows/recover-spotify-release-v147-final.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/spotify-playlist-track-links-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch v251 metadata and bump 1.0.47
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          old="v240-local-station-directory-random-pull-labels"
          new="v241-playlist-context-track-links"
          for name in ["public/app/install-boundary-v146.js","scripts/verify-five-system-navigation-v227.mjs","scripts/verify-canonical-core-only-v226.mjs"]:
              p=Path(name); text=p.read_text(); count=text.count(old)
              if count != 1: raise SystemExit(f"{name}: expected one old radio marker, found {count}")
              p.write_text(text.replace(old,new,1))

          p=Path("scripts/sync-release-coherence-v220.mjs")
          text=p.read_text()
          fix="source=replaceRequired(source,/version:'\\d+\\.\\d+\\.\\d+-chat-convergence-v250'/,`version:'${version}-chat-convergence-v250'`,'installed entry exported release version');"
          if fix not in text:
              anchor="source=replaceRequired(source,/const FALLBACK_VERSION='\\d+\\.\\d+\\.\\d+';/,`const FALLBACK_VERSION='${version}';`,'installed entry fallback release version');"
              if text.count(anchor) != 1: raise SystemExit("release-coherence installed-entry anchor missing")
              p.write_text(text.replace(anchor,anchor+"\n  "+fix,1))

          Path("VERSION").write_text("1.0.47\n")
          p=Path("package.json"); text=p.read_text()
          text,count=re.subn(r'(\"version\"\s*:\s*\")\d+\.\d+\.\d+(\")',r'\g<1>1.0.47\2',text,count=1)
          if count != 1: raise SystemExit("package version replacement failed")
          p.write_text(text)
          PY
      - name: Materialize release
        run: |
          set -euo pipefail
          node scripts/sync-release-version-assets.mjs
          node scripts/sync-release-coherence-v220.mjs
      - name: Verify
        run: |
          set -euo pipefail
          node --check public/app/radio-track-suggestions-v240.js
          node --check scripts/sync-radio-track-map-v241.mjs
          node --check scripts/verify-system-radio-v233.mjs
          node scripts/verify-system-radio-v233.mjs
          node scripts/verify-five-system-navigation-v227.mjs
          node scripts/verify-canonical-core-only-v226.mjs
          node scripts/verify-chat-convergence-v250.mjs
          git diff --check
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/recover-spotify-release-v147-final.yml .github/workflows/recover-spotify-playlist-context-v147.yml
          git commit -m "Restore Spotify playlist-context track links for Civweave 1.0.47"
          git push
