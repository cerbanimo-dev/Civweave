name: Verify Settings Open Inertness
on:
  push:
    branches: [staging]
    paths:
      - 'public/app/settings-gateway-v317.js'
      - 'scripts/verify-settings-open-inert-v321.mjs'
      - '.github/workflows/verify-settings-open-inert-v321.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-settings-open-inert-v321.mjs
