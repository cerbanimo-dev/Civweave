name: Verify recovery and asset lockboard v239

on:
  pull_request:
    paths:
      - 'public/service-worker-v203.js'
      - 'public/service-worker-offline-v211-override.js'
      - 'public/app/required-campus-autostart-v1.js'
      - 'public/app/working-campus-v156.js'
      - 'public/app/asset-lockboard-v239.*'
      - 'public/app/asset-customization-v239.js'
      - 'public/app/install-boundary-v146.js'
      - 'public/app/core-interface-runtime-v1.js'
      - 'scripts/generate-asset-lockboard-catalog-v239.mjs'
      - 'scripts/verify-recovery-asset-lockboard-v239.mjs'
      - '.github/workflows/verify-recovery-asset-lockboard-v239.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-recovery-asset-lockboard-v239.mjs
