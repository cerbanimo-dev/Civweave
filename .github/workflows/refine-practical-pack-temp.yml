name: Refine Practical Pack Temp

on:
  push:
    branches:
      - agent/general-knowledge-video-packs-v1
    paths:
      - .github/workflows/refine-practical-pack-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Refine Practical Life pack
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('config/open-learning-media-packs-v1.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          pack=next(p for p in data['packs'] if p['slug']=='practical-life')
          pack['topics']=['personal-finance','cooking-food-safety','health-wellness','computing-basics','statistics-data-literacy']
          pack['description']='Everyday competence for money, food safety, health, computing basics, and understanding data.'
          path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          PY
          python - <<'PY'
          import json
          data=json.load(open('config/open-learning-media-packs-v1.json'))
          pack=next(p for p in data['packs'] if p['slug']=='practical-life')
          assert pack['topics']==['personal-finance','cooking-food-safety','health-wellness','computing-basics','statistics-data-literacy']
          assert any(t['slug']=='emergency-preparedness' for t in data['topics'])
          PY
      - name: Commit pack refinement
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/open-learning-media-packs-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refine Practical Life media pack coverage'
          git pull --rebase origin agent/general-knowledge-video-packs-v1
          git push origin HEAD:agent/general-knowledge-video-packs-v1
