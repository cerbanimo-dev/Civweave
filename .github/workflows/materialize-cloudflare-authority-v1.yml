name: Materialize Cloudflare Authority 1.0.98

on:
  push:
    branches:
      - launch/cloudflare-authority-v1
    paths:
      - '.github/workflows/materialize-cloudflare-authority-v1.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: launch/cloudflare-authority-v1
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Stamp 1.0.98
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.writeFileSync('VERSION', '1.0.98\n');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.version='1.0.98';
          fs.writeFileSync('package.json', JSON.stringify(pkg,null,2)+'\n');
          const contract=JSON.parse(fs.readFileSync('config/release-contract.json','utf8'));
          contract.canonical.current={version:'1.0.98',path:'releases/1.0.98',status:'current'};
          fs.writeFileSync('config/release-contract.json', JSON.stringify(contract,null,2)+'\n');
          NODE
      - name: Materialize canonical release
        run: node scripts/materialize-canonical-release.mjs
      - name: Verify authority and canonical release
        run: |
          node scripts/verify-cloudflare-launch-kit-v1.mjs
          node scripts/verify-canonical-launch-release.mjs
          node scripts/verify-release-contract.mjs
      - name: Commit materialized release and remove one-shot workflow
        run: |
          git config user.name 'cerbanimo-dev'
          git config user.email 'cerbanimo@gmail.com'
          git rm .github/workflows/materialize-cloudflare-authority-v1.yml
          git add -A
          git commit -m 'Civweave 1.0.98: materialize Cloudflare authority release'
          git push origin HEAD:launch/cloudflare-authority-v1
