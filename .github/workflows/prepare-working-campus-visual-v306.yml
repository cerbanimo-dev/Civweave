name: Prepare Working Campus Visual Release v306

on:
  push:
    branches:
      - fix/working-campus-visual-v306
    paths:
      - '.github/workflows/prepare-working-campus-visual-v306.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/working-campus-visual-v306
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Advance Civweave to 1.0.118
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version='1.0.118';
          fs.writeFileSync('VERSION',`${version}\n`);
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.version=version;
          fs.writeFileSync('package.json',`${JSON.stringify(pkg,null,2)}\n`);
          const contract=JSON.parse(fs.readFileSync('config/release-contract.json','utf8'));
          contract.canonical.current={version,path:`releases/${version}`,status:'current'};
          fs.writeFileSync('config/release-contract.json',`${JSON.stringify(contract,null,2)}\n`);
          NODE
      - name: Materialize canonical 1.0.118 release
        run: node scripts/materialize-canonical-release.mjs
      - name: Remove one-time preparation workflow
        run: rm .github/workflows/prepare-working-campus-visual-v306.yml
      - name: Commit synchronized release
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Materialize Civweave 1.0.118 Working Campus visual release'
          git push origin HEAD:fix/working-campus-visual-v306
