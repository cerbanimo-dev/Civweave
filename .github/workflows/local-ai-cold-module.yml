name: Verify cold local AI module

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/app/local-ai/**'
      - 'public/app/models/**'
      - 'scripts/stage-transformers-assets.mjs'
      - '.github/workflows/local-ai-cold-module.yml'
  push:
    branches: [main]
    paths:
      - 'public/app/local-ai/**'
      - 'public/app/models/**'
      - 'scripts/stage-transformers-assets.mjs'
      - '.github/workflows/local-ai-cold-module.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check the optional local model runtime
        run: |
          for file in public/app/local-ai/*.js; do node --check "$file"; done
          node --check scripts/stage-transformers-assets.mjs
