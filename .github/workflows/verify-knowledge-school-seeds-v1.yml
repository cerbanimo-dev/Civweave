name: Verify optional knowledge school seeds

on:
  pull_request:
    paths:
      - public/downloads/knowledge-schools/**
      - public/app/knowledge-school-**
      - public/app/pwa-update-controller-v204.js
      - public/app/install-boundary-v146.js
      - public/install-v130.js
      - public/index.html
      - public/service-worker-v203.js
      - public/service-worker-update-v204.js
      - scripts/verify-knowledge-school-seeds-v1.mjs
      - .github/workflows/verify-knowledge-school-seeds-v1.yml
  push:
    branches:
      - agent/fix-updates-and-library-staging
    paths:
      - public/downloads/knowledge-schools/**
      - public/app/knowledge-school-**
      - public/app/pwa-update-controller-v204.js
      - public/app/install-boundary-v146.js
      - public/install-v130.js
      - public/index.html
      - public/service-worker-v203.js
      - public/service-worker-update-v204.js
      - scripts/verify-knowledge-school-seeds-v1.mjs
      - .github/workflows/verify-knowledge-school-seeds-v1.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify scripts, update controls, and optional asset boundaries
        run: |
          node --check public/app/knowledge-school-seeds-v1.js
          node --check public/app/knowledge-school-installer-v1.js
          node --check public/app/pwa-update-controller-v204.js
          node --check public/app/install-boundary-v146.js
          node --check public/install-v130.js
          node --check public/service-worker-v203.js
          node --check public/service-worker-update-v204.js
          node --check scripts/verify-knowledge-school-seeds-v1.mjs
          python -m py_compile public/downloads/knowledge-schools/batch_unpack_schools.py
          node scripts/verify-knowledge-school-seeds-v1.mjs
