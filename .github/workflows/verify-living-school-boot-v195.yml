name: Verify Living School boot v195

on:
  push:
    branches: [main]
    paths:
      - 'public/app/cabinets/living-school/**'
      - 'public/app/services/living-school/**'
      - 'public/app/themed-system-nav-v178.js'
      - 'public/service-worker-v156.js'
      - 'public/app/pwa-v130.js'
      - 'scripts/verify-living-school-boot-v195.mjs'
      - '.github/workflows/verify-living-school-boot-v195.yml'
  pull_request:
    paths:
      - 'public/app/cabinets/living-school/**'
      - 'public/app/services/living-school/**'
      - 'public/app/themed-system-nav-v178.js'
      - 'public/service-worker-v156.js'
      - 'public/app/pwa-v130.js'
      - 'scripts/verify-living-school-boot-v195.mjs'
      - '.github/workflows/verify-living-school-boot-v195.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: living-school-boot-v195-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  living-school-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Parse Living School runtime
        run: |
          node --check public/app/cabinets/living-school/living-school-bootstrap-v194.js
          node --check public/app/cabinets/living-school/living-school-cabinet-v151.mjs
          node --check public/app/services/living-school/modules/rubric-engine.mjs
          node --check public/app/services/living-school/modules/project-gate.mjs
          node --check public/app/services/living-school/modules/cerbanimo-bridge.mjs
          node --check public/app/themed-system-nav-v178.js
          node --check public/service-worker-v156.js
          node --check public/app/pwa-v130.js
      - name: Verify non-blocking startup and navigation
        run: node scripts/verify-living-school-boot-v195.mjs
