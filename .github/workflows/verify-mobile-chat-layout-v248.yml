name: Verify Mobile Chat + Layout v248

on:
  pull_request:
    paths:
      - 'VERSION'
      - 'package.json'
      - 'public/app/chat-single-owner-v245.js'
      - 'public/app/persistent-guide-viewport-v216.js'
      - 'public/app/guide-workspace-v242.js'
      - 'public/app/working-campus-topbar-v243.js'
      - 'public/app/working-campus-v156.css'
      - 'public/app/working-campus-v156.html'
      - 'public/service-worker-chat-repair-v245.js'
      - 'public/service-worker-v203.js'
      - 'scripts/verify-mobile-chat-layout-v248.mjs'
      - '.github/workflows/verify-mobile-chat-layout-v248.yml'
  workflow_dispatch:

jobs:
  verify-mobile-chat-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check changed runtimes
        run: |
          node --check public/app/chat-single-owner-v245.js
          node --check public/app/persistent-guide-viewport-v216.js
          node --check public/app/guide-workspace-v242.js
          node --check public/app/working-campus-topbar-v243.js
          node --check public/service-worker-chat-repair-v245.js
          node --check public/service-worker-v203.js
      - name: Verify mobile chat and viewport contract
        run: node scripts/verify-mobile-chat-layout-v248.mjs
