name: Verify Guide Stream Thinking

on:
  push:
    branches: [main, 'fix/weaveling-stream-thinking-v249-r2']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify streamed thinking chat behavior
        run: node scripts/verify-guide-stream-thinking-v249.mjs
