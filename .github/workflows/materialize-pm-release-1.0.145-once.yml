name: Materialize Civweave 1.0.145 once

on:
  push:
    branches: [feat/civweave-pm-mail-feedback-v2]
    paths:
      - '.github/workflows/materialize-pm-release-1.0.145-once.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/civweave-pm-mail-feedback-v2
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Materialize canonical 1.0.145 release
        shell: bash
        run: |
          set -euo pipefail
          printf '1.0.145\n' > VERSION
          npm version 1.0.145 --no-git-tag-version
          node scripts/materialize-canonical-release.mjs
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path='config/release-contract.json';
          const packet=JSON.parse(await readFile(path,'utf8'));
          packet.canonical.current={version:'1.0.145',path:'releases/1.0.145',status:'current'};
          await writeFile(path,JSON.stringify(packet,null,2)+'\n');
          NODE
          rm .github/workflows/materialize-pm-release-1.0.145-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize Civweave 1.0.145'
          git push origin HEAD:feat/civweave-pm-mail-feedback-v2
