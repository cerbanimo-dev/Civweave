name: Enrich Video Atlas Ephemeral Temp

on:
  push:
    branches:
      - agent/video-learning-atlas-v1
    paths:
      - .github/workflows/enrich-video-atlas-ephemeral-temp.yml

permissions:
  contents: write

concurrency:
  group: video-atlas-ephemeral-enrichment
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/video-learning-atlas-v1
          fetch-depth: 0

      - name: Generate one-run public key
        run: |
          set -euo pipefail
          PRIVATE="$RUNNER_TEMP/video-atlas-ephemeral-private.pem"
          PUBLIC="$RUNNER_TEMP/video-atlas-ephemeral-public.pem"
          PUBFILE=".video-atlas-ephemeral-public-${GITHUB_RUN_ID}.txt"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$PRIVATE" 2>/dev/null
          openssl pkey -in "$PRIVATE" -pubout -out "$PUBLIC" 2>/dev/null
          chmod 600 "$PRIVATE"
          {
            printf 'VIDEO_ATLAS_EPHEMERAL_PUBLIC_KEY:%s:' "$GITHUB_RUN_ID"
            base64 -w0 < "$PUBLIC"
            printf '\n'
          } > "$PUBFILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$PUBFILE"
          git commit -m "Publish ephemeral Video Atlas public key ${GITHUB_RUN_ID}"
          git push origin HEAD:agent/video-learning-atlas-v1

      - name: Receive encrypted key and enrich atlas
        run: |
          set -euo pipefail
          PRIVATE="$RUNNER_TEMP/video-atlas-ephemeral-private.pem"
          CIPHER="$RUNNER_TEMP/video-atlas-ephemeral-key.bin"
          KEYFILE="$RUNNER_TEMP/video-atlas-ephemeral-key.txt"
          CIPHERTEXT_FILE=".video-atlas-ephemeral-ciphertext-${GITHUB_RUN_ID}.txt"
          trap 'rm -f "$PRIVATE" "$CIPHER" "$KEYFILE"' EXIT
          CIPHERTEXT=''
          for attempt in $(seq 1 120); do
            git fetch --quiet origin agent/video-learning-atlas-v1
            CIPHERTEXT="$(git show "origin/agent/video-learning-atlas-v1:${CIPHERTEXT_FILE}" 2>/dev/null || true)"
            if [ -n "$CIPHERTEXT" ]; then break; fi
            sleep 5
          done
          if [ -z "$CIPHERTEXT" ]; then
            echo 'No encrypted API credential arrived before the one-run handshake expired.' >&2
            exit 1
          fi
          printf '%s' "$CIPHERTEXT" | base64 -d > "$CIPHER"
          openssl pkeyutl -decrypt \
            -inkey "$PRIVATE" \
            -in "$CIPHER" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out "$KEYFILE"
          YOUTUBE_API_KEY="$(cat "$KEYFILE")"
          echo "::add-mask::${YOUTUBE_API_KEY}"
          if ! printf '%s' "$YOUTUBE_API_KEY" | grep -Eq '^AIza[0-9A-Za-z_-]{30,}$'; then
            echo 'Decrypted credential does not look like a Google API key.' >&2
            exit 1
          fi
          YOUTUBE_API_KEY="$YOUTUBE_API_KEY" python scripts/enrich-video-learning-atlas-youtube-v1.py

      - name: Validate, remove handshake files, and commit enrichment
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, json, pathlib
          root=pathlib.Path('public/downloads/knowledge-schools/video-atlases')
          catalog=json.loads((root/'catalog.json').read_text())
          meta=catalog.get('youtube_metadata_sidecar') or {}
          enrichment=catalog.get('youtube_api_enrichment') or {}
          assert enrichment.get('status') == 'success'
          sidecar=root/meta['file']
          assert sidecar.exists() and sidecar.stat().st_size == meta['bytes']
          payload=json.loads(gzip.decompress(sidecar.read_bytes()))
          assert payload['schema']=='civweave.youtube-api-metadata-sidecar.v1'
          assert len(payload['records']) == meta['records'] == enrichment['returned_video_ids']
          assert payload['requested_video_ids'] == enrichment['requested_video_ids']
          print(json.dumps({'records':meta['records'],'requested':enrichment['requested_video_ids'],'missing':enrichment['missing_or_unavailable_video_ids'],'bytes':meta['bytes'],'expires_at':meta['expires_at']}, indent=2))
          PY
          git stash push --include-untracked -m "video-atlas-enrichment-${GITHUB_RUN_ID}" -- \
            public/downloads/knowledge-schools/video-atlases/youtube-metadata-current.json.gz \
            public/downloads/knowledge-schools/video-atlases/catalog.json \
            public/downloads/knowledge-schools/video-atlases/SHA256SUMS
          git fetch origin agent/video-learning-atlas-v1
          git rebase origin/agent/video-learning-atlas-v1
          git stash pop
          git rm -f ".video-atlas-ephemeral-public-${GITHUB_RUN_ID}.txt" ".video-atlas-ephemeral-ciphertext-${GITHUB_RUN_ID}.txt"
          git add public/downloads/knowledge-schools/video-atlases/youtube-metadata-current.json.gz \
                  public/downloads/knowledge-schools/video-atlases/catalog.json \
                  public/downloads/knowledge-schools/video-atlases/SHA256SUMS
          git commit -m 'Enrich Video Learning Atlas with current YouTube metadata'
          git push origin HEAD:agent/video-learning-atlas-v1
