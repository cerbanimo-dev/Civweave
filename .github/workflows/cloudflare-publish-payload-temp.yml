name: Cloudflare Publish Payload Temp

on:
  push:
    branches:
      - fix/cloudflare-publish-payload-v1
    paths:
      - .github/workflows/cloudflare-publish-payload-temp.yml

permissions:
  contents: read

env:
  PAYLOAD_PROFILE_REVISION: external-schools-v1

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build production Pages tree
        run: node scripts/build-cloudflare-pages.mjs
      - name: Verify runtime and external school contract
        run: |
          set -euo pipefail
          node scripts/verify-local-model-download-v267.mjs
          node scripts/verify-cloudflare-portable-zip-v185.mjs
          node scripts/verify-cloudflare-deploy-discipline.mjs
          node --check public/app/knowledge-school-seeds-v1.js
          test -f .cloudflare-pages/app/vendor/transformers/transformers.min.js
          test -f .cloudflare-pages/app/vendor/transformers/wasm/ort-wasm-simd-threaded.jsep.wasm
          test ! -f .cloudflare-pages/app/vendor/transformers/ort-wasm-simd-threaded.jsep.wasm
          test -f .cloudflare-pages/app/vendor/transformers-v4/transformers.min.js
          test ! -d .cloudflare-pages/downloads/knowledge-schools/schools
          python - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          catalog=json.loads(Path('.cloudflare-pages/downloads/knowledge-schools/catalog.json').read_text())
          assert catalog['download_policy']['mode']=='external-immutable-zips'
          assert catalog['download_policy']['checksum_required'] is True
          assert catalog['download_policy']['pages_carries_zip_bytes'] is False
          assert len(catalog['schools'])==11
          school=next(s for s in catalog['schools'] if s['school_slug']=='mathematics')
          url=school['download_url']
          assert url.startswith('https://raw.githubusercontent.com/cerbanimo-dev/Civweave/')
          req=urllib.request.Request(url,headers={'User-Agent':'Civweave-payload-verifier'})
          with urllib.request.urlopen(req,timeout=60) as response:
              data=response.read()
              cors=response.headers.get('access-control-allow-origin','')
              print('SCHOOL_SOURCE_STATUS',response.status)
              print('SCHOOL_SOURCE_CORS',cors)
              print('SCHOOL_SOURCE_BYTES',len(data))
              assert response.status==200
              assert cors=='*'
          assert len(data)==int(school['zip_bytes'])
          assert hashlib.sha256(data).hexdigest()==school['zip_sha256']
          print('SCHOOL_SOURCE_SHA256_OK',school['school_slug'])
          PY
      - name: Measure publish payload
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.cloudflare-pages')
          files=[p for p in root.rglob('*') if p.is_file()]
          total=sum(p.stat().st_size for p in files)
          print('TOTAL_BYTES',total)
          print('FILE_COUNT',len(files))
          for group in ['app','downloads','app/vendor','app/services','app/assets','app/federation-finder-data','downloads/knowledge-schools']:
              base=root/group
              subset=[p for p in base.rglob('*') if p.is_file()] if base.exists() else []
              print('GROUP',group,sum(p.stat().st_size for p in subset),len(subset))
          print('TOP_FILES')
          for p in sorted(files,key=lambda p:p.stat().st_size,reverse=True)[:40]:
              print(p.stat().st_size,p.relative_to(root))
          PY
