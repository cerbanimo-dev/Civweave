name: Cloudflare Publish Payload Temp

on:
  push:
    branches:
      - fix/cloudflare-publish-payload-v1
    paths:
      - .github/workflows/cloudflare-publish-payload-temp.yml

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build production Pages tree
        run: node scripts/build-cloudflare-pages.mjs
      - name: Measure publish payload
        run: |
          set -euo pipefail
          echo '--- total ---'
          du -sb .cloudflare-pages
          find .cloudflare-pages -type f | wc -l
          echo '--- top level ---'
          du -sb .cloudflare-pages/* | sort -nr | head -30
          echo '--- app children ---'
          du -sb .cloudflare-pages/app/* | sort -nr | head -40
          echo '--- downloads children ---'
          du -sb .cloudflare-pages/downloads/* | sort -nr | head -50
          echo '--- largest files ---'
          find .cloudflare-pages -type f -printf '%s %p\n' | sort -nr | head -60
