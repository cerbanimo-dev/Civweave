name: Verify Gemini Credential Usability v192

on:
  pull_request:
    paths:
      - 'public/app/model-settings-controller-v173.js'
      - 'public/app/shared/civweave-model-runtime.js'
      - 'public/extensions/civweave-device-credentials-v160.js'
      - 'public/service-worker-v156.js'
      - 'scripts/verify-credential-usable-v192.mjs'
      - '.github/workflows/verify-credential-usable-v192.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check credential bridge
        run: |
          node --check public/extensions/civweave-device-credentials-v160.js
          node --check scripts/verify-credential-usable-v192.mjs
      - name: Verify remembered Gemini key remains usable
        run: node scripts/verify-credential-usable-v192.mjs
