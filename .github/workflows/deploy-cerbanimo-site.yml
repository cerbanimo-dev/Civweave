name: Deploy Cerbanimo public site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerbanimo-cc-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy cerbanimo.cc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: cerbanimo-cc
      PUBLIC_DOMAIN: cerbanimo.cc

    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing repository secret CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing repository secret CLOUDFLARE_ACCOUNT_ID'; exit 2; }

      - name: Build flagship and Pages-mirror package
        shell: bash
        run: |
          set -euo pipefail
          node site/cerbanimo-cc/build.mjs \
            --output .cerbanimo-pages \
            --base / \
            --role flagship \
            --public-origin "https://${PUBLIC_DOMAIN}" \
            --pages-origin "https://${PAGES_PROJECT}.pages.dev"

      - name: Ensure Cloudflare Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const account = encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID);
          const project = process.env.PAGES_PROJECT;
          const headers = {
            Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
            'Content-Type': 'application/json'
          };
          const base = `https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects`;
          const lookup = await fetch(`${base}/${encodeURIComponent(project)}`, { headers });
          if (lookup.status === 404) {
            const created = await fetch(base, {
              method: 'POST',
              headers,
              body: JSON.stringify({ name: project, production_branch: 'main' })
            });
            const packet = await created.json().catch(() => ({}));
            if (!created.ok || packet.success !== true) {
              throw new Error(`Could not create Cloudflare Pages project ${project}: ${JSON.stringify(packet.errors || packet)}`);
            }
            console.log(`Created Cloudflare Pages project ${project}.`);
            process.exit(0);
          }
          const packet = await lookup.json().catch(() => ({}));
          if (!lookup.ok || packet.success !== true || packet.result?.name !== project) {
            throw new Error(`Could not access Cloudflare Pages project ${project}: ${JSON.stringify(packet.errors || packet)}`);
          }
          console.log(`Cloudflare Pages project ${project} is ready.`);
          NODE

      - name: Deploy production Pages project
        shell: bash
        run: |
          set -euo pipefail
          commit_message="$(git log -1 --pretty=%s)"
          npx --yes wrangler@4 pages deploy .cerbanimo-pages \
            --project-name "$PAGES_PROJECT" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$commit_message" \
            --commit-dirty=true 2>&1 | tee /tmp/cerbanimo-pages-deploy.log
          grep -Eqi 'https://[^[:space:]]*\.pages\.dev' /tmp/cerbanimo-pages-deploy.log || {
            echo 'Cloudflare did not report a Pages deployment URL.'
            cat /tmp/cerbanimo-pages-deploy.log
            exit 3
          }

      - name: Ensure custom domain is attached through Pages
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const account = encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID);
          const project = encodeURIComponent(process.env.PAGES_PROJECT);
          const domain = process.env.PUBLIC_DOMAIN;
          const headers = {
            Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
            'Content-Type': 'application/json'
          };
          const base = `https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects/${project}/domains`;
          const endpoint = `${base}/${encodeURIComponent(domain)}`;
          const request = async (url, options = {}) => {
            const response = await fetch(url, { headers, ...options });
            const packet = await response.json().catch(() => ({}));
            return { response, packet };
          };
          let { response, packet } = await request(endpoint);
          if (response.status === 404) {
            ({ response, packet } = await request(base, {
              method: 'POST',
              headers,
              body: JSON.stringify({ name: domain })
            }));
            if (!response.ok || packet.success !== true) {
              throw new Error(`Could not attach ${domain} through Pages: ${JSON.stringify(packet.errors || packet)}`);
            }
            console.log(`Attached ${domain} to ${process.env.PAGES_PROJECT} through the Pages API.`);
          } else if (!response.ok || packet.success !== true) {
            throw new Error(`Could not inspect Pages domain ${domain}: ${JSON.stringify(packet.errors || packet)}`);
          }
          const status = packet.result?.status || 'pending';
          if (status !== 'active') {
            const retried = await request(endpoint, { method: 'PATCH' });
            if (!retried.response.ok || retried.packet.success !== true) {
              throw new Error(`Could not retry Pages validation for ${domain}: ${JSON.stringify(retried.packet.errors || retried.packet)}`);
            }
            console.log(`Pages domain ${domain} is ${status}; validation retry requested.`);
          } else {
            console.log(`Pages domain ${domain} is active.`);
          }
          NODE

      - name: Verify both public origins and story surface
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const account = encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID);
          const project = encodeURIComponent(process.env.PAGES_PROJECT);
          const domain = process.env.PUBLIC_DOMAIN;
          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` };
          const domainEndpoint = `https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects/${project}/domains/${encodeURIComponent(domain)}`;
          const expectedCommit = process.env.GITHUB_SHA;

          async function verify(origin) {
            let failure = 'site did not become current';
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                const bust = `${Date.now()}-${attempt}`;
                const [pageResponse, historyResponse, surfaceResponse] = await Promise.all([
                  fetch(`${origin}/?verify=${bust}`, { headers: { 'Cache-Control': 'no-cache' } }),
                  fetch(`${origin}/history.json?verify=${bust}`, { headers: { 'Cache-Control': 'no-cache' } }),
                  fetch(`${origin}/surface.json?verify=${bust}`, { headers: { 'Cache-Control': 'no-cache' } })
                ]);
                if (!pageResponse.ok) throw new Error(`page HTTP ${pageResponse.status}`);
                if (!historyResponse.ok) throw new Error(`history HTTP ${historyResponse.status}`);
                if (!surfaceResponse.ok) throw new Error(`surface HTTP ${surfaceResponse.status}`);
                const html = await pageResponse.text();
                const history = await historyResponse.json();
                const surface = await surfaceResponse.json();
                if (!html.includes('Civweave | Cerbanimo')) throw new Error('public page marker missing');
                if (!html.includes('id="story"')) throw new Error('story section missing');
                if (history.latestCommit !== expectedCommit) throw new Error(`history is at ${history.latestCommit || 'missing'}, expected ${expectedCommit}`);
                if (!Number.isSafeInteger(history.commitCount) || history.commitCount < 1) throw new Error('commit counter is invalid');
                if (!history.initialCommitDate) throw new Error('initial commit date is missing');
                if (surface.role !== 'flagship' || surface.basePath !== '/') throw new Error('flagship surface marker is invalid');
                console.log(`Verified ${origin}/#story at ${history.latestCommit} with ${history.commitCount} commits since ${history.initialCommitDate}.`);
                return history;
              } catch (error) {
                failure = `attempt ${attempt}: ${error.message}`;
              }
              if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 3000));
            }
            throw new Error(`Verification failed for ${origin}: ${failure}`);
          }

          await verify(`https://${process.env.PAGES_PROJECT}.pages.dev`);

          const statusResponse = await fetch(domainEndpoint, { headers });
          const statusPacket = await statusResponse.json().catch(() => ({}));
          if (statusResponse.ok && statusPacket.success === true && statusPacket.result?.status === 'active') {
            await verify(`https://${domain}`);
          } else {
            console.log(`Custom domain ${domain} is still validating; the first-class Pages origin remains verified and live.`);
          }
          NODE
