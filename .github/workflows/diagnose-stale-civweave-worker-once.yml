name: Diagnose stale civweave Worker once

on:
  push:
    branches:
      - agent/launch-readiness-hardening-v1
    paths:
      - .github/workflows/diagnose-stale-civweave-worker-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect civweave Worker and Builds trigger
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 2; }
          node --input-type=module <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const headers={Authorization:`Bearer ${token}`};
          const get=async path=>{
            const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}${path}`,{headers});
            const payload=await response.json().catch(()=>({}));
            if(!response.ok||payload.success!==true){
              console.log(JSON.stringify({ok:false,path,status:response.status,errors:payload.errors||[]},null,2));
              process.exit(3);
            }
            return payload.result;
          };
          const scripts=await get('/workers/scripts');
          const worker=(Array.isArray(scripts)?scripts:[]).find(item=>item?.id==='civweave');
          if(!worker){
            console.log(JSON.stringify({ok:true,worker:'civweave',exists:false,conclusion:'no-obsolete-worker-found'},null,2));
            process.exit(0);
          }
          const tag=worker.tag;
          const triggers=await get(`/builds/workers/${encodeURIComponent(tag)}/triggers`);
          const builds=await get(`/builds/workers/${encodeURIComponent(tag)}/builds?page=1&per_page=5`);
          const safeTriggers=(Array.isArray(triggers)?triggers:[]).map(trigger=>({
            trigger_uuid:trigger.trigger_uuid,
            trigger_name:trigger.trigger_name,
            root_directory:trigger.root_directory,
            branch_includes:trigger.branch_includes,
            branch_excludes:trigger.branch_excludes,
            path_includes:trigger.path_includes,
            path_excludes:trigger.path_excludes,
            build_command:trigger.build_command,
            deploy_command:trigger.deploy_command,
            repo_name:trigger.repo_name,
            provider_type:trigger.provider_type,
            external_script_id:trigger.external_script_id
          }));
          const safeBuilds=(Array.isArray(builds)?builds:[]).slice(0,5).map(build=>({
            build_uuid:build.build_uuid,
            status:build.status,
            outcome:build.build_outcome,
            created_on:build.created_on,
            branch:build.build_trigger_metadata?.branch,
            commit_hash:build.build_trigger_metadata?.commit_hash,
            root_directory:build.build_trigger_metadata?.root_directory,
            build_command:build.build_trigger_metadata?.build_command,
            deploy_command:build.build_trigger_metadata?.deploy_command,
            repo_name:build.build_trigger_metadata?.repo_name
          }));
          console.log(JSON.stringify({
            ok:true,
            worker:'civweave',
            exists:true,
            workerTag:tag,
            triggerCount:safeTriggers.length,
            triggers:safeTriggers,
            recentBuilds:safeBuilds,
            expectedCanonicalProjects:['civweave-node-cloud','civweave-host-edge','civweave-core','civweave-recovery-relay'],
            note:'The repository root wrangler.jsonc is a Pages config; cloudflare/node-cloud is named civweave-node-cloud.'
          },null,2));
          NODE
