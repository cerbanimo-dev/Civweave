name: Diagnose stale civweave Worker once

on:
  push:
    branches:
      - agent/launch-readiness-hardening-v1
    paths:
      - .github/workflows/diagnose-stale-civweave-worker-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Compare canonical account with external ghost build
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 2; }
          node --input-type=module <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const externalBuildAccount='06ec4e5fd210bb047505cc7e6e0be6fd';
          const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts`,{headers:{Authorization:`Bearer ${token}`}});
          const payload=await response.json().catch(()=>({}));
          if(!response.ok||payload.success!==true){
            console.log(JSON.stringify({ok:false,status:response.status,errors:payload.errors||[]},null,2));
            process.exit(3);
          }
          const ids=(Array.isArray(payload.result)?payload.result:[]).map(item=>String(item?.id||'')).filter(Boolean).sort();
          console.log(JSON.stringify({
            ok:true,
            canonicalAccountMatchesExternalBuildAccount:account===externalBuildAccount,
            ghostWorkerExistsInCanonicalAccount:ids.includes('civweave'),
            canonicalWorkerIds:ids,
            expectedWorkerIds:['civweave-core','civweave-host-edge','civweave-node-cloud','civweave-recovery-relay']
          },null,2));
          NODE
