name: Add Open Mapping Geography Seed Temp

on:
  push:
    branches:
      - agent/general-knowledge-video-packs-v1
    paths:
      - .github/workflows/add-open-mapping-geography-seed-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Strengthen geography map vocabulary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          registry_path=Path('config/open-learning-media-packs-v1.json')
          data=json.loads(registry_path.read_text(encoding='utf-8'))
          geo=next(t for t in data['topics'] if t['slug']=='earth-geography')
          geo['aliases']=list(dict.fromkeys([*(geo.get('aliases') or []),'maps','mapping','geospatial']))
          geo['concepts']=list(dict.fromkeys([*(geo.get('concepts') or []),'cartography','geospatial data']))
          registry_path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          assert {'maps','mapping','geospatial'} <= set(geo['aliases'])
          PY
      - name: Commit geography vocabulary
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/open-learning-media-packs-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Recognize open mapping geography media'
          git pull --rebase origin agent/general-knowledge-video-packs-v1
          git push origin HEAD:agent/general-knowledge-video-packs-v1
