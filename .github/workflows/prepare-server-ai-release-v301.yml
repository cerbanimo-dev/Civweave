name: Prepare Server AI Release v301

on:
  push:
    branches:
      - feature/server-ai-commerce-entry-v1
    paths:
      - '.github/workflows/prepare-server-ai-release-v301.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/server-ai-commerce-entry-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Advance Civweave to 1.0.116 and cache server AI controls
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = '1.0.116';
          fs.writeFileSync('VERSION', `${version}\n`);

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = version;
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);

          const contract = JSON.parse(fs.readFileSync('config/release-contract.json', 'utf8'));
          contract.canonical.current = { version, path: `releases/${version}`, status: 'current' };
          fs.writeFileSync('config/release-contract.json', `${JSON.stringify(contract, null, 2)}\n`);

          for (const path of [
            'public/app/server-ai-router-v301.js',
            'public/app/server-ai-settings-v301.js',
            'public/app/fast-interactive-runtime-v192.js',
            'public/app/node-ai-mesh-v1.js'
          ]) {
            const source = fs.readFileSync(path, 'utf8').replaceAll('1.0.115', version);
            fs.writeFileSync(path, source);
          }

          const offlinePath = 'public/app/offline-package-v208.json';
          const offline = JSON.parse(fs.readFileSync(offlinePath, 'utf8'));
          for (const asset of ['/app/server-ai-router-v301.js', '/app/server-ai-settings-v301.js']) {
            if (!offline.assets.includes(asset)) offline.assets.push(asset);
          }
          fs.writeFileSync(offlinePath, `${JSON.stringify(offline, null, 2)}\n`);
          NODE
      - name: Materialize canonical 1.0.116 release
        run: node scripts/materialize-canonical-release.mjs
      - name: Remove one-time preparation workflow
        run: rm .github/workflows/prepare-server-ai-release-v301.yml
      - name: Commit synchronized release
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Materialize Civweave 1.0.116 server AI release'
          git push origin HEAD:feature/server-ai-commerce-entry-v1
