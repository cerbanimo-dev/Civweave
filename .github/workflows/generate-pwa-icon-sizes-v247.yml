name: Generate PWA icon sizes v247

on:
  push:
    branches:
      - fix/pwa-real-192-icon-v247

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pwa-real-192-icon-v247
          fetch-depth: 0
      - name: Generate clean true-size Civweave PNG icons
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick pngcrush
          source=public/app/logos/civweave-canonical.png
          clean=/tmp/civweave-canonical-clean.png
          pngcrush -q -fix "$source" "$clean"
          mv "$clean" "$source"
          for path in public/app/logos/civweave-icon-*.png; do
            name="$(basename "$path")"
            if [[ "$name" =~ ^civweave-icon-([0-9]+)\.png$ ]]; then
              size="${BASH_REMATCH[1]}"
              convert "$source" -filter Lanczos -resize "${size}x${size}!" "$path"
            fi
          done
          convert "$source" -filter Lanczos -resize '512x512!' public/app/logos/civweave-icon-maskable-512.png
          python3 - <<'PY'
          from pathlib import Path
          import struct,zlib

          def verify_png(path, expected=None):
              data=Path(path).read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{path}: not a PNG')
              width,height=struct.unpack('>II',data[16:24])
              if expected and (width,height)!=(expected,expected):
                  raise SystemExit(f'{path}: expected {expected}x{expected}, got {width}x{height}')
              pos=8
              while pos+12<=len(data):
                  length=struct.unpack('>I',data[pos:pos+4])[0]
                  ctype=data[pos+4:pos+8]
                  payload=data[pos+8:pos+8+length]
                  crc=struct.unpack('>I',data[pos+8+length:pos+12+length])[0]
                  actual=zlib.crc32(ctype)
                  actual=zlib.crc32(payload,actual)&0xffffffff
                  if crc!=actual:
                      raise SystemExit(f'{path}: bad CRC in {ctype.decode("latin1")} chunk')
                  pos+=12+length
                  if ctype==b'IEND': break
              return width,height

          verify_png('public/app/logos/civweave-canonical.png',512)
          verify_png('public/app/logos/civweave-icon-maskable-512.png',512)
          for path in Path('public/app/logos').glob('civweave-icon-*.png'):
              stem=path.stem.removeprefix('civweave-icon-')
              if stem.isdigit(): verify_png(path,int(stem))
          PY
      - name: Commit generated icon family
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "civweave-icon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/app/logos/civweave-canonical.png public/app/logos/civweave-icon-*.png
          if git diff --cached --quiet; then
            echo "No icon changes needed."
            exit 0
          fi
          git commit -m "Generate valid true-size Civweave PWA icons"
          git push origin HEAD:fix/pwa-real-192-icon-v247
