name: Verify Weaveling AI-only Quest Authority

on:
  push:
    paths:
      - 'public/app/working-campus-v156.part5.txt'
      - 'public/app/weaveling-plan-materialization-v265.js'
      - 'public/extensions/civweave-weaveling-plan-json-v190.js'
      - 'public/app/intention-planner-v141.js'
      - 'public/app/guide-forward-failure-policy-v1.js'
      - 'public/app/guide-forward-failure-hardening-v1.js'
      - 'public/service-worker-local-ai-coherence-v307.js'
      - 'public/service-worker-v203.js'
      - 'public/service-worker.js'
      - 'public/service-worker-v156.js'
      - 'scripts/verify-weaveling-ai-quest-authority-v1.mjs'
      - '.github/workflows/verify-weaveling-ai-quest-authority-v1.yml'
  pull_request:
    paths:
      - 'public/app/working-campus-v156.part5.txt'
      - 'public/app/weaveling-plan-materialization-v265.js'
      - 'public/extensions/civweave-weaveling-plan-json-v190.js'
      - 'public/app/intention-planner-v141.js'
      - 'public/app/guide-forward-failure-policy-v1.js'
      - 'public/app/guide-forward-failure-hardening-v1.js'
      - 'public/service-worker-local-ai-coherence-v307.js'
      - 'public/service-worker-v203.js'
      - 'public/service-worker.js'
      - 'public/service-worker-v156.js'
      - 'scripts/verify-weaveling-ai-quest-authority-v1.mjs'
      - '.github/workflows/verify-weaveling-ai-quest-authority-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify AI-only Quest authority
        run: node scripts/verify-weaveling-ai-quest-authority-v1.mjs
