name: Verify Expressive Avatar Runtime v346

on:
  pull_request:
    paths:
      - 'Civweave-weaveling-sprites.png'
      - 'Living-School-moss-sprites.png'
      - 'Cerbanimo-kamiya-sprites.png'
      - 'FellowFare-rook-sprites.png'
      - 'Anarchadia-merlin-sprites.png'
      - 'public/Civweave-weaveling-sprites.png'
      - 'public/Living-School-moss-sprites.png'
      - 'public/Cerbanimo-kamiya-sprites.png'
      - 'public/FellowFare-rook-sprites.png'
      - 'public/Anarchadia-merlin-sprites.png'
      - 'public/app/avatar-expression-director-v345.js'
      - 'public/app/shared-chat-face-icons-v255.js'
      - 'public/app/shared-guide-surface-v236.js'
      - 'public/app/minilm-context-router-v344.js'
      - 'public/service-worker-chat-repair-v245.js'
      - 'public/service-worker-v203.js'
      - 'scripts/build-service-worker-v211.mjs'
      - 'scripts/verify-avatar-expression-director-v343.mjs'
      - '.github/workflows/verify-avatar-runtime-v346.yml'
  push:
    branches: [main]
    paths:
      - 'public/app/avatar-expression-director-v345.js'
      - 'public/app/shared-chat-face-icons-v255.js'
      - 'public/app/shared-guide-surface-v236.js'
      - 'public/app/minilm-context-router-v344.js'
      - 'public/service-worker-chat-repair-v245.js'
      - 'public/service-worker-v203.js'
      - 'public/*-sprites.png'
      - 'scripts/verify-avatar-expression-director-v343.mjs'

permissions:
  contents: read

jobs:
  verify-avatar-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify lossless sprites, boot expressions, MiniLM lamp, and cache rotation
        run: node scripts/verify-avatar-expression-director-v343.mjs
