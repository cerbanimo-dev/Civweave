name: Fix Geography Title Anchor Temp

on:
  push:
    branches:
      - agent/general-knowledge-video-packs-v1
    paths:
      - .github/workflows/fix-geography-title-anchor-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Accept singular and plural map teaching titles
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/filter-open-learning-media-title-quality-v1.py')
          text=path.read_text(encoding='utf-8')
          old='"earth-geography": r"\\b(?:geograph|map\\b|mapping|latitude|longitude|landform|contour|topograph|cartograph)",'
          new='"earth-geography": r"\\b(?:geograph|maps?\\b|mapping|latitude|longitude|landform|contour|topograph|cartograph)",'
          if new not in text:
              if old not in text:
                  raise SystemExit('geography anchor not found')
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
          python -m py_compile scripts/filter-open-learning-media-title-quality-v1.py
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('q','scripts/filter-open-learning-media-title-quality-v1.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          pattern=mod.COMPILED['earth-geography']
          assert pattern.search('O-Train Lesson 9: Generate and use O&M location maps')
          assert not pattern.search('OpenRefine Geography Recon Workshop') is None
          assert pattern.search('Physical geography lecture')
          PY
      - name: Commit geography title anchor
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/filter-open-learning-media-title-quality-v1.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Accept plural map titles in geography gate'
          git pull --rebase origin agent/general-knowledge-video-packs-v1
          git push origin HEAD:agent/general-knowledge-video-packs-v1
