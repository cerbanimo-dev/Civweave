name: Materialize Connect Release Once

on:
  push:
    branches: [payments/connect-configurable-accounts-v1]
    paths:
      - '.github/workflows/materialize-connect-release-once.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: payments/connect-configurable-accounts-v1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Materialize canonical release from reconciled main
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          rm -rf "releases/$version"
          node scripts/materialize-canonical-release.mjs
          node scripts/verify-canonical-launch-release.mjs
      - name: Commit generated assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION package.json config/release-contract.json releases/ public/ scripts/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Materialize reconciled Civweave 1.0.93 assets"
          git push origin HEAD:payments/connect-configurable-accounts-v1
