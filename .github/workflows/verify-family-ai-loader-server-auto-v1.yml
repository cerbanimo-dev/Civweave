name: Verify Family AI Server-Auto Loader

on:
  pull_request:
    paths:
      - 'public/app/family-ai-loader-v105.js'
      - 'public/app/server-ai-router-v301.js'
      - 'public/app/fast-interactive-runtime-v192.js'
      - 'public/app/cabinets/living-school/living-school-cleanroom-core-v218.mjs'
      - 'scripts/verify-family-ai-loader-server-auto-v1.mjs'
      - '.github/workflows/verify-family-ai-loader-server-auto-v1.yml'
  push:
    branches: ['**']
    paths:
      - 'public/app/family-ai-loader-v105.js'
      - 'public/app/server-ai-router-v301.js'
      - 'public/app/fast-interactive-runtime-v192.js'
      - 'public/app/cabinets/living-school/living-school-cleanroom-core-v218.mjs'
      - 'scripts/verify-family-ai-loader-server-auto-v1.mjs'
      - '.github/workflows/verify-family-ai-loader-server-auto-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-family-ai-server-auto-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check loader and verifier syntax
        run: |
          node --check public/app/family-ai-loader-v105.js
          node --check public/app/server-ai-router-v301.js
          node --check public/app/fast-interactive-runtime-v192.js
          node --check scripts/verify-family-ai-loader-server-auto-v1.mjs
      - name: Verify shared server-auto loader contract
        run: node scripts/verify-family-ai-loader-server-auto-v1.mjs
