name: Verify hosted AI staging wallet v1

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  staging-wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse staging wallet runtime
        run: |
          node --check lib/ai-wallet-staging-v1.mjs
          node --check scripts/grant-ai-wallet-staging-credit-v1.mjs
          node --check scripts/test-ai-wallet-staging-v1.mjs
          node --check public/ai-wallet-preview-v1.js
          node --check server-gateway-v131.mjs
      - name: Exercise staging wallet loop
        run: node --test scripts/test-ai-wallet-staging-v1.mjs
