name: Verify ESCO skill crosswalk v1

on:
  pull_request:
    paths:
      - 'public/app/shared/skill-crosswalk-v1.mjs'
      - 'public/app/cerbanimo-learning-packs-v1.js'
      - 'public/app/living-school-learning-packs-v1.mjs'
      - 'public/downloads/learning-packs/catalog.json'
      - 'public/downloads/learning-packs/esco-skill-crosswalk-v1.json.gz'
      - 'scripts/build-esco-crosswalk-v1.mjs'
      - 'scripts/verify-esco-crosswalk-v1.mjs'
      - 'docs/LEARNING-PACKS.md'
      - '.github/workflows/verify-esco-crosswalk-v1.yml'
  push:
    branches: [ main ]
    paths:
      - 'public/app/shared/skill-crosswalk-v1.mjs'
      - 'public/app/cerbanimo-learning-packs-v1.js'
      - 'public/app/living-school-learning-packs-v1.mjs'
      - 'public/downloads/learning-packs/catalog.json'
      - 'public/downloads/learning-packs/esco-skill-crosswalk-v1.json.gz'
      - 'scripts/build-esco-crosswalk-v1.mjs'
      - 'scripts/verify-esco-crosswalk-v1.mjs'
      - 'docs/LEARNING-PACKS.md'
      - '.github/workflows/verify-esco-crosswalk-v1.yml'

jobs:
  verify-esco-crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check public/app/shared/skill-crosswalk-v1.mjs
          node --check scripts/build-esco-crosswalk-v1.mjs
          node --check scripts/verify-esco-crosswalk-v1.mjs
      - name: Build ESCO bridge
        run: node scripts/build-esco-crosswalk-v1.mjs
      - name: Verify crosswalk contract
        run: node scripts/verify-esco-crosswalk-v1.mjs
      - name: Preserve generated crosswalk artifact
        uses: actions/upload-artifact@v4
        with:
          name: esco-skill-crosswalk-v1-test-build
          path: |
            public/downloads/learning-packs/esco-skill-crosswalk-v1.json.gz
            public/downloads/learning-packs/catalog.json
          if-no-files-found: error
          retention-days: 7
