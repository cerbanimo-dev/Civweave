name: Materialize avatar nav release 1.0.144
on:
  push:
    branches:
      - agent/subsystem-avatar-nav-v347
    paths:
      - '.github/workflows/materialize-avatar-nav-v144.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/subsystem-avatar-nav-v347
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Normalize nav release token and bump release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('public/app/themed-system-nav-v178.js')
          s=p.read_text()
          s=s.replace("const VERSION='1.0.144-five-system-navigation-v228-avatar-status';","const VERSION='1.0.143-five-system-navigation-v227';")
          s=s.replace("version:'1.0.144'","version:'1.0.143'")
          p.write_text(s)
          PY
          printf '1.0.144\n' > VERSION
          npm version 1.0.144 --no-git-tag-version
          node - <<'NODE'
          const fs=require('node:fs');
          const path='config/release-contract.json';
          const doc=JSON.parse(fs.readFileSync(path,'utf8'));
          doc.canonical.current={version:'1.0.144',path:'releases/1.0.144',status:'current'};
          fs.writeFileSync(path,JSON.stringify(doc,null,2)+'\n');
          NODE
      - name: Materialize canonical release
        run: node scripts/materialize-canonical-release.mjs
      - name: Verify synchronized release and avatar nav
        run: |
          node scripts/verify-release-version-sync.mjs
          node scripts/verify-subsystem-avatar-nav-v347.mjs
      - name: Commit generated release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'civweave-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/materialize-avatar-nav-v144.yml
          git add -A
          git commit -m 'Materialize Civweave 1.0.144 avatar navigation release'
          git push origin HEAD:agent/subsystem-avatar-nav-v347
