name: Verify Open Learning Media v1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'agent/open-learning-media-*'
      - 'agent/general-knowledge-video-packs-*'
    paths:
      - config/open-learning-media-packs-v1.json
      - scripts/harvest-open-learning-media-v1.py
      - scripts/harvest-open-learning-media-library-v1.py
      - scripts/curate-open-learning-media-library-v1.py
      - scripts/filter-open-learning-media-title-quality-v1.py
      - scripts/test-open-learning-media-harvest-v1.py
      - scripts/test-open-learning-media-packs-v1.py
      - scripts/test-open-learning-media-runtime-v1.mjs
      - scripts/finalize-open-learning-media-topic-inference-v1.py
      - scripts/fix-open-learning-media-learning-path-budget-v1.py
      - scripts/fix-open-learning-media-finalizer-idempotency-v1.py
      - scripts/finalize-open-learning-media-launch-v1.py
      - scripts/finalize-open-learning-media-range-v1.py
      - scripts/finalize-open-learning-media-safety-v1.py
      - scripts/verify-root-hygiene.mjs
      - ops/triggers/open-learning-media-harvest.trigger
      - public/app/open-learning-media-cache-v1.mjs
      - public/app/open-learning-media-installer-v1.mjs
      - public/app/video-learning-contract-v1.mjs
      - public/app/video-atlas-installer-v1.js
      - public/app/offline-package-v208.json
      - public/app/working-campus-v156.html
      - public/app/cabinets/living-school/index.html
      - public/app/realm-console-v140.html
      - public/service-worker-core-v208.js
      - public/service-worker-v203.js
      - public/install-v130.js
      - public/app/installed-entry-v146.js
      - public/downloads/knowledge-schools/open-learning-media/**
      - docs/open-learning-media-service-v1.md
      - docs/open-learning-media-packs-v1.md
      - .github/workflows/harvest-open-learning-media-v1.yml
      - .github/workflows/verify-open-learning-media-v1.yml
  pull_request:
    branches:
      - main
    paths:
      - config/open-learning-media-packs-v1.json
      - scripts/harvest-open-learning-media-library-v1.py
      - scripts/curate-open-learning-media-library-v1.py
      - scripts/filter-open-learning-media-title-quality-v1.py
      - scripts/test-open-learning-media-packs-v1.py
      - scripts/test-open-learning-media-runtime-v1.mjs
      - scripts/finalize-open-learning-media-topic-inference-v1.py
      - public/app/open-learning-media-cache-v1.mjs
      - public/app/open-learning-media-installer-v1.mjs
      - public/downloads/knowledge-schools/open-learning-media/**
      - docs/open-learning-media-packs-v1.md
      - .github/workflows/harvest-open-learning-media-v1.yml
      - .github/workflows/verify-open-learning-media-v1.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Syntax check Open Learning Media service
        run: |
          set -euo pipefail
          python -m py_compile scripts/harvest-open-learning-media-v1.py scripts/harvest-open-learning-media-library-v1.py scripts/curate-open-learning-media-library-v1.py scripts/filter-open-learning-media-title-quality-v1.py scripts/test-open-learning-media-harvest-v1.py scripts/test-open-learning-media-packs-v1.py scripts/finalize-open-learning-media-topic-inference-v1.py scripts/fix-open-learning-media-learning-path-budget-v1.py scripts/fix-open-learning-media-finalizer-idempotency-v1.py scripts/finalize-open-learning-media-launch-v1.py scripts/finalize-open-learning-media-range-v1.py scripts/finalize-open-learning-media-safety-v1.py
          node --check public/app/open-learning-media-cache-v1.mjs
          node --check public/app/open-learning-media-installer-v1.mjs
          node --check public/app/video-learning-contract-v1.mjs
          node --check public/service-worker-core-v208.js
          node --check public/service-worker-v203.js
          node --check public/install-v130.js
          node --check public/app/installed-entry-v146.js
          node --check scripts/test-open-learning-media-runtime-v1.mjs
          python scripts/finalize-open-learning-media-topic-inference-v1.py
          git diff --exit-code public/app/open-learning-media-cache-v1.mjs

      - name: Verify repository hygiene boundary
        run: node scripts/verify-root-hygiene.mjs

      - name: Verify harvested seed and pack contracts
        run: |
          python scripts/test-open-learning-media-harvest-v1.py
          python scripts/test-open-learning-media-packs-v1.py

      - name: Verify cache mesh rights and offline launch contracts
        run: node scripts/test-open-learning-media-runtime-v1.mjs

      - name: Verify existing required-video compatibility
        run: node scripts/test-video-learning-contract-v1.mjs
