name: Verify shared intention party chat v1

on:
  pull_request:
    paths:
      - 'public/app/shared-intention-party-chat-v1.js'
      - 'public/app/shared-guide-surface-v236.js'
      - 'public/service-worker-chat-repair-v245.js'
      - 'scripts/verify-shared-intention-party-chat-v1.mjs'
      - '.github/workflows/verify-shared-intention-party-v1.yml'
  push:
    branches: [main]
    paths:
      - 'public/app/shared-intention-party-chat-v1.js'
      - 'public/app/shared-guide-surface-v236.js'
      - 'public/service-worker-chat-repair-v245.js'
      - 'scripts/verify-shared-intention-party-chat-v1.mjs'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-shared-intention-party-chat-v1.mjs
