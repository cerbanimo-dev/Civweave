name: Repair stale Civweave Workers Builds trigger

on:
  push:
    branches:
      - fix/remove-stale-civweave-worker-build-v1

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove orphaned Workers Builds trigger from stale Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 2; }
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const account = '06ec4e5fd210bb047505cc7e6e0be6fd';
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const api = `https://api.cloudflare.com/client/v4/accounts/${account}`;
          const headers = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };
          const raw = async (path, init={}) => {
            const response = await fetch(`${api}${path}`, { ...init, headers:{...headers,...(init.headers||{})} });
            const payload = await response.json().catch(()=>({}));
            return {response,payload};
          };
          const checked = async (path, init={}) => {
            const {response,payload}=await raw(path,init);
            if(!response.ok || payload.success!==true){
              const errors=Array.isArray(payload.errors)?payload.errors.map(({code,message})=>({code,message})):[];
              throw new Error(`${init.method||'GET'} ${path} failed (${response.status}): ${JSON.stringify(errors)}`);
            }
            return payload.result;
          };
          const cfg=JSON.parse(readFileSync('wrangler.jsonc','utf8'));
          if(cfg.name!=='civweave'||cfg.pages_build_output_dir!=='./.cloudflare-pages') throw new Error('Refusing repair: canonical root is not Pages-only.');

          const buildUuid='53e29c09-002c-41ab-908d-0e46423b7316';
          const probe=await raw(`/builds/builds/${buildUuid}`);
          console.log(JSON.stringify({http:probe.response.status,success:probe.payload?.success===true,errors:probe.payload?.errors||[]},null,2));
          if(!probe.response.ok || probe.payload?.success!==true) throw new Error('Current repository token cannot access the stale Cloudflare build account.');
          const build=probe.payload.result;
          const triggerUuid=build?.trigger?.trigger_uuid||build?.build_trigger_metadata?.trigger_uuid||null;
          if(!triggerUuid) throw new Error('Stale build is accessible but did not expose a trigger UUID.');
          const repo=String(build?.trigger?.repo_connection?.repo_name||build?.build_trigger_metadata?.repo_name||'').toLowerCase();
          if(repo && repo!=='civweave') throw new Error(`Refusing to delete trigger for unexpected repository ${repo}.`);
          await checked(`/builds/triggers/${encodeURIComponent(triggerUuid)}`,{method:'DELETE'});
          console.log(`Deleted stale Civweave Workers Builds trigger ${triggerUuid}.`);
          const verify=await raw(`/builds/triggers/${encodeURIComponent(triggerUuid)}`);
          if(verify.response.ok && verify.payload?.success===true) throw new Error(`Trigger ${triggerUuid} still exists after deletion.`);
          console.log('Verified stale trigger no longer resolves.');
          NODE
