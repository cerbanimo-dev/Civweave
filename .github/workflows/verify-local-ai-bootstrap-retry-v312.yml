name: Verify Local AI Bootstrap Retry v312

on:
  pull_request:
    paths:
      - 'public/app/local-ai/bootstrap-v266.js'
      - 'scripts/verify-local-ai-bootstrap-retry-v312.mjs'
      - '.github/workflows/verify-local-ai-bootstrap-retry-v312.yml'
  push:
    branches: [main]
    paths:
      - 'public/app/local-ai/bootstrap-v266.js'
      - 'scripts/verify-local-ai-bootstrap-retry-v312.mjs'
      - '.github/workflows/verify-local-ai-bootstrap-retry-v312.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check bootstrap
        run: node --check public/app/local-ai/bootstrap-v266.js
      - name: Verify self-healing bootstrap
        run: node scripts/verify-local-ai-bootstrap-retry-v312.mjs
      - name: Preserve v307 coherence contract
        run: node scripts/verify-local-ai-bootstrap-coherence-v307.mjs
