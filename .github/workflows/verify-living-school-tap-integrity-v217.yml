name: Verify Living School tap integrity v217

on:
  pull_request:
    paths:
      - 'public/app/cabinets/living-school/index.html'
      - 'public/app/cabinets/living-school/living-school-flat-loader-v213.js'
      - 'public/app/cabinets/living-school/living-school-interactions-v213.js'
      - 'public/app/cabinets/living-school/living-school-paths-v213.js'
      - 'public/app/cabinets/living-school/living-school-workbench-v158.js'
      - 'scripts/verify-living-school-tap-integrity-v217.mjs'
      - '.github/workflows/verify-living-school-tap-integrity-v217.yml'
  push:
    branches:
      - main
    paths:
      - 'public/app/cabinets/living-school/index.html'
      - 'public/app/cabinets/living-school/living-school-flat-loader-v213.js'
      - 'public/app/cabinets/living-school/living-school-interactions-v213.js'
      - 'public/app/cabinets/living-school/living-school-paths-v213.js'
      - 'public/app/cabinets/living-school/living-school-workbench-v158.js'
      - 'scripts/verify-living-school-tap-integrity-v217.mjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-living-school-tap-integrity-v217.mjs
