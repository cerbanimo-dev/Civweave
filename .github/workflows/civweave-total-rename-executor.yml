name: Execute Civweave total rename
# Publishes source and asset changes first, then hands workflow edits to the trusted connector.

on:
  push:
    branches:
      - main
      - brand/civweave-executor-trigger
    paths:
      - .github/workflows/civweave-total-rename-executor.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: civweave-total-rename-executor
  cancel-in-progress: false

jobs:
  migrate:
    name: Rewrite source, paths, and checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the prepared migration branch
        uses: actions/checkout@v4
        with:
          ref: brand/civweave-total-rename
          fetch-depth: 0
          token: ${{ secrets.CODE_AUTOMATION_GITHUB_TOKEN || secrets.EVERGREEN_GITHUB_TOKEN || github.token }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebase migration onto the triggering main commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

      - name: Remove the one-shot executor from the generated tree
        run: rm -f .github/workflows/civweave-total-rename-executor.yml

      - name: Apply repository-wide Civweave replacement
        run: python scripts/civweave-total-rename.py

      - name: Verify generated JavaScript and repository checks
        run: npm run check:syntax

      - name: Prove the former identifier is absent from the generated tree
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -i 'commonweave'; then
            echo 'Former identifier remains in a tracked path.' >&2
            exit 1
          fi
          if git grep -I -n -i 'commonweave'; then
            echo 'Former identifier remains in tracked text.' >&2
            exit 1
          fi

      - name: Preserve transformed workflow files for connector publication
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          raw = subprocess.check_output([
              'git', 'diff', '--name-status', '-z', '--find-renames',
              'origin/main', '--', '.github/workflows'
          ])
          fields = raw.split(b'\0')
          if fields and fields[-1] == b'':
              fields.pop()

          operations = []
          index = 0
          while index < len(fields):
              status = fields[index].decode('utf-8')
              index += 1
              if status.startswith(('R', 'C')):
                  source = fields[index].decode('utf-8')
                  target = fields[index + 1].decode('utf-8')
                  index += 2
              else:
                  source = fields[index].decode('utf-8')
                  target = None if status.startswith('D') else source
                  index += 1

              content = b''
              if target and Path(target).is_file():
                  content = Path(target).read_bytes()

              operations.append({
                  's': base64.b64encode(source.encode('utf-8')).decode('ascii'),
                  't': base64.b64encode(target.encode('utf-8')).decode('ascii') if target else '',
                  'd': base64.b64encode(content).decode('ascii') if target else '',
                  'h': hashlib.sha256(content).hexdigest() if target else '',
                  'k': status,
              })

          Path('CIVWEAVE-WORKFLOW-MIGRATION.json').write_text(
              json.dumps({'schema': 1, 'operations': operations}, indent=2) + '\n',
              encoding='utf-8'
          )
          print(json.dumps({'workflowOperations': len(operations)}))
          PY

      - name: Restore workflow directory before branch publication
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/workflows
          git checkout origin/main -- .github/workflows
          if ! git diff --quiet -- .github/workflows; then
            echo 'Workflow restore did not return to the trusted main tree.' >&2
            git diff --stat -- .github/workflows
            exit 1
          fi

      - name: Publish generated source and workflow handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --name-only -- .github/workflows | grep -q .; then
            echo 'Workflow files must be published by the trusted connector, not this token.' >&2
            exit 1
          fi
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No generated migration changes found.' >&2
            exit 1
          fi
          version="$(tr -d '[:space:]' < VERSION)"
          git commit -m "Publish Civweave v${version} source migration"
          git push --force-with-lease origin HEAD:brand/civweave-total-rename
