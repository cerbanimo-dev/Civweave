name: Verify persistent guide chat v215

on:
  pull_request:
    branches: [main]
    paths:
      - public/app/install-boundary-v146.js
      - public/app/persistent-guide-chat-v215.js
      - public/app/cabinets/living-school/index.html
      - public/app/cabinets/living-school/living-school-flat-loader-v213.js
      - public/app/cabinets/living-school/living-school-paths-v213.js
      - public/app/cabinets/living-school/living-school-interactions-v213.js
      - public/app/cabinets/living-school/living-school-interactions-v213.css
      - scripts/verify-persistent-guide-chat-v214.mjs
      - scripts/verify-persistent-guide-chat-v215.mjs
      - .github/workflows/verify-persistent-guide-chat-v215.yml
  push:
    branches: [main]
    paths:
      - public/app/install-boundary-v146.js
      - public/app/persistent-guide-chat-v215.js
      - public/app/cabinets/living-school/index.html
      - public/app/cabinets/living-school/living-school-flat-loader-v213.js
      - public/app/cabinets/living-school/living-school-paths-v213.js
      - public/app/cabinets/living-school/living-school-interactions-v213.js
      - public/app/cabinets/living-school/living-school-interactions-v213.css
      - scripts/verify-persistent-guide-chat-v214.mjs
      - scripts/verify-persistent-guide-chat-v215.mjs
      - .github/workflows/verify-persistent-guide-chat-v215.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check repaired runtime
        run: |
          node --check public/app/install-boundary-v146.js
          node --check public/app/persistent-guide-chat-v215.js
          node --check public/app/cabinets/living-school/living-school-flat-loader-v213.js
          node --check public/app/cabinets/living-school/living-school-paths-v213.js
          node --check public/app/cabinets/living-school/living-school-interactions-v213.js
          node --check scripts/verify-persistent-guide-chat-v215.mjs
      - name: Verify one thread and direct Living School controls
        run: node scripts/verify-persistent-guide-chat-v215.mjs
