name: Verify Premier Phone finalizer

on:
  pull_request:
    paths:
      - 'public/app/local-ai/premier-phone-finalizer-v1.js'
      - 'public/app/model-settings-controller-v173.js'
      - 'public/app/settings-local-models-direct-v325.js'
      - 'public/app/settings-local-progress-placement-v1.js'
      - 'public/app/settings-local-route-v325.js'
      - 'scripts/verify-premier-phone-finalizer-v1.mjs'
      - '.github/workflows/verify-premier-phone-finalizer-v1.yml'
  push:
    branches:
      - staging
    paths:
      - 'public/app/local-ai/premier-phone-finalizer-v1.js'
      - 'public/app/model-settings-controller-v173.js'
      - 'public/app/settings-local-models-direct-v325.js'
      - 'public/app/settings-local-progress-placement-v1.js'
      - 'public/app/settings-local-route-v325.js'
      - 'scripts/verify-premier-phone-finalizer-v1.mjs'
      - '.github/workflows/verify-premier-phone-finalizer-v1.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check changed JavaScript syntax
        run: |
          node --check public/app/local-ai/premier-phone-finalizer-v1.js
          node --check public/app/model-settings-controller-v173.js
          node --check public/app/settings-local-models-direct-v325.js
          node --check public/app/settings-local-progress-placement-v1.js
          node --check public/app/settings-local-route-v325.js
          node --check scripts/verify-premier-phone-finalizer-v1.mjs
      - name: Verify finalizer contract
        run: node scripts/verify-premier-phone-finalizer-v1.mjs
