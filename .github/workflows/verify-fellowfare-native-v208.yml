name: Verify FellowFare Native v208
on:
  pull_request:
    paths:
      - 'public/app/fellowfare-cabinet-v144.html'
      - 'public/app/fellowfare-native-v208.css'
      - 'public/app/fellowfare-native-scroll-v208.js'
      - 'public/app/fellowfare-cabinet-v144.js'
      - 'public/app/services/fellowfare/fulfillment-economy-v2.js'
      - 'scripts/verify-fellowfare-native-v208.mjs'
      - '.github/workflows/verify-fellowfare-native-v208.yml'
  push:
    branches: [fix/fellowfare-native-v208]
    paths:
      - 'public/app/fellowfare-cabinet-v144.html'
      - 'public/app/fellowfare-native-v208.css'
      - 'public/app/fellowfare-native-scroll-v208.js'
      - 'public/app/fellowfare-cabinet-v144.js'
      - 'public/app/services/fellowfare/fulfillment-economy-v2.js'
      - 'scripts/verify-fellowfare-native-v208.mjs'
      - '.github/workflows/verify-fellowfare-native-v208.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check public/app/fellowfare-native-scroll-v208.js
      - run: node scripts/verify-fellowfare-native-v208.mjs
      - run: node scripts/verify-fellowfare-active-v203.mjs
