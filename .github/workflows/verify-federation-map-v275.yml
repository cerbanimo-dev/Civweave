name: Verify federation locality map v275

on:
  pull_request:
    paths:
      - 'public/app/federation-finder-map-v275.html'
      - 'public/app/civweave-map-service-v275.js'
      - 'public/app/civweave-map-bootstrap-v1.js'
      - 'public/app/civweave-map-mesh-v276.js'
      - 'public/app/civweave-map-mesh-bridge-v276.js'
      - 'public/app/civweave-map-coverage-v277.js'
      - 'public/app/civweave-map-storage-v1.js'
      - 'public/app/civweave-map-offline-v1.js'
      - 'public/app/civweave-map-ui-v1.js'
      - 'public/app/civweave-map-v1-manifest.json'
      - 'public/app/shared/civweave-map-coverage-scoring-v1.mjs'
      - 'public/app/shared/civweave-sha256-stream-v1.mjs'
      - 'public/app/local-object-mesh-v146.js'
      - 'public/finder/index.html'
      - 'public/app/offline-package-v208.json'
      - 'public/service-worker.js'
      - 'scripts/stage-maplibre-v275.mjs'
      - 'scripts/stage-federation-finder-data-v274.mjs'
      - 'scripts/prepare-start-v131.mjs'
      - 'scripts/build-civweave-map-v1.mjs'
      - 'scripts/build-cloudflare-pages.mjs'
      - 'scripts/build-install-artifacts.sh'
      - 'scripts/build-mobile-install-kit.mjs'
      - 'scripts/test-federation-map-v275.mjs'
      - 'scripts/test-civweave-map-v1.mjs'
      - '.github/workflows/verify-federation-map-v275.yml'
  push:
    branches:
      - 'agent/real-locality-map-service-v2'
      - 'agent/civweave-map-v1-launch'

concurrency:
  group: federation-map-v275-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check map runtime
        run: |
          node --check public/app/civweave-map-service-v275.js
          node --check public/app/civweave-map-bootstrap-v1.js
          node --check public/app/civweave-map-mesh-v276.js
          node --check public/app/civweave-map-mesh-bridge-v276.js
          node --check public/app/civweave-map-coverage-v277.js
          node --check public/app/civweave-map-storage-v1.js
          node --check public/app/civweave-map-offline-v1.js
          node --check public/app/civweave-map-ui-v1.js
          node --check public/app/shared/civweave-map-coverage-scoring-v1.mjs
          node --check public/app/shared/civweave-sha256-stream-v1.mjs
          node --check public/service-worker.js
          node --check scripts/stage-maplibre-v275.mjs
          node --check scripts/stage-federation-finder-data-v274.mjs
          node --check scripts/prepare-start-v131.mjs
          node --check scripts/build-civweave-map-v1.mjs
          node --check scripts/build-cloudflare-pages.mjs
          node --check scripts/test-civweave-map-v1.mjs
      - name: Verify locality map, WWW mesh, and coverage-healing contracts
        run: node --test scripts/test-federation-map-v275.mjs
      - name: Verify Civweave Map v1 launch contract
        run: node --test scripts/test-civweave-map-v1.mjs
