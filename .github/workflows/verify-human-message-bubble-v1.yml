name: Verify human message bubble v1

on:
  push:
    branches: ['**']
    paths:
      - 'public/app/human-message-bubble-v1.js'
      - 'public/app/shared-guide-surface-v236.js'
      - 'public/app/shared-intention-party-chat-v1.js'
      - 'public/service-worker-chat-repair-v245.js'
      - 'scripts/verify-human-message-bubble-v1.mjs'
      - '.github/workflows/verify-human-message-bubble-v1.yml'
  pull_request:
    paths:
      - 'public/app/human-message-bubble-v1.js'
      - 'public/app/shared-guide-surface-v236.js'
      - 'public/app/shared-intention-party-chat-v1.js'
      - 'public/service-worker-chat-repair-v245.js'
      - 'scripts/verify-human-message-bubble-v1.mjs'
      - '.github/workflows/verify-human-message-bubble-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-human-message-bubble-v1.mjs
