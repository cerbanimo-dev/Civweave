name: Verify Moss selected local server and learning goal

on:
  push:
    branches: [staging, main]
    paths:
      - public/app/selected-provider-authority-v1.js
      - public/app/unified-chat-system-v1.js
      - scripts/verify-moss-native-server-goal-pin-v1.mjs
      - .github/workflows/verify-moss-native-server-goal-pin-v1.yml
  pull_request:
    paths:
      - public/app/selected-provider-authority-v1.js
      - public/app/unified-chat-system-v1.js
      - scripts/verify-moss-native-server-goal-pin-v1.mjs
      - .github/workflows/verify-moss-native-server-goal-pin-v1.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check public/app/selected-provider-authority-v1.js
      - run: node --check public/app/unified-chat-system-v1.js
      - run: node scripts/verify-moss-native-server-goal-pin-v1.mjs
