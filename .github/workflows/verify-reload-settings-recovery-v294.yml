name: Verify Reload + AI Settings Recovery v294

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'VERSION'
      - 'public/app/document-lifecycle-v221.js'
      - 'public/app/local-ai/bootstrap-v266.js'
      - 'public/app/local-ai/test-pulse-v269.js'
      - 'public/service-worker-installed-launch-v282.js'
      - 'scripts/verify-reload-settings-recovery-v294.mjs'
      - '.github/workflows/verify-reload-settings-recovery-v294.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Syntax check recovery surfaces
        run: |
          node --check public/app/document-lifecycle-v221.js
          node --check public/app/local-ai/bootstrap-v266.js
          node --check public/service-worker-installed-launch-v282.js
          node --check scripts/verify-reload-settings-recovery-v294.mjs
      - name: Verify reload and settings resilience
        run: node scripts/verify-reload-settings-recovery-v294.mjs
