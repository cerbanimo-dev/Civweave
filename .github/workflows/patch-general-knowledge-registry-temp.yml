name: Patch General Knowledge Registry Temp

on:
  push:
    branches:
      - agent/general-knowledge-video-packs-v1
    paths:
      - .github/workflows/patch-general-knowledge-registry-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch registry
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('config/open-learning-media-packs-v1.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          by_slug={topic['slug']:topic for topic in data['topics']}

          arts=by_slug['arts-culture']
          arts['aliases']=list(dict.fromkeys([*(arts.get('aliases') or []),'baroque art','renaissance art','artmaking','digital painting','painting tutorial','art tutorial']))
          arts['concepts']=list(dict.fromkeys([*(arts.get('concepts') or []),'art history','visual culture','artmaking']))

          old=by_slug.pop('first-aid-basics',None)
          emergency={
            'slug':'emergency-preparedness',
            'name':'Emergency Preparedness',
            'school_slug':'everyday-life',
            'required':False,
            'queries':['emergency preparedness basics','disaster preparedness emergency kit','fire safety emergency preparedness'],
            'concepts':['emergency preparedness','disaster readiness','emergency planning','fire safety'],
            'aliases':['emergency preparedness','disaster preparedness','emergency kit','emergency planning','fire safety']
          }
          data['topics']=[emergency if topic.get('slug')=='first-aid-basics' else topic for topic in data['topics']]
          for pack in data['packs']:
            if pack['slug']=='practical-life':
              pack['topics']=['emergency-preparedness' if slug=='first-aid-basics' else slug for slug in pack['topics']]
              pack['description']='Everyday competence for money, food, emergency preparedness, home upkeep, and work.'
          path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          PY
          python - <<'PY'
          import json
          data=json.load(open('config/open-learning-media-packs-v1.json'))
          slugs=[x['slug'] for x in data['topics']]
          assert len(slugs)==30 and len(slugs)==len(set(slugs))
          assert 'emergency-preparedness' in slugs and 'first-aid-basics' not in slugs
          arts=next(x for x in data['topics'] if x['slug']=='arts-culture')
          assert 'baroque art' in arts['aliases'] and 'digital painting' in arts['aliases']
          practical=next(x for x in data['packs'] if x['slug']=='practical-life')
          assert 'emergency-preparedness' in practical['topics']
          PY
      - name: Commit registry patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/open-learning-media-packs-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refine arts and practical media topics'
          git pull --rebase origin agent/general-knowledge-video-packs-v1
          git push origin HEAD:agent/general-knowledge-video-packs-v1
