name: Apply Open Learning Topic Inference Temp

on:
  push:
    branches:
      - agent/general-knowledge-video-packs-v1
    paths:
      - .github/workflows/apply-open-learning-topic-inference-temp.yml
  workflow_dispatch:

permissions:
  contents: write

# retry: source-shape resilient finalizer
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply and validate topic inference
        run: |
          set -euo pipefail
          python scripts/finalize-open-learning-media-topic-inference-v1.py
          node --check public/app/open-learning-media-cache-v1.mjs
          python scripts/finalize-open-learning-media-topic-inference-v1.py
      - name: Commit runtime patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/app/open-learning-media-cache-v1.mjs
          if git diff --cached --quiet; then
            echo 'Runtime already finalized.'
            exit 0
          fi
          git commit -m 'Use generated media topic hints at runtime'
          git pull --rebase origin agent/general-knowledge-video-packs-v1
          git push origin HEAD:agent/general-knowledge-video-packs-v1
