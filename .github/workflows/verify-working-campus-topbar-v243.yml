name: Verify Working Campus Topbar v243

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check map runtime syntax
        run: |
          node --check public/app/working-campus-topbar-v243.js
          node --check public/app/working-campus-topbar-v243-base.js
          node --check public/app/federation-association-map.js
          node --check public/app/map-thread-engine.js
      - name: Verify sticky topbar and association-map contract
        run: node scripts/verify-working-campus-topbar-v243.mjs
