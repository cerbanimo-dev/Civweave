name: Verify Working Campus Topbar v243

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check topbar runtime syntax
        run: node --check public/app/working-campus-topbar-v243.js
      - name: Verify sticky topbar and map launch contract
        run: node scripts/verify-working-campus-topbar-v243.mjs
