name: Materialize optional knowledge school seeds

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Actions artifact containing civweave-category-school-seeds
        required: true
        default: '8929365780'
  push:
    branches:
      - agent/optional-knowledge-school-seeds
    paths:
      - ops/triggers/knowledge-school-materialize.trigger

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARTIFACT_ID: ${{ github.event.inputs.artifact_id || '8929365780' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/optional-knowledge-school-seeds
          fetch-depth: 0
      - name: Download category-school artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf build/knowledge-school-artifact
          mkdir -p build/knowledge-school-artifact
          curl --fail --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o build/knowledge-school-artifact.zip
          unzip -q build/knowledge-school-artifact.zip -d build/knowledge-school-artifact
      - name: Copy optional school assets into public downloads
        run: |
          set -euo pipefail
          source_dir="$(find build/knowledge-school-artifact -type d -name civweave-category-school-seeds -print -quit)"
          test -n "${source_dir}"
          target=public/downloads/knowledge-schools
          mkdir -p "${target}/schools"
          rm -f "${target}/schools/"*.zip
          cp "${source_dir}/catalog.json" "${target}/catalog.json"
          cp "${source_dir}/civweave-school-catalog.sqlite" "${target}/civweave-school-catalog.sqlite"
          cp "${source_dir}/RECONCILIATION.json" "${target}/RECONCILIATION.json"
          cp "${source_dir}/SHA256SUMS" "${target}/SHA256SUMS"
          cp "${source_dir}/schools/"*.zip "${target}/schools/"
          test ! -e "${target}/civweave-category-school-seeds.zip"
      - name: Verify optional school assets
        run: |
          node --check public/app/knowledge-school-seeds-v1.js
          node --check public/app/knowledge-school-installer-v1.js
          python -m py_compile public/downloads/knowledge-schools/batch_unpack_schools.py
          node scripts/verify-knowledge-school-seeds-v1.mjs
      - name: Commit materialized school assets
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/downloads/knowledge-schools/catalog.json \
            public/downloads/knowledge-schools/civweave-school-catalog.sqlite \
            public/downloads/knowledge-schools/RECONCILIATION.json \
            public/downloads/knowledge-schools/SHA256SUMS \
            public/downloads/knowledge-schools/schools
          if git diff --cached --quiet; then
            echo 'Knowledge school assets already match the artifact.'
            exit 0
          fi
          git commit -m '[CF-Pages-Skip] Add optional category school seed assets'
          git push origin HEAD:agent/optional-knowledge-school-seeds
