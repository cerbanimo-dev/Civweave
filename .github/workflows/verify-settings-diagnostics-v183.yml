name: Verify Commonweave v1.0.6 Settings Diagnostics

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check diagnostic delivery
        run: |
          node --check public/app/settings-delegation-v175.js
          node --check public/service-worker.js
          node --check public/service-worker-v156.js
          node --check public/install-v130.js
          node --check public/app/pwa-v130.js
          node --check public/app/install-boundary-v146.js
          node --check scripts/verify-settings-diagnostics-v183.mjs
          node --check scripts/verify-device-package-self-heal-v184.mjs
      - name: Verify reusable settings log levels
        run: node scripts/verify-settings-diagnostics-v183.mjs
      - name: Verify installed package self-repair
        run: node scripts/verify-device-package-self-heal-v184.mjs
      - name: Verify existing settings boundaries
        run: |
          node scripts/verify-ai-settings-self-contained-v181.mjs
          node scripts/verify-v106-settings-layer-v179.mjs
