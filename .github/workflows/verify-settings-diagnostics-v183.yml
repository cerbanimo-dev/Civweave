name: Verify Civweave AI Settings Clean Room

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanroom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check clean-room delivery
        run: |
          node --check public/app/document-lifecycle-v221.js
          node --check public/app/model-settings-controller-v173.js
          node --check public/app/unified-ai-settings-v175.js
          node --check public/app/settings-delegation-v175.js
          node --check public/app/fast-interactive-runtime-v192.js
          node --check public/app/ai-capability-broker-v268.js
          node --check public/app/gemini-task-tier-router-v213.js
          node --check public/app/weaveling-memory-bridge-v191.js
          node --check public/app/local-ai/runtime-bridge-v266.js
          node --check public/app/install-boundary-v146.js
          node --check public/service-worker.js
          node --check public/service-worker-v156.js
          node --check scripts/verify-ai-settings-cleanroom-v188.mjs
          node --check scripts/verify-ai-settings-entry-runtime-spine-v269.mjs
          node --check scripts/verify-local-model-settings-mount-v273.mjs
      - name: Verify clean-room freeze boundary
        run: node scripts/verify-ai-settings-cleanroom-v188.mjs
      - name: Verify settings entry and runtime spine
        run: node scripts/verify-ai-settings-entry-runtime-spine-v269.mjs
      - name: Verify downloaded local model management mounts
        run: node scripts/verify-local-model-settings-mount-v273.mjs
