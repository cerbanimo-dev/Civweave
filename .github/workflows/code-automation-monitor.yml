name: Monitor Civweave Code Automation

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [civweave-code-automation-monitor]
  workflow_run:
    workflows: [Verify Civweave Clean-Room Settings, Verify Civweave Code Automation]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

concurrency:
  group: civweave-code-automation-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile Jules, AI validator receipts, GitHub checks, and merge authority
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.CODE_AUTOMATION_GITHUB_TOKEN || github.token }}
          CODE_AUTOMATION_GITHUB_TOKEN: ${{ secrets.CODE_AUTOMATION_GITHUB_TOKEN }}
          CIVWEAVE_AI_VALIDATOR_URL: ${{ secrets.CIVWEAVE_AI_VALIDATOR_URL }}
          CIVWEAVE_AI_VALIDATOR_TOKEN: ${{ secrets.CIVWEAVE_AI_VALIDATOR_TOKEN }}
          CODE_AUTOMATION_AUTOMERGE_ENABLED: ${{ vars.CODE_AUTOMATION_AUTOMERGE_ENABLED || 'true' }}
        run: node scripts/code-automation-monitor.mjs
