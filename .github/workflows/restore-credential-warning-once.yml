name: Restore credential access warning once

on:
  push:
    branches:
      - agent/launch-readiness-hardening-v1
    paths:
      - .github/workflows/restore-credential-warning-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/launch-readiness-hardening-v1
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Restore explicit shared-profile credential warning
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const file='public/app/model-settings-controller-v173.js';
          let source=await readFile(file,'utf8');
          const before="if(mode==='device')node.textContent=`Remember on this device keeps the ${route==='gemini'?'Gemini':'provider'} key in this browser’s local storage until you tap Forget saved key, clear site data, or uninstall/reset the app.`;";
          const after="if(mode==='device')node.textContent=`Remember on this device keeps the ${route==='gemini'?'Gemini':'provider'} key in this browser’s local storage until you tap Forget saved key, clear site data, or uninstall/reset the app. Anyone with access to this unlocked browser profile may be able to use that saved credential.`;";
          if(!source.includes(before))throw new Error('Credential teaching anchor moved.');
          source=source.replace(before,after);
          await writeFile(file,source);
          NODE
      - name: Advance patch release for security-copy change
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const current=(await readFile('VERSION','utf8')).trim();
          const match=/^(\d+)\.(\d+)\.(\d+)$/.exec(current);
          if(!match)throw new Error(`Invalid VERSION ${current}`);
          const next=`${match[1]}.${match[2]}.${Number(match[3])+1}`;
          await writeFile('VERSION',`${next}\n`);
          for(const file of ['package.json','package-lock.json']){
            const data=JSON.parse(await readFile(file,'utf8'));
            data.version=next;
            if(file==='package-lock.json'&&data.packages?.[''])data.packages[''].version=next;
            await writeFile(file,`${JSON.stringify(data,null,2)}\n`);
          }
          const contract=JSON.parse(await readFile('config/release-contract.json','utf8'));
          contract.canonical.current.version=next;
          contract.canonical.current.path=`releases/${next}`;
          await writeFile('config/release-contract.json',`${JSON.stringify(contract,null,2)}\n`);
          for(const file of ['public/app/installed-entry-v146.js','public/app/installed-entry-v146.html','ops/launch/README.md']){
            let source=await readFile(file,'utf8');
            source=source.replaceAll(current,next);
            await writeFile(file,source);
          }
          console.log(JSON.stringify({current,next}));
          NODE
      - name: Materialize canonical release
        run: node scripts/materialize-canonical-release.mjs
      - name: Verify credential and launch contracts
        run: |
          node scripts/verify-memory-credential-v191.mjs
          node scripts/verify-pwa-cold-launch-recovery-v426.mjs
          node scripts/verify-legal-consent-v1.mjs
          node scripts/test-node-ai-marketplace-surface-v1.mjs
          npm run check:release-discipline
          git diff --check
      - name: Commit repair and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "civweave-launch-bot"
          git config user.email "civweave-launch-bot@users.noreply.github.com"
          git rm .github/workflows/restore-credential-warning-once.yml
          git add -A
          git commit -m "Restore remembered-credential access warning"
          git push origin HEAD:agent/launch-readiness-hardening-v1
