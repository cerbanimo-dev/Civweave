name: Verify Active Screen Surface v350

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: active-screen-surface-v350-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-active-screen-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Syntax check current guide surface
        run: node --check public/app/guide-chat-surface-v350.js && node --check public/app/guide-workspace-v242.js && node --check public/app/saved-chat-ui-v295.js
      - name: Reject retired presentation screens
        run: node scripts/verify-active-screen-surface-v350.mjs
