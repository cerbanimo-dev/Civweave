name: Materialize manual-first installer v304

on:
  push:
    branches:
      - fix/manual-first-installer-v304

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manual-first-installer-v304
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Teach release sync the manual-first headline
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/sync-release-version-assets.mjs')
          s=p.read_text()
          old="  source=replaceRequired(source,/Install Civweave v\\d+\\.\\d+\\.\\d+\\. The campus downloads automatically\\./,`Install Civweave v${version}. The campus downloads automatically.`,'installer headline');"
          new="  source=replaceRequired(source,/(?:Install Civweave v\\d+\\.\\d+\\.\\d+\\. The campus downloads automatically\\.|Install the shell\\. Open Civweave immediately\\. Download offline files only when you choose\\.)/,`Install the shell. Open Civweave immediately. Download offline files only when you choose.`,'installer headline');"
          if old not in s:
              raise SystemExit('expected legacy installer headline synchronizer not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Align package release version
        run: npm version 1.0.104 --no-git-tag-version
      - name: Materialize canonical release
        run: node scripts/materialize-canonical-release.mjs
      - name: Verify generated installer metadata
        run: |
          node scripts/smoke-installer-hardening-v281.mjs
          node scripts/verify-release-contract.mjs
          node scripts/verify-canonical-launch-release.mjs
      - name: Commit generated release and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-manual-first-v304.yml
          git add -A
          git commit -m "Materialize Civweave v1.0.104 manual-first installer"
          git push origin HEAD:fix/manual-first-installer-v304
