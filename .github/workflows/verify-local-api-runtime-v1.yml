name: Verify local API runtime

on:
  pull_request:
    paths:
      - 'public/app/shared/civweave-model-runtime.js'
      - 'public/app/guide-provider-policy-v1.js'
      - 'public/app/guide-forward-failure-policy-v1.js'
      - 'public/app/weaveling-memory-bridge-v191.js'
      - 'public/app/family-ai-loader-v105.js'
      - 'public/app/fast-interactive-runtime-v192.js'
      - 'public/app/guide-forward-failure-hardening-v1.js'
      - 'public/app/assistant-runtime-v141.js'
      - 'public/app/action-followthrough-v165.js'
      - 'public/app/platform-experience-v160.js'
      - 'public/app/safe-mode-v1.mjs'
      - 'public/app/video-learning-contract-v1.mjs'
      - 'public/app/guide-stream-thinking-v249.js'
      - 'public/app/guide-chat-surface-v350.js'
      - 'public/app/guide-stream-thinking-v249.js'
      - 'public/app/knowledge-encyclopedia-bridge-v271.js'
      - 'public/extensions/civweave-weaveling-plan-json-v190.js'
      - 'scripts/test-local-api-runtime-v1.mjs'
      - 'scripts/test-assistant-extension-startup-v1.mjs'
      - 'scripts/test-chat-stream-finalization-v1.mjs'
      - 'scripts/test-guide-http-capability-options-v1.mjs'
      - 'scripts/test-guide-http-wrapper-integration-v1.mjs'
      - '.github/workflows/verify-local-api-runtime-v1.yml'
  push:
    branches: [staging, main]
    paths:
      - 'public/app/shared/civweave-model-runtime.js'
      - 'public/app/guide-provider-policy-v1.js'
      - 'public/app/guide-forward-failure-policy-v1.js'
      - 'public/app/weaveling-memory-bridge-v191.js'
      - 'public/app/family-ai-loader-v105.js'
      - 'public/app/fast-interactive-runtime-v192.js'
      - 'public/app/guide-forward-failure-hardening-v1.js'
      - 'public/app/assistant-runtime-v141.js'
      - 'public/app/action-followthrough-v165.js'
      - 'public/app/platform-experience-v160.js'
      - 'public/app/safe-mode-v1.mjs'
      - 'public/app/video-learning-contract-v1.mjs'
      - 'public/app/guide-stream-thinking-v249.js'
      - 'public/app/guide-chat-surface-v350.js'
      - 'public/app/guide-stream-thinking-v249.js'
      - 'public/app/knowledge-encyclopedia-bridge-v271.js'
      - 'public/extensions/civweave-weaveling-plan-json-v190.js'
      - 'scripts/test-local-api-runtime-v1.mjs'
      - 'scripts/test-assistant-extension-startup-v1.mjs'
      - 'scripts/test-chat-stream-finalization-v1.mjs'
      - 'scripts/test-guide-http-capability-options-v1.mjs'
      - 'scripts/test-guide-http-wrapper-integration-v1.mjs'
      - '.github/workflows/verify-local-api-runtime-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check public/app/shared/civweave-model-runtime.js
      - run: node --test scripts/test-local-api-runtime-v1.mjs scripts/test-assistant-extension-startup-v1.mjs scripts/test-chat-stream-finalization-v1.mjs scripts/test-guide-http-capability-options-v1.mjs scripts/test-guide-http-wrapper-integration-v1.mjs
