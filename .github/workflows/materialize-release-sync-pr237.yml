name: Materialize PR237 release sync

on:
  push:
    branches:
      - agent/spotify-playlist-track-links
    paths:
      - '.github/workflows/materialize-release-sync-pr237.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/spotify-playlist-track-links
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize release assets
        run: |
          node scripts/sync-release-version-assets.mjs
          node scripts/sync-release-coherence-v220.mjs
      - name: Commit generated release assets
        run: |
          git config user.name 'civweave-release-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Release assets already synchronized.'
            exit 0
          fi
          git commit -m 'Materialize Civweave 1.0.44 release assets'
          git push origin HEAD:agent/spotify-playlist-track-links
