name: Verify Moss Learning Journey Bridge

on:
  pull_request:
    paths:
      - 'public/app/install-boundary-v146.js'
      - 'public/app/guide-chat-surface-v350.js'
      - 'public/app/shared-guide-surface-v236.js'
      - 'public/app/unified-chat-system-v1.js'
      - 'public/app/moss-learning-plan-approval-button-v1.js'
      - 'public/app/living-school-generation-budget-v3.js'
      - 'public/app/working-campus-v156.part3.txt'
      - 'scripts/verify-moss-curriculum-quest-library-v1.mjs'
      - 'public/app/living-school-generation-guard-v262.mjs'
      - 'public/app/living-school-quiz-contract-guard-v263.mjs'
      - 'public/app/living-school-cleanroom-actions-v243.mjs'
      - 'public/app/living-school-grounded-compiler-v336.js'
      - 'public/app/living-school-assessment-curator-v337.js'
      - 'public/app/cabinets/living-school/living-school-cleanroom-core-v218-base.mjs'
      - 'public/app/cabinets/living-school/living-school-cleanroom-v218.mjs'
      - 'public/app/cabinets/living-school/living-school-cleanroom-render-v218.mjs'
      - 'public/app/cabinets/living-school/living-school-journey-index-v1.mjs'
      - 'scripts/verify-living-school-journey-list-v1.mjs'
      - 'public/app/cabinets/living-school/living-school-cleanroom-actions-v218.mjs'
      - 'public/app/cabinets/living-school/living-school-cleanroom-render-v218.mjs'
      - 'public/app/services/living-school/modules/cerbanimo-bridge.mjs'
      - 'public/app/services/living-school/modules/project-gate.mjs'
      - 'scripts/test-moss-assessment-materialization-v1.mjs'
      - 'scripts/test-learning-practicum-handoff-v1.mjs'
      - 'scripts/test-learning-journey-replacement-v1.mjs'
      - 'scripts/verify-moss-learning-journey-bridge-v1.mjs'
      - 'scripts/verify-moss-learning-plan-approval-button-v1.mjs'
      - '.github/workflows/verify-moss-learning-journey-bridge-v1.yml'
  push:
    branches: ['**']
    paths:
      - 'public/app/install-boundary-v146.js'
      - 'public/app/guide-chat-surface-v350.js'
      - 'public/app/shared-guide-surface-v236.js'
      - 'public/app/unified-chat-system-v1.js'
      - 'public/app/moss-learning-plan-approval-button-v1.js'
      - 'public/app/living-school-generation-budget-v3.js'
      - 'public/app/working-campus-v156.part3.txt'
      - 'scripts/verify-moss-curriculum-quest-library-v1.mjs'
      - 'public/app/living-school-generation-guard-v262.mjs'
      - 'public/app/living-school-quiz-contract-guard-v263.mjs'
      - 'public/app/living-school-cleanroom-actions-v243.mjs'
      - 'public/app/living-school-grounded-compiler-v336.js'
      - 'public/app/living-school-assessment-curator-v337.js'
      - 'public/app/cabinets/living-school/living-school-cleanroom-core-v218-base.mjs'
      - 'public/app/cabinets/living-school/living-school-cleanroom-v218.mjs'
      - 'public/app/cabinets/living-school/living-school-cleanroom-render-v218.mjs'
      - 'public/app/cabinets/living-school/living-school-journey-index-v1.mjs'
      - 'scripts/verify-living-school-journey-list-v1.mjs'
      - 'public/app/cabinets/living-school/living-school-cleanroom-actions-v218.mjs'
      - 'public/app/cabinets/living-school/living-school-cleanroom-render-v218.mjs'
      - 'public/app/services/living-school/modules/cerbanimo-bridge.mjs'
      - 'public/app/services/living-school/modules/project-gate.mjs'
      - 'scripts/test-moss-assessment-materialization-v1.mjs'
      - 'scripts/test-learning-practicum-handoff-v1.mjs'
      - 'scripts/test-learning-journey-replacement-v1.mjs'
      - 'scripts/verify-moss-learning-journey-bridge-v1.mjs'
      - 'scripts/verify-moss-learning-plan-approval-button-v1.mjs'
      - '.github/workflows/verify-moss-learning-journey-bridge-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-moss-learning-journey-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check syntax
        run: |
          node --check public/app/install-boundary-v146.js
          node --check public/app/unified-chat-system-v1.js
          node --check public/app/moss-learning-plan-approval-button-v1.js
          node --check scripts/verify-moss-learning-journey-bridge-v1.mjs
          node --check scripts/verify-moss-learning-plan-approval-button-v1.mjs
          node --check scripts/verify-moss-curriculum-quest-library-v1.mjs
      - name: Verify Moss learning goal routing and capability load order
        run: node scripts/verify-moss-learning-journey-bridge-v1.mjs
      - name: Verify Moss direct approval button materialization
        run: node scripts/verify-moss-learning-plan-approval-button-v1.mjs
      - name: Verify local curriculum deadline and saved Learning Journey visibility
        run: node scripts/verify-moss-curriculum-quest-library-v1.mjs
      - name: Verify Living School pending, failed and approved journey list
        run: node scripts/verify-living-school-journey-list-v1.mjs
      - name: Verify genuine AI assessment materialization and bounded failure
        run: node scripts/test-moss-assessment-materialization-v1.mjs
      - name: Verify practicum handoff and authoritative completion receipt
        run: node scripts/test-learning-practicum-handoff-v1.mjs
      - name: Verify replacement Journey completion isolation and recovery
        run: node scripts/test-learning-journey-replacement-v1.mjs
