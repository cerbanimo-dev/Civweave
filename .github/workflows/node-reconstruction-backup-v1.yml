name: Node reconstruction backup v1

on:
  pull_request:
    paths:
      - 'lib/node-reconstruction-backup-v1.mjs'
      - 'scripts/node-reconstruction-backup-v1.mjs'
      - 'scripts/test-node-reconstruction-backup-v1.mjs'
      - 'docs/architecture/node-reconstruction-backups-v1.md'
      - 'config/system-ownership.json'
      - '.github/workflows/node-reconstruction-backup-v1.yml'
  push:
    branches: [main]
    paths:
      - 'lib/node-reconstruction-backup-v1.mjs'
      - 'scripts/node-reconstruction-backup-v1.mjs'
      - 'scripts/test-node-reconstruction-backup-v1.mjs'
      - 'docs/architecture/node-reconstruction-backups-v1.md'
      - 'config/system-ownership.json'

permissions:
  contents: read

jobs:
  node-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Syntax
        run: |
          node --check lib/node-reconstruction-backup-v1.mjs
          node --check scripts/node-reconstruction-backup-v1.mjs
          node --check scripts/test-node-reconstruction-backup-v1.mjs
      - name: Exact reconstruction, crypto, delta and replica tests
        run: node --test scripts/test-node-reconstruction-backup-v1.mjs
