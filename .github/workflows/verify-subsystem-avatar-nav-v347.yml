name: Verify subsystem avatar nav v347
on:
  pull_request:
    paths:
      - 'public/app/themed-system-nav-v178.js'
      - 'public/app/subsystem-avatar-state-v347.js'
      - 'scripts/verify-subsystem-avatar-nav-v347.mjs'
      - '.github/workflows/verify-subsystem-avatar-nav-v347.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-subsystem-avatar-nav-v347.mjs
