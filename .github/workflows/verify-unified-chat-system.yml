name: Verify Unified Chat System

on:
  pull_request:
    paths:
      - 'VERSION'
      - 'package.json'
      - 'config/system-ownership.json'
      - 'public/app/experience-orchestrator-v232.js'
      - 'public/app/unified-chat-system-v1.js'
      - 'public/app/shared-guide-surface-v236.js'
      - 'public/app/shared-guide-surface-v236-core-v244.js'
      - 'public/app/shared-intention-party-chat-v1.js'
      - 'public/app/guide-chat-surface-v350.js'
      - 'public/app/guide-workspace-v242.js'
      - 'public/app/realm-session-integrity-v237.js'
      - 'public/app/family-ai-loader-v105.js'
      - 'public/app/assistant-runtime-v141.js'
      - 'public/app/minilm-context-router-v344.js'
      - 'public/app/minilm-response-router-v347.js'
      - 'public/app/shared-chat-face-icons-v255.js'
      - 'public/app/avatar-expression-director-v345.js'
      - 'public/app/anarchadia-console-v139.html'
      - 'public/app/installed-entry-v146.js'
      - 'public/service-worker-chat-repair-v245.js'
      - 'public/service-worker-v203.js'
      - 'scripts/verify-chat-launch-readiness-v295.mjs'
      - 'scripts/verify-human-message-bubble-v1.mjs'
      - 'scripts/verify-minilm-response-router-v347.mjs'
      - '.github/workflows/verify-unified-chat-system.yml'
  push:
    branches: ['**']
    paths:
      - 'VERSION'
      - 'package.json'
      - 'config/system-ownership.json'
      - 'public/app/experience-orchestrator-v232.js'
      - 'public/app/unified-chat-system-v1.js'
      - 'public/app/shared-guide-surface-v236.js'
      - 'public/app/shared-guide-surface-v236-core-v244.js'
      - 'public/app/shared-intention-party-chat-v1.js'
      - 'public/app/guide-chat-surface-v350.js'
      - 'public/app/guide-workspace-v242.js'
      - 'public/app/realm-session-integrity-v237.js'
      - 'public/app/family-ai-loader-v105.js'
      - 'public/app/assistant-runtime-v141.js'
      - 'public/app/minilm-context-router-v344.js'
      - 'public/app/minilm-response-router-v347.js'
      - 'public/app/shared-chat-face-icons-v255.js'
      - 'public/app/avatar-expression-director-v345.js'
      - 'public/app/anarchadia-console-v139.html'
      - 'public/app/installed-entry-v146.js'
      - 'public/service-worker-chat-repair-v245.js'
      - 'public/service-worker-v203.js'
      - 'scripts/verify-chat-launch-readiness-v295.mjs'
      - 'scripts/verify-human-message-bubble-v1.mjs'
      - 'scripts/verify-minilm-response-router-v347.mjs'
      - '.github/workflows/verify-unified-chat-system.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-unified-chat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check canonical chat runtime syntax
        run: |
          node --check public/app/experience-orchestrator-v232.js
          node --check public/app/unified-chat-system-v1.js
          node --check public/app/shared-guide-surface-v236.js
          node --check public/app/shared-guide-surface-v236-core-v244.js
          node --check public/app/shared-intention-party-chat-v1.js
          node --check public/app/guide-chat-surface-v350.js
          node --check public/app/guide-workspace-v242.js
          node --check public/app/realm-session-integrity-v237.js
          node --check public/app/family-ai-loader-v105.js
          node --check public/app/assistant-runtime-v141.js
          node --check public/app/minilm-context-router-v344.js
          node --check public/app/minilm-response-router-v347.js
          node --check public/app/shared-chat-face-icons-v255.js
          node --check public/app/avatar-expression-director-v345.js
          node --check public/app/installed-entry-v146.js
          node --check public/service-worker-chat-repair-v245.js
          node --check public/service-worker-v203.js
          node --check scripts/verify-chat-launch-readiness-v295.mjs
          node --check scripts/verify-human-message-bubble-v1.mjs
          node --check scripts/verify-minilm-response-router-v347.mjs

      - name: Enforce one-core five-guide avatar contract
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const orchestrator=fs.readFileSync('public/app/experience-orchestrator-v232.js','utf8');
          const core=fs.readFileSync('public/app/unified-chat-system-v1.js','utf8');
          const loader=fs.readFileSync('public/app/shared-guide-surface-v236.js','utf8');
          const shared=fs.readFileSync('public/app/shared-guide-surface-v236-core-v244.js','utf8');
          const party=fs.readFileSync('public/app/shared-intention-party-chat-v1.js','utf8');
          const surface=fs.readFileSync('public/app/guide-chat-surface-v350.js','utf8');
          const compat=fs.readFileSync('public/app/guide-workspace-v242.js','utf8');
          const family=fs.readFileSync('public/app/family-ai-loader-v105.js','utf8');
          const assistant=fs.readFileSync('public/app/assistant-runtime-v141.js','utf8');
          const minilmContext=fs.readFileSync('public/app/minilm-context-router-v344.js','utf8');
          const minilmResponse=fs.readFileSync('public/app/minilm-response-router-v347.js','utf8');
          const faces=fs.readFileSync('public/app/shared-chat-face-icons-v255.js','utf8');
          const sessions=fs.readFileSync('public/app/realm-session-integrity-v237.js','utf8');
          const anarchadia=fs.readFileSync('public/app/anarchadia-console-v139.html','utf8');
          const repair=fs.readFileSync('public/service-worker-chat-repair-v245.js','utf8');
          const serviceWorker=fs.readFileSync('public/service-worker-v203.js','utf8');

          for(const system of ['civweave','living-school','cerbanimo','fellowfare','anarchadia']){
            if(!core.includes(system))throw new Error(`Unified chat is missing theme ${system}`);
            if(!surface.includes(system))throw new Error(`Canonical surface is missing guide ${system}`);
          }
          if(!orchestrator.includes("REVISION='experience-orchestrator-v355-minilm-submit-gate'"))throw new Error('Selected-local submit owner lost MiniLM-first routing');
          if(!orchestrator.includes('await router.classify(text,')||!orchestrator.includes("route.taskClass==='ordinary'")||!orchestrator.includes('!route.networkRequired'))throw new Error('Selected-local capture can bypass MiniLM classification');
          if(!sessions.includes('threadKey=system=>`civweave.guide-thread.${system}.v237`'))throw new Error('Five-folder realm memory contract is missing');
          if(!core.includes("architecture:'one-core-five-themes-five-memory-folders'"))throw new Error('Unified architecture marker missing');
          if(core.includes('setInterval('))throw new Error('Unified chat must not poll the DOM/runtime');
          if(!surface.includes("const ROOT_ID='cw-persistent-guide-chat-v215'"))throw new Error('Canonical chat root missing');
          if(!surface.includes('cw242-window-switcher')||!surface.includes('data-cw242-window')||!surface.includes('cw242-unread'))throw new Error('Five-avatar switcher/notification contract is missing');
          if(surface.includes('<select data-guide-select'))throw new Error('Guide dropdown regression returned');
          const start=surface.slice(surface.indexOf('function start(){'),surface.indexOf('\n\nconst api='));
          if(start.includes('ensureRoot()')||start.includes('render()'))throw new Error('Chat surface is materializing at application launch');
          if(!start.includes('ensureLauncher()'))throw new Error('Canonical chat owner no longer creates the lightweight universal launcher');
          if(!shared.includes('api?.ensureLauncher?.()'))throw new Error('Universal guide layer cannot repair a missing launcher');
          if(!shared.includes("launcherOwner:'guide-chat-surface-v350'"))throw new Error('Universal launcher ownership is not explicit');
          if(!shared.includes("addEventListener('pageshow',repairSurface)"))throw new Error('Universal launcher is not reconciled after BFCache/page restoration');
          if(anarchadia.includes('class="ac-merlin-chat"')||anarchadia.includes('aria-label="Chat with Merlin"'))throw new Error('Anarchadia rebuilt a page-local Merlin chat surface instead of using the universal launcher');
          if(!anarchadia.includes('/app/install-boundary-v146.js'))throw new Error('Anarchadia is no longer attached to the universal system experience boundary');
          if(!shared.includes('switchGuide?.(currentSystem,{open:false})'))throw new Error('Shared guide ownership can reopen chat during launch');
          if(!faces.includes('idleUntilChatOpen:true')||!faces.includes("addEventListener('civweave:guide-chat-opened',activate)"))throw new Error('Avatar presentation is not deferred until chat opens');
          if(!faces.includes('heavyRuntimeOnOpen:false')||!faces.includes("expressionRuntimeTrigger:'first-chat-submit'")||!faces.includes('miniLmPolling:false'))throw new Error('Chat-open heavy-runtime guard is missing');
          const activateStart=faces.indexOf('function activate(){'),activateEnd=faces.indexOf('\nfunction start(){',activateStart),activateBody=faces.slice(activateStart,activateEnd);
          if(activateBody.includes('ensureExpressionDirector')||activateBody.includes('setInterval('))throw new Error('Opening chat is starting expression/MiniLM work');
          if(faces.includes('miniLmLampTimer=setInterval')||faces.includes('setInterval(refreshMiniLmLamp'))throw new Error('Face runtime reintroduced MiniLM polling');
          if(!compat.includes('Compatibility loader only')||!compat.includes("const TARGET='/app/guide-chat-surface-v350.js'"))throw new Error('V242 compatibility path is no longer a loader-only shim');
          for(const path of ['/app/guide-chat-surface-v350.js','/app/unified-chat-system-v1.js','/app/shared-guide-surface-v236-core-v244.js','/app/shared-intention-party-chat-v1.js','/app/shared-chat-face-icons-v255.js','/app/assistant-runtime-v141.js','/app/minilm-response-router-v347.js']){
            if(!repair.includes(`'${path}'`))throw new Error(`PWA cache repair is missing ${path}`);
          }
          if(!repair.includes("MODEL_ROUTE_REVISION='selected-local-minilm-v357'"))throw new Error('PWA cache repair lost the selected-local/MiniLM delivery revision');
          if(!serviceWorker.includes('model=selected-local-minilm-v357'))throw new Error('Main service worker no longer activates selected-local/MiniLM cache repair');
          if(!loader.includes('/app/unified-chat-system-v1.js'))throw new Error('Shared guide loader does not load unified chat');
          if(!loader.includes('partyAutostart:false')||!loader.includes('activatePartyChat'))throw new Error('Party chat is not explicitly lazy');
          const installStart=loader.indexOf('function install(){'),installEnd=loader.indexOf('\n}\n\ninstall();',installStart),installBody=loader.slice(installStart,installEnd);
          if(installBody.includes('/app/shared-intention-party-chat-v1.js'))throw new Error('Party chat is loading during ordinary guide startup');
          if(!loader.includes("addEventListener('civweave:open-human-thread',onPartyRequest)"))throw new Error('Lazy party activation is not connected to explicit human-party use');
          if(!party.includes('function startTransport()'))throw new Error('Party transport contract disappeared');

          if(!family.includes('async function ensureLocalAI()')||!family.includes('await ensureLocalAI()'))throw new Error('Selected downloaded-local model bootstrap is no longer attached to guide generation');
          if(!family.includes('/app/minilm-response-router-v347.js'))throw new Error('MiniLM response router is no longer loaded with guide generation');
          if(!assistant.includes('async function semanticRoute(')||!assistant.includes('CivweaveContextRouterV344'))throw new Error('Assistant no longer asks MiniLM for semantic routing');
          if(assistant.includes("if(type)return{response:conversational"))throw new Error('Deterministic small-talk shortcut bypasses the selected model');
          if(!assistant.includes("code:'SELECTED_LOCAL_MODEL_FAILED'"))throw new Error('Selected local model failures can silently fall back again');
          if(!minilmContext.includes("model:'Xenova/all-MiniLM-L6-v2'"))throw new Error('MiniLM context router model contract is missing');
          if(!minilmResponse.includes("dispatchEvent(new CustomEvent('civweave:response-route'"))throw new Error('MiniLM response routing event contract is missing');
          if(!minilmResponse.includes('minilmPrimary:true')||!minilmResponse.includes('deterministicFallbackOnly:true'))throw new Error('Free-form prompt routing is no longer MiniLM-first with deterministic fallback only');
          if(!surface.includes("provider:'local-model-error'"))throw new Error('Canonical chat can silently label a selected local model failure as deterministic output');
          if(!surface.includes("'civweave:avatar-direct-text'")||!surface.includes('data-message-role')||!surface.includes('data-pending'))throw new Error('Canonical chat no longer feeds response lifecycle into MiniLM avatar expression selection');
          NODE

      - name: Verify current chat behavior
        run: |
          node scripts/verify-chat-launch-readiness-v295.mjs
          node scripts/verify-human-message-bubble-v1.mjs
          node scripts/verify-minilm-response-router-v347.mjs