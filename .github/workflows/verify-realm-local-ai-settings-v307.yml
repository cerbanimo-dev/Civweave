name: Verify Realm Local AI Settings v307

on:
  pull_request:
    paths:
      - 'public/app/install-boundary-v146.js'
      - 'public/app/document-lifecycle-v221.js'
      - 'public/app/model-settings-controller-v173.js'
      - 'public/app/local-ai/settings-panel-v267.js'
      - 'public/app/system-routes-v227.js'
      - 'public/app/working-campus-v156.html'
      - 'public/app/realm-console-v140.html'
      - 'public/app/cabinets/living-school/index.html'
      - 'public/app/fellowfare-cabinet-v144.html'
      - 'public/app/anarchadia-console-v139.html'
      - 'scripts/verify-realm-local-ai-settings-v307.mjs'
      - '.github/workflows/verify-realm-local-ai-settings-v307.yml'
  push:
    branches: [main]
    paths:
      - 'public/app/install-boundary-v146.js'
      - 'public/app/document-lifecycle-v221.js'
      - 'public/app/model-settings-controller-v173.js'
      - 'public/app/local-ai/settings-panel-v267.js'
      - 'public/app/system-routes-v227.js'
      - 'public/app/working-campus-v156.html'
      - 'public/app/realm-console-v140.html'
      - 'public/app/cabinets/living-school/index.html'
      - 'public/app/fellowfare-cabinet-v144.html'
      - 'public/app/anarchadia-console-v139.html'
      - 'scripts/verify-realm-local-ai-settings-v307.mjs'
      - '.github/workflows/verify-realm-local-ai-settings-v307.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check public/app/install-boundary-v146.js
          node --check public/app/document-lifecycle-v221.js
          node --check scripts/verify-realm-local-ai-settings-v307.mjs
      - name: Realm settings contract
        run: node scripts/verify-realm-local-ai-settings-v307.mjs
