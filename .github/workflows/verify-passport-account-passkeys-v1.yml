name: Verify Passport Account Passkeys v1

on:
  pull_request:
    paths:
      - 'cloudflare/account-edge/src/hub-passport-account-v1.mjs'
      - 'cloudflare/account-edge/src/recovery-entry-v11.mjs'
      - 'cloudflare/account-edge/wrangler.jsonc'
      - 'cloudflare/node-cloud/src/account-directory-v1.mjs'
      - 'cloudflare/node-cloud/src/cloud-node-recovery-v2.mjs'
      - 'cloudflare/node-cloud/src/server-ai-entry-v5.mjs'
      - 'cloudflare/node-cloud/wrangler.jsonc'
      - 'cloudflare/cerbanimo-mail/src/index.mjs'
      - 'public/app/hub-passport-account-v1.js'
      - 'public/app/hub-recovery-ui-v1.js'
      - 'scripts/verify-passport-account-passkeys-v1.mjs'
      - '.github/workflows/verify-passport-account-passkeys-v1.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare/account-edge/src/hub-passport-account-v1.mjs'
      - 'cloudflare/account-edge/src/recovery-entry-v11.mjs'
      - 'cloudflare/account-edge/wrangler.jsonc'
      - 'cloudflare/node-cloud/src/account-directory-v1.mjs'
      - 'cloudflare/node-cloud/src/cloud-node-recovery-v2.mjs'
      - 'cloudflare/node-cloud/src/server-ai-entry-v5.mjs'
      - 'cloudflare/node-cloud/wrangler.jsonc'
      - 'cloudflare/cerbanimo-mail/src/index.mjs'
      - 'public/app/hub-passport-account-v1.js'
      - 'public/app/hub-recovery-ui-v1.js'
      - 'scripts/verify-passport-account-passkeys-v1.mjs'
      - '.github/workflows/verify-passport-account-passkeys-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Syntax check account security surfaces
        run: |
          node --check cloudflare/account-edge/src/hub-passport-account-v1.mjs
          node --check cloudflare/account-edge/src/recovery-entry-v11.mjs
          node --check cloudflare/node-cloud/src/account-directory-v1.mjs
          node --check cloudflare/node-cloud/src/cloud-node-recovery-v2.mjs
          node --check cloudflare/node-cloud/src/server-ai-entry-v5.mjs
          node --check public/app/hub-passport-account-v1.js
          node --check public/app/hub-recovery-ui-v1.js
      - name: Verify account-name, hidden-mail and 2FA contracts
        run: node scripts/verify-passport-account-passkeys-v1.mjs
