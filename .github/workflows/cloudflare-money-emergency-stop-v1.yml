name: Cloudflare Money Emergency Stop v1

on:
  workflow_dispatch:
    inputs:
      active:
        description: 'Turn the money-edge emergency stop on or off'
        required: true
        type: boolean
        default: true
      confirmation:
        description: 'To clear the stop, type exactly: CLEAR CIVWEAVE EMERGENCY STOP'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: civweave-cloudflare-money-edge-production
  cancel-in-progress: false

jobs:
  emergency-stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CIVWEAVE_LIVE_CORE_ORIGIN: https://civweave-core.cerbanimo.workers.dev
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 2; }
          if [ "${{ inputs.active }}" != 'true' ]; then
            test "${{ inputs.confirmation }}" = 'CLEAR CIVWEAVE EMERGENCY STOP' || { echo 'Exact confirmation phrase is required to clear the stop'; exit 3; }
          fi

      - name: Prepare remote-preserving core config
        id: config
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest d1 list --json > /tmp/civweave-d1.json
          D1_ID="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw = JSON.parse(fs.readFileSync('/tmp/civweave-d1.json','utf8'));
          const rows = Array.isArray(raw) ? raw : (raw.result || raw.databases || []);
          const row = rows.find(item => item?.name === 'civweave-core');
          process.stdout.write(String(row?.uuid || row?.id || row?.database_id || row?.databaseId || ''));
          NODE
          )"
          test -n "$D1_ID" || { echo 'civweave-core D1 database is missing'; exit 4; }
          node scripts/prepare-cloudflare-launch-kit-v1.mjs "--d1-id=$D1_ID"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = '.cloudflare-launch/core.wrangler.jsonc';
          let text = fs.readFileSync(path, 'utf8');
          text = text.replace(/\n  "routes": \[[\s\S]*?\n  \],/, '');
          text = text.replace(/\n  "r2_buckets": \[[\s\S]*?\n  \],/, '');
          const marker = '"vars": {';
          if (!text.includes(marker)) throw new Error('Generated Wrangler config is missing vars.');
          text = text.replace(marker, `${marker}\n    "CIVWEAVE_MONEY_EMERGENCY_STOP": "${process.env.EMERGENCY_ACTIVE}",`);
          fs.writeFileSync(path, text);
          NODE
          echo "path=.cloudflare-launch/core.wrangler.jsonc" >> "$GITHUB_OUTPUT"
        env:
          EMERGENCY_ACTIVE: ${{ inputs.active }}

      - name: Apply emergency stop state
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --keep-vars --config "${{ steps.config.outputs.path }}"

      - name: Verify emergency stop state
        shell: bash
        env:
          EXPECTED_ACTIVE: ${{ inputs.active }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 2 --retry-all-errors "$CIVWEAVE_LIVE_CORE_ORIGIN/api/money-edge/status" > /tmp/emergency-status.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/emergency-status.json', 'utf8'));
          const edge = payload.moneyEdge || payload;
          const blockers = edge.operationalBlockers || [];
          const expected = String(process.env.EXPECTED_ACTIVE) === 'true';
          const actual = blockers.includes('emergency-stop-active');
          if (actual !== expected) throw new Error(`Emergency stop verification mismatch: expected ${expected}, got ${actual}`);
          if (expected && edge.liveReady === true) throw new Error('Emergency stop is active but liveReady remained true.');
          console.log(JSON.stringify({ ok: true, emergencyStopActive: actual, providerMode: edge.providerMode, liveReady: edge.liveReady, operationalBlockers: blockers }, null, 2));
          NODE
