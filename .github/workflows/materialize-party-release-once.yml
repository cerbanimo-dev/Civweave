name: One-shot party release materialization

on:
  push:
    branches:
      - agent/shared-intention-party-chat
    paths:
      - .github/workflows/materialize-party-release-once.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/shared-intention-party-chat
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Synchronize package version
        shell: bash
        run: npm version "$(cat VERSION)" --no-git-tag-version --ignore-scripts

      - name: Materialize canonical release
        run: npm run release:materialize

      - name: Advance canonical release index
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const version=(await fs.readFile('VERSION','utf8')).trim();
          const path='config/release-contract.json';
          const contract=JSON.parse(await fs.readFile(path,'utf8'));
          contract.canonical.current.version=version;
          contract.canonical.current.path=`releases/${version}`;
          await fs.writeFile(path,`${JSON.stringify(contract,null,2)}\n`,'utf8');
          NODE

      - name: Verify generated release
        run: |
          node scripts/verify-canonical-launch-release.mjs
          node scripts/verify-shared-intention-party-chat-v1.mjs

      - name: Commit generated release and remove helper
        shell: bash
        run: |
          rm -f .github/workflows/materialize-party-release-once.yml
          git config user.name "civweave-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Materialize canonical release 1.0.141"
          git push origin HEAD:agent/shared-intention-party-chat
