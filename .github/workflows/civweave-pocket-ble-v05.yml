name: Civweave Pocket BLE v0.5 Android debug APK
on:
  push:
    branches: [feature/pocket-ble-v05]
    paths:
      - native/android/civweave-pocket-v05/**
      - .github/workflows/civweave-pocket-ble-v05.yml
  pull_request:
    branches: [staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare source archive
        run: |
          base64 -d native/android/civweave-pocket-v05/android-pocket-src.tar.xz.b64 | tar xJf -
          test -f android-pocket/app/build.gradle
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        working-directory: android-pocket
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: civweave-pocket-ble-v05-debug
          path: android-pocket/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
