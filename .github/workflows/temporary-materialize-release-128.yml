name: Temporary Materialize Civweave 1.0.128

on:
  push:
    branches:
      - agent/fulfillment-economy-v2-current
    paths:
      - '.github/workflows/temporary-materialize-release-128.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fulfillment-economy-v2-current
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Synchronize canonical release assets
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = "1.0.128"
          node scripts/sync-release-version-assets.mjs
          node scripts/build-service-worker-v211.mjs
          node scripts/sync-release-coherence-v220.mjs
          node scripts/generate-prelive-metadata-v281.mjs
      - name: Recompute canonical packaged-server hashes
        run: |
          node --input-type=module <<'NODE'
          import fsp from 'node:fs/promises';
          import crypto from 'node:crypto';
          import path from 'node:path';
          const version='1.0.128';
          const base='releases/'+version;
          const server=base+'/server';
          const sha256={};
          for(const name of (await fsp.readdir(server)).filter(name=>name.endsWith('.mjs')).sort()){
            const bytes=await fsp.readFile(path.join(server,name));
            sha256['server/'+name]=crypto.createHash('sha256').update(bytes).digest('hex');
          }
          const manifest={
            schema:'civweave.canonical-release.v1',
            version,
            status:'current',
            canonicalPath:base,
            sourceCommit:'pending-merge',
            basedOn:'1.0.127',
            runtime:{
              base:base+'/server/server.mjs',
              dev:base+'/server/server-v130.mjs',
              local:base+'/server/server-local-v131.mjs',
              gatewayBase:base+'/server/server-gateway-v131-base.mjs',
              gateway:base+'/server/server-gateway-v131.mjs',
              federated:base+'/server/server-federated-v152.mjs'
            },
            sha256
          };
          await fsp.writeFile(base+'/release.json',JSON.stringify(manifest,null,2)+'\n');
          NODE
      - name: Commit generated assets back to feature branch
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Generated release assets were already synchronized.'
            exit 0
          fi
          git config user.name 'civweave-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize generated Civweave 1.0.128 assets'
          git push origin HEAD:agent/fulfillment-economy-v2-current
