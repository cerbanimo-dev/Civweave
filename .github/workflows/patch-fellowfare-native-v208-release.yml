name: Prepare FellowFare Native v208 Release
on:
  push:
    branches: [fix/fellowfare-native-v208]
    paths: ['.github/workflows/patch-fellowfare-native-v208-release.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fellowfare-native-v208
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align FellowFare verifiers
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('scripts/verify-fellowfare-active-v203.mjs')
          s=p.read_text()
          s=s.replace('data-build="fellowfare-native-market-v207"','data-build="fellowfare-native-market-v208"')
          s=s.replace("assert(!outerHtml.includes('<iframe id=\\\"ffc144-workbench\\\"'),'Active FellowFare still contains the retired nested marketplace iframe.');", "assert(!outerHtml.includes('<iframe id=\\\"ffc144-workbench\\\"'),'Active FellowFare still contains the retired nested marketplace iframe.');\nassert(!outerHtml.includes('<script src=\\\"/app/fellowfare-mobile-flow-v205.js'),'Active FellowFare re-enabled the retired cross-document sizing runtime.');")
          s=s.replace("  '/app/fellowfare-native-v207.css',\n  '/app/fellowfare-native-host-v207.js'", "  '/app/fellowfare-native-v208.css',\n  '/app/fellowfare-native-scroll-v208.js',\n  '/app/fellowfare-native-host-v207.js'")
          s=s.replace("/app/services/fellowfare/marketplace-v2.js?v=native-v207", "/app/services/fellowfare/marketplace-v2.js?v=native-v208")
          p.write_text(s)
          Path('scripts/verify-fellowfare-native-v207.mjs').write_text("import './verify-fellowfare-native-v208.mjs';\n")
          PY
      - name: Materialize 1.0.131
        run: |
          printf '1.0.131\n' > VERSION
          npm pkg set version=1.0.131
          node scripts/materialize-canonical-release.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='config/release-contract.json';
          const value=JSON.parse(fs.readFileSync(file,'utf8'));
          value.canonical.current={version:'1.0.131',path:'releases/1.0.131',status:'current'};
          fs.writeFileSync(file,JSON.stringify(value,null,2)+'\n');
          NODE
      - name: Verify
        env:
          CHANGED_FILES: |
            public/app/fellowfare-cabinet-v144.html
            public/app/fellowfare-native-v208.css
            public/app/fellowfare-native-scroll-v208.js
            scripts/verify-fellowfare-native-v208.mjs
        run: |
          node --check public/app/fellowfare-native-scroll-v208.js
          node scripts/verify-fellowfare-native-v208.mjs
          node scripts/verify-fellowfare-native-v207.mjs
          node scripts/verify-fellowfare-active-v203.mjs
          node scripts/verify-version-policy.mjs 1.0.130 1.0.131
          node scripts/verify-canonical-launch-release.mjs
      - name: Commit
        run: |
          git config user.name civweave-release-bot
          git config user.email civweave-release-bot@users.noreply.github.com
          git add -A
          git commit -m 'Materialize Civweave 1.0.131 FellowFare native v208' || exit 0
          git push origin HEAD:fix/fellowfare-native-v208
