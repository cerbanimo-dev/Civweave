name: Verify Shared Review Surface v234

on:
  pull_request:
    paths:
      - 'public/app/shared-review-surface-v234.js'
      - 'public/app/install-boundary-v146.js'
      - 'public/app/index.html'
      - 'public/app/offline-campus-status-v210.js'
      - 'scripts/verify-shared-review-surface-v234.mjs'
      - 'scripts/verify-five-system-navigation-v227.mjs'
      - 'scripts/verify-canonical-core-only-v226.mjs'
      - '.github/workflows/verify-shared-review-surface-v234.yml'
      - 'VERSION'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - 'public/app/shared-review-surface-v234.js'
      - 'public/app/install-boundary-v146.js'
      - 'public/app/index.html'
      - 'public/app/offline-campus-status-v210.js'
      - 'scripts/verify-shared-review-surface-v234.mjs'
      - 'scripts/verify-five-system-navigation-v227.mjs'
      - 'scripts/verify-canonical-core-only-v226.mjs'
      - '.github/workflows/verify-shared-review-surface-v234.yml'
      - 'VERSION'
      - 'package.json'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax
        run: |
          node --check public/app/shared-review-surface-v234.js
          node --check public/app/install-boundary-v146.js
          node --check public/app/offline-campus-status-v210.js
          node --check scripts/verify-shared-review-surface-v234.mjs
          node --check scripts/verify-five-system-navigation-v227.mjs
          node --check scripts/verify-canonical-core-only-v226.mjs
      - name: Verify shared review and installer contracts
        run: node scripts/verify-shared-review-surface-v234.mjs
      - name: Verify five-system experience boundary
        run: node scripts/verify-five-system-navigation-v227.mjs
      - name: Verify canonical core boundary
        run: node scripts/verify-canonical-core-only-v226.mjs
