name: One-shot Kamido Guild Worker resident sessions v1

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/one-shot-kamido-guild-worker-sessions-v1.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: civweave-guild-cloud
      WORKER_ORIGIN: https://civweave-guild-cloud.new-new-york-84759cba63.workers.dev
      EXPECTED_GUILD_ID: kamido-356e5z30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refuse the wrong Cloudflare target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test "$WORKER_NAME" = 'civweave-guild-cloud'
          status="$(curl -fsS "$WORKER_ORIGIN/api/guild/status")"
          node -e 'const s=JSON.parse(process.argv[1]); if(s.claimed!==true||s.guildId!==process.env.EXPECTED_GUILD_ID) process.exit(2)' "$status"

      - name: Build deployment config that preserves the existing claim secret
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'cloudflare/mobile-guild-edge/wrangler.jsonc';
          const config = JSON.parse(readFileSync(path, 'utf8'));
          delete config.secrets;
          writeFileSync('cloudflare/mobile-guild-edge/wrangler.kamido.json', JSON.stringify(config, null, 2));
          NODE

      - name: Compile Mobile Guild Worker
        run: npx --yes wrangler@4 deploy --config cloudflare/mobile-guild-edge/wrangler.kamido.json --name "$WORKER_NAME" --dry-run --outdir /tmp/civweave-guild-cloud-dry-run

      - name: Deploy resident-session Worker without replacing secrets
        run: npx --yes wrangler@4 deploy --config cloudflare/mobile-guild-edge/wrangler.kamido.json --name "$WORKER_NAME" --keep-vars

      - name: Verify claimed Guild, capacity and login route
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const origin = process.env.WORKER_ORIGIN;
          const guildId = process.env.EXPECTED_GUILD_ID;
          let last = 'not checked';
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const bust = `${Date.now()}-${attempt}`;
              const [statusResponse, capacityResponse, loginResponse] = await Promise.all([
                fetch(`${origin}/api/guild/status?verify=${bust}`, { headers: { 'cache-control': 'no-cache' } }),
                fetch(`${origin}/api/fabric/capacity?verify=${bust}`, { headers: { 'cache-control': 'no-cache' } }),
                fetch(`${origin}/api/ai/node/session?nodeId=${encodeURIComponent(guildId)}&verify=${bust}`, { headers: { 'cache-control': 'no-cache' } }),
              ]);
              const status = await statusResponse.json().catch(() => ({}));
              const capacity = await capacityResponse.json().catch(() => ({}));
              const login = await loginResponse.json().catch(() => ({}));
              if (
                statusResponse.ok && status.claimed === true && status.guildId === guildId &&
                capacityResponse.ok && capacity.capacityAvailable === true &&
                capacity.residentSessionSchema === 'civweave.mobile-guild-capacity-session.v1' &&
                Number.isFinite(Number(capacity.slots?.free)) &&
                loginResponse.status === 401 && /capacity session/i.test(String(login.error || ''))
              ) {
                console.log(JSON.stringify({ ok: true, guildId, capacity, unauthenticatedLoginStatus: loginResponse.status }));
                process.exit(0);
              }
              last = JSON.stringify({ status: statusResponse.status, statusBody: status, capacity: capacityResponse.status, capacityBody: capacity, login: loginResponse.status, loginBody: login });
            } catch (error) {
              last = String(error?.stack || error);
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          console.error(`Kamido Worker verification failed: ${last}`);
          process.exit(3);
          NODE
