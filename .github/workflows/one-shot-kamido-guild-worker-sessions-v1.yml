name: One-shot Kamido Guild Worker cleanup v1

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/one-shot-kamido-guild-worker-sessions-v1.yml'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: civweave-guild-cloud
      ACCIDENTAL_ORIGIN: https://civweave-guild-cloud.cerbanimo.workers.dev
      KAMIDO_ORIGIN: https://civweave-guild-cloud.new-new-york-84759cba63.workers.dev
      EXPECTED_GUILD_ID: kamido-356e5z30

    steps:
      - uses: actions/checkout@v4

      - name: Prove the Cerbanimo-account Worker is the unclaimed accidental deployment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          accidental="$(curl -fsS "$ACCIDENTAL_ORIGIN/api/guild/status")"
          kamido="$(curl -fsS "$KAMIDO_ORIGIN/api/guild/status")"
          node --input-type=module - "$accidental" "$kamido" <<'NODE'
          const accidental = JSON.parse(process.argv[2]);
          const kamido = JSON.parse(process.argv[3]);
          if (accidental.claimed !== false || accidental.guildId != null || Number(accidental.storedEnvelopes || 0) !== 0) {
            throw new Error('Refusing to delete: the Cerbanimo-account Worker is no longer the empty accidental deployment.');
          }
          if (kamido.claimed !== true || kamido.guildId !== process.env.EXPECTED_GUILD_ID) {
            throw new Error('Refusing cleanup: the real Kamido Worker identity changed.');
          }
          NODE

      - name: Delete only the accidental Cerbanimo-account Worker
        run: npx --yes wrangler@4 delete --config cloudflare/mobile-guild-edge/wrangler.jsonc --name "$WORKER_NAME" --force

      - name: Verify Kamido was untouched
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -fsS "$KAMIDO_ORIGIN/api/guild/status?verify=post-wrong-account-cleanup")"
          node -e 'const s=JSON.parse(process.argv[1]); if(s.claimed!==true||s.guildId!==process.env.EXPECTED_GUILD_ID) process.exit(2)' "$status"
          if curl -fsS "$ACCIDENTAL_ORIGIN/api/guild/status?verify=deleted" >/dev/null 2>&1; then
            echo 'Accidental Cerbanimo-account Worker still responds.' >&2
            exit 3
          fi
