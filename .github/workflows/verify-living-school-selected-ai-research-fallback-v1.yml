name: Verify Living School selected AI research fallback

on:
  push:
    branches: [staging]
    paths:
      - 'public/app/living-school-local-research-v243.mjs'
      - 'scripts/verify-living-school-selected-ai-research-fallback-v1.mjs'
      - '.github/workflows/verify-living-school-selected-ai-research-fallback-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check public/app/living-school-local-research-v243.mjs
          node --check scripts/verify-living-school-selected-ai-research-fallback-v1.mjs
      - name: Verify selected AI fallback
        run: node scripts/verify-living-school-selected-ai-research-fallback-v1.mjs
