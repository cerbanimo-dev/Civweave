name: Verify Video Learning Contract v1

on:
  workflow_dispatch:
  push:
    branches:
      - agent/video-learning-atlas-v1
    paths:
      - public/app/video-learning-contract-v1.mjs
      - public/app/living-school-video-generation-guard-v1.mjs
      - public/app/cabinets/living-school/living-school-cleanroom-v218.mjs
      - public/app/cerbanimo-video-task-contract-v1.mjs
      - public/app/realm-console-v140.html
      - public/app/video-atlas-installer-v1.js
      - public/app/index.html
      - scripts/build-video-learning-atlas-v1.py
      - scripts/build-video-learning-atlas-parallel-v1.py
      - scripts/materialize-video-learning-lookup-v1.py
      - scripts/verify-video-learning-contract-v1.mjs
      - scripts/test-video-learning-contract-v1.mjs
      - .github/workflows/verify-video-learning-contract-v1.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse video contract modules
        run: |
          node --check public/app/video-learning-contract-v1.mjs
          node --check public/app/living-school-video-generation-guard-v1.mjs
          node --check public/app/cabinets/living-school/living-school-cleanroom-v218.mjs
          node --check public/app/cerbanimo-video-task-contract-v1.mjs
          node --check public/app/video-atlas-installer-v1.js
          python -m py_compile scripts/build-video-learning-atlas-v1.py scripts/build-video-learning-atlas-parallel-v1.py scripts/materialize-video-learning-lookup-v1.py
      - name: Verify cross-realm video invariants
        run: node scripts/verify-video-learning-contract-v1.mjs
      - name: Exercise resolver and fallback behavior
        run: node scripts/test-video-learning-contract-v1.mjs
