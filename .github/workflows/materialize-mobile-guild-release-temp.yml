name: TEMP Materialize Mobile Guild Release

on:
  push:
    branches:
      - feature/mobile-guild-download-onboarding

permissions:
  contents: write

concurrency:
  group: materialize-mobile-guild-release
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/mobile-guild-download-onboarding
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Set 1.0.163 release version
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const version='1.0.163';
          await writeFile('VERSION',`${version}\n`,'utf8');
          const pkg=JSON.parse(await readFile('package.json','utf8'));
          pkg.version=version;
          await writeFile('package.json',`${JSON.stringify(pkg,null,2)}\n`,'utf8');
          NODE
      - name: Materialize canonical release
        run: node scripts/materialize-canonical-release.mjs
      - name: Commit generated release assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION package.json config/release-contract.json releases/1.0.163 public scripts
          if git diff --cached --quiet; then
            echo 'No generated release changes to commit.'
            exit 0
          fi
          git commit -m 'Materialize Civweave 1.0.163 mobile Guild release'
          git push origin HEAD:feature/mobile-guild-download-onboarding
