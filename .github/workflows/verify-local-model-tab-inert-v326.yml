name: Verify Local Models Inert View

on:
  push:
    branches: [staging, main, fix/local-model-view-fresh-route-v328]
    paths:
      - public/app/settings-local-route-v323.js
      - public/app/settings-local-route-v325.js
      - public/app/settings-local-route-v327.js
      - public/app/settings-local-route-v331.js
      - public/app/persistent-system-shell-v1.html
      - public/app/working-campus-v440.html
      - scripts/verify-local-model-tab-inert-v326.mjs
      - .github/workflows/verify-local-model-tab-inert-v326.yml
  pull_request:
    branches: [staging, main]
    paths:
      - public/app/settings-local-route-v323.js
      - public/app/settings-local-route-v325.js
      - public/app/settings-local-route-v327.js
      - public/app/settings-local-route-v331.js
      - public/app/persistent-system-shell-v1.html
      - public/app/working-campus-v440.html
      - scripts/verify-local-model-tab-inert-v326.mjs
      - .github/workflows/verify-local-model-tab-inert-v326.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-local-model-tab-inert-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inert-view:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Syntax check canonical and compatibility routes
        run: |
          node --check public/app/settings-local-route-v325.js
          node --check public/app/settings-local-route-v323.js
          node --check public/app/settings-local-route-v327.js
          node --check public/app/settings-local-route-v331.js
          node --check scripts/verify-local-model-tab-inert-v326.mjs
      - name: Verify live Local models route is inert and canonical
        run: node scripts/verify-local-model-tab-inert-v326.mjs
