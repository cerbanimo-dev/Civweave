name: Verify Cerbanimo Deterministic Boundary v203

on:
  push:
    branches: [main]
    paths:
      - 'public/app/cerbanimo-deterministic-boundary-v203.js'
      - 'public/service-worker-critical-v199.js'
      - 'public/service-worker-v156.js'
      - 'scripts/verify-cerbanimo-deterministic-boundary-v203.mjs'
      - '.github/workflows/verify-cerbanimo-deterministic-boundary-v203.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/app/cerbanimo-deterministic-boundary-v203.js'
      - 'public/service-worker-critical-v199.js'
      - 'public/service-worker-v156.js'
      - 'scripts/verify-cerbanimo-deterministic-boundary-v203.mjs'
      - '.github/workflows/verify-cerbanimo-deterministic-boundary-v203.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Syntax check boundary and package workers
        run: |
          node --check public/app/cerbanimo-deterministic-boundary-v203.js
          node --check public/service-worker-critical-v199.js
          node --check public/service-worker-v156.js
          node --check scripts/verify-cerbanimo-deterministic-boundary-v203.mjs
      - name: Verify deterministic provider boundary
        run: node scripts/verify-cerbanimo-deterministic-boundary-v203.mjs
