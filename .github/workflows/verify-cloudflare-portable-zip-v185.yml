name: Verify Cloudflare Portable ZIP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check portable release build
        run: |
          node --check scripts/portable-zip.mjs
          node --check scripts/build-cloudflare-pages.mjs
          node --check scripts/verify-cloudflare-portable-zip-v185.mjs
      - name: Build Pages output without system zip
        run: node scripts/verify-cloudflare-portable-zip-v185.mjs
      - name: Verify Workers static-assets deployment configuration
        run: npx --yes wrangler@4.118.0 deploy --dry-run
