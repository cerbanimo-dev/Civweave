name: Verify Cloudflare Portable ZIP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Pages build dependencies
        run: npm install --ignore-scripts
      - name: Syntax check portable release build
        run: |
          node --check scripts/portable-zip.mjs
          node --check scripts/build-cloudflare-pages.mjs
          node --check scripts/verify-cloudflare-portable-zip-v185.mjs
      - name: Build Pages output without system zip
        run: node scripts/verify-cloudflare-portable-zip-v185.mjs
      - name: Verify Pages deployment configuration
        run: |
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); if(c.pages_build_output_dir!=='./.cloudflare-pages') throw new Error('Pages output directory is not configured'); if(c.assets) throw new Error('Workers static-assets config must not replace Pages');"
          test -f .cloudflare-pages/index.html
