name: Apply Japanese visible-copy v3

on:
  push:
    paths:
      - '.github/workflows/apply-japanese-visible-copy-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply curated Japanese coverage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/apply-japanese-visible-copy-v3.mjs')
          text=path.read_text()
          start=text.index('function insertExact(')
          end=text.index('\n\nlet mode =',start)
          replacement=r'''function insertExact(source, additions, startMarker, endMarker) {
            const keys = existingKeys(source, startMarker, endMarker);
            const missing = additions.filter(([key]) => !keys.has(key));
            if (!missing.length) return source;
            const block = missing.map(([en,ja]) => `  [${JSON.stringify(en)},${JSON.stringify(ja)}]`).join(',\n');
            const end = source.indexOf(endMarker, source.indexOf(startMarker) + startMarker.length);
            const close = source.lastIndexOf(']);', end);
            if (end < 0 || close < 0) throw new Error(`Could not find exact insertion boundary for ${endMarker}`);
            return source.slice(0, close) + `,\n${block}\n` + source.slice(close);
          }'''
          path.write_text(text[:start]+replacement+text[end:])
          PY
          node --check scripts/apply-japanese-visible-copy-v3.mjs
          node scripts/apply-japanese-visible-copy-v3.mjs
          node --check public/app/japanese-mode-v1.js
          node --check public/app/japanese-shell-copy-v1.js
          node scripts/verify-japanese-mode-v1.mjs
      - name: Commit translated copy
        run: |
          set -euo pipefail
          git config user.name "cerbanimo-dev"
          git config user.email "cerbanimo@gmail.com"
          git add public/app/japanese-mode-v1.js public/app/japanese-shell-copy-v1.js scripts/verify-japanese-mode-v1.mjs
          git rm -f scripts/apply-japanese-visible-copy-v3.mjs .github/workflows/apply-japanese-visible-copy-v3.yml
          git commit -m "Translate remaining Japanese interface copy"
          git push origin HEAD:fix/japanese-localization-v3-coverage
