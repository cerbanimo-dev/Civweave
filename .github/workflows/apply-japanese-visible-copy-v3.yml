name: Apply Japanese visible-copy v3

on:
  push:
    paths:
      - '.github/workflows/apply-japanese-visible-copy-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply curated Japanese coverage
        run: |
          set -euo pipefail
          node --check scripts/apply-japanese-visible-copy-v3.mjs
          node scripts/apply-japanese-visible-copy-v3.mjs
          node --check public/app/japanese-mode-v1.js
          node --check public/app/japanese-shell-copy-v1.js
          node scripts/verify-japanese-mode-v1.mjs
      - name: Commit translated copy
        run: |
          set -euo pipefail
          git config user.name "cerbanimo-dev"
          git config user.email "cerbanimo@gmail.com"
          git add public/app/japanese-mode-v1.js public/app/japanese-shell-copy-v1.js
          git rm scripts/apply-japanese-visible-copy-v3.mjs .github/workflows/apply-japanese-visible-copy-v3.yml
          git commit -m "Translate remaining Japanese interface copy"
          git push origin HEAD:fix/japanese-localization-v3-coverage
