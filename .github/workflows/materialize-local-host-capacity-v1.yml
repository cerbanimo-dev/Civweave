name: Materialize local Host live capacity

on:
  push:
    branches: [feat/local-host-live-capacity]
    paths:
      - '.github/scripts/materialize-local-host-capacity-v1.py'
      - '.github/workflows/materialize-local-host-capacity-v1.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/local-host-live-capacity
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Materialize Civweave 1.0.120
        run: python3 .github/scripts/materialize-local-host-capacity-v1.py
      - name: Verify local Host capacity
        shell: bash
        run: |
          node --check lib/local-host-capacity-v1.mjs
          node --check public/app/host-node-local-capacity-v1.js
          node --check lib/ai-wallet-http-v1.mjs
          node --check lib/node-ai-live-commerce-v1.mjs
          node --check releases/1.0.120/server/server-federated-v152.mjs
          node scripts/test-local-host-capacity-v1.mjs
          node scripts/verify-host-node-installer-lobby-v1.mjs
          node scripts/check-canonical-server-syntax.mjs
          grep -q '/api/federation/capacity' releases/1.0.120/server/server-federated-v152.mjs
          grep -q 'host-node-local-capacity-v1.js' public/app/host-node-installer-lobby-v1.js
      - name: Commit generated release
        shell: bash
        run: |
          git config user.name 'civweave-release-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION package.json docker-compose.federated.yml lib public/app scripts releases/1.0.120
          git commit -m 'Ship Civweave 1.0.120 live local Host capacity'
          git push origin HEAD:feat/local-host-live-capacity
