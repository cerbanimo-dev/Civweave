name: Deploy New New York Territory Host v1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civweave-new-new-york-territory-host
  cancel-in-progress: false

jobs:
  deploy-territory-host:
    name: Deploy isolated New New York host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.NEW_NEW_YORK_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.NEW_NEW_YORK_CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: civweave-new-new-york
      CIVWEAVE_HOST_ID: new-new-york
      TERRITORY_ID: us
      TERRITORY_NAME: New New York
      STEWARD_APPOINTMENT_ID: steward-us-cami-20260814

    steps:
      - name: Check out current source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require New New York Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing NEW_NEW_YORK_CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing NEW_NEW_YORK_CLOUDFLARE_ACCOUNT_ID'; exit 2; }
          npx --yes wrangler@4 whoami

      - name: Ensure the New New York Pages shell exists
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const account = encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID);
          const project = process.env.PAGES_PROJECT;
          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, 'Content-Type': 'application/json' };
          const base = `https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects`;
          const lookup = await fetch(`${base}/${encodeURIComponent(project)}`, { headers });
          if (lookup.status === 404) {
            const created = await fetch(base, { method: 'POST', headers, body: JSON.stringify({ name: project, production_branch: 'main' }) });
            const packet = await created.json().catch(() => ({}));
            if (!created.ok || packet.success !== true) throw new Error(`Could not create ${project}: ${JSON.stringify(packet.errors || packet)}`);
          } else {
            const packet = await lookup.json().catch(() => ({}));
            if (!lookup.ok || packet.success !== true) throw new Error(`Could not access ${project}: ${JSON.stringify(packet.errors || packet)}`);
          }
          console.log(`${project} is ready.`);
          NODE

      - name: Provision the territory account edge and starter nodes
        run: >-
          node scripts/provision-cloudflare-account-edge-v1.mjs
          --host-id "$CIVWEAVE_HOST_ID"
          --strict
          --output /tmp/new-new-york-account-edge.json

      - name: Verify the authority candidate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const snapshot = JSON.parse(fs.readFileSync('/tmp/new-new-york-account-edge.json', 'utf8'));
          if (snapshot.status !== 'ready' || !Array.isArray(snapshot.starterNodes) || snapshot.starterNodes.length !== 3) throw new Error('New New York account edge is not fully provisioned.');
          const candidate = snapshot.starterNodes.find(node => node.nodeId === 'new-new-york-a');
          if (!candidate?.publicOrigin) throw new Error('new-new-york-a is missing from the account edge.');
          console.log(`Authority candidate: ${candidate.nodeId} at ${candidate.publicOrigin}`);
          NODE

      - name: Build current Civweave Pages tree
        run: node scripts/build-cloudflare-pages.mjs

      - name: Build this host's Cerbanimo surface
        shell: bash
        run: |
          set -euo pipefail
          pages_origin="https://${PAGES_PROJECT}.pages.dev"
          node site/cerbanimo-cc/build.mjs \
            --output .cloudflare-pages/cerbanimo \
            --base /cerbanimo/ \
            --role community \
            --host-id "$CIVWEAVE_HOST_ID" \
            --public-origin "$pages_origin" \
            --pages-origin "$pages_origin"

      - name: Record isolated territory-host metadata
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const accountEdge = JSON.parse(fs.readFileSync('/tmp/new-new-york-account-edge.json', 'utf8'));
          const candidate = accountEdge.starterNodes.find(node => node.nodeId === 'new-new-york-a');
          const pagesOrigin = `https://${process.env.PAGES_PROJECT}.pages.dev`;
          fs.mkdirSync('.cloudflare-pages/app', { recursive: true });
          fs.writeFileSync('.cloudflare-pages/app/host-deployment-v1.json', `${JSON.stringify({
            schema: 'civweave.host-deployment.v1',
            role: 'territory-steward',
            hostId: process.env.CIVWEAVE_HOST_ID,
            displayName: process.env.TERRITORY_NAME,
            pagesProject: process.env.PAGES_PROJECT,
            pagesOrigin,
            publicOrigin: pagesOrigin,
            canonicalOrigin: 'https://civweave.cc',
            territory: {
              territoryId: process.env.TERRITORY_ID,
              stewardAppointmentId: process.env.STEWARD_APPOINTMENT_ID,
              authorityCandidateNodeId: candidate.nodeId,
              authorityCandidateOrigin: candidate.publicOrigin,
              authorityStatus: 'pending-root-binding'
            },
            trafficBoundary: {
              browserTraffic: 'pages-only',
              nodeFabricTraffic: 'account-edge-only',
              founderRootSecretsPresent: false,
              founderSourceNode: false
            },
            accountEdge,
            localAnchorRecommended: true,
            localAnchorRequired: false,
            sourceCommit: process.env.GITHUB_SHA,
            generatedAt: new Date().toISOString()
          }, null, 2)}\n`);
          NODE

      - name: Deploy the New New York Pages shell
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy .cloudflare-pages \
            --project-name "$PAGES_PROJECT" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$(git log -1 --pretty=%s)" \
            --commit-dirty=true

      - name: Verify browser and node traffic remain separate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pages = `https://${process.env.PAGES_PROJECT}.pages.dev`;
          const edge = JSON.parse(fs.readFileSync('/tmp/new-new-york-account-edge.json', 'utf8'));
          const candidate = edge.starterNodes.find(node => node.nodeId === 'new-new-york-a');
          let last = '';
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const [markerResponse, pageResponse, manifestResponse] = await Promise.all([
                fetch(`${pages}/app/host-deployment-v1.json?verify=${Date.now()}`, { cache: 'no-store' }),
                fetch(`${pages}/app/campus.html?verify=${Date.now()}`, { cache: 'no-store' }),
                fetch(new URL('api/ai/node/manifest', candidate.publicOrigin), { cache: 'no-store' })
              ]);
              if (!markerResponse.ok || !pageResponse.ok || !manifestResponse.ok) throw new Error(`HTTP marker=${markerResponse.status} page=${pageResponse.status} node=${manifestResponse.status}`);
              const marker = await markerResponse.json();
              const envelope = await manifestResponse.json();
              const manifest = envelope.manifest || envelope;
              if (marker.trafficBoundary?.browserTraffic !== 'pages-only') throw new Error('browser traffic boundary marker is missing');
              if (marker.trafficBoundary?.founderRootSecretsPresent !== false) throw new Error('territory shell claims founder secrets');
              if (manifest.nodeId !== 'new-new-york-a') throw new Error('authority candidate identity mismatch');
              console.log(`Verified ${pages} and ${candidate.publicOrigin}.`);
              process.exit(0);
            } catch (error) { last = `attempt ${attempt}: ${error.message}`; }
            if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error(last);
          NODE
