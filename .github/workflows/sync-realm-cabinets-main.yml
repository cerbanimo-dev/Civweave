name: Sync realm cabinets with main

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/realm-cabinet-consoles-v140-current
          fetch-depth: 0
      - name: Merge current main into the cabinet branch
        run: |
          set -euxo pipefail
          git config user.name commonweave-release-bot
          git config user.email commonweave-release-bot@users.noreply.github.com
          git fetch origin main
          git merge --no-ff origin/main -m "Merge current main into realm cabinet overhaul"
          git push origin HEAD:feature/realm-cabinet-consoles-v140-current
