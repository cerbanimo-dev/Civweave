name: Verify Jules Evergreen

on:
  pull_request:
    paths:
      - '.github/jules-evergreen.json'
      - '.github/workflows/jules-evergreen-daemon.yml'
      - '.github/workflows/sync-jules-evergreen-branch.yml'
      - '.github/workflows/verify-jules-evergreen.yml'
      - 'scripts/jules-evergreen-daemon.mjs'
      - 'scripts/lib/jules-api-client.mjs'
      - 'scripts/lib/github-evergreen-client.mjs'
      - 'scripts/lib/jules-evergreen-core.mjs'
      - 'scripts/test-jules-evergreen-core.mjs'
      - 'scripts/verify-jules-evergreen.mjs'
      - 'docs/JULES-EVERGREEN.md'
      - 'docs/roadmap/ten-year-pipeline.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax
        run: |
          node --check scripts/lib/jules-evergreen-core.mjs
          node --check scripts/lib/jules-api-client.mjs
          node --check scripts/lib/github-evergreen-client.mjs
          node --check scripts/jules-evergreen-daemon.mjs
          node --check scripts/verify-jules-evergreen.mjs
      - name: Run unit tests
        run: node --test scripts/test-jules-evergreen-core.mjs
      - name: Verify safety and queue contracts
        run: node scripts/verify-jules-evergreen.mjs
