name: Verify Version Bump

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  require-higher-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require every change to advance Civweave
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          base_version="$(git show "origin/${{ github.base_ref }}:VERSION" | tr -d '[:space:]')"
          proposed_version="$(tr -d '[:space:]' < VERSION)"
          node - "$base_version" "$proposed_version" <<'NODE'
          const [base, proposed] = process.argv.slice(2);
          const parse = value => {
            const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(value);
            if (!match) throw new Error(`Invalid semantic version: ${value}`);
            return match.slice(1).map(Number);
          };
          const left = parse(base);
          const right = parse(proposed);
          const greater = right.some((value, index) => value > left[index] && right.slice(0, index).every((part, prior) => part === left[prior]));
          if (!greater) {
            console.error(`Every Civweave PR must advance VERSION. Base is ${base}; proposed is ${proposed}.`);
            process.exit(1);
          }
          console.log(`Civweave version advances from ${base} to ${proposed}.`);
          NODE

  synchronize-release:
    if: github.event.pull_request.head.ref == 'fix/civweave-post-rename-checks'
    needs: require-higher-version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize Civweave release surfaces
        run: |
          node scripts/sync-release-version-assets.mjs
          node scripts/sync-release-coherence-v220.mjs
      - name: Commit synchronized release assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'Release surfaces are already synchronized.'
            exit 0
          fi
          git commit -m "Synchronize Civweave v1.0.18 release assets"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
