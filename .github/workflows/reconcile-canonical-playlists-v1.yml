name: Reconcile Canonical Playlists v1

on:
  schedule:
    - cron: '19 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-playlist-reconcile-v1
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Reconcile approved Anarchadia playlist events
        env:
          SPOTIFY_ACCESS_TOKEN: ${{ secrets.SPOTIFY_ACCESS_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          CIVWEAVE_CANONICAL_PLAYLIST_QUEUE_URL: ${{ vars.CIVWEAVE_CANONICAL_PLAYLIST_QUEUE_URL }}
          CIVWEAVE_CANONICAL_PLAYLIST_RECEIPT_URL: ${{ vars.CIVWEAVE_CANONICAL_PLAYLIST_RECEIPT_URL }}
          CIVWEAVE_CANONICAL_PLAYLIST_RECEIPT_TOKEN: ${{ secrets.CIVWEAVE_CANONICAL_PLAYLIST_RECEIPT_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "${SPOTIFY_ACCESS_TOKEN:-}" ] && { [ -z "${SPOTIFY_CLIENT_ID:-}" ] || [ -z "${SPOTIFY_CLIENT_SECRET:-}" ] || [ -z "${SPOTIFY_REFRESH_TOKEN:-}" ]; }; then
            echo 'Spotify credentials are not configured; refusing to pretend playlist reconciliation ran.'
            exit 1
          fi
          node scripts/reconcile-canonical-playlists-v1.mjs --write
      - name: Persist enriched provider mappings
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/downloads/hub-media/open-music/provider-enrichment.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh canonical music provider mappings'
          git pull --rebase origin main
          git push origin HEAD:main
