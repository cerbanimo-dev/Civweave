name: Jules Evergreen Daemon

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect the queue without launching, merging, or mutating a PR
        type: boolean
        default: false

permissions:
  contents: read
  checks: read
  pull-requests: write
  issues: write

concurrency:
  group: commonweave-jules-evergreen
  cancel-in-progress: false

jobs:
  daemon:
    if: vars.JULES_EVERGREEN_ENABLED != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify evergreen control logic
        run: |
          node --test scripts/test-jules-evergreen-core.mjs
          node scripts/verify-jules-evergreen.mjs

      - name: Monitor Jules work, auto-merge eligible PRs, and launch the next bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVERGREEN_GITHUB_TOKEN: ${{ secrets.EVERGREEN_GITHUB_TOKEN }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_EVERGREEN_ENABLED: ${{ vars.JULES_EVERGREEN_ENABLED }}
          JULES_AUTOMERGE_ENABLED: ${{ vars.JULES_AUTOMERGE_ENABLED }}
          JULES_DAILY_TASK_BUDGET: ${{ vars.JULES_DAILY_TASK_BUDGET }}
          JULES_MINIMUM_MINUTES_BETWEEN_LAUNCHES: ${{ vars.JULES_MINIMUM_MINUTES_BETWEEN_LAUNCHES }}
          JULES_FAILURE_FEEDBACK_AFTER_MINUTES: ${{ vars.JULES_FAILURE_FEEDBACK_AFTER_MINUTES }}
          JULES_FAILED_RETRY_CAP: ${{ vars.JULES_FAILED_RETRY_CAP }}
          JULES_DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/jules-evergreen-daemon.mjs
