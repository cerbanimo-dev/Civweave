name: Verify Canonical Rewards v2

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-rewards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check reward runtime syntax
        run: |
          node --check public/app/cw-reward-ledger-v2.js
          node --check public/app/cw-reward-receivers-v2.js
          node --check public/app/cw-reward-legacy-bridge-v2.js
          node --check public/app/cw-reward-surfaces-v2.js
          node --check lib/contribution-ledger-v1.mjs
          node --check scripts/test-contribution-ledger-v1.mjs
          node --check scripts/verify-canonical-rewards-v2.mjs
          node --check scripts/verify-reward-model-contract-v2.mjs
      - name: Verify contribution currency invariants
        run: node --test scripts/test-contribution-ledger-v1.mjs
      - name: Verify ledger, Passport, prompts, and receivers
        run: |
          node scripts/verify-canonical-rewards-v2.mjs
          node scripts/verify-reward-model-contract-v2.mjs
      - name: Verify offline package seeds
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('public/app/offline-package-v208.json','utf8'));
          const required=['/app/cw-reward-ledger-v2.js','/app/cw-reward-receivers-v2.js','/app/cw-reward-legacy-bridge-v2.js','/app/cw-reward-surfaces-v2.js'];
          for(const path of required){if(!manifest.seeds.includes(path))throw new Error(`Offline package omits ${path}`)}
          console.log('canonical reward runtimes are seeded for offline use');
          NODE
