name: Verify Canonical Rewards v2

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-rewards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check reward runtime syntax
        run: |
          node --check public/app/cw-reward-ledger-v2.js
          node --check public/app/cw-reward-receivers-v2.js
          node --check public/app/cw-reward-legacy-bridge-v2.js
          node --check public/app/cw-reward-surfaces-v2.js
          node --check lib/contribution-ledger-v1.mjs
          node --check lib/contribution-mesh-v1.mjs
          node --check lib/contribution-security-v1.mjs
          node --check lib/contribution-validator-committee-v2.mjs
          node --check public/app/shared/civweave-contribution-mesh-v1.js
          node --check public/app/shared/civweave-contribution-security-v1.js
          node --check public/app/shared/civweave-validator-committee-v2.js
          node --check public/app/shared/civweave-contribution-ship-guard-v1.js
          node --check public/app/shared/civweave-canonical-reward-mesh-bridge-v1.js
          node --check public/app/contribution-security-settings-entry-v1.js
          node --check public/app/contribution-security-v1.js
          node --check public/app/phone-ledger-bootstrap-v1.js
          node --check public/app/local-first-policy-v131.js
          node --check public/app/document-lifecycle-v221.js
          node --check public/app/installed-entry-v146.js
          node --check scripts/test-contribution-ledger-v1.mjs
          node --check scripts/test-contribution-mesh-v1.mjs
          node --check scripts/test-contribution-security-v1.mjs
          node --check scripts/test-contribution-validator-committee-v2.mjs
          node --check scripts/test-contribution-security-browser-v1.mjs
          node --check scripts/test-contribution-browser-committee-v2.mjs
          node --check scripts/test-canonical-reward-mesh-bridge-v1.mjs
          node --check scripts/test-contribution-browser-adapter-v1.mjs
          node --check scripts/test-phone-ledger-bootstrap-v1.mjs
          node --check scripts/verify-canonical-rewards-v2.mjs
          node --check scripts/verify-reward-model-contract-v2.mjs
      - name: Verify contribution currency invariants
        run: node --test scripts/test-contribution-ledger-v1.mjs
      - name: Verify contribution mesh invariants
        run: node --test scripts/test-contribution-mesh-v1.mjs
      - name: Verify ship security, recovery, and partition policy
        run: node --test scripts/test-contribution-security-v1.mjs
      - name: Verify earned validator committee v2 invariants
        run: node --test scripts/test-contribution-validator-committee-v2.mjs
      - name: Verify browser contribution security and containment
        run: node --test scripts/test-contribution-security-browser-v1.mjs
      - name: Verify browser earned committee and canonical reward bridge
        run: node --test scripts/test-contribution-browser-committee-v2.mjs scripts/test-canonical-reward-mesh-bridge-v1.mjs
      - name: Verify browser mesh identity compatibility
        run: node --test scripts/test-contribution-browser-adapter-v1.mjs
      - name: Verify hostless qualified-committee phone ledger boot
        run: node --test scripts/test-phone-ledger-bootstrap-v1.mjs
      - name: Verify ledger, Passport, prompts, and receivers
        run: |
          node scripts/verify-canonical-rewards-v2.mjs
          node scripts/verify-reward-model-contract-v2.mjs
      - name: Verify offline package seeds
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('public/app/offline-package-v208.json','utf8'));
          const required=['/app/cw-reward-ledger-v2.js','/app/cw-reward-receivers-v2.js','/app/cw-reward-legacy-bridge-v2.js','/app/cw-reward-surfaces-v2.js'];
          for(const path of required){if(!manifest.seeds.includes(path))throw new Error(`Offline package omits ${path}`)}
          const phoneLedger=['/app/local-first-policy-v131.js','/app/local-object-mesh-v146.js','/app/shared/civweave-contribution-mesh-v1.js','/app/shared/civweave-contribution-security-v1.js','/app/shared/civweave-validator-committee-v2.js','/app/shared/civweave-contribution-ship-guard-v1.js','/app/shared/civweave-canonical-reward-mesh-bridge-v1.js','/app/contribution-security-settings-entry-v1.js','/app/contribution-security-v1.html','/app/contribution-security-v1.js','/app/phone-ledger-bootstrap-v1.js'];
          for(const path of phoneLedger){if(!manifest.assets.includes(path))throw new Error(`Offline package omits ${path}`)}
          if(manifest.phoneLedgerRevision!=='phone-ledger-r4-qualified-committees')throw new Error('Offline package is not pinned to the qualified-committee phone-ledger revision');
          console.log('canonical rewards and qualified-committee hostless phone contribution ledger are seeded for offline use');
          NODE
