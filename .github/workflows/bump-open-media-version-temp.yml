name: Bump Open Learning Media Version Temp

on:
  push:
    branches:
      - agent/open-learning-media-harvest-v1
    paths:
      - .github/workflows/bump-open-media-version-temp.yml

permissions:
  contents: write

concurrency:
  group: bump-open-learning-media-version-temp
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/open-learning-media-harvest-v1
          fetch-depth: 0
      - name: Advance patch version beyond current main
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          base_version="$(git show origin/main:VERSION | tr -d '[:space:]')"
          next_version="$(node -e 'const v=process.argv[1].split(".").map(Number); if(v.length!==3||v.some(Number.isNaN)) process.exit(2); v[2]++; process.stdout.write(v.join("."));' "$base_version")"
          printf '%s\n' "$next_version" > VERSION
          node - "$next_version" <<'NODE'
          const fs=require('fs');
          const next=process.argv[2];
          let pkg=fs.readFileSync('package.json','utf8');
          pkg=pkg.replace(/("version"\s*:\s*")[^"]+("\s*,)/, `$1${next}$2`);
          fs.writeFileSync('package.json',pkg);
          let manifest=fs.readFileSync('public/app/manifest.webmanifest','utf8');
          manifest=manifest.replace(/("name"\s*:\s*"Civweave v)[^"]+("\s*,)/, `$1${next}$2`);
          fs.writeFileSync('public/app/manifest.webmanifest',manifest);
          NODE
          git rm .github/workflows/bump-open-media-version-temp.yml
          git add VERSION package.json public/app/manifest.webmanifest
          git commit -m "Advance Civweave to ${next_version} for open learning media"
          git pull --rebase origin agent/open-learning-media-harvest-v1
          git push origin HEAD:agent/open-learning-media-harvest-v1
