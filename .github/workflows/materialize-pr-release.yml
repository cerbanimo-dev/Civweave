name: Materialize PR Canonical Release

on:
  push:
    branches:
      - fix/fellowfare-contrast-r3
    paths:
      - '.github/workflows/materialize-pr-release.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fellowfare-contrast-r3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize canonical release
        run: node scripts/materialize-canonical-release.mjs
      - name: Commit generated release assets
        run: |
          git config user.name "civweave-release-bot"
          git config user.email "civweave-release-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Release already materialized."
            exit 0
          fi
          git commit -m "Materialize Civweave 1.0.127 canonical release"
          git push origin HEAD:fix/fellowfare-contrast-r3
