name: Verify Canonical Release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  canonical-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/verify-root-hygiene.mjs
      - run: node scripts/verify-cloudflare-deploy-discipline.mjs
      - run: node scripts/verify-canonical-launch-release.mjs
      - run: node scripts/verify-release-contract.mjs
      - run: node scripts/verify-release-version-sync.mjs
      - run: node scripts/verify-interface-runtime-v1.mjs
      - run: node scripts/verify-system-ownership-v317.mjs
      - run: npm run test:anarchadia-governance
      - name: Assert verifiers did not self-heal the checkout
        run: git diff --exit-code -- .
      - run: node scripts/check-canonical-server-syntax.mjs
      - run: npm audit --omit=dev --audit-level=high
