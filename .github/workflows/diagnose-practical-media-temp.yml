name: Diagnose Practical Media Temp

on:
  push:
    branches:
      - agent/general-knowledge-video-packs-v1
    paths:
      - .github/workflows/diagnose-practical-media-temp.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Rebuild and print Practical Life selection
        env:
          OPEN_MEDIA_RESULTS_PER_QUERY: '6'
          OPEN_MEDIA_WORKERS: '8'
        run: |
          set -euo pipefail
          python scripts/harvest-open-learning-media-library-v1.py
          python scripts/curate-open-learning-media-library-v1.py || true
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('public/downloads/knowledge-schools/open-learning-media/summary.json').read_text())
          wanted=['personal-finance','cooking-food-safety','emergency-preparedness','home-maintenance','career-work-skills']
          print('PRACTICAL_TOPIC_STATS')
          for slug in wanted:
              print(slug, json.dumps(summary.get('topic_stats',{}).get(slug,{}), ensure_ascii=False))
          print('PRACTICAL_PACK',json.dumps(summary.get('packs',{}).get('practical-life',{}),ensure_ascii=False))
          PY
