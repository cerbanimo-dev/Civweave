name: Verify offline translation packs v1
on:
  pull_request:
    paths:
      - 'public/app/local-ai/translation-packs-v1.js'
      - 'public/app/local-ai/translation-worker-v1.js'
      - 'public/app/shared-guide-surface-v236.js'
      - 'public/service-worker-chat-repair-v245.js'
      - 'public/app/japanese-mode-v1.js'
      - 'scripts/verify-offline-translation-packs-v1.mjs'
      - '.github/workflows/verify-offline-translation-packs-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-offline-translation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check translation runtime
        run: |
          node --check public/app/local-ai/translation-packs-v1.js
          node --check public/app/local-ai/translation-worker-v1.js
          node --check public/app/shared-guide-surface-v236.js
          node --check public/service-worker-chat-repair-v245.js
      - name: Verify offline translation contract
        run: node scripts/verify-offline-translation-packs-v1.mjs
