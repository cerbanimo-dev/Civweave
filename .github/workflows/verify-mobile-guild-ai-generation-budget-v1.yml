name: Verify mobile Guild AI generation budget

on:
  push:
    branches: [staging, main]
    paths:
      - 'cloudflare/mobile-guild-edge/src/creator-provenance-entry.mjs'
      - 'public/app/server-ai-router-v301.js'
      - 'public/app/living-school-generation-budget-v3.js'
      - 'scripts/test-mobile-guild-provenance-ai-generation-budget-v1.mjs'
      - '.github/workflows/verify-mobile-guild-ai-generation-budget-v1.yml'
  pull_request:
    paths:
      - 'cloudflare/mobile-guild-edge/src/creator-provenance-entry.mjs'
      - 'public/app/server-ai-router-v301.js'
      - 'public/app/living-school-generation-budget-v3.js'
      - 'scripts/test-mobile-guild-provenance-ai-generation-budget-v1.mjs'
      - '.github/workflows/verify-mobile-guild-ai-generation-budget-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Check mobile Guild edge syntax
        run: node --check cloudflare/mobile-guild-edge/src/creator-provenance-entry.mjs
      - name: Verify end-to-end generation budget
        run: node scripts/test-mobile-guild-provenance-ai-generation-budget-v1.mjs
