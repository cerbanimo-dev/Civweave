name: Verify Guild Map locality and Rally Point v1

on:
  pull_request:
    paths:
      - 'public/finder/index.html'
      - 'public/app/hub-map-v1.html'
      - 'public/app/civweave-hub-map-v1.js'
      - 'public/app/civweave-locality-gossip-v1.js'
      - 'public/app/guild-rally-point-setup-v1.js'
      - 'public/app/mobile-guild-create-v1.mjs'
      - 'public/app/node-ai-mesh-v1.js'
      - 'public/app/civweave-map-v1-manifest.json'
      - 'functions/api/hub-map-nodes.ts'
      - 'functions/api/guild-directory-register.ts'
      - 'public/host-setup.html'
      - 'cloudflare/core/src/guild-directory.mjs'
      - 'cloudflare/core/src/live-entry.mjs'
      - 'cloudflare/node-cloud/src/index.mjs'
      - 'cloudflare/mobile-guild-edge/src/index.mjs'
      - 'public/app/local-object-mesh-v146.js'
      - 'public/app/host-node-session-v1.js'
      - 'scripts/test-hub-location-onboarding-v1.mjs'
      - 'scripts/test-mobile-guild-create-v1.mjs'
      - 'scripts/test-public-guild-directory-v1.mjs'
      - 'scripts/verify-guild-location-parity-v1.mjs'
      - 'scripts/verify-hub-map-locality-ledger-v1.mjs'
      - 'docs/architecture/locality-gossip-ledger-v1.md'
      - '.github/workflows/verify-hub-map-locality-ledger-v1.yml'
  push:
    branches: ['staging', 'agent/hub-map-locality-ledger-v1']
    paths:
      - 'public/finder/index.html'
      - 'public/app/hub-map-v1.html'
      - 'public/app/civweave-hub-map-v1.js'
      - 'public/app/civweave-locality-gossip-v1.js'
      - 'public/app/guild-rally-point-setup-v1.js'
      - 'public/app/mobile-guild-create-v1.mjs'
      - 'public/app/node-ai-mesh-v1.js'
      - 'public/app/civweave-map-v1-manifest.json'
      - 'functions/api/hub-map-nodes.ts'
      - 'functions/api/guild-directory-register.ts'
      - 'public/host-setup.html'
      - 'cloudflare/core/src/guild-directory.mjs'
      - 'cloudflare/core/src/live-entry.mjs'
      - 'cloudflare/node-cloud/src/index.mjs'
      - 'cloudflare/mobile-guild-edge/src/index.mjs'
      - 'public/app/local-object-mesh-v146.js'
      - 'public/app/host-node-session-v1.js'
      - 'scripts/test-hub-location-onboarding-v1.mjs'
      - 'scripts/test-mobile-guild-create-v1.mjs'
      - 'scripts/test-public-guild-directory-v1.mjs'
      - 'scripts/verify-guild-location-parity-v1.mjs'
      - 'scripts/verify-hub-map-locality-ledger-v1.mjs'
      - 'docs/architecture/locality-gossip-ledger-v1.md'
      - '.github/workflows/verify-hub-map-locality-ledger-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check Guild Map scripts
        run: |
          node --check public/app/civweave-hub-map-v1.js
          node --check public/app/civweave-locality-gossip-v1.js
          node --check public/app/guild-rally-point-setup-v1.js
          node --check public/app/mobile-guild-create-v1.mjs
          node --check public/app/node-ai-mesh-v1.js
          node --check cloudflare/core/src/guild-directory.mjs
          node --check cloudflare/core/src/live-entry.mjs
          node --check cloudflare/node-cloud/src/index.mjs
          node --check cloudflare/mobile-guild-edge/src/index.mjs
          node --check scripts/test-hub-location-onboarding-v1.mjs
          node --check scripts/test-mobile-guild-create-v1.mjs
          node --check scripts/test-public-guild-directory-v1.mjs
          node --check scripts/verify-guild-location-parity-v1.mjs
          node --check scripts/verify-hub-map-locality-ledger-v1.mjs
      - name: Test Guildkeeper location and Rally Point publication
        run: node scripts/test-hub-location-onboarding-v1.mjs
      - name: Test mobile Guild location lifecycle
        run: node scripts/test-mobile-guild-create-v1.mjs
      - name: Test public Cloudflare Guild directory registration
        run: node scripts/test-public-guild-directory-v1.mjs
      - name: Verify cross-device Guild location parity
        run: node scripts/verify-guild-location-parity-v1.mjs
      - name: Verify end-to-end Guild Map contract
        run: node scripts/verify-hub-map-locality-ledger-v1.mjs
