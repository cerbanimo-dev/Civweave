name: Verify five guide prompt injection v346

on:
  pull_request:
    paths:
      - 'public/app/assistant-runtime-v141.js'
      - 'public/app/local-ai/model-registry-v266.js'
      - 'public/app/local-ai/runtime-bridge-v266.js'
      - 'scripts/verify-five-guide-prompt-injection-v346.mjs'
      - '.github/workflows/verify-five-guide-prompt-injection-v346.yml'
  push:
    branches:
      - main
    paths:
      - 'public/app/assistant-runtime-v141.js'
      - 'public/app/local-ai/model-registry-v266.js'
      - 'public/app/local-ai/runtime-bridge-v266.js'
      - 'scripts/verify-five-guide-prompt-injection-v346.mjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-five-guide-prompt-injection-v346.mjs
