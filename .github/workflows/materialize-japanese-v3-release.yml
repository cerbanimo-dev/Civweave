name: Materialize Japanese localization v3 release

on:
  push:
    branches:
      - fix/japanese-localization-v3-coverage
    paths:
      - .github/workflows/materialize-japanese-v3-release.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/japanese-localization-v3-coverage
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Reconcile latest main and materialize next patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          BASE_VERSION="$(git show origin/main:VERSION | tr -d '[:space:]')"
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          NEXT_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          printf '%s\n' "$NEXT_VERSION" > VERSION
          npm version "$NEXT_VERSION" --no-git-tag-version --allow-same-version
          node scripts/materialize-canonical-release.mjs
          node --check public/app/japanese-mode-v1.js
          node scripts/verify-japanese-mode-v1.mjs
          git rm .github/workflows/materialize-japanese-v3-release.yml
          git add -A
          git commit -m "Materialize Japanese localization release $NEXT_VERSION"
          git push origin HEAD:fix/japanese-localization-v3-coverage
