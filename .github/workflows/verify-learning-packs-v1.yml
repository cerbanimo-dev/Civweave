name: Verify learning packs v1

on:
  pull_request:
    paths:
      - 'public/app/shared/learning-pack-runtime-v1.mjs'
      - 'public/app/shared/core-practice-pack-v1.mjs'
      - 'public/app/shared/expert-pack-library-v1.mjs'
      - 'public/app/shared/learning-pack-resolver-v1.mjs'
      - 'public/app/shared/learning-pack-shelf-v1.mjs'
      - 'public/app/shared/learning-pack-shelf-v1.css'
      - 'public/app/learning-pack-seeds-v1.js'
      - 'public/app/cerbanimo-learning-packs-v1.js'
      - 'public/app/living-school-learning-packs-v1.mjs'
      - 'public/app/cabinets/living-school/index.html'
      - 'public/app/realm-console-v140.html'
      - 'public/downloads/learning-packs/**'
      - 'scripts/build-learning-packs-v1.mjs'
      - 'scripts/verify-learning-packs-v1.mjs'
      - 'scripts/verify-learning-pack-shelf-v1.mjs'
      - 'docs/LEARNING-PACKS.md'
      - '.github/workflows/verify-learning-packs-v1.yml'
  push:
    branches: [ main ]
    paths:
      - 'public/app/shared/learning-pack-runtime-v1.mjs'
      - 'public/app/shared/core-practice-pack-v1.mjs'
      - 'public/app/shared/expert-pack-library-v1.mjs'
      - 'public/app/shared/learning-pack-resolver-v1.mjs'
      - 'public/app/shared/learning-pack-shelf-v1.mjs'
      - 'public/app/shared/learning-pack-shelf-v1.css'
      - 'public/app/learning-pack-seeds-v1.js'
      - 'public/app/cerbanimo-learning-packs-v1.js'
      - 'public/app/living-school-learning-packs-v1.mjs'
      - 'public/app/cabinets/living-school/index.html'
      - 'public/app/realm-console-v140.html'
      - 'public/downloads/learning-packs/**'
      - 'scripts/build-learning-packs-v1.mjs'
      - 'scripts/verify-learning-packs-v1.mjs'
      - 'scripts/verify-learning-pack-shelf-v1.mjs'
      - 'docs/LEARNING-PACKS.md'
      - '.github/workflows/verify-learning-packs-v1.yml'

jobs:
  verify-learning-packs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check public/app/shared/learning-pack-runtime-v1.mjs
          node --check public/app/shared/core-practice-pack-v1.mjs
          node --check public/app/shared/expert-pack-library-v1.mjs
          node --check public/app/shared/learning-pack-resolver-v1.mjs
          node --check public/app/shared/learning-pack-shelf-v1.mjs
          node --check public/app/learning-pack-seeds-v1.js
          node --check public/app/cerbanimo-learning-packs-v1.js
          node --check public/app/living-school-learning-packs-v1.mjs
          node --check scripts/build-learning-packs-v1.mjs
          node --check scripts/verify-learning-packs-v1.mjs
          node --check scripts/verify-learning-pack-shelf-v1.mjs
      - name: Build O*NET 30.3 Labor Atlas
        run: node scripts/build-learning-packs-v1.mjs
      - name: Contract, resolver, artifact, and route verification
        run: node scripts/verify-learning-packs-v1.mjs
      - name: Learning Pack Shelf contract
        run: node scripts/verify-learning-pack-shelf-v1.mjs
      - name: Preserve generated Labor Atlas test artifact
        uses: actions/upload-artifact@v4
        with:
          name: onet-labor-atlas-30-3-test-build
          path: |
            public/downloads/learning-packs/onet-labor-atlas-30-3.json.gz
            public/downloads/learning-packs/catalog.json
          if-no-files-found: error
          retention-days: 7
