name: Verify Production Boot Canary v251

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'VERSION'
      - 'package.json'
      - 'wrangler.jsonc'
      - 'config/launch-topology-v1.json'
      - 'docs/operations/cloudflare-setup.md'
      - 'public/index.html'
      - 'public/app/manifest.webmanifest'
      - 'public/app/pwa-install-prompt-v246.js'
      - 'public/app/host-deployment-v1.json'
      - 'public/app/host-steward-reminder-v1.js'
      - 'public/host-local-anchor.html'
      - 'public/app/installed-entry-v146.js'
      - 'public/service-worker-v203.js'
      - 'scripts/setup-cloudflare-node.mjs'
      - 'scripts/verify-cloudflare-production-origin-v251.mjs'
      - 'scripts/verify-production-boot-canary-v251.mjs'
      - 'scripts/test-production-version-policy-v251.mjs'
      - '.github/workflows/verify-production-boot-canary-v251.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-boot-canary-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-production-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Syntax check production canaries
        run: |
          node --check scripts/setup-cloudflare-node.mjs
          node --check scripts/verify-cloudflare-production-origin-v251.mjs
          node --check scripts/verify-production-boot-canary-v251.mjs
          node --check scripts/test-production-version-policy-v251.mjs
          node --check public/app/host-steward-reminder-v1.js
      - name: Verify production version policy
        run: node --test scripts/test-production-version-policy-v251.mjs
      - name: Verify stable Cloudflare production origin contract
        run: node scripts/verify-cloudflare-production-origin-v251.mjs
      - name: Resolve expected production release
        id: expected
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            version="$(git show "origin/${GITHUB_BASE_REF}:VERSION" | tr -d '[:space:]')"
            attempts=2
            delay=5000
            allow_newer=true
          else
            version="$(tr -d '[:space:]' < VERSION)"
            attempts=36
            delay=15000
            allow_newer=false
          fi
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "attempts=$attempts" >> "$GITHUB_OUTPUT"
          echo "delay=$delay" >> "$GITHUB_OUTPUT"
          echo "allow_newer=$allow_newer" >> "$GITHUB_OUTPUT"
      - name: Verify deployed manifest, updater, and worker bytes
        if: github.event_name != 'pull_request'
        env:
          CIVWEAVE_EXPECTED_VERSION: ${{ steps.expected.outputs.version }}
          CIVWEAVE_ALLOW_NEWER_VERSION: ${{ steps.expected.outputs.allow_newer }}
          CIVWEAVE_PRODUCTION_URLS: https://civweave.pages.dev,https://commonweave-host-node-9l1u.onrender.com
          CIVWEAVE_PROBE_ATTEMPTS: ${{ steps.expected.outputs.attempts }}
          CIVWEAVE_PROBE_DELAY_MS: ${{ steps.expected.outputs.delay }}
        run: node scripts/verify-production-boot-canary-v251.mjs
      - name: Explain origin migration on pull requests
        if: github.event_name == 'pull_request'
        run: echo "PR checks validate the new civweave.pages.dev contract statically; live production probing begins after the canonical Pages project is deployed."
