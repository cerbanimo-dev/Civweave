name: Verify Live Money Promotion Safety v1

on:
  pull_request:
    paths:
      - 'cloudflare/core/**'
      - 'cloudflare/node-cloud/**'
      - 'config/**'
      - 'lib/node-ai-bootstrap-v1.mjs'
      - '.env.ai-wallet.example'
      - 'docs/finance/live-money-human-gate.md'
      - 'scripts/verify-stripe-live-readiness-preflight.mjs'
      - 'scripts/verify-stripe-snapshot-webhook-hardening.mjs'
      - 'scripts/verify-live-money-promotion-safety-v1.mjs'
      - '.github/workflows/deploy-cloudflare-money-edge-v1.yml'
      - '.github/workflows/promote-cloudflare-live-money-v1.yml'
      - '.github/workflows/cloudflare-money-emergency-stop-v1.yml'
      - '.github/workflows/verify-live-money-promotion-safety-v1.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare/core/**'
      - 'cloudflare/node-cloud/**'
      - 'config/**'
      - 'lib/node-ai-bootstrap-v1.mjs'
      - '.env.ai-wallet.example'
      - 'docs/finance/live-money-human-gate.md'
      - 'scripts/verify-stripe-live-readiness-preflight.mjs'
      - 'scripts/verify-stripe-snapshot-webhook-hardening.mjs'
      - 'scripts/verify-live-money-promotion-safety-v1.mjs'
      - '.github/workflows/deploy-cloudflare-money-edge-v1.yml'
      - '.github/workflows/promote-cloudflare-live-money-v1.yml'
      - '.github/workflows/cloudflare-money-emergency-stop-v1.yml'
      - '.github/workflows/verify-live-money-promotion-safety-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify promotion safety contract
        run: node scripts/verify-live-money-promotion-safety-v1.mjs
