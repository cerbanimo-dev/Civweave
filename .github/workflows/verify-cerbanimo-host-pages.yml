name: Verify Cerbanimo host pages

on:
  pull_request:
    paths:
      - 'site/cerbanimo-cc/**'
      - '.github/workflows/deploy-cerbanimo-site.yml'
      - '.github/workflows/deploy-civweave-host-pages.yml'
      - '.github/workflows/verify-cerbanimo-host-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build flagship and community surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build flagship surface
        run: |
          node site/cerbanimo-cc/build.mjs \
            --output .verify-cerbanimo-flagship \
            --base / \
            --role flagship \
            --public-origin https://cerbanimo.cc \
            --pages-origin https://cerbanimo-cc.pages.dev

      - name: Build community-host surface
        run: |
          node site/cerbanimo-cc/build.mjs \
            --output .verify-cerbanimo-community \
            --base /cerbanimo/ \
            --role community \
            --host-id test-garden \
            --public-origin https://civweave-test-garden.pages.dev \
            --pages-origin https://civweave-test-garden.pages.dev

      - name: Verify portable host paths, Japanese surface, posters, and local links
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const flagship = readFileSync('.verify-cerbanimo-flagship/index.html', 'utf8');
          const flagshipJa = readFileSync('.verify-cerbanimo-flagship/ja/index.html', 'utf8');
          const hosted = readFileSync('.verify-cerbanimo-community/index.html', 'utf8');
          const hostedJa = readFileSync('.verify-cerbanimo-community/ja/index.html', 'utf8');
          const hostedApp = readFileSync('.verify-cerbanimo-community/app.js', 'utf8');
          const surface = JSON.parse(readFileSync('.verify-cerbanimo-community/surface.json', 'utf8'));
          const history = JSON.parse(readFileSync('.verify-cerbanimo-community/history.json', 'utf8'));
          const japaneseNames = [
            '民織 / シヴウィーヴ / Civweave',
            '生学舎 / リビング・スクール / Living School',
            '神織 / セルバニモ / Cerbanimo',
            '共市 / フェローフェア / FellowFare',
            '自治郷 / アナーケイディア / Anarchadia',
          ];
          const posterFiles = [
            'living-school-poster.webp',
            'cerbanimo-poster.webp',
            'fellowfare-poster.webp',
            'anarchadia-poster.webp',
          ];
          const guideFiles = [
            'weaveling.png',
            'moss.png',
            'kamiya.png',
            'rook.png',
            'merlin.png',
          ];
          const forbiddenRealmSprites = guideFiles.slice(1);
          const realmMarkup = html => html.match(/<div class="realms">[\s\S]*?<\/div>\s*<\/section>/)?.[0] || '';
          const flagshipRealms = realmMarkup(flagship);
          const flagshipJaRealms = realmMarkup(flagshipJa);
          const hostedRealms = realmMarkup(hosted);
          const hostedJaRealms = realmMarkup(hostedJa);
          const hasAllPosters = html => posterFiles.every(file => html.includes(file));
          const hasAllGuides = (html, base) => guideFiles.every(file => html.includes(`${base}assets/${file}`));
          const hasNoRealmSprites = html => forbiddenRealmSprites.every(file => !html.includes(file));
          const checks = [
            [flagship.includes('id="story"'), 'flagship story section'],
            [hasAllPosters(flagshipRealms), 'flagship realm posters'],
            [hasNoRealmSprites(flagshipRealms), 'flagship realms contain no guide sprites'],
            [hasAllGuides(flagship, '/'), 'flagship guide artwork materialized in HTML'],
            [flagshipJa.includes('<html lang="ja">'), 'flagship Japanese language marker'],
            [flagshipJa.includes('名前について：'), 'Civweave kanji explainer'],
            [flagshipJa.includes('<strong>名前：</strong>'), 'realm kanji explainers'],
            [japaneseNames.every(name => flagshipJa.includes(name)), 'canonical Japanese realm names'],
            [flagshipJa.includes('hreflang="ja"'), 'Japanese hreflang'],
            [hasAllPosters(flagshipJaRealms), 'Japanese flagship realm posters'],
            [hasNoRealmSprites(flagshipJaRealms), 'Japanese flagship realms contain no guide sprites'],
            [hasAllGuides(flagshipJa, '/'), 'Japanese flagship guide artwork materialized in HTML'],
            [hosted.includes('id="story"'), 'community story section'],
            [hosted.includes('/cerbanimo/assets/civweave-on.png'), 'community asset base'],
            [hosted.includes('Community Cerbanimo'), 'community host banner'],
            [hosted.includes('https://civweave-test-garden.pages.dev/">Open this node'), 'local-node CTA'],
            [hasAllPosters(hostedRealms), 'community realm posters'],
            [hasNoRealmSprites(hostedRealms), 'community realms contain no guide sprites'],
            [hasAllGuides(hosted, '/cerbanimo/'), 'community guide artwork materialized in HTML'],
            [hostedJa.includes('/cerbanimo/assets/civweave-on.png'), 'Japanese community asset base'],
            [hostedJa.includes('コミュニティ 神織'), 'Japanese community host banner'],
            [hostedJa.includes('https://civweave-test-garden.pages.dev/ja/">この民織ノードを開く'), 'Japanese local-node CTA'],
            [hasAllPosters(hostedJaRealms), 'Japanese community realm posters'],
            [hasNoRealmSprites(hostedJaRealms), 'Japanese community realms contain no guide sprites'],
            [hasAllGuides(hostedJa, '/cerbanimo/'), 'Japanese community guide artwork materialized in HTML'],
            [hostedApp.includes('/cerbanimo/history.json'), 'community history path'],
            [!hostedApp.includes('/cerbanimo/assets/weaveling.png'), 'community runtime does not own static guide artwork'],
            [surface.role === 'community', 'community role marker'],
            [surface.hostId === 'test-garden', 'community host marker'],
            [surface.basePath === '/cerbanimo/', 'community base-path marker'],
            [Array.isArray(surface.languages) && surface.languages.includes('en') && surface.languages.includes('ja'), 'surface language markers'],
            [history.surface?.hostId === 'test-garden', 'history surface marker'],
          ];
          const failures = checks.filter(([ok]) => !ok).map(([, label]) => label);
          if (failures.length) throw new Error(`Cerbanimo host packaging failed: ${failures.join(', ')}`);
          console.log(`Verified ${checks.length} Cerbanimo flagship/community/Japanese packaging invariants.`);
          NODE
