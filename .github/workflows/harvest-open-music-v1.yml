name: Harvest Open Music v1

on:
  push:
    branches:
      - main
      - 'agent/canonical-playlist-hub-music-*'
    paths:
      - config/open-music-harvest-v1.json
      - scripts/harvest-open-music-v1.py
      - scripts/test-open-music-harvest-v1.py
      - .github/workflows/harvest-open-music-v1.yml
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: open-music-harvest-v1-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify the strict rights gate
        run: python scripts/test-open-music-harvest-v1.py
      - name: Build rights-cleared lazy music references
        env:
          OPEN_MUSIC_RESULTS_PER_QUERY: '10'
          OPEN_MUSIC_WORKERS: '6'
        run: python scripts/harvest-open-music-v1.py
      - name: Commit validated daily batch and lazy manifest
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/downloads/hub-media/open-music
          if git diff --cached --quiet; then
            echo 'Open music harvest produced no catalog diff.'
            exit 0
          fi
          TARGET_REF="${GITHUB_REF_NAME:-main}"
          if [ "$TARGET_REF" = "main" ]; then
            MESSAGE='Refresh rights-cleared open music batch'
          else
            MESSAGE='[CF-Pages-Skip] Refresh rights-cleared open music batch'
          fi
          git commit -m "$MESSAGE"
          git pull --rebase origin "$TARGET_REF"
          git push origin "HEAD:$TARGET_REF"
