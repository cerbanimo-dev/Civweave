name: Deploy Civweave Community Host

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civweave-community-host-production
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.CIVWEAVE_PAGES_PROJECT != '' && vars.CIVWEAVE_PAGES_PROJECT != 'civweave'
    name: Build and deploy community host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CIVWEAVE_PAGES_PROJECT: ${{ vars.CIVWEAVE_PAGES_PROJECT }}
      CIVWEAVE_HOST_ID: ${{ vars.CIVWEAVE_HOST_ID }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify host deployment settings and Pages project access
        shell: bash
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing repository secret CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing repository secret CLOUDFLARE_ACCOUNT_ID'; exit 2; }
          test -n "${CIVWEAVE_PAGES_PROJECT:-}" || { echo 'Missing repository variable CIVWEAVE_PAGES_PROJECT'; exit 2; }
          test "$CIVWEAVE_PAGES_PROJECT" != 'civweave' || { echo 'The canonical civweave project is reserved'; exit 2; }
          node --input-type=module <<'NODE'
          const project = process.env.CIVWEAVE_PAGES_PROJECT;
          const account = encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID);
          const response = await fetch(
            'https://api.cloudflare.com/client/v4/accounts/' + account + '/pages/projects/' + encodeURIComponent(project),
            { headers: { Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN } },
          );
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || payload.success !== true || payload.result?.name !== project) {
            const errors = Array.isArray(payload.errors) ? JSON.stringify(payload.errors) : response.statusText;
            console.error('Cloudflare token/account cannot access Pages project "' + project + '": ' + errors);
            process.exit(3);
          }
          console.log('Verified access to community Pages project "' + project + '".');
          NODE

      - name: Build host Pages package
        run: node scripts/build-cloudflare-pages.mjs

      - name: Record community host deployment
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          const project = process.env.CIVWEAVE_PAGES_PROJECT;
          const hostId = process.env.CIVWEAVE_HOST_ID || project.replace(/^civweave-/, '');
          const target = '.cloudflare-pages/app/host-deployment-v1.json';
          mkdirSync('.cloudflare-pages/app', { recursive: true });
          writeFileSync(target, `${JSON.stringify({
            schema: 'civweave.host-deployment.v1',
            role: 'community',
            hostId,
            pagesProject: project,
            publicOrigin: `https://${project}.pages.dev`,
            canonicalOrigin: 'https://civweave.pages.dev',
            localAnchorRecommended: true,
            localAnchorRequired: false,
            sourceCommit: process.env.GITHUB_SHA,
            generatedAt: new Date().toISOString(),
          }, null, 2)}\n`, 'utf8');
          NODE

      - name: Deploy community Pages project
        shell: bash
        run: |
          commit_message="$(git log -1 --pretty=%s)"
          npx wrangler pages deploy .cloudflare-pages \
            --project-name "$CIVWEAVE_PAGES_PROJECT" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$commit_message" \
            --commit-dirty=true
