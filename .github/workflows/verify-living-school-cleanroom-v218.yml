name: Verify Living School clean room v218

on:
  pull_request:
    paths:
      - 'public/app/cabinets/living-school/**'
      - 'public/app/services/living-school/**'
      - 'scripts/verify-living-school-cleanroom-v218.mjs'
      - '.github/workflows/verify-living-school-cleanroom-v218.yml'
  push:
    branches: [main]
    paths:
      - 'public/app/cabinets/living-school/**'
      - 'public/app/services/living-school/**'
      - 'scripts/verify-living-school-cleanroom-v218.mjs'

permissions:
  contents: read

jobs:
  clean-room:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse the only Living School runtime
        run: |
          node --check public/app/cabinets/living-school/living-school-cleanroom-core-v218.mjs
          node --check public/app/cabinets/living-school/living-school-cleanroom-render-v218.mjs
          node --check public/app/cabinets/living-school/living-school-cleanroom-actions-v218.mjs
          node --check public/app/cabinets/living-school/living-school-cleanroom-v218.mjs
      - name: Prove one handler and no legacy tripwires
        run: node scripts/verify-living-school-cleanroom-v218.mjs
