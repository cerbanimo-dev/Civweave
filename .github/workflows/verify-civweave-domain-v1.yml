name: Verify Civweave Domain Layer

on:
  pull_request:
    paths:
      - 'cloudflare/shared-domain/**'
      - 'cloudflare/core/src/shared-domain-policy.mjs'
      - 'cloudflare/core/migrations/0007_shared_domains.sql'
      - 'scripts/ensure-cloudflare-pages-domain-v1.mjs'
      - 'scripts/prepare-cloudflare-launch-kit-v1.mjs'
      - 'scripts/verify-civweave-shared-domain-*.mjs'
      - 'config/launch-topology-v1.json'
      - 'public/index.html'
      - '.github/workflows/deploy-civweave-pages.yml'
      - '.github/workflows/verify-civweave-domain-v1.yml'
  push:
    branches:
      - main
    paths:
      - 'cloudflare/shared-domain/**'
      - 'cloudflare/core/src/shared-domain-policy.mjs'
      - 'cloudflare/core/migrations/0007_shared_domains.sql'
      - 'scripts/ensure-cloudflare-pages-domain-v1.mjs'
      - 'scripts/prepare-cloudflare-launch-kit-v1.mjs'
      - 'scripts/verify-civweave-shared-domain-*.mjs'
      - 'config/launch-topology-v1.json'
      - 'public/index.html'
      - '.github/workflows/deploy-civweave-pages.yml'
      - '.github/workflows/verify-civweave-domain-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check domain layer
        run: |
          node --check cloudflare/core/src/shared-domain-policy.mjs
          node --check cloudflare/shared-domain/src/index.mjs
          node --check scripts/ensure-cloudflare-pages-domain-v1.mjs
          node --check scripts/prepare-cloudflare-launch-kit-v1.mjs
          node --check scripts/verify-civweave-shared-domain-policy-v1.mjs
          node --check scripts/verify-civweave-shared-domain-router-v1.mjs

      - name: Verify free and contributor address policy
        run: node scripts/verify-civweave-shared-domain-policy-v1.mjs

      - name: Verify shared-domain router behavior
        run: node scripts/verify-civweave-shared-domain-router-v1.mjs

      - name: Verify generated Wrangler configs
        env:
          CIVWEAVE_CORE_D1_ID: 11111111-1111-1111-1111-111111111111
        run: |
          node scripts/prepare-cloudflare-launch-kit-v1.mjs > /tmp/civweave-launch-kit.json
          grep -q 'civweave-domain-router' /tmp/civweave-launch-kit.json
          grep -q '"pattern": "*.civweave.cc/*"' .cloudflare-launch/shared-domain.wrangler.jsonc
          grep -q '11111111-1111-1111-1111-111111111111' .cloudflare-launch/shared-domain.wrangler.jsonc
          grep -q '../cloudflare/shared-domain/src/index.mjs' .cloudflare-launch/shared-domain.wrangler.jsonc
