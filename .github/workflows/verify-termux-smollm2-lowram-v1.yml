name: Verify Termux SmolLM2 low-RAM guide
on:
  push:
    paths:
      - 'public/app/shared/civweave-model-runtime.js'
      - 'public/app/family-ai-loader-v105.js'
      - 'public/app/settings-gateway-v317.js'
      - 'scripts/verify-termux-smollm2-lowram-v1.mjs'
      - '.github/workflows/verify-termux-smollm2-lowram-v1.yml'
  pull_request:
    paths:
      - 'public/app/shared/civweave-model-runtime.js'
      - 'public/app/family-ai-loader-v105.js'
      - 'public/app/settings-gateway-v317.js'
      - 'scripts/verify-termux-smollm2-lowram-v1.mjs'
      - '.github/workflows/verify-termux-smollm2-lowram-v1.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-termux-smollm2-lowram-v1.mjs
