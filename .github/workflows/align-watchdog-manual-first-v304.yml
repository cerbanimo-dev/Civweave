name: Align watchdog with manual-first installer v304

on:
  push:
    branches:
      - fix/manual-first-installer-v304

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manual-first-installer-v304
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update watchdog simulation for explicit shell action
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/smoke-service-worker-registration-watchdog-v207-legacy.mjs')
          s=p.read_text()
          patches=[
              ("  vm.runInNewContext(acceleratedInstaller,harness.context,{filename:'install-watchdog-stall.js'});\n  await delay(450);", "  vm.runInNewContext(acceleratedInstaller,harness.context,{filename:'install-watchdog-stall.js'});\n  harness.nodes.get('#check-update').click();\n  await delay(450);"),
              ("  vm.runInNewContext(acceleratedInstaller,harness.context,{filename:'install-watchdog-repeat.js'});\n  await delay(120);", "  vm.runInNewContext(acceleratedInstaller,harness.context,{filename:'install-watchdog-repeat.js'});\n  harness.nodes.get('#check-update').click();\n  await delay(120);"),
              ("  vm.runInNewContext(acceleratedInstaller,harness.context,{filename:'install-watchdog-current.js'});\n  await delay(120);", "  vm.runInNewContext(acceleratedInstaller,harness.context,{filename:'install-watchdog-current.js'});\n  harness.nodes.get('#check-update').click();\n  await delay(120);")
          ]
          for old,new in patches:
              if old not in s:
                  raise SystemExit('watchdog scenario anchor not found: '+old.splitlines()[0])
              s=s.replace(old,new,1)
          if s.count("harness.nodes.get('#check-update').click();") < 3:
              raise SystemExit('manual-first watchdog clicks were not fully inserted')
          p.write_text(s)
          PY
      - name: Verify watchdog and manual-first contracts
        run: |
          node scripts/smoke-service-worker-registration-watchdog-v207.mjs
          node scripts/smoke-installer-hardening-v281.mjs
          node scripts/verify-release-version-sync.mjs
      - name: Commit and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/align-watchdog-manual-first-v304.yml
          git add -A
          git commit -m "Align registration watchdog with explicit shell actions"
          git push origin HEAD:fix/manual-first-installer-v304
