name: Salvage install-only PWA draft

on:
  push:
    branches:
      - salvage/install-only-pwa-v145
    paths:
      - '.salvage-install-only-pwa'

permissions:
  contents: write

jobs:
  salvage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: salvage/install-only-pwa-v145
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Reconcile current main
        run: |
          set -euo pipefail
          git config user.name "civweave-salvage-bot"
          git config user.email "civweave-salvage-bot@users.noreply.github.com"
          git fetch origin main agent/install-only-pwa-boundary
          git merge --no-edit origin/main

      - name: Replay draft with current-main conflict preference
        run: |
          set -euo pipefail
          git cherry-pick -X ours 09ca09f666397e182a6ef2ddbd436778abee27c3^..d0c8c89ad5b5fad8166195940ad6f2271c6319db

      - name: Normalize salvaged runtime to current release and domain
        run: |
          set -euo pipefail
          CURRENT="$(tr -d '[:space:]' < VERSION)"
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const version=(await readFile('VERSION','utf8')).trim();
          const paths=[
            'public/app/installer-repair-only-v1.js',
            'public/app/index.html',
            'public/app/install-boundary-v146.js',
            'public/app/installed-entry-v146.html',
            'public/app/pwa-install-prompt-v247.js',
            'public/service-worker-shell-repair-v225.js',
            'public/service-worker-v203.js',
            'scripts/verify-pwa-install-campus-v246.mjs'
          ];
          for(const path of paths){
            let source;
            try{source=await readFile(path,'utf8')}catch{continue}
            const next=source.replaceAll('1.0.141',version);
            if(next!==source)await writeFile(path,next);
          }

          const installerPath='public/app/index.html';
          let installer=await readFile(installerPath,'utf8');
          installer=installer.replace('pwa-install-prompt-v247.js?v=front-door-v2-open-after-install','pwa-install-prompt-v247.js?v=front-door-v3-install-only-runtime');
          installer=installer.replace(
            'Install the shell. Open Civweave immediately. Download offline files only when you choose.</h2><p>The installer does no large background work on arrival. Install prepares the small PWA shell. The offline campus is a separate resumable code download, while large pictures, media, knowledge packs, and local AI models arrive on demand.',
            'Install the shell. Then open Civweave as an installed app.</h2><p>The installer does no large background work on arrival. Install prepares the small PWA shell. The Civweave campus itself runs only from the installed app, while the offline campus remains a separate resumable code download and large pictures, media, knowledge packs, and local AI models arrive on demand.'
          );
          installer=installer.replace(
            '<article><b>2</b><strong>Open Civweave</strong><span>Launch as soon as installation completes.</span></article>',
            '<article><b>2</b><strong>Open installed app</strong><span>Launch Civweave from your device app launcher.</span></article>'
          );
          installer=installer.replace(/<a id="open-online-campus-v225" class="secondary" href="\/app\/working-campus-v156\.html\?installed=1&amp;launch=online">Browser fallback<\/a>/,'');
          installer=installer.replace(
            '/app/installer-online-fallback-v225.js?v=shell-self-repair-v225',
            `/app/installer-repair-only-v1.js?v=${version}-install-only-pwa-boundary`
          );
          await writeFile(installerPath,installer);

          const linksPath='public/.well-known/assetlinks.json';
          const links=JSON.parse(await readFile(linksPath,'utf8'));
          const canonicalSite='https://civweave.cc/app/manifest.webmanifest';
          if(!links.some(entry=>entry?.target?.site===canonicalSite)){
            links.unshift({
              relation:['delegate_permission/common.query_webapk'],
              target:{namespace:'web',site:canonicalSite}
            });
            await writeFile(linksPath,`${JSON.stringify(links,null,2)}\n`);
          }

          const verifierPath='scripts/verify-pwa-install-campus-v246.mjs';
          let verifier=await readFile(verifierPath,'utf8');
          verifier=verifier.replace(
            "const canonicalOrigin='https://civweave.pages.dev';\nconst legacyCanonicalOrigin='https://commonweave.pages.dev';",
            "const canonicalOrigin='https://civweave.cc';\nconst previousCanonicalOrigin='https://civweave.pages.dev';\nconst legacyCanonicalOrigin='https://commonweave.pages.dev';"
          );
          verifier=verifier.replace(
            "const canonicalManifest=`${canonicalOrigin}/app/manifest.webmanifest`;\nconst legacyCanonicalManifest=",
            "const canonicalManifest=`${canonicalOrigin}/app/manifest.webmanifest`;\nconst previousCanonicalManifest=`${previousCanonicalOrigin}/app/manifest.webmanifest`;\nconst legacyCanonicalManifest="
          );
          verifier=verifier.replace(
            "assert.ok(related.some(app=>app.platform==='webapp'&&app.url===canonicalManifest),'manifest must prefer civweave.pages.dev for installed-related-app discovery');",
            "assert.ok(related.some(app=>app.platform==='webapp'&&app.url===canonicalManifest),'manifest must prefer civweave.cc for installed-related-app discovery');\nassert.ok(related.some(app=>app.platform==='webapp'&&app.url===previousCanonicalManifest),'manifest must retain the Pages underlay during origin migration');"
          );
          verifier=verifier.replace(
            "assert.ok(querySites.has(canonicalManifest),'asset links must let the new canonical manifest query a related installed PWA');",
            "assert.ok(querySites.has(canonicalManifest),'asset links must let the civweave.cc manifest query a related installed PWA');\nassert.ok(querySites.has(previousCanonicalManifest),'asset links must retain Pages-underlay discovery during migration');"
          );
          verifier=verifier.replace(
            "assert.ok(rootHtml.includes(`const LEGACY_CANONICAL_ORIGIN='${legacyCanonicalOrigin}'`),'root entry must recognize the previous canonical origin');",
            "assert.ok(rootHtml.includes(`const PREVIOUS_CANONICAL_ORIGIN='${previousCanonicalOrigin}'`),'root entry must recognize the Pages underlay as the previous canonical origin');\nassert.ok(rootHtml.includes(`const LEGACY_CANONICAL_ORIGIN='${legacyCanonicalOrigin}'`),'root entry must retain the older Commonweave origin');"
          );
          verifier=verifier.replace(
            "assert.ok(bridge.includes(`const CANONICAL_ORIGIN='${canonicalOrigin}'`),'native install bridge must name civweave.pages.dev as the OG root');",
            "assert.ok(bridge.includes(`const CANONICAL_ORIGIN='${canonicalOrigin}'`),'native install bridge must name civweave.cc as the canonical root');\nassert.ok(bridge.includes(`const PREVIOUS_CANONICAL_ORIGIN='${previousCanonicalOrigin}'`),'native install bridge must retain the Pages underlay');"
          );
          verifier=verifier.replace("hostname:'civweave.pages.dev'","hostname:'civweave.cc'");
          await writeFile(verifierPath,verifier);
          NODE
          git add -A
          if ! git diff --cached --quiet; then git commit -m "Normalize install-only PWA salvage to ${CURRENT} and civweave.cc"; fi

      - name: Verify salvaged behavior before release bump
        run: |
          set -euo pipefail
          node --check public/app/install-boundary-v146.js
          node --check public/app/installer-repair-only-v1.js
          node --check public/app/pwa-install-prompt-v247.js
          node scripts/verify-pwa-install-campus-v246.mjs
          node scripts/verify-installer-front-door-v1.mjs
          node scripts/verify-installer-redirect-loop-v1.mjs
          node scripts/verify-installed-shell-repair-v293.mjs
          node scripts/verify-shell-self-repair-v225.mjs
          node scripts/verify-service-worker-evaluation-v189.mjs
          node scripts/smoke-service-worker-registration-watchdog-v207.mjs
          node scripts/verify-host-node-installer-lobby-v1.mjs
          node scripts/verify-hub-recovery-wiring-v1.mjs
          node scripts/verify-navigation-generators-v227.mjs
          node scripts/verify-working-campus-return-v425.mjs

      - name: Advance to next patch release
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const current=(await readFile('VERSION','utf8')).trim();
          const parts=current.split('.').map(Number);
          if(parts.length!==3||parts.some(n=>!Number.isInteger(n)))throw new Error(`Invalid VERSION ${current}`);
          const version=`${parts[0]}.${parts[1]}.${parts[2]+1}`;
          await writeFile('VERSION',`${version}\n`);
          const pkg=JSON.parse(await readFile('package.json','utf8'));
          pkg.version=version;
          await writeFile('package.json',`${JSON.stringify(pkg,null,2)}\n`);
          const lock=JSON.parse(await readFile('package-lock.json','utf8'));
          lock.version=version;
          if(lock.packages?.[''])lock.packages[''].version=version;
          await writeFile('package-lock.json',`${JSON.stringify(lock,null,2)}\n`);
          const contract=JSON.parse(await readFile('config/release-contract.json','utf8'));
          contract.canonical.current={version,path:`releases/${version}`,status:'current'};
          await writeFile('config/release-contract.json',`${JSON.stringify(contract,null,2)}\n`);
          console.log(`NEXT_VERSION=${version}`);
          NODE

      - name: Materialize canonical release
        run: |
          set -euo pipefail
          node scripts/materialize-canonical-release.mjs
          node scripts/sync-release-coherence-v220.mjs

      - name: Verify release and install-only boundary
        run: |
          set -euo pipefail
          node scripts/verify-release-contract.mjs
          node scripts/verify-version-policy.mjs --self-test
          node scripts/verify-canonical-launch-release.mjs
          node scripts/verify-release-version-sync.mjs
          node scripts/verify-pwa-install-campus-v246.mjs
          node scripts/verify-installer-front-door-v1.mjs
          node scripts/verify-installer-redirect-loop-v1.mjs
          node scripts/verify-installed-shell-repair-v293.mjs
          node scripts/verify-shell-self-repair-v225.mjs
          node scripts/verify-service-worker-evaluation-v189.mjs
          node scripts/smoke-service-worker-registration-watchdog-v207.mjs

      - name: Commit salvaged release
        run: |
          set -euo pipefail
          VERSION_NOW="$(tr -d '[:space:]' < VERSION)"
          git add -A
          git commit -m "Salvage install-only PWA boundary as Civweave ${VERSION_NOW}"
          git push origin HEAD:salvage/install-only-pwa-v145
