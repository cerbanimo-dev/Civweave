name: Verify Local Model Downloads v267

on:
  pull_request:
    paths:
      - 'public/app/local-ai/**'
      - 'public/app/document-lifecycle-v221.js'
      - 'public/app/ai-capability-broker-v268.js'
      - 'public/app/fast-interactive-runtime-v192.js'
      - 'public/app/working-campus-v156.part5.txt'
      - 'public/service-worker-v203.js'
      - 'public/service-worker-local-model-download-v267.js'
      - 'scripts/stage-transformers-assets.mjs'
      - 'scripts/build-cloudflare-pages.mjs'
      - 'scripts/verify-local-model-download-v267.mjs'
      - 'scripts/verify-local-model-cache-loader-v270.mjs'
      - 'scripts/verify-local-model-test-pulse-v269.mjs'
      - 'scripts/verify-local-model-settings-mount-v273.mjs'
      - 'package.json'
      - '.github/workflows/verify-local-model-download-v267.yml'
  push:
    branches: [main]
    paths:
      - 'public/app/local-ai/**'
      - 'public/app/document-lifecycle-v221.js'
      - 'public/app/ai-capability-broker-v268.js'
      - 'public/app/fast-interactive-runtime-v192.js'
      - 'public/app/working-campus-v156.part5.txt'
      - 'public/service-worker-v203.js'
      - 'public/service-worker-local-model-download-v267.js'
      - 'scripts/stage-transformers-assets.mjs'
      - 'scripts/build-cloudflare-pages.mjs'
      - 'scripts/verify-local-model-download-v267.mjs'
      - 'scripts/verify-local-model-cache-loader-v270.mjs'
      - 'scripts/verify-local-model-test-pulse-v269.mjs'
      - 'scripts/verify-local-model-settings-mount-v273.mjs'
      - 'package.json'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check public/app/ai-capability-broker-v268.js
          node --check public/app/fast-interactive-runtime-v192.js
          node --check public/app/document-lifecycle-v221.js
          node --check public/app/local-ai/download-manager-v267.js
          node --check public/app/local-ai/model-registry-v266.js
          node --check public/app/local-ai/runtime-v266.js
          node --check public/app/local-ai/runtime-bridge-v266.js
          node --check public/app/local-ai/worker-v266.js
          node --check public/app/local-ai/test-pulse-v269.js
          node --check public/app/local-ai/settings-panel-v267.js
          node --check public/app/local-ai/bootstrap-v266.js
          node --check public/service-worker-local-model-download-v267.js
          node --check public/service-worker-v203.js
          node --check scripts/build-cloudflare-pages.mjs
          node --check scripts/verify-local-model-download-v267.mjs
          node --check scripts/verify-local-model-cache-loader-v270.mjs
          node --check scripts/verify-local-model-test-pulse-v269.mjs
          node --check scripts/verify-local-model-settings-mount-v273.mjs
      - name: Local inference contract
        run: node scripts/verify-local-model-download-v267.mjs
      - name: Cache and routing regression
        run: node scripts/verify-local-model-cache-loader-v270.mjs
      - name: Health pulse regression
        run: node scripts/verify-local-model-test-pulse-v269.mjs
      - name: Settings mount regression
        run: node scripts/verify-local-model-settings-mount-v273.mjs
      - name: Install browser runtime dependency
        run: npm install --ignore-scripts
      - name: Stage Transformers.js runtime
        run: node scripts/stage-transformers-assets.mjs --force
      - name: Verify staged runtime and Cloudflare asset ceiling
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const files=['public/app/vendor/transformers/transformers.min.js','public/app/vendor/transformers/wasm/ort-wasm-simd-threaded.jsep.mjs','public/app/vendor/transformers/wasm/ort-wasm-simd-threaded.jsep.wasm'];
          const limit=24*1024*1024;
          for(const file of files){const size=fs.statSync(file).size;if(size>limit)throw new Error(`${file} is ${(size/1024/1024).toFixed(2)} MiB, above the 24 MiB Civweave Pages ceiling.`);console.log(`${file}: ${(size/1024/1024).toFixed(2)} MiB`)}
          NODE
      - name: Build Cloudflare Pages output
        run: node scripts/build-cloudflare-pages.mjs
