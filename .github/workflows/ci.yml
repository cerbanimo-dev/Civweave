name: Civweave current-tree CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  current-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact runtime dependency
        run: npm install --no-audit --no-fund
      - name: Verify the only production tree
        run: npm run check
