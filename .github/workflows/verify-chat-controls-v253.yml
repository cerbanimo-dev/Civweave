name: Verify Chat Controls v253

on:
  pull_request:
    paths:
      - 'public/app/realm-session-integrity-v237.js'
      - 'public/app/guide-workspace-v242.js'
      - 'public/app/shared-guide-surface-v236.js'
      - 'scripts/verify-chat-controls-v253.mjs'
      - 'VERSION'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'public/app/realm-session-integrity-v237.js'
      - 'public/app/guide-workspace-v242.js'
      - 'public/app/shared-guide-surface-v236.js'
      - 'scripts/verify-chat-controls-v253.mjs'
      - 'VERSION'
      - 'package.json'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check chat control syntax
        run: |
          node --check public/app/realm-session-integrity-v237.js
          node --check public/app/guide-workspace-v242.js
          node --check public/app/shared-guide-surface-v236.js
          node --check scripts/verify-chat-controls-v253.mjs
      - name: Verify chat control capture contract
        run: node scripts/verify-chat-controls-v253.mjs
