name: Verify knowledge encyclopedia v271

on:
  push:
    paths:
      - 'public/app/shared/knowledge-encyclopedia-v271.mjs'
      - 'public/app/knowledge-encyclopedia-bridge-v271.js'
      - 'public/app/family-ai-loader-v105.js'
      - 'scripts/verify-knowledge-encyclopedia-v271.mjs'
      - '.github/workflows/verify-knowledge-encyclopedia-v271.yml'
  pull_request:
    paths:
      - 'public/app/shared/knowledge-encyclopedia-v271.mjs'
      - 'public/app/knowledge-encyclopedia-bridge-v271.js'
      - 'public/app/family-ai-loader-v105.js'
      - 'scripts/verify-knowledge-encyclopedia-v271.mjs'
      - '.github/workflows/verify-knowledge-encyclopedia-v271.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check public/app/shared/knowledge-encyclopedia-v271.mjs
          node --check public/app/knowledge-encyclopedia-bridge-v271.js
          node --check public/app/family-ai-loader-v105.js
          node --check scripts/verify-knowledge-encyclopedia-v271.mjs
      - name: Verify encyclopedia routing
        run: node scripts/verify-knowledge-encyclopedia-v271.mjs
