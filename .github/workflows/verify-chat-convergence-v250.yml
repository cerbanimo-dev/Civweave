name: Verify Chat Convergence v250

on:
  pull_request:
    paths:
      - 'VERSION'
      - 'package.json'
      - 'public/_redirects'
      - 'public/index.html'
      - 'public/app/manifest.webmanifest'
      - 'public/app/installed-entry-v146.html'
      - 'public/app/installed-entry-v146.js'
      - 'public/app/system-routes-v227.js'
      - 'public/app/themed-system-nav-v178.js'
      - 'public/app/install-boundary-v146.js'
      - 'public/app/guide-workspace-v242.js'
      - 'public/app/shared-guide-surface-v236.js'
      - 'public/app/realm-console-v140.html'
      - 'public/app/family-ai-loader-v105.js'
      - 'public/app/platform-stability-v159.js'
      - 'public/app/working-campus-v156.part5.txt'
      - 'public/service-worker-chat-repair-v245.js'
      - 'public/service-worker-v203.js'
      - 'scripts/sync-release-version-assets.mjs'
      - 'scripts/sync-release-coherence-v220.mjs'
      - 'scripts/verify-chat-convergence-v250.mjs'
      - '.github/workflows/verify-chat-convergence-v250.yml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-chat-convergence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize release assets
        run: node scripts/sync-release-version-assets.mjs
      - name: Syntax check canonical runtimes and generators
        run: |
          node --check public/app/installed-entry-v146.js
          node --check public/app/system-routes-v227.js
          node --check public/app/themed-system-nav-v178.js
          node --check public/app/install-boundary-v146.js
          node --check public/app/guide-workspace-v242.js
          node --check public/app/shared-guide-surface-v236.js
          node --check public/app/family-ai-loader-v105.js
          node --check public/app/platform-stability-v159.js
          node --check public/service-worker-chat-repair-v245.js
          node --check public/service-worker-v203.js
          node --check scripts/sync-release-version-assets.mjs
          node --check scripts/sync-release-coherence-v220.mjs
          node --check scripts/verify-chat-convergence-v250.mjs
      - name: Verify one canonical chat runtime and updater-first launch
        run: node scripts/verify-chat-convergence-v250.mjs