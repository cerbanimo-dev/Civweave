name: Verify local model test pulse v269

on:
  pull_request:
    paths:
      - 'public/app/local-ai/test-pulse-v269.js'
      - 'public/app/local-ai/bootstrap-v266.js'
      - 'public/app/local-ai/runtime-v266.js'
      - 'scripts/verify-local-model-test-pulse-v269.mjs'
      - '.github/workflows/verify-local-model-test-pulse-v269.yml'
  push:
    branches:
      - main
    paths:
      - 'public/app/local-ai/test-pulse-v269.js'
      - 'public/app/local-ai/bootstrap-v266.js'
      - 'public/app/local-ai/runtime-v266.js'
      - 'scripts/verify-local-model-test-pulse-v269.mjs'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-local-model-test-pulse-v269.mjs
