name: Refresh PR 572 onto latest main

on:
  push:
    branches:
      - agent/peer-local-plan-borrow-validation-rewards-current
    paths:
      - '.github/workflows/refresh-pr-572-v1.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/peer-local-plan-borrow-validation-rewards-current
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Merge latest main, preferring current main on conflicts
        run: |
          git config user.name 'civweave-refresh-bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit -X theirs origin/main
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            git diff --name-only --diff-filter=U | while read -r path; do
              git checkout --theirs -- "$path"
              git add "$path"
            done
            git commit --no-edit
          fi
      - run: npm ci --ignore-scripts
      - name: Assign next Civweave patch release
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const current=fs.readFileSync('VERSION','utf8').trim();
          const parts=current.split('.').map(Number);
          if(parts.length!==3||parts.some(n=>!Number.isInteger(n))) throw new Error(`Unexpected VERSION ${current}`);
          const next=`${parts[0]}.${parts[1]}.${parts[2]+1}`;
          fs.writeFileSync('VERSION',`${next}\n`);
          execFileSync('npm',['version',next,'--no-git-tag-version'],{stdio:'inherit'});
          console.log(`NEXT_VERSION=${next}`);
          NODE
      - name: Materialize canonical release
        run: node scripts/materialize-canonical-release.mjs
      - name: Verify refreshed feature and release
        run: |
          node scripts/verify-peer-compute-validation-governance-v1.mjs
          node scripts/verify-canonical-launch-release.mjs
          node scripts/verify-release-version-sync.mjs
          node scripts/verify-release-contract.mjs
          node scripts/verify-hub-map-locality-ledger-v1.mjs
          node --check public/app/node-ai-mesh-v1.js
          node --check public/app/peer-local-plan-borrow-v2.js
          node --check public/app/proposal-voting-gate-v2.js
          node --check public/app/validation-labor-rewards-v1.js
      - name: Remove one-shot helper and commit refresh
        run: |
          rm -f .github/workflows/refresh-pr-572-v1.yml
          git add -A
          git commit -m 'Refresh peer compute governance onto latest main'
          git push origin HEAD:agent/peer-local-plan-borrow-validation-rewards-current
