name: Verify Civweave Code Automation

on:
  push:
    branches: [main, brand/civweave-total-rename]
    paths:
      - 'public/app/code-automation-orchestrator-v217.js'
      - 'public/app/weaveling-memory-bridge-v191.js'
      - 'scripts/lib/code-automation-core.mjs'
      - 'scripts/code-automation-jules-dispatch.mjs'
      - 'scripts/code-automation-monitor.mjs'
      - 'scripts/verify-code-automation-v217.mjs'
      - 'scripts/test-code-automation-core-v217.mjs'
      - 'scripts/test-code-automation-browser-v217.mjs'
      - '.github/workflows/verify-code-automation-v217.yml'
  pull_request:
    branches: [main, brand/civweave-total-rename]
    paths:
      - 'public/app/code-automation-orchestrator-v217.js'
      - 'public/app/weaveling-memory-bridge-v191.js'
      - 'scripts/lib/code-automation-core.mjs'
      - 'scripts/code-automation-jules-dispatch.mjs'
      - 'scripts/code-automation-monitor.mjs'
      - 'scripts/verify-code-automation-v217.mjs'
      - 'scripts/test-code-automation-core-v217.mjs'
      - 'scripts/test-code-automation-browser-v217.mjs'
      - '.github/workflows/verify-code-automation-v217.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-automation-control-plane:
    name: code-automation-control-plane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check code automation modules
        run: |
          node --check public/app/code-automation-orchestrator-v217.js
          node --check public/app/weaveling-memory-bridge-v191.js
          node --check scripts/lib/code-automation-core.mjs
          node --check scripts/code-automation-jules-dispatch.mjs
          node --check scripts/code-automation-monitor.mjs
          node --check scripts/verify-code-automation-v217.mjs
      - name: Test the dual-gate plan and browser router
        run: |
          node --test scripts/test-code-automation-core-v217.mjs
          node --test scripts/test-code-automation-browser-v217.mjs
      - name: Verify the complete control plane
        run: node scripts/verify-code-automation-v217.mjs
