name: Federation v1 check

on:
  pull_request:
    paths:
      - 'server/federated.mjs'
      - 'server/gateway.mjs'
      - 'releases/**/server/**'
      - 'scripts/verify-federation-v152.mjs'
      - 'scripts/check-canonical-server-syntax.mjs'
      - 'Dockerfile.federated'
      - 'docker-compose.federated.yml'
      - 'VERSION'
      - '.dockerignore'
      - '.github/workflows/federation-v1-check.yml'
  push:
    branches: [main]
    paths:
      - 'server/federated.mjs'
      - 'server/gateway.mjs'
      - 'releases/**/server/**'
      - 'scripts/verify-federation-v152.mjs'
      - 'scripts/check-canonical-server-syntax.mjs'
      - 'Dockerfile.federated'
      - 'docker-compose.federated.yml'
      - 'VERSION'
      - '.dockerignore'
      - '.github/workflows/federation-v1-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check canonical server syntax
        run: node scripts/check-canonical-server-syntax.mjs
      - name: Verify two-node federation
        run: node scripts/verify-federation-v152.mjs
      - name: Build federated container
        run: docker build -f Dockerfile.federated -t civweave-federated:test .
      - name: Verify federated image release contract
        run: |
          expected="$(tr -d '\r\n' < VERSION)"
          actual="$(docker run --rm --entrypoint sh civweave-federated:test -c 'tr -d "\r\n" < /app/VERSION')"
          test "$actual" = "$expected"
          docker run --rm --entrypoint sh civweave-federated:test -c 'version="$(tr -d "\r\n" < /app/VERSION)"; test -s "/app/releases/$version/server/server-federated-v152.mjs"; test -s /app/server/gateway.mjs'
      - name: Verify federated container default application boot
        run: |
          docker rm -f civweave-federated-boot >/dev/null 2>&1 || true
          trap 'docker rm -f civweave-federated-boot >/dev/null 2>&1 || true' EXIT
          docker run -d --name civweave-federated-boot -p 18787:8787 \
            -e CIVWEAVE_FEDERATION_ADMIN_TOKEN=test-federation-token \
            -e PUBLIC_HOST_URL=http://127.0.0.1:18787 \
            civweave-federated:test
          for attempt in $(seq 1 60); do
            if health="$(curl -fsS http://127.0.0.1:18787/api/federation/health 2>/dev/null)"; then
              echo "$health"
              if node -e 'const h=JSON.parse(process.argv[1]); if(h.ok!==true||h.appAvailable!==true) process.exit(1)' "$health"; then
                curl -fsS http://127.0.0.1:18787/ >/dev/null
                exit 0
              fi
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' civweave-federated-boot 2>/dev/null || true)" != "true" ]; then
              echo 'Federated container exited before the application became available.'
              docker logs civweave-federated-boot || true
              exit 1
            fi
            sleep 1
          done
          echo 'Timed out waiting for the federated container application.'
          docker logs civweave-federated-boot || true
          exit 1
