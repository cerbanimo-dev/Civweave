name: Federation v1 check

on:
  pull_request:
    paths:
      - 'server/federated.mjs'
      - 'releases/**/server/**'
      - 'scripts/verify-federation-v152.mjs'
      - 'scripts/check-canonical-server-syntax.mjs'
      - 'Dockerfile.federated'
      - 'docker-compose.federated.yml'
      - '.dockerignore'
      - '.github/workflows/federation-v1-check.yml'
  push:
    branches: [main]
    paths:
      - 'server/federated.mjs'
      - 'releases/**/server/**'
      - 'scripts/verify-federation-v152.mjs'
      - 'scripts/check-canonical-server-syntax.mjs'
      - 'Dockerfile.federated'
      - 'docker-compose.federated.yml'
      - '.dockerignore'
      - '.github/workflows/federation-v1-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check canonical server syntax
        run: node scripts/check-canonical-server-syntax.mjs
      - name: Verify two-node federation
        run: node scripts/verify-federation-v152.mjs
      - name: Build federated container
        run: docker build -f Dockerfile.federated -t civweave-federated:test .
