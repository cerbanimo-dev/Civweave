name: Verify Critical Package Completion

on:
  pull_request:
    branches: [main]
    paths:
      - 'VERSION'
      - 'package.json'
      - 'public/install-v130.js'
      - 'public/app/pwa-v130.js'
      - 'public/app/install-boundary-v146.js'
      - 'public/service-worker*.js'
      - 'scripts/verify-critical-package-completion-v200.mjs'
      - '.github/workflows/verify-critical-package-completion-v200.yml'
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'package.json'
      - 'public/install-v130.js'
      - 'public/app/pwa-v130.js'
      - 'public/app/install-boundary-v146.js'
      - 'public/service-worker*.js'
      - 'scripts/verify-critical-package-completion-v200.mjs'
      - '.github/workflows/verify-critical-package-completion-v200.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check package scripts
        run: |
          node --check public/service-worker-critical-v199.js
          node --check public/install-v130.js
          node --check public/app/pwa-v130.js
          node --check scripts/verify-critical-package-completion-v200.mjs
      - name: Verify fresh and existing package paths
        run: node scripts/verify-critical-package-completion-v200.mjs
