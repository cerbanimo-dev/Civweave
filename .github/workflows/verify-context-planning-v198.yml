name: Verify MiniLM Template Planning and Rewards

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planning-and-rewards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check planning runtime syntax
        run: |
          node --check public/app/reward-policy-v198.js
          node --check public/app/context-plan-composer-v198.js
          node --check public/app/deterministic-mode-v175.js
      - name: Verify template diversity and anti-farming policy
        run: node scripts/verify-context-planning-rewards-v198.mjs
      - name: Verify live loom wiring
        run: |
          grep -q '/app/reward-policy-v198.js' public/app/loom-v128.html
          grep -q '/app/context-plan-composer-v198.js' public/app/loom-v128.html
          grep -q '/app/deterministic-mode-v175.js' public/app/loom-v128.html
          grep -q 'semanticPlanning' public/app/deterministic-mode-v175.js
