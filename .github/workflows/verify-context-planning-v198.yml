name: Verify MiniLM Template Planning and Rewards

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/app/reward-policy-v198.js'
      - 'public/app/context-plan-composer-v198.js'
      - 'public/app/deterministic-mode-v175.js'
      - 'public/app/working-campus-v156*'
      - 'scripts/verify-context-planning-rewards-v198.mjs'
      - 'scripts/verify-working-campus-planner-v199.mjs'
      - '.github/workflows/verify-context-planning-v198.yml'
  push:
    branches: [main]
    paths:
      - 'public/app/reward-policy-v198.js'
      - 'public/app/context-plan-composer-v198.js'
      - 'public/app/deterministic-mode-v175.js'
      - 'public/app/working-campus-v156*'
      - 'scripts/verify-context-planning-rewards-v198.mjs'
      - 'scripts/verify-working-campus-planner-v199.mjs'
      - '.github/workflows/verify-context-planning-v198.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planning-and-rewards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check planning runtime syntax
        run: |
          node --check public/app/reward-policy-v198.js
          node --check public/app/context-plan-composer-v198.js
          node --check public/app/deterministic-mode-v175.js
          node --check scripts/verify-working-campus-planner-v199.mjs
      - name: Verify template diversity and anti-farming policy
        run: node scripts/verify-context-planning-rewards-v198.mjs
      - name: Verify active Working Campus wiring and settings boundary
        run: node scripts/verify-working-campus-planner-v199.mjs
      - name: Verify deterministic assistant integration
        run: grep -q 'semanticPlanning' public/app/deterministic-mode-v175.js
