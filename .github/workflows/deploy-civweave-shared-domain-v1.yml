name: Deploy Civweave Shared Domain v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/shared-domain/**'
      - 'cloudflare/core/migrations/0007_shared_domains.sql'
      - 'cloudflare/core/src/shared-domain-policy.mjs'
      - 'scripts/ensure-cloudflare-shared-domain-dns-v1.mjs'
      - 'scripts/prepare-cloudflare-launch-kit-v1.mjs'
      - 'scripts/verify-civweave-shared-domain-*.mjs'
      - '.github/workflows/deploy-civweave-shared-domain-v1.yml'

permissions:
  contents: read

concurrency:
  group: civweave-shared-domain-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify shared-domain source
        run: |
          node --check cloudflare/core/src/shared-domain-policy.mjs
          node --check cloudflare/shared-domain/src/index.mjs
          node --check scripts/ensure-cloudflare-shared-domain-dns-v1.mjs
          node scripts/verify-civweave-shared-domain-policy-v1.mjs
          node scripts/verify-civweave-shared-domain-router-v1.mjs

      - name: Require Cloudflare domain-router credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing repository secret CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing repository secret CLOUDFLARE_ACCOUNT_ID'; exit 2; }
          echo 'Required token access: D1 Edit, Workers Scripts Write, Workers Routes Write, Zone Read, DNS Write for civweave.cc.'
          npx --yes wrangler@latest --version
          npx --yes wrangler@latest whoami

      - name: Resolve civweave-core D1 database
        id: resources
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest d1 list --json > /tmp/civweave-d1.json
          D1_ID="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw = JSON.parse(fs.readFileSync('/tmp/civweave-d1.json','utf8'));
          const rows = Array.isArray(raw) ? raw : (raw.result || raw.databases || []);
          const row = rows.find(item => item?.name === 'civweave-core');
          process.stdout.write(String(row?.uuid || row?.id || row?.database_id || row?.databaseId || ''));
          NODE
          )"
          test -n "$D1_ID" || { echo 'Could not resolve existing civweave-core D1 database'; exit 3; }
          echo "d1_id=$D1_ID" >> "$GITHUB_OUTPUT"
          node scripts/prepare-cloudflare-launch-kit-v1.mjs "--d1-id=$D1_ID"

      - name: Ensure wildcard civweave.cc DNS ingress
        run: node scripts/ensure-cloudflare-shared-domain-dns-v1.mjs --zone civweave.cc

      - name: Apply shared-domain D1 migration
        run: npx --yes wrangler@latest d1 migrations apply civweave-core --remote --config .cloudflare-launch/core.wrangler.jsonc

      - name: Validate shared-domain Worker bundle
        run: npx --yes wrangler@latest deploy --dry-run --config .cloudflare-launch/shared-domain.wrangler.jsonc

      - name: Deploy shared-domain Worker and wildcard route
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --config .cloudflare-launch/shared-domain.wrangler.jsonc 2>&1 | tee /tmp/civweave-domain-router-deploy.log
          WORKER_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/civweave-domain-router-deploy.log | tail -1 || true)"
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Probe wildcard routing and canonical www redirect
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const checks = [
            { url: 'https://www.civweave.cc/', status: 308, location: 'https://civweave.cc/' },
            { url: 'https://domain-smoke-test.civweave.cc/', status: 404, code: 'shared-domain-not-found' }
          ];
          for (const check of checks) {
            let last = 'not attempted';
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                const response = await fetch(check.url, { redirect: 'manual', headers: { 'cache-control': 'no-cache' } });
                if (response.status !== check.status) throw new Error(`HTTP ${response.status}`);
                if (check.location && response.headers.get('location') !== check.location) throw new Error(`location=${response.headers.get('location')}`);
                if (check.code) {
                  const body = await response.json().catch(() => ({}));
                  if (body.code !== check.code) throw new Error(`code=${body.code || 'missing'}`);
                }
                console.log(`Verified ${check.url} on attempt ${attempt}.`);
                last = '';
                break;
              } catch (error) {
                last = `attempt ${attempt}: ${error.message}`;
                if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 5000));
              }
            }
            if (last) throw new Error(`Shared-domain probe failed for ${check.url}: ${last}`);
          }
          NODE

      - name: Publish shared-domain deployment
        run: |
          echo "Shared hub domain: https://<host-id>.civweave.cc"
          echo "Free underlay remains: https://civweave-<host-id>.pages.dev"
          echo "Router workers.dev URL: ${{ steps.deploy.outputs.worker_url }}"
