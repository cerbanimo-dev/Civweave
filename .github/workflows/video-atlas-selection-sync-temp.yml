name: Video Atlas Selection Sync Temp

on:
  push:
    branches:
      - fix/video-atlas-selection-sync-v2
    paths:
      - .github/workflows/video-atlas-selection-sync-temp.yml

permissions:
  contents: write

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Materialize Civweave 1.0.100 and bust atlas cache
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          version='1.0.100'
          index=Path('public/app/index.html')
          text=index.read_text(encoding='utf-8')
          old='/app/video-atlas-installer-v1.js?v=video-atlas-v1'
          new='/app/video-atlas-installer-v1.js?v=video-atlas-selection-sync-v2'
          if old not in text:
              raise SystemExit('expected legacy video atlas cache key is missing')
          index.write_text(text.replace(old,new),encoding='utf-8')
          Path('VERSION').write_text(version+'\n',encoding='utf-8')
          pkg_path=Path('package.json')
          pkg=json.loads(pkg_path.read_text(encoding='utf-8'))
          pkg['version']=version
          pkg_path.write_text(json.dumps(pkg,indent=2)+'\n',encoding='utf-8')
          lock_path=Path('package-lock.json')
          lock=json.loads(lock_path.read_text(encoding='utf-8'))
          lock['version']=version
          if isinstance(lock.get('packages'),dict) and isinstance(lock['packages'].get(''),dict):
              lock['packages']['']['version']=version
          lock_path.write_text(json.dumps(lock,indent=2)+'\n',encoding='utf-8')
          contract_path=Path('config/release-contract.json')
          contract=json.loads(contract_path.read_text(encoding='utf-8'))
          contract['canonical']['current']={'version':version,'path':f'releases/{version}','status':'current'}
          contract_path.write_text(json.dumps(contract,indent=2)+'\n',encoding='utf-8')
          PY
          node scripts/materialize-canonical-release.mjs
      - name: Verify atlas startup selection repair
        run: |
          set -euo pipefail
          node --check public/app/video-atlas-installer-v1.js
          node scripts/verify-video-learning-contract-v1.mjs
          node scripts/test-video-learning-contract-v1.mjs
          grep -F '/app/video-atlas-installer-v1.js?v=video-atlas-selection-sync-v2' public/app/index.html
          npm run check:release-discipline
      - name: Commit verified release
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Release video atlas selection sync as Civweave 1.0.100'
          git pull --rebase origin fix/video-atlas-selection-sync-v2
          git push origin HEAD:fix/video-atlas-selection-sync-v2
