name: Diagnose Stripe Connect Snapshot Webhook

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-stripe-connect-snapshot-webhook.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SNAPSHOT_WEBHOOK_URL: https://civweave-core.glaedn.workers.dev/api/money-edge/webhooks/stripe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Stripe SDK
        run: npm install --prefix cloudflare/core --omit=dev --no-audit --no-fund
      - name: Inspect sandbox webhook endpoints
        working-directory: cloudflare/core
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import Stripe from 'stripe';
          const key = String(process.env.STRIPE_SECRET_KEY || '').trim();
          if (!key.startsWith('sk_test_') && !key.startsWith('rk_test_')) throw new Error('Diagnostic refuses non-sandbox Stripe credentials.');
          const stripeClient = new Stripe(key, { httpClient: Stripe.createFetchHttpClient() });
          const endpoints = await stripeClient.webhookEndpoints.list({ limit: 100 });
          console.log(JSON.stringify(endpoints.data.map(endpoint => ({
            id: endpoint.id,
            url: endpoint.url,
            status: endpoint.status,
            livemode: endpoint.livemode,
            api_version: endpoint.api_version,
            enabled_events: endpoint.enabled_events,
            description: endpoint.description,
            metadata: endpoint.metadata,
          })), null, 2));
          const target = endpoints.data.filter(endpoint => endpoint.url === process.env.SNAPSHOT_WEBHOOK_URL);
          console.log(`TARGET_ENDPOINT_COUNT=${target.length}`);
          console.log(`TARGET_HAS_CHECKOUT_COMPLETED=${target.some(endpoint => endpoint.enabled_events.includes('checkout.session.completed') || endpoint.enabled_events.includes('*'))}`);
          console.log(`TARGET_HAS_CHARGE_REFUNDED=${target.some(endpoint => endpoint.enabled_events.includes('charge.refunded') || endpoint.enabled_events.includes('*'))}`);
          NODE
      - name: Inspect recent Stripe events stored in D1
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest d1 execute civweave-core --remote --json --command "SELECT event_id,event_type,livemode,processing_error,received_at FROM stripe_events ORDER BY received_at DESC LIMIT 20"
