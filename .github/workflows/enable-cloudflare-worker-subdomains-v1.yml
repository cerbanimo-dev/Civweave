name: Enable Civweave Workers.dev Endpoints

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-cloudflare-worker-subdomains-v1.yml'
      - 'cloudflare/recovery-relay/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy global Hub recovery proof relay
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 2; }
          npx --yes wrangler@latest deploy --config cloudflare/recovery-relay/wrangler.jsonc

      - name: Enable stable workers.dev routes
        shell: bash
        run: |
          set -euo pipefail
          enable_subdomain() {
            local script="$1"
            echo "Enabling workers.dev for ${script}"
            curl --fail --silent --show-error \
              --request POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${script}/subdomain" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data '{"enabled":true,"previews_enabled":false}' | tee "/tmp/${script}-subdomain.json"
            node --input-type=module - "/tmp/${script}-subdomain.json" <<'NODE'
          import fs from 'node:fs';
          const file = process.argv[2];
          const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (!payload.success || payload.result?.enabled !== true) throw new Error(`workers.dev enable failed: ${JSON.stringify(payload.errors || payload)}`);
          console.log(JSON.stringify(payload.result));
          NODE
          }
          enable_subdomain civweave-core
          enable_subdomain civweave-node-cloud
          enable_subdomain civweave-recovery-relay

      - name: Resolve live workers.dev endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' > /tmp/workers-account-subdomain.json
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('/tmp/workers-account-subdomain.json', 'utf8'));
          const subdomain = String(payload?.result?.subdomain || '').trim();
          if (!payload?.success || !/^[a-z0-9-]{1,63}$/i.test(subdomain)) {
            throw new Error(`Could not resolve this Cloudflare account's workers.dev subdomain: ${JSON.stringify(payload?.errors || payload)}`);
          }
          const endpoints = {
            WORKERS_ACCOUNT_SUBDOMAIN: subdomain,
            CORE_URL: `https://civweave-core.${subdomain}.workers.dev`,
            NODE_URL: `https://civweave-node-cloud.${subdomain}.workers.dev`,
            RECOVERY_RELAY_URL: `https://civweave-recovery-relay.${subdomain}.workers.dev`,
          };
          appendFileSync(process.env.GITHUB_ENV, Object.entries(endpoints).map(([key, value]) => `${key}=${value}`).join('\n') + '\n');
          console.log(JSON.stringify({ ok: true, workersAccountSubdomain: subdomain, recoveryRelay: endpoints.RECOVERY_RELAY_URL }));
          NODE

      - name: Probe recovery proof relay
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 2 --retry-all-errors "${RECOVERY_RELAY_URL}/api/health"
          echo

      - name: Configure free Hub recovery email routing
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const API = 'https://api.cloudflare.com/client/v4';
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const zoneName = 'commonweave.earth';
          const routingDomain = 'recovery.commonweave.earth';
          const mailbox = 'recover@recovery.commonweave.earth';
          const worker = 'civweave-recovery-relay';
          const auth = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };
          const annotate = value => String(value || '').replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');

          async function request(path, init = {}, { allowFailure = false } = {}) {
            const response = await fetch(API + path, { ...init, headers: { ...auth, ...(init.headers || {}) } });
            const payload = await response.json().catch(() => ({}));
            if ((!response.ok || payload.success !== true) && !allowFailure) {
              const detail = (payload.errors || []).map(item => item.message || item.code).join('; ') || `HTTP ${response.status}`;
              console.error(`::error title=Cloudflare Email Routing::${annotate(`${path}: ${detail}`)}`);
              throw Object.assign(new Error(detail), { status: response.status, path });
            }
            return { response, payload };
          }

          const zones = await request(`/zones?name=${encodeURIComponent(zoneName)}&account.id=${encodeURIComponent(accountId)}`);
          const zone = (zones.payload.result || []).find(item => item.name === zoneName);
          if (!zone?.id) throw new Error(`Cloudflare zone ${zoneName} was not found in this account.`);

          const dns = await request(`/zones/${zone.id}/email/routing/dns?subdomain=${encodeURIComponent(routingDomain)}`, {}, { allowFailure: true });
          const dnsText = JSON.stringify(dns.payload.result || {});
          if (!dns.response.ok || dns.payload.success !== true || !dnsText.includes(routingDomain)) {
            const enabled = await request(`/zones/${zone.id}/email/routing/dns`, {
              method: 'POST',
              body: JSON.stringify({ name: routingDomain }),
            });
            console.log(`Email Routing domain state: ${enabled.payload.result?.status || 'configured'}`);
          } else {
            console.log(`Email Routing DNS already exists for ${routingDomain}.`);
          }

          const listed = await request(`/zones/${zone.id}/email/routing/rules?per_page=100`);
          const rules = Array.isArray(listed.payload.result) ? listed.payload.result : [];
          const existing = rules.find(rule => (rule.matchers || []).some(matcher => matcher.type === 'literal' && matcher.field === 'to' && String(matcher.value || '').toLowerCase() === mailbox));
          const body = {
            name: 'Civweave Hub recovery',
            enabled: true,
            matchers: [{ type: 'literal', field: 'to', value: mailbox }],
            actions: [{ type: 'worker', value: [worker] }],
          };
          const saved = existing?.id
            ? await request(`/zones/${zone.id}/email/routing/rules/${existing.id}`, { method: 'PUT', body: JSON.stringify(body) })
            : await request(`/zones/${zone.id}/email/routing/rules`, { method: 'POST', body: JSON.stringify(body) });
          const rule = saved.payload.result;
          if (rule?.enabled !== true || !(rule?.actions || []).some(action => action.type === 'worker' && (action.value || []).includes(worker))) {
            throw new Error('Hub recovery Email Routing rule did not become active.');
          }
          console.log(JSON.stringify({ ok: true, routingDomain, mailbox, worker, ruleId: rule.id || existing?.id || null }));
          NODE

      - name: Probe core money edge
        shell: bash
        run: |
          set -euo pipefail
          for path in /api/health /api/money-edge/status /api/money-edge/trust; do
            echo "GET ${CORE_URL}${path}"
            curl --fail --silent --show-error --retry 8 --retry-delay 2 --retry-all-errors "${CORE_URL}${path}"
            echo
          done

      - name: Probe host-node fabric
        shell: bash
        run: |
          set -euo pipefail
          echo "GET ${NODE_URL}/api/fabric/health"
          curl --fail --silent --show-error --retry 8 --retry-delay 2 --retry-all-errors "${NODE_URL}/api/fabric/health"
          echo

      - name: Report canonical endpoints
        run: |
          echo "CIVWEAVE_MONEY_EDGE_URL=${CORE_URL}"
          echo "CIVWEAVE_NODE_FABRIC_URL=${NODE_URL}"
          echo "CIVWEAVE_HUB_RECOVERY_RELAY=${RECOVERY_RELAY_URL}"
          echo "CIVWEAVE_HUB_RECOVERY_EMAIL=recover@recovery.commonweave.earth"
