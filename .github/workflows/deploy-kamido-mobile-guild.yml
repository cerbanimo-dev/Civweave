name: Deploy Kamido mobile Guild edge

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - '.github/deploy/kamido-mobile-guild'

permissions:
  contents: read

concurrency:
  group: deploy-kamido-mobile-guild
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.KAMIDO_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.KAMIDO_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Kamido Cloudflare credentials are configured
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing KAMIDO_CLOUDFLARE_API_TOKEN or KAMIDO_CLOUDFLARE_ACCOUNT_ID repository secret." >&2
            exit 1
          fi

      - name: Install mobile Guild edge deployment dependencies
        run: npm install --prefix cloudflare/mobile-guild-edge --no-audit --no-fund

      - name: Deploy Kamido Worker
        run: npm --prefix cloudflare/mobile-guild-edge run deploy -- --name civweave-guild-cloud --keep-vars

      - name: Verify deployed Guild capacity endpoint
        run: |
          node - <<'NODE'
          const response = await fetch('https://civweave-guild-cloud.new-new-york-84759cba63.workers.dev/api/fabric/capacity', { headers: { accept: 'application/json' } });
          const body = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(`Capacity endpoint returned HTTP ${response.status}: ${JSON.stringify(body)}`);
          if (Number(body?.slots?.paid) < 1 && Number(body?.paidExpansionSeatsRemaining) < 1) {
            throw new Error(`Deployment completed, but Patron capacity is still not being published: ${JSON.stringify(body)}`);
          }
          console.log(JSON.stringify({ ok: true, status: response.status, paid: body?.slots?.paid ?? body?.paidExpansionSeatsRemaining, free: body?.slots?.free ?? body?.communitySeatsRemaining }));
          NODE