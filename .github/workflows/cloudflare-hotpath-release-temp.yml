name: Cloudflare Hotpath Release Temp

on:
  push:
    branches:
      - fix/cloudflare-build-hotpath-v1
    paths:
      - .github/workflows/cloudflare-hotpath-release-temp.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Materialize Civweave 1.0.101
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          version='1.0.101'
          Path('VERSION').write_text(version+'\n',encoding='utf-8')
          for name in ['package.json','package-lock.json']:
              path=Path(name); data=json.loads(path.read_text(encoding='utf-8')); data['version']=version
              if name=='package-lock.json' and isinstance(data.get('packages'),dict) and isinstance(data['packages'].get(''),dict): data['packages']['']['version']=version
              path.write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          contract_path=Path('config/release-contract.json')
          contract=json.loads(contract_path.read_text(encoding='utf-8'))
          contract['canonical']['current']={'version':version,'path':f'releases/{version}','status':'current'}
          contract_path.write_text(json.dumps(contract,indent=2)+'\n',encoding='utf-8')
          PY
          node scripts/materialize-canonical-release.mjs
      - name: Verify optimized Cloudflare release
        run: |
          set -euo pipefail
          node scripts/verify-cloudflare-deploy-discipline.mjs
          node scripts/verify-cloudflare-portable-zip-v185.mjs
          npm run check:release-discipline
      - name: Commit verified release
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add VERSION package.json package-lock.json config/release-contract.json public releases/1.0.101 scripts/smoke-gateway-v131-base.mjs scripts/verify-device-package-self-heal-v184.mjs
          git commit -m '[CF-Pages-Skip] Release optimized Cloudflare Pages hot path as Civweave 1.0.101'
          git pull --rebase origin fix/cloudflare-build-hotpath-v1
          git push origin HEAD:fix/cloudflare-build-hotpath-v1
