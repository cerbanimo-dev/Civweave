name: Materialize realm consoles v140

on:
  push:
    branches: [feature/realm-cabinet-consoles-v140]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/realm-cabinet-consoles-v140
          fetch-depth: 0
      - name: Wire host, PWA, and verification
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          p=Path('public/service-worker.js')
          s=p.read_text()
          s=s.replace("CACHE_REVISION='minilm-runtime-r17'","CACHE_REVISION='realm-cabinets-r18'")
          s=s.replace("build:'1.0.30-minilm-runtime-r17'","build:'1.0.30-realm-cabinets-r18'")
          needle="  '/app/v130-cabinet-launcher.css','/app/v130-cabinet-launcher.js',\n"
          addition="  '/app/realm-console-v140.html','/app/realm-console-v140.css','/app/realm-console-v140.js',\n"
          if addition not in s:
              if needle not in s: raise SystemExit('service worker launcher entry missing')
              s=s.replace(needle,needle+addition,1)
          p.write_text(s)

          p=Path('server-v130.mjs')
          s=p.read_text()
          needle="      '/app/anarchadia-console-v139.js'\n"
          replacement="      '/app/anarchadia-console-v139.js',\n      '/app/realm-console-v140.html'\n"
          if "'/app/realm-console-v140.html'" not in s:
              if needle not in s: raise SystemExit('server console allowlist missing')
              s=s.replace(needle,replacement,1)
          p.write_text(s)

          p=Path('package.json')
          data=json.loads(p.read_text())
          syntax=data['scripts']['check:syntax']
          if 'public/app/realm-console-v140.js' not in syntax:
              syntax=syntax.replace('node --check public/app/anarchadia-console-v139.js','node --check public/app/anarchadia-console-v139.js && node --check public/app/realm-console-v140.js')
          if 'scripts/verify-realm-consoles-v140.mjs' not in syntax:
              syntax=syntax.replace('node --check scripts/verify-anarchadia-console-v139.mjs','node --check scripts/verify-anarchadia-console-v139.mjs && node --check scripts/verify-realm-consoles-v140.mjs')
          data['scripts']['check:syntax']=syntax
          check=data['scripts']['check']
          if 'verify-realm-consoles-v140.mjs' not in check:
              check=check.replace('node scripts/verify-anarchadia-console-v139.mjs','node scripts/verify-anarchadia-console-v139.mjs && node scripts/verify-realm-consoles-v140.mjs')
          data['scripts']['check']=check
          p.write_text(json.dumps(data,indent=2)+'\n')

          for name in ['scripts/verify-anarchadia-console-v139.mjs','scripts/verify-minilm-reflex-v138.mjs']:
              p=Path(name);s=p.read_text();s=s.replace("CACHE_REVISION='minilm-runtime-r17'","CACHE_REVISION='realm-cabinets-r18'").replace("cacheRevision:'minilm-runtime-r17'","cacheRevision:'realm-cabinets-r18'");p.write_text(s)

          p=Path('.github/workflows/verify-v126.yml')
          s=p.read_text().replace("CACHE_REVISION='minilm-runtime-r17'","CACHE_REVISION='realm-cabinets-r18'")
          needle="          curl -fsS http://127.0.0.1:8787/app/anarchadia-console-v139.html -o anarchadia-console.html\n"
          checks="          curl -fsS http://127.0.0.1:8787/app/realm-console-v140.html -o realm-console.html\n          grep -q 'Commonweave Realm Console' realm-console.html\n          curl -fsS http://127.0.0.1:8787/app/realm-console-v140.css -o realm-console.css\n          grep -q '.rc-feature-grid' realm-console.css\n          curl -fsS http://127.0.0.1:8787/app/realm-console-v140.js -o realm-console.js\n          grep -q 'commonweave.realm-console.v140' realm-console.js\n          grep -q 'living-school.send-quest' realm-console.js\n          grep -q 'cerbanimo.publish-need' realm-console.js\n          if grep -q 'sourceRoute' realm-console.js; then exit 1; fi\n"
          if 'realm-console-v140.html -o realm-console.html' not in s:
              if needle not in s: raise SystemExit('live console insertion point missing')
              s=s.replace(needle,checks+needle,1)
          evidence="            realm-console.html\n            realm-console.css\n            realm-console.js\n"
          if '            realm-console.html\n' not in s:
              s=s.replace('            anarchadia-console.html\n',evidence+'            anarchadia-console.html\n',1)
          s=s.replace('commonweave-v130-minilm-runtime-r17-evidence','commonweave-v130-realm-cabinets-r18-evidence')
          p.write_text(s)
          PY
      - name: Remove temporary workflows
        run: rm -f .github/workflows/export-current-ui-source.yml .github/workflows/materialize-realm-consoles-v140.yml
      - name: Commit materialized release plumbing
        run: |
          git config user.name commonweave-release-bot
          git config user.email commonweave-release-bot@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Wire realm cabinets into host, PWA, and verification"
          git push origin HEAD:feature/realm-cabinet-consoles-v140
