name: Materialize Working Campus Fast Boot v1

on:
  push:
    branches: [feat/fast-boot-v1]
    paths:
      - 'scripts/build-working-campus-fast-boot-v1.mjs'
      - '.github/workflows/materialize-working-campus-fast-boot-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fast-boot-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize Fast Boot v1
        run: node scripts/build-working-campus-fast-boot-v1.mjs
      - name: Verify generated runtime
        run: |
          node --check public/app/working-campus-v156.js
          node scripts/build-working-campus-fast-boot-v1.mjs --check
          node scripts/verify-working-campus-fast-boot-v1.mjs
      - name: Commit generated runtime
        run: |
          rm .github/workflows/materialize-working-campus-fast-boot-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app/working-campus-v156.js public/app/working-campus-v440.html package.json .github/workflows/materialize-working-campus-fast-boot-v1.yml
          git diff --cached --quiet && exit 0
          git commit -m "Materialize Working Campus Fast Boot v1"
          git push origin HEAD:feat/fast-boot-v1
