name: Apply stable entry response v217

on:
  push:
    branches: [agent/normalize-stable-entry-v217]
    paths:
      - scripts/apply-stable-entry-response-v217.mjs
      - .github/workflows/apply-stable-entry-response-v217.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/normalize-stable-entry-v217
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply response normalization
        run: node scripts/apply-stable-entry-response-v217.mjs
      - name: Validate patched runtime
        run: |
          node --check public/install-v130.js
          node --check public/service-worker-core-v208.js
          node --check public/service-worker-v203.js
          node scripts/verify-stable-entry-response-v217.mjs
      - name: Commit generated repair
        run: |
          git config user.name "cerbanimo-dev"
          git config user.email "cerbanimo@gmail.com"
          git add public/index.html public/install-v130.js public/service-worker-core-v208.js public/service-worker-v203.js scripts/smoke-service-worker-registration-watchdog-v207.mjs scripts/verify-stable-entry-response-v217.mjs .github/workflows/verify-stable-entry-response-v217.yml
          if git diff --cached --quiet; then
            echo "Stable entry response repair already current."
            exit 0
          fi
          git commit -m "Normalize the stable app entry response"
          git push origin HEAD:agent/normalize-stable-entry-v217
