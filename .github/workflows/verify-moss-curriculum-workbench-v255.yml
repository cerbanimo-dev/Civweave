name: Verify Moss Curriculum Workbench v255

on:
  pull_request:
    paths:
      - 'public/app/living-school-chat-workbench-v255.js'
      - 'public/app/living-school-cleanroom-actions-v243.mjs'
      - 'public/app/cabinets/living-school/living-school-cleanroom-v218.mjs'
      - 'public/app/shared-guide-surface-v236.js'
      - 'scripts/verify-moss-curriculum-workbench-v255.mjs'
      - '.github/workflows/verify-moss-curriculum-workbench-v255.yml'
  push:
    branches: [main]
    paths:
      - 'public/app/living-school-chat-workbench-v255.js'
      - 'public/app/living-school-cleanroom-actions-v243.mjs'
      - 'public/app/cabinets/living-school/living-school-cleanroom-v218.mjs'
      - 'public/app/shared-guide-surface-v236.js'
      - 'scripts/verify-moss-curriculum-workbench-v255.mjs'
      - '.github/workflows/verify-moss-curriculum-workbench-v255.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check public/app/living-school-chat-workbench-v255.js
      - run: node --check public/app/living-school-cleanroom-actions-v243.mjs
      - run: node --check public/app/cabinets/living-school/living-school-cleanroom-v218.mjs
      - run: node --check public/app/shared-guide-surface-v236.js
      - run: node scripts/verify-moss-curriculum-workbench-v255.mjs
