name: Materialize chat controls v253

on:
  push:
    branches:
      - fix/chat-send-capture-v253
    paths:
      - '.github/workflows/materialize-chat-controls-v253.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-send-capture-v253
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply chat control repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          realm_path=Path('public/app/realm-session-integrity-v237.js')
          realm=realm_path.read_text()
          realm=realm.replace("const VERSION='1.0.31-realm-session-integrity-v237';","const VERSION='1.0.32-realm-session-integrity-v237-chat-controls-v253';")
          old="function onTrigger(event){const trigger=event.target.closest?.('[data-cwf-chat],[data-open-guide-chat],[data-open-persistent-chat],#moss,#compass,.ls-moss,.ls-compass,[data-guide]');if(!trigger)return;event.preventDefault();event.stopImmediatePropagation();openChat({guide:pageSystem})}"
          new="function onTrigger(event){if(event.target.closest?.(`#${ROOT_ID},#${LAUNCHER_ID},#cw-shared-guide-surface-v236`))return;const trigger=event.target.closest?.('[data-cwf-chat],[data-open-guide-chat],[data-open-persistent-chat],#moss,#compass,.ls-moss,.ls-compass,[data-guide]');if(!trigger)return;event.preventDefault();event.stopImmediatePropagation();openChat({guide:pageSystem})}"
          if old not in realm:
              raise SystemExit('Expected realm-session onTrigger contract not found')
          realm=realm.replace(old,new,1)
          realm_path.write_text(realm)

          Path('VERSION').write_text('1.0.49\n')
          pkg_path=Path('package.json')
          pkg=json.loads(pkg_path.read_text())
          pkg['version']='1.0.49'
          pkg_path.write_text(json.dumps(pkg,indent=2)+'\n')

          verifier="""import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import path from 'node:path';
          import {fileURLToPath} from 'node:url';

          const root=path.resolve(path.dirname(fileURLToPath(import.meta.url)),'..');
          const read=relative=>readFile(path.join(root,relative),'utf8');
          const [realm,workspace,shared]=await Promise.all([
            read('public/app/realm-session-integrity-v237.js'),
            read('public/app/guide-workspace-v242.js'),
            read('public/app/shared-guide-surface-v236.js')
          ]);

          const handlerStart=realm.indexOf('function onTrigger(event){');
          const guard=realm.indexOf('event.target.closest?.(`#${ROOT_ID},#${LAUNCHER_ID},#cw-shared-guide-surface-v236`)',handlerStart);
          const broadTrigger=realm.indexOf("event.target.closest?.('[data-cwf-chat],[data-open-guide-chat],[data-open-persistent-chat],#moss,#compass,.ls-moss,.ls-compass,[data-guide]')",handlerStart);
          assert(handlerStart>=0,'Realm-session chat trigger handler is missing.');
          assert(guard>handlerStart&&guard<broadTrigger,'Chat-root exclusion must run before the broad [data-guide] launcher selector.');
          assert(realm.includes('if(event.target.closest?.(`#${ROOT_ID},#${LAUNCHER_ID},#cw-shared-guide-surface-v236`))return;'),'Chat controls can still be swallowed by the legacy launcher capture handler.');
          assert(workspace.includes("document.addEventListener('submit',onSubmitCapture,true)"),'Canonical workspace submit capture is missing.');
          assert(workspace.includes('void submitActive(text)'),'Canonical workspace does not route form submission into submitActive.');
          assert(workspace.includes('submitText:async(text,system=activeWindow)'),'Canonical workspace direct submission API is missing.');
          assert(shared.includes('await api.submitText(value,currentSystem)'),'Inline realm composer is not routed through the canonical submission API.');
          assert(shared.includes('type=\"submit\"')||shared.includes('type="submit"'),'Inline realm composer Send control is not a submit button.');

          console.log(JSON.stringify({ok:true,revision:'v253-chat-control-capture',chatRootExcludedFromLegacyTrigger:true,sendButtonDefaultPreserved:true,closeMinimizeDefaultPreserved:true,canonicalWorkspaceSubmit:true,inlineSubmit:true},null,2));
          """
          Path('scripts/verify-chat-controls-v253.mjs').write_text(verifier)

          workflow="""name: Verify Chat Controls v253

          on:
            pull_request:
              paths:
                - 'public/app/realm-session-integrity-v237.js'
                - 'public/app/guide-workspace-v242.js'
                - 'public/app/shared-guide-surface-v236.js'
                - 'scripts/verify-chat-controls-v253.mjs'
                - 'VERSION'
                - 'package.json'
            push:
              branches: [main]
              paths:
                - 'public/app/realm-session-integrity-v237.js'
                - 'public/app/guide-workspace-v242.js'
                - 'public/app/shared-guide-surface-v236.js'
                - 'scripts/verify-chat-controls-v253.mjs'
                - 'VERSION'
                - 'package.json'

          jobs:
            verify:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - name: Check chat control syntax
                  run: |
                    node --check public/app/realm-session-integrity-v237.js
                    node --check public/app/guide-workspace-v242.js
                    node --check public/app/shared-guide-surface-v236.js
                    node --check scripts/verify-chat-controls-v253.mjs
                - name: Verify chat control capture contract
                  run: node scripts/verify-chat-controls-v253.mjs
          """
          Path('.github/workflows/verify-chat-controls-v253.yml').write_text(workflow)
          PY
      - name: Materialize release
        run: |
          node scripts/sync-release-version-assets.mjs
          node scripts/sync-release-coherence-v220.mjs
      - name: Verify repair
        run: |
          node --check public/app/realm-session-integrity-v237.js
          node --check public/app/guide-workspace-v242.js
          node --check public/app/shared-guide-surface-v236.js
          node --check scripts/verify-chat-controls-v253.mjs
          node scripts/verify-chat-controls-v253.mjs
          node scripts/verify-regression-fixes-v243.mjs
          node scripts/verify-guide-workspace-v242.mjs
          node scripts/verify-shared-guide-floating-v236.mjs
          node scripts/verify-chat-single-owner-v245.mjs
          node scripts/verify-mobile-chat-layout-v248.mjs
          node scripts/verify-chat-convergence-v250.mjs
          git diff --check
      - name: Commit materialized repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/materialize-chat-controls-v253.yml
          if git diff --cached --quiet; then
            echo "Chat control repair already materialized."
          else
            git commit -m "Fix canonical chat control capture v253"
            git push
          fi
