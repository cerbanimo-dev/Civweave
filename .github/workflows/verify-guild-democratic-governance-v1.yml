name: Verify Guild democratic moderation and role transfer
on:
  pull_request:
    paths:
      - 'cloudflare/mobile-guild-edge/src/guild-democratic-governance-v1.mjs'
      - 'cloudflare/mobile-guild-edge/src/guild-democratic-governance-state-v1.mjs'
      - 'cloudflare/mobile-guild-edge/src/creator-provenance-entry.mjs'
      - 'cloudflare/core/src/guild-peer-reports-v1.mjs'
      - 'cloudflare/core/src/live-entry.mjs'
      - 'cloudflare/core/src/origin-entry.mjs'
      - 'cloudflare/core/src/guild-directory-entry.mjs'
      - 'cloudflare/core/migrations/0016_guild_peer_reports.sql'
      - 'public/app/guild-democratic-governance-v1.js'
      - 'public/app/guild-owner-management-v1.js'
      - 'public/app/guild-symbol-v1.js'
      - 'public/app/working-campus-v440.html'
      - 'scripts/test-guild-democratic-governance-v1.mjs'
      - '.github/workflows/verify-guild-democratic-governance-v1.yml'
  push:
    branches: [staging,main]
    paths:
      - 'cloudflare/mobile-guild-edge/src/guild-democratic-governance-v1.mjs'
      - 'cloudflare/mobile-guild-edge/src/guild-democratic-governance-state-v1.mjs'
      - 'cloudflare/mobile-guild-edge/src/creator-provenance-entry.mjs'
      - 'cloudflare/core/src/guild-peer-reports-v1.mjs'
      - 'public/app/guild-democratic-governance-v1.js'
      - 'scripts/test-guild-democratic-governance-v1.mjs'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and governance policy
        run: |
          node --check cloudflare/mobile-guild-edge/src/guild-democratic-governance-v1.mjs
          node --check cloudflare/mobile-guild-edge/src/guild-democratic-governance-state-v1.mjs
          node --check cloudflare/mobile-guild-edge/src/creator-provenance-entry.mjs
          node --check cloudflare/core/src/guild-peer-reports-v1.mjs
          node --check cloudflare/core/src/live-entry.mjs
          node --check cloudflare/core/src/origin-entry.mjs
          node --check cloudflare/core/src/guild-directory-entry.mjs
          node --check public/app/guild-democratic-governance-v1.js
          node --check public/app/guild-symbol-v1.js
          node --check public/app/guild-owner-management-v1.js
      - name: Prove quorum and atomic approved-action behavior with SQLite
        run: node --test scripts/test-guild-democratic-governance-v1.mjs
      - name: Verify old unilateral removal is disabled
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const edge=fs.readFileSync('cloudflare/mobile-guild-edge/src/creator-provenance-entry.mjs','utf8');
          const owner=fs.readFileSync('public/app/guild-owner-management-v1.js','utf8');
          const ui=fs.readFileSync('public/app/guild-symbol-v1.js','utf8');
          const app=fs.readFileSync('public/app/working-campus-v440.html','utf8');
          if(!edge.includes('this.ctx.storage.transactionSync'))throw Error('Atomic approval/action transaction is missing');
          if(!edge.includes("action==='remove-member')throw"))throw Error('Founder bypass is not disabled');
          if(owner.includes('data-gm-action="remove-member"'))throw Error('Unilateral remove button remains');
          if(!ui.includes('data-guild-ui-action="council"'))throw Error('Council is not reachable from Guild tab');
          if(!app.includes('guild-democratic-governance-v1.js'))throw Error('Council runtime is not loaded by the campus');
          EOF
