name: Verify Civweave ledger settlement invariants v1
on:
  push:
    branches: [staging, main]
    paths:
      - 'public/app/civweave-fulfillment-ledger-v1.js'
      - 'scripts/verify-civweave-ledger-settlement-invariants-v1.mjs'
      - '.github/workflows/verify-civweave-ledger-settlement-invariants-v1.yml'
  pull_request:
    paths:
      - 'public/app/civweave-fulfillment-ledger-v1.js'
      - 'scripts/verify-civweave-ledger-settlement-invariants-v1.mjs'
      - '.github/workflows/verify-civweave-ledger-settlement-invariants-v1.yml'
permissions:
  contents: read
jobs:
  verify-settlement-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-civweave-ledger-settlement-invariants-v1.mjs
