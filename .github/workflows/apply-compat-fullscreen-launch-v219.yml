name: Apply fullscreen launch compatibility v219

on:
  push:
    branches: [agent/compat-fullscreen-launch-v219]
    paths:
      - scripts/apply-compat-fullscreen-launch-v219.mjs
      - .github/workflows/apply-compat-fullscreen-launch-v219.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compat-fullscreen-launch-v219
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply compatibility route
        run: node scripts/apply-compat-fullscreen-launch-v219.mjs
      - name: Validate patched runtime
        run: |
          node --check public/install-v130.js
          node --check public/service-worker-core-v208.js
          node --check public/service-worker-v203.js
          node scripts/verify-deterministic-pwa-boot-v218.mjs
          node scripts/verify-compat-fullscreen-launch-v219.mjs
      - name: Commit compatibility repair
        run: |
          git config user.name "cerbanimo-dev"
          git config user.email "cerbanimo@gmail.com"
          git add public/index.html public/install-v130.js public/service-worker-core-v208.js public/service-worker-v203.js scripts/verify-deterministic-pwa-boot-v218.mjs scripts/verify-compat-fullscreen-launch-v219.mjs
          if git diff --cached --quiet; then
            echo "Compatibility repair already current."
            exit 0
          fi
          git commit -m "Support installed fullscreen launch URLs"
          git push origin HEAD:agent/compat-fullscreen-launch-v219
