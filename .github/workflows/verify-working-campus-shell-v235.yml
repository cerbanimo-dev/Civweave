name: Verify Working Campus Shell v235

on:
  pull_request:
    paths:
      - 'public/app/working-campus-v156.css'
      - 'public/app/go-live-visual-v300.css'
      - 'public/app/working-campus-v156.js'
      - 'public/app/working-campus-v156.html'
      - 'public/app/settings-gateway-v317.js'
      - 'public/app/core-interface-runtime-v1.js'
      - 'scripts/verify-working-campus-shell-v235.mjs'
      - 'scripts/verify-working-campus-mvp-v155.mjs'
      - '.github/workflows/verify-working-campus-shell-v235.yml'
      - 'VERSION'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - 'public/app/working-campus-v156.css'
      - 'public/app/go-live-visual-v300.css'
      - 'public/app/working-campus-v156.js'
      - 'public/app/working-campus-v156.html'
      - 'public/app/settings-gateway-v317.js'
      - 'public/app/core-interface-runtime-v1.js'
      - 'scripts/verify-working-campus-shell-v235.mjs'
      - 'scripts/verify-working-campus-mvp-v155.mjs'
      - '.github/workflows/verify-working-campus-shell-v235.yml'
      - 'VERSION'
      - 'package.json'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax
        run: |
          node --check public/app/working-campus-v156.js
          node --check scripts/verify-working-campus-shell-v235.mjs
          node --check scripts/verify-working-campus-mvp-v155.mjs
      - name: Verify compact shell contract
        run: node scripts/verify-working-campus-shell-v235.mjs
      - name: Verify Working Campus behavior contract
        run: node scripts/verify-working-campus-mvp-v155.mjs
