name: Materialize Living School radio v148

on:
  push:
    branches:
      - fix/living-school-radio-suggestions
    paths:
      - '.github/workflows/materialize-living-school-radio-v148.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/living-school-radio-suggestions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align package version
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const version=fs.readFileSync('VERSION','utf8').trim();
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.version=version;
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          NODE
      - name: Materialize release
        run: |
          node scripts/sync-release-version-assets.mjs
          node scripts/sync-release-coherence-v220.mjs
      - name: Verify
        run: |
          node --check scripts/verify-living-school-radio-v252.mjs
          node scripts/verify-living-school-radio-v252.mjs
          node scripts/verify-system-radio-v233.mjs
          node scripts/verify-living-school-cleanroom-v218.mjs
          node scripts/verify-five-system-navigation-v227.mjs
          node scripts/verify-canonical-core-only-v226.mjs
          node scripts/verify-chat-convergence-v250.mjs
          git diff --check
      - name: Commit generated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/materialize-living-school-radio-v148.yml
          if git diff --cached --quiet; then
            echo "Release surfaces already materialized."
          else
            git commit -m "Materialize Civweave 1.0.48 Living School radio fix"
            git push
          fi
