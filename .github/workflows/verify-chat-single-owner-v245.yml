name: Verify Chat Single Owner v245

on:
  pull_request:
    paths:
      - 'public/app/chat-single-owner-v245.js'
      - 'public/app/persistent-guide-viewport-v216.js'
      - 'public/service-worker-chat-repair-v245.js'
      - 'public/service-worker-v203.js'
      - 'scripts/verify-chat-single-owner-v245.mjs'
      - 'VERSION'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'public/app/chat-single-owner-v245.js'
      - 'public/app/persistent-guide-viewport-v216.js'
      - 'public/service-worker-chat-repair-v245.js'
      - 'public/service-worker-v203.js'
      - 'scripts/verify-chat-single-owner-v245.mjs'
      - 'VERSION'
      - 'package.json'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check repair syntax
        run: |
          node --check public/app/chat-single-owner-v245.js
          node --check public/app/persistent-guide-viewport-v216.js
          node --check public/service-worker-chat-repair-v245.js
          node --check public/service-worker-v203.js
          node --check scripts/verify-chat-single-owner-v245.mjs
      - name: Verify canonical chat ownership and cache purge
        run: node scripts/verify-chat-single-owner-v245.mjs
