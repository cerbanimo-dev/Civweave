name: Materialize low-end device lab once

on:
  push:
    branches:
      - ops/low-end-device-lab-v1
    paths:
      - .github/workflows/materialize-low-end-device-lab-once.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ops/low-end-device-lab-v1
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Refuse a stale runtime base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "2e0d2b042de6bc25b78659556dd3fb92d6739de4"
      - name: Add lab to installed offline shell and manual memory fallback
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const workerFile='public/service-worker-core-v208.js';
          let worker=await readFile(workerFile,'utf8');
          const anchor="const OPTIONAL_SHELL_ASSETS = [\n";
          const assets=[
            '/app/low-end-device-lab-v1.html',
            '/app/low-end-device-lab-v1.js',
            '/app/local-ai/model-registry-v266.js',
            '/app/local-ai/download-manager-v267.js',
            '/app/local-ai/runtime-v266.js',
            '/app/mobile-ai-hardening-v302.js',
            '/app/local-ai/test-pulse-v269.js',
            '/app/minilm-context-router-v344.js',
            '/app/models/all-minilm-l6-v2/adapter.js'
          ];
          if(!worker.includes(anchor))throw new Error('Optional shell asset anchor moved.');
          if(!worker.includes("'/app/low-end-device-lab-v1.html'")){
            worker=worker.replace(anchor,anchor+assets.map(asset=>`  '${asset}',`).join('\n')+'\n');
            await writeFile(workerFile,worker);
          }

          const htmlFile='public/app/low-end-device-lab-v1.html';
          let html=await readFile(htmlFile,'utf8');
          const htmlAnchor='<label>Approx. observation minutes<input id="observation-minutes" inputmode="decimal" type="number" min="1" max="240" step="1"></label>';
          if(!html.includes('id="manual-peak-memory"')){
            if(!html.includes(htmlAnchor))throw new Error('Physical observation form anchor moved.');
            html=html.replace(htmlAnchor,`${htmlAnchor}\n      <label>Manual peak memory (MB, only if browser memory API is unavailable)<input id="manual-peak-memory" inputmode="decimal" type="number" min="1" step="1"></label>`);
            await writeFile(htmlFile,html);
          }

          const jsFile='public/app/low-end-device-lab-v1.js';
          let js=await readFile(jsFile,'utf8');
          const before="const start=Number($('battery-start').value),end=Number($('battery-end').value),thermal=$('thermal').value,minutes=Number($('observation-minutes').value),notes=$('physical-notes').value.trim(),battery=await batterySnapshot();";
          const after="const start=Number($('battery-start').value),end=Number($('battery-end').value),thermal=$('thermal').value,minutes=Number($('observation-minutes').value),manualPeak=Number($('manual-peak-memory').value),notes=$('physical-notes').value.trim(),battery=await batterySnapshot();";
          if(!js.includes('manualPeak=Number(')){
            if(!js.includes(before))throw new Error('Physical observation runtime anchor moved.');
            js=js.replace(before,after);
            const stateAnchor="const startValue=Number.isFinite(start)?start:(state.physical.batteryStartPercent??battery?.level??null),endValue=Number.isFinite(end)?end:(battery?.level??null);";
            const stateAfter=`${stateAnchor}\n  if(Number.isFinite(manualPeak)&&manualPeak>0){state.measurements.peakMemoryMb=Math.max(Number(state.measurements.peakMemoryMb||0),manualPeak);state.physical.manualPeakMemoryMb=manualPeak;state.physical.memoryMeasurementSource='manual-os-observation';}`;
            if(!js.includes(stateAnchor))throw new Error('Physical evidence state anchor moved.');
            js=js.replace(stateAnchor,stateAfter);
            await writeFile(jsFile,js);
          }
          NODE
      - name: Advance patch release
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const current=(await readFile('VERSION','utf8')).trim();
          const match=/^(\d+)\.(\d+)\.(\d+)$/.exec(current);
          if(!match)throw new Error(`Invalid VERSION ${current}`);
          const next=`${match[1]}.${match[2]}.${Number(match[3])+1}`;
          await writeFile('VERSION',`${next}\n`);
          for(const file of ['package.json','package-lock.json']){
            const data=JSON.parse(await readFile(file,'utf8'));
            data.version=next;
            if(file==='package-lock.json'&&data.packages?.[''])data.packages[''].version=next;
            await writeFile(file,`${JSON.stringify(data,null,2)}\n`);
          }
          const contract=JSON.parse(await readFile('config/release-contract.json','utf8'));
          contract.canonical.current.version=next;
          contract.canonical.current.path=`releases/${next}`;
          await writeFile('config/release-contract.json',`${JSON.stringify(contract,null,2)}\n`);
          for(const file of ['public/app/installed-entry-v146.js','public/app/installed-entry-v146.html','ops/launch/README.md']){
            let source=await readFile(file,'utf8');
            source=source.replaceAll(current,next);
            await writeFile(file,source);
          }
          console.log(JSON.stringify({current,next}));
          NODE
      - name: Regenerate release and shell metadata
        run: |
          node scripts/sync-release-version-assets.mjs
          node scripts/sync-release-coherence-v220.mjs
          node scripts/generate-prelive-metadata-v281.mjs
          node scripts/materialize-canonical-release.mjs
      - name: Verify device lab and release contracts
        run: |
          node --check public/app/low-end-device-lab-v1.js
          node scripts/verify-low-end-device-lab-v1.mjs
          node scripts/verify-local-ai-smooth-fit-v314.mjs
          node scripts/verify-pwa-cold-launch-recovery-v426.mjs
          node scripts/verify-release-version-sync.mjs
          node scripts/verify-release-coherence-v220.mjs
          npm run check:release-discipline
          git diff --check
      - name: Commit release and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "civweave-launch-bot"
          git config user.email "civweave-launch-bot@users.noreply.github.com"
          git rm .github/workflows/materialize-low-end-device-lab-once.yml
          git add -A
          git commit -m "Ship low-end physical launch lab as Civweave 1.0.137"
          git push origin HEAD:ops/low-end-device-lab-v1
