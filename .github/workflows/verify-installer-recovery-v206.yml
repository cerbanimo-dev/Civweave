name: Verify installer and worker recovery v206

on:
  pull_request:
    paths:
      - 'server/gateway.mjs'
      - 'releases/**/server/**'
      - 'public/index.html'
      - 'public/install-v130.js'
      - 'public/service-worker.js'
      - 'public/service-worker-v156.js'
      - 'public/service-worker-v203.js'
      - 'public/service-worker-update-v204.js'
      - 'public/app/knowledge-school-**'
      - 'public/app/pwa-update-controller-v204.js'
      - 'public/downloads/knowledge-schools/**'
      - 'scripts/smoke-installer-recovery-v206.mjs'
      - 'scripts/verify-knowledge-school-seeds-v1.mjs'
      - 'scripts/verify-service-worker-evaluation-v189.mjs'
      - '.github/workflows/verify-installer-recovery-v206.yml'
  push:
    branches: [main]
    paths:
      - 'server/gateway.mjs'
      - 'releases/**/server/**'
      - 'public/index.html'
      - 'public/install-v130.js'
      - 'public/service-worker*.js'
      - 'public/app/knowledge-school-**'
      - 'public/app/pwa-update-controller-v204.js'
      - 'public/downloads/knowledge-schools/**'
      - 'scripts/smoke-installer-recovery-v206.mjs'
      - 'scripts/verify-knowledge-school-seeds-v1.mjs'
      - 'scripts/verify-service-worker-evaluation-v189.mjs'
      - '.github/workflows/verify-installer-recovery-v206.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check canonical and recovery syntax
        run: |
          node scripts/check-canonical-server-syntax.mjs
          node --check public/install-v130.js
          node --check public/service-worker.js
          node --check public/service-worker-v156.js
          node --check public/service-worker-v203.js
          node --check public/service-worker-update-v204.js
          node --check scripts/smoke-installer-recovery-v206.mjs
          node --check scripts/verify-knowledge-school-seeds-v1.mjs
          node --check scripts/verify-service-worker-evaluation-v189.mjs
      - name: Exercise exact console-error routes and worker composition
        run: node scripts/smoke-installer-recovery-v206.mjs
