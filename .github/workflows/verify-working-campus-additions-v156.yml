name: Verify Commonweave v1.0.6 Working Campus

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check active runtime
        run: npm run check:syntax
      - name: Verify v1.0.6 settings layer
        run: node scripts/verify-v106-settings-layer-v179.mjs
      - name: Verify repository package
        run: npm run check
      - name: Test Anarchadia governance kernel
        run: npm run test:anarchadia-governance
      - name: Test Anarchadia sovereignty kernel
        run: npm run test:anarchadia-sovereignty
      - name: Verify proof-driven checkpoints
        run: node scripts/test-proof-driven-checkpoints-v158.mjs
      - name: Verify tiered Cerbanimo rewards
        run: node scripts/test-tiered-cerbanimo-rewards-v157.mjs
