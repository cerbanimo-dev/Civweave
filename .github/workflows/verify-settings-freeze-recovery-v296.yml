name: Verify settings freeze recovery v316

on:
  push:
    branches:
      - main
      - 'fix/settings-freeze-v296'
      - 'agent/fix-settings-freeze-v316'
    paths:
      - 'public/app/experience-orchestrator-v232.js'
      - 'public/app/settings-parity-v295.js'
      - 'public/app/document-lifecycle-v221.js'
      - 'public/app/model-settings-controller-v173.js'
      - 'public/app/mobile-ai-hardening-v302.js'
      - 'public/app/local-ai/settings-panel-v267.js'
      - 'public/app/local-ai/runtime-v266.js'
      - 'public/app/local-chat-owner-v295.js'
      - 'public/app/install-boundary-v146.js'
      - 'scripts/verify-settings-freeze-recovery-v296.mjs'
      - 'scripts/verify-mobile-local-settings-v315.mjs'
      - 'scripts/verify-reload-settings-recovery-v294.mjs'
      - 'scripts/verify-chat-launch-readiness-v295.mjs'
      - 'scripts/verify-local-model-settings-mount-v273.mjs'
      - 'scripts/verify-living-school-settings-owner-v310.mjs'
      - 'scripts/verify-realm-local-ai-visible-v308.mjs'
      - 'scripts/verify-realm-local-ai-settings-v307.mjs'
      - 'scripts/verify-ai-settings-entry-runtime-spine-v269.mjs'
      - 'scripts/verify-working-campus-return-v425.mjs'
      - '.github/workflows/verify-settings-freeze-recovery-v296.yml'
  pull_request:
    paths:
      - 'public/app/experience-orchestrator-v232.js'
      - 'public/app/settings-parity-v295.js'
      - 'public/app/document-lifecycle-v221.js'
      - 'public/app/model-settings-controller-v173.js'
      - 'public/app/mobile-ai-hardening-v302.js'
      - 'public/app/local-ai/settings-panel-v267.js'
      - 'public/app/local-ai/runtime-v266.js'
      - 'public/app/local-chat-owner-v295.js'
      - 'public/app/install-boundary-v146.js'
      - 'scripts/verify-settings-freeze-recovery-v296.mjs'
      - 'scripts/verify-mobile-local-settings-v315.mjs'
      - 'scripts/verify-reload-settings-recovery-v294.mjs'
      - 'scripts/verify-chat-launch-readiness-v295.mjs'
      - 'scripts/verify-local-model-settings-mount-v273.mjs'
      - 'scripts/verify-living-school-settings-owner-v310.mjs'
      - 'scripts/verify-realm-local-ai-visible-v308.mjs'
      - 'scripts/verify-realm-local-ai-settings-v307.mjs'
      - 'scripts/verify-ai-settings-entry-runtime-spine-v269.mjs'
      - 'scripts/verify-working-campus-return-v425.mjs'
      - '.github/workflows/verify-settings-freeze-recovery-v296.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Syntax check shared settings paths
        run: |
          node --check public/app/experience-orchestrator-v232.js
          node --check public/app/settings-parity-v295.js
          node --check public/app/document-lifecycle-v221.js
          node --check public/app/model-settings-controller-v173.js
          node --check scripts/verify-settings-freeze-recovery-v296.mjs
          node --check scripts/verify-mobile-local-settings-v315.mjs
          node --check scripts/verify-reload-settings-recovery-v294.mjs
          node --check scripts/verify-living-school-settings-owner-v310.mjs
          node --check scripts/verify-realm-local-ai-visible-v308.mjs
          node --check scripts/verify-realm-local-ai-settings-v307.mjs
          node --check scripts/verify-ai-settings-entry-runtime-spine-v269.mjs
          node --check scripts/verify-working-campus-return-v425.mjs
      - name: Verify settings nonblocking contract
        run: node scripts/verify-settings-freeze-recovery-v296.mjs
      - name: Verify mobile settings single-owner contract
        run: node scripts/verify-mobile-local-settings-v315.mjs
      - name: Verify Living School canonical ownership
        run: node scripts/verify-living-school-settings-owner-v310.mjs
      - name: Verify realm Settings management is on demand
        run: node scripts/verify-realm-local-ai-settings-v307.mjs
      - name: Verify BFCache and visible local AI contract
        run: node scripts/verify-realm-local-ai-visible-v308.mjs
      - name: Verify Settings entry and runtime spine
        run: node scripts/verify-ai-settings-entry-runtime-spine-v269.mjs
      - name: Verify Working Campus BFCache return
        run: node scripts/verify-working-campus-return-v425.mjs
      - name: Verify reload settings recovery
        run: node scripts/verify-reload-settings-recovery-v294.mjs
      - name: Verify chat launch separation
        run: node scripts/verify-chat-launch-readiness-v295.mjs
      - name: Verify local model settings dormancy
        run: node scripts/verify-local-model-settings-mount-v273.mjs
