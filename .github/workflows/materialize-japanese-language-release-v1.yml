name: Materialize Japanese language release v1

on:
  push:
    branches:
      - fix/japanese-install-language-settings-v1
    paths:
      - '.github/workflows/materialize-japanese-language-release-v1.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/japanese-install-language-settings-v1
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Materialize release 1.0.146
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'civweave-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          npm version 1.0.146 --no-git-tag-version
          printf '1.0.146\n' > VERSION
          node scripts/materialize-canonical-release.mjs
          node scripts/verify-japanese-mode-v1.mjs
          node scripts/verify-release-version-sync.mjs
          node scripts/verify-release-contract.mjs
          git rm .github/workflows/materialize-japanese-language-release-v1.yml
          git add -A
          git commit -m 'Materialize Japanese language release 1.0.146'
          git push origin HEAD:fix/japanese-install-language-settings-v1
