name: Verify Guide Forward Failure Policy

on:
  push:
    branches: [staging]
    paths:
      - 'public/app/guide-forward-failure-policy-v1.js'
      - 'public/app/guide-forward-failure-hardening-v1.js'
      - 'public/app/server-ai-router-v301.js'
      - 'public/app/shared-guide-surface-v236.js'
      - 'scripts/verify-guide-forward-failure-policy-v1.mjs'
      - '.github/workflows/verify-guide-forward-failure-policy-v1.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check forward policy syntax
        run: node --check public/app/guide-forward-failure-policy-v1.js
      - name: Check terminal hardening syntax
        run: node --check public/app/guide-forward-failure-hardening-v1.js
      - name: Check Guild server router syntax
        run: node --check public/app/server-ai-router-v301.js
      - name: Check shared guide loader syntax
        run: node --check public/app/shared-guide-surface-v236.js
      - name: Verify forward-only routing behavior
        run: node scripts/verify-guide-forward-failure-policy-v1.mjs
