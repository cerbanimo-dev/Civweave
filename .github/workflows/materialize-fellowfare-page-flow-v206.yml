name: Materialize FellowFare Page Flow Release

on:
  push:
    branches:
      - fix/fellowfare-page-flow-v206
    paths:
      - '.github/workflows/materialize-fellowfare-page-flow-v206.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fellowfare-page-flow-v206
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync package version
        run: npm pkg set version=1.0.129
      - name: Materialize canonical release
        run: node scripts/materialize-canonical-release.mjs
      - name: Update canonical release index
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='config/release-contract.json';
          const value=JSON.parse(fs.readFileSync(file,'utf8'));
          value.canonical.current={version:'1.0.129',path:'releases/1.0.129',status:'current'};
          fs.writeFileSync(file,JSON.stringify(value,null,2)+'\n');
          NODE
      - name: Commit generated release assets
        run: |
          git config user.name "civweave-release-bot"
          git config user.email "civweave-release-bot@users.noreply.github.com"
          git add -A
          git commit -m "Materialize Civweave 1.0.129 canonical release" || exit 0
          git push origin HEAD:fix/fellowfare-page-flow-v206
