name: Materialize Civweave 1.0.143 Intention Landscape

on:
  push:
    branches:
      - feature/cerbanimo-intention-landscape-v1
    paths:
      - '.release-materialize-1.0.143-intention-landscape'
      - '.release-materialize-1.0.143-intention-landscape-retry'
      - '.release-materialize-1.0.143-intention-landscape-final'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/cerbanimo-intention-landscape-v1
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Reconcile current main
        run: |
          git config user.name "civweave-release-bot"
          git config user.email "civweave-release-bot@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:feature/cerbanimo-intention-landscape-v1

      - name: Advance release metadata to 1.0.143
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const version='1.0.143';
          await writeFile('VERSION',`${version}\n`);
          const pkg=JSON.parse(await readFile('package.json','utf8'));
          pkg.version=version;
          await writeFile('package.json',`${JSON.stringify(pkg,null,2)}\n`);
          const lock=JSON.parse(await readFile('package-lock.json','utf8'));
          lock.version=version;
          if(lock.packages?.[''])lock.packages[''].version=version;
          await writeFile('package-lock.json',`${JSON.stringify(lock,null,2)}\n`);
          const contract=JSON.parse(await readFile('config/release-contract.json','utf8'));
          contract.canonical.current={version,path:`releases/${version}`,status:'current'};
          await writeFile('config/release-contract.json',`${JSON.stringify(contract,null,2)}\n`);
          NODE

      - name: Materialize canonical release
        run: node scripts/materialize-canonical-release.mjs

      - name: Apply release coherence
        run: node scripts/sync-release-coherence-v220.mjs

      - name: Verify feature and release discipline
        run: |
          node --check public/app/cerbanimo-intention-landscape-v1.js
          node scripts/verify-cerbanimo-intention-landscape-v1.mjs
          node scripts/verify-release-contract.mjs
          node scripts/verify-version-policy.mjs --self-test
          node scripts/verify-canonical-launch-release.mjs
          node scripts/verify-release-version-sync.mjs

      - name: Commit generated 1.0.143 release
        run: |
          git add -A
          git status --short
          git commit -m "Materialize Civweave 1.0.143 intention landscape release"
          git push origin HEAD:feature/cerbanimo-intention-landscape-v1
