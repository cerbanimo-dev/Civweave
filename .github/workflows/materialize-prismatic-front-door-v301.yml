name: Materialize prismatic front door v301

on:
  push:
    branches:
      - agent/prismatic-installer-steward-branding

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/prismatic-installer-steward-branding
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Advance release identity
        run: |
          printf '1.0.108\n' > VERSION
          npm version 1.0.108 --no-git-tag-version
      - name: Refresh prismatic front-door cache keys
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for(const path of ['public/app/index.html','public/host-setup.html','public/host-local-anchor.html']){
            const before=fs.readFileSync(path,'utf8');
            const after=before.replace(/front-door-prismatic-v301\.css\?v=[^"'`\s)]+/g,'front-door-prismatic-v301.css?v=1.0.108-prismatic-front-door-v301');
            if(after===before)throw new Error(`Missing prismatic front-door cache key in ${path}`);
            fs.writeFileSync(path,after);
          }
          NODE
      - name: Materialize canonical release
        run: |
          node scripts/materialize-canonical-release.mjs
          node scripts/build-service-worker-v211.mjs
          node scripts/generate-prelive-metadata-v281.mjs
      - name: Advance canonical current release
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path='config/release-contract.json';
          const contract=JSON.parse(fs.readFileSync(path,'utf8'));
          contract.canonical.current={version:'1.0.108',path:'releases/1.0.108',status:'current'};
          fs.writeFileSync(path,JSON.stringify(contract,null,2)+'\n');
          NODE
      - name: Verify front door and release contracts
        run: |
          node scripts/verify-installer-front-door-v1.mjs
          node scripts/verify-canonical-launch-release.mjs
          node scripts/verify-release-contract.mjs
          CHANGED_FILES="$(git diff --name-only origin/main...HEAD; git diff --name-only)" node scripts/verify-version-policy.mjs 1.0.107 1.0.108
      - name: Commit generated release and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-prismatic-front-door-v301.yml
          git add -A
          git commit -m "Materialize Civweave 1.0.108 prismatic front door"
          git push origin HEAD:agent/prismatic-installer-steward-branding
