name: Verify Node Onboarding + Trial Commerce v1

on:
  pull_request:
    paths:
      - 'lib/node-ai-onboarding-v1.mjs'
      - 'lib/node-ai-trial-commerce-v1.mjs'
      - 'lib/ai-wallet-http-v1.mjs'
      - 'lib/ai-wallet-service-v1.mjs'
      - 'public/app/node-ai-marketplace-surface-v1.js'
      - 'public/app/node-ai-operator-v1.js'
      - 'scripts/test-node-ai-trial-commerce-v1.mjs'
      - 'scripts/test-node-ai-trial-surface-v1.mjs'
      - '.env.ai-wallet.example'
      - 'docs/NODE-AI-TRIAL-COMMERCE-v1.md'
      - 'package.json'
      - 'VERSION'
      - 'public/app/manifest.webmanifest'
      - '.github/workflows/verify-node-ai-trial-commerce-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trial-commerce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check onboarding and trial commerce
        run: |
          node --check lib/node-ai-onboarding-v1.mjs
          node --check lib/node-ai-trial-commerce-v1.mjs
          node --check lib/ai-wallet-http-v1.mjs
          node --check lib/ai-wallet-service-v1.mjs
          node --check public/app/node-ai-marketplace-surface-v1.js
          node --check public/app/node-ai-operator-v1.js
          node --check scripts/test-node-ai-trial-commerce-v1.mjs
          node --check scripts/test-node-ai-trial-surface-v1.mjs
      - name: Test trial commerce accounting and pairing
        run: node --test scripts/test-node-ai-trial-commerce-v1.mjs
      - name: Test Finder and operator trial surfaces
        run: node --test scripts/test-node-ai-trial-surface-v1.mjs
      - name: Verify sandbox/live-payment boundary
        run: |
          grep -q 'livePayments:false' lib/node-ai-trial-commerce-v1.mjs
          grep -q 'sandboxOnly: true, livePayments: false' lib/ai-wallet-service-v1.mjs
          grep -q 'NODE_AI_TRIAL_COMMERCE_ENABLED=0' .env.ai-wallet.example
          ! grep -RniE 'stripe|checkout\.session|payment_intent|connect account|destination charge' lib/node-ai-trial-commerce-v1.mjs public/app/node-ai-marketplace-surface-v1.js public/app/node-ai-operator-v1.js
      - name: Preserve centralization guard
        run: |
          test ! -e lib/ai-wallet-postgres-v1.mjs
          test ! -e db/migrations/001-ai-wallet-ledger.sql
          ! grep -RniE 'AI_WALLET_DATABASE_URL|@neondatabase/serverless|PostgresAiWallet|providerReserveCents|providerShareBps|AI_PLAN_CATALOG' lib package.json .env.ai-wallet.example --exclude='test-node-ai-marketplace-v1.mjs' --exclude='test-node-ai-http-v1.mjs'
