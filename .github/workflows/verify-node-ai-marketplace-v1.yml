name: Verify Node AI Marketplace v1

on:
  pull_request:
    paths:
      - 'lib/node-ai-*.mjs'
      - 'lib/ai-wallet-*.mjs'
      - 'lib/ai-capability-token-v1.mjs'
      - 'examples/node-ai-*.mjs'
      - 'public/app/node-ai-*.js'
      - 'public/app/node-ai-*.html'
      - 'public/app/federation-finder-*.js'
      - 'public/app/federation-finder-*.html'
      - 'public/app/federation-finder-data/**'
      - 'public/finder/**'
      - 'public/node-ai/**'
      - 'public/app/shared/civweave-node-ai-routing-v1.mjs'
      - 'public/app/install-boundary-v146.js'
      - 'public/app/offline-package-v208.json'
      - 'scripts/stage-federation-finder-data-v274.mjs'
      - 'scripts/test-node-ai-*.mjs'
      - '.env.ai-wallet.example'
      - 'config/node-ai-services.example.json'
      - 'docs/NODE-AI-MARKETPLACE-v1.md'
      - 'package.json'
      - 'server/gateway.mjs'
      - 'releases/**/server/**'
      - '.github/workflows/verify-node-ai-marketplace-v1.yml'
  push:
    branches: [main]
    paths:
      - 'lib/node-ai-*.mjs'
      - 'lib/ai-wallet-*.mjs'
      - 'public/app/node-ai-*'
      - 'public/app/federation-finder-*'
      - 'public/finder/**'
      - 'public/node-ai/**'
      - 'public/app/install-boundary-v146.js'
      - 'public/app/offline-package-v208.json'
      - 'scripts/test-node-ai-*.mjs'
      - 'package.json'
      - 'server/gateway.mjs'
      - 'releases/**/server/**'
      - '.github/workflows/verify-node-ai-marketplace-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check node marketplace syntax
        run: |
          node --check lib/node-ai-marketplace-v1.mjs
          node --check lib/node-ai-ledger-sqlite-v1.mjs
          node --check lib/node-ai-http-v1.mjs
          node --check lib/node-ai-inference-gate-v1.mjs
          node --check lib/node-ai-inference-http-v1.mjs
          node --check lib/node-ai-service-package-v1.mjs
          node --check lib/ai-capability-token-v1.mjs
          node --check lib/ai-wallet-service-v1.mjs
          node --check lib/ai-wallet-http-v1.mjs
          node --check examples/node-ai-fireworks-package-v1.mjs
          node --check public/app/node-ai-mesh-v1.js
          node --check public/app/node-ai-marketplace-surface-v1.js
          node --check public/app/node-ai-operator-v1.js
          node --check public/app/federation-finder-local-v269.js
          node --check public/app/shared/civweave-node-ai-routing-v1.mjs
          node --check scripts/stage-federation-finder-data-v274.mjs
          node scripts/check-canonical-server-syntax.mjs
      - name: Test node marketplace contracts
        run: node --test scripts/test-node-ai-marketplace-v1.mjs scripts/test-node-ai-http-v1.mjs scripts/test-node-ai-routing-v1.mjs scripts/test-node-ai-service-package-v1.mjs scripts/test-node-ai-marketplace-surface-v1.mjs scripts/test-node-ai-fireworks-package-v1.mjs
      - name: Verify canonical bootstrap and offline carriage
        run: |
          grep -q "const NODE_AI_MESH_RUNTIME='/app/node-ai-mesh-v1.js'" public/app/install-boundary-v146.js
          grep -q 'NODE_AI_MESH_RUNTIME' public/app/install-boundary-v146.js
          grep -q "'/app/local-object-mesh-v146.js?v=node-ai-mesh-v1'" public/app/node-ai-mesh-v1.js
          grep -q "const ROUTER_URL='/app/shared/civweave-node-ai-routing-v1.mjs'" public/app/node-ai-mesh-v1.js
          node -e "const p=require('./public/app/offline-package-v208.json'); if(!Array.isArray(p.seeds)||p.seeds.length<11) throw new Error('canonical offline roots unexpectedly shrank'); for(const f of ['/finder','/app/federation-finder-local-v269.html','/app/node-ai-marketplace-surface-v1.js','/app/node-ai-operator-v1.html']) if(!p.assets.includes(f)) throw new Error('missing optional offline marketplace asset '+f)"
      - name: Reject centralized wallet architecture
        run: |
          test ! -e lib/ai-wallet-postgres-v1.mjs
          test ! -e db/migrations/001-ai-wallet-ledger.sql
          test ! -e scripts/test-ai-wallet-postgres-v1.mjs
          ! grep -RniE 'AI_WALLET_DATABASE_URL|@neondatabase/serverless|PostgresAiWallet|providerReserveCents|providerShareBps|AI_PLAN_CATALOG' lib "releases/$(cat VERSION)/server" .env.ai-wallet.example package.json --exclude='test-node-ai-marketplace-v1.mjs' --exclude='test-node-ai-http-v1.mjs'
