name: Dispatch Civweave Code Automation

on:
  repository_dispatch:
    types: [civweave-code-automation]
  workflow_dispatch:
    inputs:
      payload:
        description: Canonical civweave.code-automation-dispatch.v1 JSON
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: code-automation-dispatch-${{ github.event.client_payload.plan.id || github.run_id }}
  cancel-in-progress: false

jobs:
  launch-jules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Launch the automation-only Cerbanimo plan
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          CIVWEAVE_CODE_AUTOMATION_PAYLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.payload || toJson(github.event.client_payload) }}
        run: node scripts/code-automation-jules-dispatch.mjs
