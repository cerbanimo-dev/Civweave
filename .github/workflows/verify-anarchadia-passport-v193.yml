name: Verify expanded Anarchadia Passport

on:
  pull_request:
    paths:
      - 'public/app/anarchadia-console-v139.html'
      - 'public/app/anarchadia-passport-v193.css'
      - 'public/app/anarchadia-passport-v193.js'
      - 'public/service-worker-v156.js'
      - 'scripts/verify-anarchadia-passport-v193.mjs'
      - '.github/workflows/verify-anarchadia-passport-v193.yml'
  push:
    branches: [main]
    paths:
      - 'public/app/anarchadia-console-v139.html'
      - 'public/app/anarchadia-passport-v193.css'
      - 'public/app/anarchadia-passport-v193.js'
      - 'public/service-worker-v156.js'
      - 'scripts/verify-anarchadia-passport-v193.mjs'
      - '.github/workflows/verify-anarchadia-passport-v193.yml'

permissions:
  contents: read

jobs:
  verify-passport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify visible Passport and ledger boundaries
        run: node scripts/verify-anarchadia-passport-v193.mjs
