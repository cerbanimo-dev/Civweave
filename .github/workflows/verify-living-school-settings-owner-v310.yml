name: Verify Living School Settings Owner v310

on:
  pull_request:
    paths:
      - 'public/app/cabinets/living-school/index.html'
      - 'public/app/settings-parity-v295.js'
      - 'public/app/experience-orchestrator-v232.js'
      - 'scripts/verify-living-school-settings-owner-v310.mjs'
      - '.github/workflows/verify-living-school-settings-owner-v310.yml'
  push:
    branches: [main]
    paths:
      - 'public/app/cabinets/living-school/index.html'
      - 'public/app/settings-parity-v295.js'
      - 'public/app/experience-orchestrator-v232.js'
      - 'scripts/verify-living-school-settings-owner-v310.mjs'
      - '.github/workflows/verify-living-school-settings-owner-v310.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify canonical Living School settings ownership
        run: node scripts/verify-living-school-settings-owner-v310.mjs
