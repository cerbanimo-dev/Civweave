name: Diagnose go-live Cloudflare v300

on:
  push:
    branches:
      - go-live/realm-visual-pass-2026-08-12

jobs:
  pages-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reproduce Cloudflare Pages build
        run: node scripts/build-cloudflare-pages.mjs
      - name: Check generated tree
        run: |
          test -d .cloudflare-pages
          test -f .cloudflare-pages/app/go-live-visual-v300.css
          test -f .cloudflare-pages/app/platform-experience-v160.css
          grep -q "go-live-visual-v300.css" .cloudflare-pages/app/platform-experience-v160.css
