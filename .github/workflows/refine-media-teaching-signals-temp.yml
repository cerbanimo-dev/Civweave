name: Refine Media Teaching Signals Temp

on:
  push:
    branches:
      - agent/general-knowledge-video-packs-v1
    paths:
      - .github/workflows/refine-media-teaching-signals-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Refine instructional intent vocabulary
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/curate-open-learning-media-library-v1.py')
          text=path.read_text(encoding='utf-8')
          phrases='prompt engineering|prompt design|pseudocode|algorithm design|critical thinking|systems thinking'
          text=text.replace('high school|grade|for all)\\b",re.I)',f'high school|grade|for all|{phrases})\\b",re.I)',1)
          text=text.replace('high school|grade|for all|documentary',f'high school|grade|for all|{phrases}|documentary',1)
          text=text.replace('high school|grade|for all|documentary',f'high school|grade|for all|{phrases}|documentary',1)
          path.write_text(text,encoding='utf-8')
          assert text.count('prompt engineering') >= 3
          PY
          python -m py_compile scripts/curate-open-learning-media-library-v1.py
      - name: Commit refinement
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/curate-open-learning-media-library-v1.py
          git commit -m 'Recognize instructional computing topic titles'
          git pull --rebase origin agent/general-knowledge-video-packs-v1
          git push origin HEAD:agent/general-knowledge-video-packs-v1
