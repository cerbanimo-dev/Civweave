name: Verify system radio v232

on:
  pull_request:
    paths:
      - 'public/app/experience-orchestrator-v232.js'
      - 'public/app/system-radio-agent-v232.js'
      - 'public/app/install-boundary-v146.js'
      - 'scripts/verify-system-radio-v232.mjs'
      - '.github/workflows/verify-system-radio-v232.yml'
  push:
    branches:
      - main
    paths:
      - 'public/app/experience-orchestrator-v232.js'
      - 'public/app/system-radio-agent-v232.js'
      - 'public/app/install-boundary-v146.js'
      - 'scripts/verify-system-radio-v232.mjs'
      - '.github/workflows/verify-system-radio-v232.yml'

permissions:
  contents: read

jobs:
  verify-system-radio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Civweave
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check subsystem
        run: |
          node --check public/app/experience-orchestrator-v232.js
          node --check public/app/system-radio-agent-v232.js
          node --check public/app/install-boundary-v146.js
          node --check scripts/verify-system-radio-v232.mjs

      - name: Verify deterministic identity and agent boundaries
        run: node scripts/verify-system-radio-v232.mjs
