name: Verify Release Discipline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-discipline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/verify-release-contract.mjs
      - run: node scripts/verify-stale-release-identities.mjs
      - run: node scripts/verify-root-hygiene.mjs
      - run: node scripts/verify-version-policy.mjs --self-test
