name: Verify Generation Lifecycle v1

on:
  push:
    branches: [staging]
    paths:
      - 'public/app/generation-lifecycle-v1.js'
      - 'public/app/guide-generation-tracker-v1.js'
      - 'public/app/persistent-system-shell-v1.html'
      - 'public/service-worker-weave-pipeline-takeover-v1.js'
      - 'public/service-worker-v203.js'
      - 'public/service-worker.js'
      - 'scripts/verify-generation-lifecycle-v1.mjs'
      - '.github/workflows/verify-generation-lifecycle-v1.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check lifecycle bridge
        run: node --check public/app/generation-lifecycle-v1.js
      - name: Syntax check generation tracker
        run: node --check public/app/guide-generation-tracker-v1.js
      - name: Syntax check takeover worker
        run: node --check public/service-worker-weave-pipeline-takeover-v1.js
      - name: Verify artifact naming, cross-frame progress, and Stop recovery
        run: node scripts/verify-generation-lifecycle-v1.mjs
