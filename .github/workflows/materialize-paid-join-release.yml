name: Materialize paid join release

on:
  push:
    branches:
      - agent/paid-only-hub-join

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/paid-only-hub-join
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Align package metadata
        run: npm version "$(cat VERSION)" --no-git-tag-version --allow-same-version
      - name: Materialize canonical release
        run: node scripts/materialize-canonical-release.mjs
      - name: Commit generated release files
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Release files are already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize release 1.0.133"
          git push origin HEAD:agent/paid-only-hub-join
