name: Sync Main Release Temp

on:
  push:
    branches:
      - agent/general-knowledge-video-packs-v1
    paths:
      - .github/workflows/sync-main-release-temp.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Merge current main preserving canonical release files
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            expected=$'VERSION\nconfig/release-contract.json\npackage.json'
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --theirs VERSION config/release-contract.json package.json
            git add VERSION config/release-contract.json package.json
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m 'Sync current main before media release'
          git push origin HEAD:agent/general-knowledge-video-packs-v1
