name: Verify realm cabinets v140

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realm-cabinets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install local semantic runtime
        run: |
          npm install --no-audit --no-fund
          for attempt in 1 2 3 4 5; do
            if npm run model:pull; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo 'MiniLM package could not be materialized after five attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 8))
          done
          npm run model:check
      - name: Verify all release contracts
        run: npm run check
      - name: Start host
        run: |
          PORT=8787 npm start > realm-cabinets-server.log 2>&1 &
          echo $! > realm-cabinets-server.pid
      - name: Inspect cabinet assets and screen runtimes
        run: |
          set -euxo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health > health.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/app/v130-cabinet-launcher.js -o cabinet-launcher.js
          grep -q 'cw-cabinet-frame-art' cabinet-launcher.js
          grep -q 'realmSrcdoc' cabinet-launcher.js
          grep -q '/app/anarchadia-console-v139.html?embed=1' cabinet-launcher.js
          curl -fsS http://127.0.0.1:8787/app/v130-cabinet-launcher.css -o cabinet-launcher.css
          grep -q '.cw-cabinet-frame iframe' cabinet-launcher.css
          grep -q -- '--cw-screen-clip' cabinet-launcher.css
          curl -fsS http://127.0.0.1:8787/app/realm-console-v140.css -o realm-console.css
          grep -q 'html\[data-system="commonweave"\]' realm-console.css
          grep -q 'html\[data-system="living-school"\]' realm-console.css
          grep -q 'html\[data-system="cerbanimo"\]' realm-console.css
          grep -q 'html\[data-system="fellowfare"\]' realm-console.css
          curl -fsS http://127.0.0.1:8787/app/realm-console-v140.js -o realm-console.js
          grep -q 'commonweave.realm-console.v140' realm-console.js
          grep -q 'living-school.send-quest' realm-console.js
          grep -q 'cerbanimo.publish-need' realm-console.js
          if grep -q 'sourceRoute' realm-console.js; then
            echo 'Realm console still links to legacy source pages' >&2
            exit 1
          fi
          curl -fsS http://127.0.0.1:8787/app/shared/cabinet-shells-v129.json -o cabinet-shells.json
          for realm in commonweave living-school cerbanimo fellowfare anarchadia; do
            grep -q "/app/assets/cabinets/$realm.webp" cabinet-shells.json
          done
          curl -fsS http://127.0.0.1:8787/service-worker.js -o service-worker.js
          grep -q "CACHE_REVISION='minilm-runtime-r19'" service-worker.js
          grep -q "CABINET_REVISION='realm-cabinets-r18'" service-worker.js
          grep -q '/app/realm-console-v140.js' service-worker.js
      - name: Upload cabinet evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realm-cabinets-v140-evidence
          path: |
            realm-cabinets-server.log
            health.json
            cabinet-launcher.js
            cabinet-launcher.css
            realm-console.css
            realm-console.js
            cabinet-shells.json
            service-worker.js
