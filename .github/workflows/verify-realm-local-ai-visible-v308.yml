name: Verify Realm Local AI Visible v308

on:
  pull_request:
    paths:
      - 'public/app/document-lifecycle-v221.js'
      - 'scripts/verify-realm-local-ai-visible-v308.mjs'
      - '.github/workflows/verify-realm-local-ai-visible-v308.yml'
  push:
    branches: [main]
    paths:
      - 'public/app/document-lifecycle-v221.js'
      - 'scripts/verify-realm-local-ai-visible-v308.mjs'
      - '.github/workflows/verify-realm-local-ai-visible-v308.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check public/app/document-lifecycle-v221.js
          node --check scripts/verify-realm-local-ai-visible-v308.mjs
      - name: BFCache and visible local AI contract
        run: node scripts/verify-realm-local-ai-visible-v308.mjs
