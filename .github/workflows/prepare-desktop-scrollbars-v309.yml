name: Prepare Desktop + Scrollbars v309

on:
  push:
    branches:
      - fix/desktop-fill-scrollbars-v309
    paths:
      - .github/workflows/prepare-desktop-scrollbars-v309.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/desktop-fill-scrollbars-v309
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Advance Civweave to 1.0.121
        run: |
          npm version 1.0.121 --no-git-tag-version
          printf '1.0.121\n' > VERSION
      - name: Materialize canonical 1.0.121 release
        run: node scripts/materialize-canonical-release.mjs
      - name: Refresh canonical release index
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const path='config/release-contract.json';
          const contract=JSON.parse(await readFile(path,'utf8'));
          contract.canonical.current={version:'1.0.121',path:'releases/1.0.121',status:'current'};
          await writeFile(path,JSON.stringify(contract,null,2)+'\n');
          NODE
      - name: Verify desktop and scrollbar assets
        run: |
          test -f public/app/custom-scrollbars-v309.css
          test -f public/app/working-campus-desktop-v309.css
          grep -q "custom-scrollbars-v309.css" public/app/platform-experience-v160.css
          grep -q "working-campus-desktop-v309.css" public/app/platform-experience-v160.css
          grep -q "grid-template-columns:minmax(320px,38%)" public/app/working-campus-desktop-v309.css
          grep -q "data-civweave-system=\"living-school\"" public/app/custom-scrollbars-v309.css
          node scripts/verify-canonical-launch-release.mjs
          node scripts/verify-release-contract.mjs
          node scripts/verify-release-version-sync.mjs
      - name: Remove one-time preparation workflow
        run: rm .github/workflows/prepare-desktop-scrollbars-v309.yml
      - name: Commit synchronized release
        run: |
          git config user.name "cerbanimo-dev"
          git config user.email "cerbanimo@gmail.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Prepare Civweave 1.0.121 desktop and scrollbar release"
          git push origin HEAD:fix/desktop-fill-scrollbars-v309
