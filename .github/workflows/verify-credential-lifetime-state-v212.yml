name: Verify Credential Lifetime State v212

on:
  pull_request:
    branches: [main]
    paths:
      - public/app/model-settings-controller-v173.js
      - scripts/verify-credential-lifetime-state-v212.mjs
      - .github/workflows/verify-credential-lifetime-state-v212.yml
  push:
    branches: [main]
    paths:
      - public/app/model-settings-controller-v173.js
      - scripts/verify-credential-lifetime-state-v212.mjs
      - .github/workflows/verify-credential-lifetime-state-v212.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check lifetime state repair
        run: |
          node --check public/app/model-settings-controller-v173.js
          node --check scripts/verify-credential-lifetime-state-v212.mjs
      - name: Verify remembered lifetime survives retired profiles
        run: node scripts/verify-credential-lifetime-state-v212.mjs
