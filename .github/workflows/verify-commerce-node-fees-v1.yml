name: Verify Commerce Node Fees v1

on:
  pull_request:
    paths:
      - 'cloudflare/core/src/commerce-node-fees.mjs'
      - 'scripts/verify-commerce-node-fees-v1.mjs'
      - 'docs/finance/cerbanimo-commerce-distribution-v1.md'
      - '.github/workflows/verify-commerce-node-fees-v1.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare/core/src/commerce-node-fees.mjs'
      - 'scripts/verify-commerce-node-fees-v1.mjs'
      - 'docs/finance/cerbanimo-commerce-distribution-v1.md'
      - '.github/workflows/verify-commerce-node-fees-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --check cloudflare/core/src/commerce-node-fees.mjs
      - run: node scripts/verify-commerce-node-fees-v1.mjs
