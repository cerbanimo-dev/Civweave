name: Verify research source provenance gate

on:
  pull_request:
    branches: [staging]
    paths:
      - 'public/app/research-source-*.mjs'
      - 'public/app/living-school-local-research-v243.mjs'
      - 'scripts/scan-research-provenance-v1.mjs'
      - 'scripts/test-research-source-provenance-v1.mjs'
      - 'scripts/verify-living-school-selected-ai-research-fallback-v1.mjs'
      - '.github/workflows/verify-research-source-provenance-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check public/app/research-source-indicators-v1.mjs
          node --check public/app/research-source-policy-v1.mjs
          node --check public/app/living-school-local-research-v243.mjs
          node --check scripts/scan-research-provenance-v1.mjs
      - name: Provenance matching regression
        run: node --test scripts/test-research-source-provenance-v1.mjs
      - name: Selected-model research fallback regression
        run: node scripts/verify-living-school-selected-ai-research-fallback-v1.mjs
