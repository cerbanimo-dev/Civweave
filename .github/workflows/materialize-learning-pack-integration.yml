name: Materialize learning pack integration

on:
  push:
    branches:
      - agent/learning-pack-foundation-sync

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'cerbanimo-dev/Civweave'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Align release metadata
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version=fs.readFileSync('VERSION','utf8').trim();
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.version=version;
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          NODE
      - name: Materialize canonical release
        run: node scripts/materialize-canonical-release.mjs
      - name: Point canonical index at materialized release
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version=fs.readFileSync('VERSION','utf8').trim();
          const file='config/release-contract.json';
          const contract=JSON.parse(fs.readFileSync(file,'utf8'));
          contract.canonical.current={version,path:`releases/${version}`,status:'current'};
          fs.writeFileSync(file,JSON.stringify(contract,null,2)+'\n');
          NODE
      - name: Build Labor Atlas verification artifact
        run: node scripts/build-learning-packs-v1.mjs
      - name: Verify release contract
        run: node scripts/verify-release-contract.mjs
      - name: Verify canonical release
        run: node scripts/verify-canonical-launch-release.mjs
      - name: Capture learning pack verification
        shell: bash
        run: |
          set +e
          node scripts/verify-learning-packs-v1.mjs > learning-pack-integration-verifier.log 2>&1
          code=$?
          echo "exit_code=${code}" >> learning-pack-integration-verifier.log
          cat learning-pack-integration-verifier.log
          exit 0
      - name: Commit generated release assets and diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'civweave-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json config/release-contract.json public releases scripts/smoke-gateway-v131-base.mjs scripts/verify-device-package-self-heal-v184.mjs learning-pack-integration-verifier.log
          if git diff --cached --quiet; then
            echo 'Canonical release already materialized.'
            exit 0
          fi
          git commit -m 'Materialize Civweave 1.0.86 learning pack release'
          git push origin HEAD:${GITHUB_REF_NAME}
