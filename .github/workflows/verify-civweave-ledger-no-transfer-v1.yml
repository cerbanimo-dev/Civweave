name: Verify Civweave reward no-transfer v1

on:
  push:
    branches: [staging, main]
    paths:
      - 'public/app/civweave-ledger-contract-v1.js'
      - 'scripts/verify-civweave-ledger-no-transfer-v1.mjs'
      - '.github/workflows/verify-civweave-ledger-no-transfer-v1.yml'
  pull_request:
    paths:
      - 'public/app/civweave-ledger-contract-v1.js'
      - 'scripts/verify-civweave-ledger-no-transfer-v1.mjs'
      - '.github/workflows/verify-civweave-ledger-no-transfer-v1.yml'
permissions:
  contents: read
jobs:
  verify-no-transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-civweave-ledger-no-transfer-v1.mjs
