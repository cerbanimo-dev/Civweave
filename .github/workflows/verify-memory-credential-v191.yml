name: Verify Weaveling Memory and Credential v191

on:
  pull_request:
    paths:
      - 'public/app/weaveling-memory-v191.js'
      - 'public/app/weaveling-memory-bridge-v191.js'
      - 'public/app/model-settings-controller-v173.js'
      - 'public/extensions/commonweave-device-credentials-v160.js'
      - 'public/app/family-ai-loader-v105.js'
      - 'public/app/working-campus-v156.part5.txt'
      - 'public/app/install-boundary-v146.js'
      - 'public/service-worker.js'
      - 'public/service-worker-v156.js'
      - 'scripts/verify-memory-credential-v191.mjs'
      - '.github/workflows/verify-memory-credential-v191.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check memory and settings files
        run: |
          node --check public/app/weaveling-memory-v191.js
          node --check public/app/weaveling-memory-bridge-v191.js
          node --check public/app/model-settings-controller-v173.js
          node --check public/extensions/commonweave-device-credentials-v160.js
          node --check public/app/family-ai-loader-v105.js
          node --check scripts/verify-memory-credential-v191.mjs
      - name: Verify working memory, durable memory, and explicit credential persistence
        run: node scripts/verify-memory-credential-v191.mjs
