name: Stripe Connect Sandbox Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stripe-connect-sandbox-smoke.yml'

permissions:
  contents: read

concurrency:
  group: civweave-stripe-connect-sandbox-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONNECTED_ACCOUNT_ID: acct_1U3JJYJ2BJRgxv9P
      TEST_AMOUNT_CENTS: '100'
      APPLICATION_FEE_CENTS: '15'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install production Stripe SDK
        run: npm install --prefix cloudflare/core --omit=dev --no-audit --no-fund

      - name: Create connected-account product and direct-charge Checkout
        id: checkout
        working-directory: cloudflare/core
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import Stripe from 'stripe';

          const key = String(process.env.STRIPE_SECRET_KEY || '').trim();
          if (!key) throw new Error('STRIPE_SECRET_KEY is missing. Add the sandbox server key to GitHub Actions secrets.');
          if (!key.startsWith('sk_test_') && !key.startsWith('rk_test_')) {
            throw new Error('Sandbox smoke test refuses to run unless STRIPE_SECRET_KEY is a Stripe test/restricted-test key.');
          }

          const accountId = String(process.env.CONNECTED_ACCOUNT_ID || '').trim();
          const amount = Number(process.env.TEST_AMOUNT_CENTS || 100);
          const applicationFee = Number(process.env.APPLICATION_FEE_CENTS || 15);
          if (!accountId.startsWith('acct_')) throw new Error('CONNECTED_ACCOUNT_ID must be a Stripe account ID.');
          if (!Number.isSafeInteger(amount) || amount <= 0) throw new Error('TEST_AMOUNT_CENTS must be a positive integer.');
          if (!Number.isSafeInteger(applicationFee) || applicationFee < 0 || applicationFee > amount) throw new Error('APPLICATION_FEE_CENTS is invalid.');

          const stripeClient = new Stripe(key, { httpClient: Stripe.createFetchHttpClient() });
          const account = await stripeClient.accounts.retrieve(accountId);
          if (!account.charges_enabled) throw new Error(`Connected account ${accountId} is not enabled for charges.`);

          const runTag = `gh-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
          const product = await stripeClient.products.create({
            name: 'Civweave sandbox smoke product',
            description: 'One-dollar Stripe Connect direct-charge verification. Sandbox only.',
            default_price_data: { unit_amount: amount, currency: 'usd' },
            metadata: {
              civweave_schema: 'civweave.stripe-connect-smoke.v1',
              civweave_run: runTag,
            },
          }, { stripeAccount: accountId });

          const priceId = typeof product.default_price === 'string' ? product.default_price : product.default_price?.id;
          if (!priceId) throw new Error('Stripe did not return a default Price for the smoke product.');

          const session = await stripeClient.checkout.sessions.create({
            mode: 'payment',
            line_items: [{ price: priceId, quantity: 1 }],
            payment_intent_data: {
              application_fee_amount: applicationFee,
              metadata: {
                civweave_schema: 'civweave.stripe-connect-smoke.v1',
                civweave_run: runTag,
              },
            },
            metadata: {
              civweave_schema: 'civweave.stripe-connect-smoke.v1',
              civweave_run: runTag,
            },
            success_url: 'https://commonweave.pages.dev/?stripe_smoke=success&session_id={CHECKOUT_SESSION_ID}',
            cancel_url: 'https://commonweave.pages.dev/?stripe_smoke=cancelled',
          }, { stripeAccount: accountId });

          if (!session.url) throw new Error('Stripe did not return a hosted Checkout URL.');

          console.log('=== CIVWEAVE STRIPE SANDBOX CHECKOUT READY ===');
          console.log(`CONNECTED_ACCOUNT=${accountId}`);
          console.log(`PRODUCT_ID=${product.id}`);
          console.log(`PRICE_ID=${priceId}`);
          console.log(`SESSION_ID=${session.id}`);
          console.log(`AMOUNT_CENTS=${amount}`);
          console.log(`APPLICATION_FEE_CENTS=${applicationFee}`);
          console.log(`SANDBOX_CHECKOUT_URL=${session.url}`);
          console.log('Use a Stripe test card only. No live funds are enabled by this workflow.');

          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            `account_id=${accountId}`,
            `product_id=${product.id}`,
            `price_id=${priceId}`,
            `session_id=${session.id}`,
            `checkout_url=${session.url}`,
          ].join('\n') + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Stripe Connect sandbox smoke\n\n[Open sandbox Checkout](${session.url})\n\n- Connected account: \`${accountId}\`\n- Amount: $${(amount / 100).toFixed(2)}\n- Civweave application fee: $${(applicationFee / 100).toFixed(2)}\n- Session: \`${session.id}\`\n`);
          NODE

      - name: Wait for warm-body sandbox Checkout
        id: payment
        working-directory: cloudflare/core
        env:
          SESSION_ID: ${{ steps.checkout.outputs.session_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import Stripe from 'stripe';

          const key = String(process.env.STRIPE_SECRET_KEY || '').trim();
          if (!key.startsWith('sk_test_') && !key.startsWith('rk_test_')) throw new Error('Refusing non-sandbox Stripe credential.');
          const stripeClient = new Stripe(key, { httpClient: Stripe.createFetchHttpClient() });
          const accountId = process.env.CONNECTED_ACCOUNT_ID;
          const sessionId = process.env.SESSION_ID;
          const expectedFee = Number(process.env.APPLICATION_FEE_CENTS || 15);

          console.log('WAITING_FOR_WARM_BODY: hosted Checkout is ready. Polling for up to 15 minutes.');
          let session;
          for (let attempt = 0; attempt < 180; attempt += 1) {
            session = await stripeClient.checkout.sessions.retrieve(sessionId, { expand: ['payment_intent.latest_charge'] }, { stripeAccount: accountId });
            if (session.payment_status === 'paid') break;
            if (attempt % 6 === 0) console.log(`Checkout still ${session.payment_status || 'unpaid'} (${attempt * 5}s elapsed)`);
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!session || session.payment_status !== 'paid') throw new Error('Sandbox Checkout was not completed within 15 minutes. Re-run the workflow when ready.');

          const paymentIntent = session.payment_intent;
          const paymentIntentId = typeof paymentIntent === 'string' ? paymentIntent : paymentIntent?.id;
          const charge = typeof paymentIntent === 'object' ? paymentIntent?.latest_charge : null;
          const chargeId = typeof charge === 'string' ? charge : charge?.id;
          if (!paymentIntentId) throw new Error('Paid Checkout did not expose its PaymentIntent.');

          const pi = typeof paymentIntent === 'object' ? paymentIntent : await stripeClient.paymentIntents.retrieve(paymentIntentId, {}, { stripeAccount: accountId });
          if (Number(pi.application_fee_amount || 0) !== expectedFee) {
            throw new Error(`Application fee mismatch. Expected ${expectedFee}, Stripe reports ${pi.application_fee_amount}.`);
          }

          let applicationFee = null;
          if (chargeId) {
            const fees = await stripeClient.applicationFees.list({ charge: chargeId, limit: 10 });
            applicationFee = fees.data[0] || null;
          }
          if (!applicationFee) throw new Error('Stripe did not expose the expected platform Application Fee for the connected-account charge.');
          if (Number(applicationFee.amount) !== expectedFee) throw new Error(`Platform Application Fee mismatch. Expected ${expectedFee}, got ${applicationFee.amount}.`);

          console.log('=== SANDBOX DIRECT CHARGE PAID ===');
          console.log(`SESSION_ID=${session.id}`);
          console.log(`PAYMENT_INTENT_ID=${paymentIntentId}`);
          console.log(`CHARGE_ID=${chargeId || 'unexpanded'}`);
          console.log(`APPLICATION_FEE_ID=${applicationFee.id}`);
          console.log(`APPLICATION_FEE_AMOUNT=${applicationFee.amount}`);

          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            `payment_intent_id=${paymentIntentId}`,
            `charge_id=${chargeId || ''}`,
            `application_fee_id=${applicationFee.id}`,
          ].join('\n') + '\n');
          NODE

      - name: Verify snapshot webhook reached Civweave D1
        env:
          SESSION_ID: ${{ steps.checkout.outputs.session_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 2; }
          FOUND=0
          for attempt in $(seq 1 12); do
            npx --yes wrangler@latest d1 execute civweave-core --remote --json --command "SELECT event_id,event_type,livemode,processing_error,received_at FROM stripe_events WHERE payload_json LIKE '%${SESSION_ID}%' ORDER BY received_at DESC LIMIT 10" > /tmp/stripe-smoke-d1.json
            cat /tmp/stripe-smoke-d1.json
            if node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/stripe-smoke-d1.json', 'utf8'));
          const rows = Array.isArray(payload) ? payload.flatMap(x => x?.results || x?.result?.results || []) : (payload?.results || payload?.result?.results || []);
          process.exit(rows.some(row => row.event_type === 'checkout.session.completed') ? 0 : 1);
          NODE
            then
              FOUND=1
              break
            fi
            echo "Waiting for checkout.session.completed webhook to reach D1 (${attempt}/12)..."
            sleep 10
          done
          test "$FOUND" = 1 || { echo 'Paid Checkout succeeded, but no checkout.session.completed snapshot webhook was found in D1 within two minutes.'; exit 3; }
          echo 'CIVWEAVE_STRIPE_SANDBOX_SMOKE=PASS'
