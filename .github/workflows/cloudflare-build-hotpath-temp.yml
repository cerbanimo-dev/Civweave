name: Cloudflare Build Hotpath Temp

on:
  push:
    branches:
      - fix/cloudflare-build-hotpath-v1
    paths:
      - .github/workflows/cloudflare-build-hotpath-temp.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify deploy discipline
        run: node scripts/verify-cloudflare-deploy-discipline.mjs
      - name: Build Pages output and report wall time
        run: |
          set -euo pipefail
          start=$(date +%s)
          node scripts/build-cloudflare-pages.mjs
          end=$(date +%s)
          echo "CLOUDFLARE_BUILD_SECONDS=$((end-start))"
      - name: Verify generated production assets
        run: |
          set -euo pipefail
          test -f .cloudflare-pages/app/vendor/transformers/transformers.min.js
          test -f .cloudflare-pages/app/vendor/transformers-v4/transformers.min.js
          test -f .cloudflare-pages/app/vendor/maplibre-v5.13.0/maplibre-gl.js
          test -f .cloudflare-pages/app/federation-finder-data/atlas-v274/manifest.json
          test -f .cloudflare-pages/app/shared/civweave-parity-ledger.json
          test -f .cloudflare-pages/downloads/Civweave-Map-v1.zip
          test -f .cloudflare-pages/downloads/Civweave-Mobile-Install-Kit.zip
          node scripts/verify-cloudflare-production-origin-v251.mjs
