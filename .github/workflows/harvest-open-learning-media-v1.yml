name: Harvest Open Learning Media v1

on:
  push:
    branches:
      - main
      - staging
      - 'agent/open-learning-media-*'
      - 'agent/general-knowledge-video-packs-*'
    paths:
      - config/open-learning-media-packs-v1.json
      - config/open-learning-media-pack-expansion-v2.json
      - scripts/apply-open-learning-media-pack-expansion-v2.py
      - scripts/harvest-open-learning-media-v1.py
      - scripts/harvest-open-learning-media-library-v1.py
      - scripts/curate-open-learning-media-library-v1.py
      - scripts/filter-open-learning-media-title-quality-v1.py
      - scripts/report-open-learning-media-pack-coverage-v1.py
      - scripts/test-open-learning-media-harvest-v1.py
      - scripts/test-open-learning-media-packs-v1.py
      - ops/triggers/open-learning-media-harvest.trigger
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: open-learning-media-harvest-v1-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Expand subject media pack registry
        run: |
          set -euo pipefail
          python scripts/apply-open-learning-media-pack-expansion-v2.py

      - name: Harvest rights-cleared general and extension media metadata
        env:
          OPEN_MEDIA_RESULTS_PER_QUERY: '6'
          OPEN_MEDIA_WORKERS: '8'
        run: |
          set -uo pipefail
          python scripts/harvest-open-learning-media-library-v1.py
          harvest_status=$?
          if [ "$harvest_status" -ne 0 ]; then
            exit "$harvest_status"
          fi
          python scripts/curate-open-learning-media-library-v1.py
          curate_status=$?
          if [ -f public/downloads/knowledge-schools/open-learning-media/summary.json ]; then
            python scripts/report-open-learning-media-pack-coverage-v1.py || true
          fi
          if [ "$curate_status" -ne 0 ]; then
            exit "$curate_status"
          fi
          python scripts/filter-open-learning-media-title-quality-v1.py

      - name: Validate generated catalog and pack coverage before publication
        run: |
          python scripts/test-open-learning-media-harvest-v1.py
          python scripts/test-open-learning-media-packs-v1.py

      - name: Commit validated catalog refresh
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/downloads/knowledge-schools/open-learning-media
          if git diff --cached --quiet; then
            echo 'Harvest produced no catalog diff.'
            exit 0
          fi
          TARGET_REF="${GITHUB_REF_NAME:-main}"
          if [ "$TARGET_REF" = "main" ]; then
            COMMIT_MESSAGE='Refresh open learning media catalog'
          else
            COMMIT_MESSAGE='[CF-Pages-Skip] Refresh open learning media catalog'
          fi
          git commit -m "$COMMIT_MESSAGE"
          git pull --rebase origin "$TARGET_REF"
          git push origin "HEAD:$TARGET_REF"
