name: Verify Gemma 4 Current Registry Runtime

on:
  pull_request:
    paths:
      - 'public/app/local-ai/gemma4-current-registry-authority-v1.js'
      - 'public/app/working-campus-v440.html'
      - 'public/app/persistent-system-shell-v1.html'
      - 'scripts/verify-gemma4-current-registry-runtime-v1.mjs'
      - '.github/workflows/verify-gemma4-current-registry-runtime-v1.yml'
  push:
    branches: [staging]
    paths:
      - 'public/app/local-ai/gemma4-current-registry-authority-v1.js'
      - 'public/app/working-campus-v440.html'
      - 'public/app/persistent-system-shell-v1.html'
      - 'scripts/verify-gemma4-current-registry-runtime-v1.mjs'
      - '.github/workflows/verify-gemma4-current-registry-runtime-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check registry authority
        run: node --check public/app/local-ai/gemma4-current-registry-authority-v1.js
      - name: Verify cached legacy registry recovery
        run: node scripts/verify-gemma4-current-registry-runtime-v1.mjs
