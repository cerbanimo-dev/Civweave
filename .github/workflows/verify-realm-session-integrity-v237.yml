name: Verify Realm Session Integrity v237

on:
  pull_request:
    paths:
      - 'public/app/realm-session-integrity-v237.js'
      - 'public/app/install-boundary-v146.js'
      - 'scripts/verify-realm-session-integrity-v237.mjs'
      - 'package.json'
      - 'VERSION'
      - '.github/workflows/verify-realm-session-integrity-v237.yml'
  push:
    branches: [main]
    paths:
      - 'public/app/realm-session-integrity-v237.js'
      - 'public/app/install-boundary-v146.js'
      - 'scripts/verify-realm-session-integrity-v237.mjs'
      - 'package.json'
      - 'VERSION'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check v237 syntax
        run: |
          node --check public/app/realm-session-integrity-v237.js
          node --check public/app/install-boundary-v146.js
          node --check scripts/verify-realm-session-integrity-v237.mjs
      - name: Verify realm session integrity
        run: node scripts/verify-realm-session-integrity-v237.mjs
