name: Verify guide identity integrity v216

on:
  pull_request:
    paths:
      - 'public/app/guide-identity-integrity-v216.js'
      - 'public/app/install-boundary-v146.js'
      - 'public/app/guide-chat-surface-v350.js'
      - 'public/app/guide-workspace-v242.js'
      - 'public/app/assistant-runtime-v141.js'
      - 'scripts/verify-guide-identity-integrity-v216.mjs'
      - '.github/workflows/verify-guide-identity-integrity-v216.yml'
  push:
    branches:
      - main
    paths:
      - 'public/app/guide-identity-integrity-v216.js'
      - 'public/app/install-boundary-v146.js'
      - 'public/app/guide-chat-surface-v350.js'
      - 'public/app/guide-workspace-v242.js'
      - 'public/app/assistant-runtime-v141.js'
      - 'scripts/verify-guide-identity-integrity-v216.mjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-guide-identity-integrity-v216.mjs