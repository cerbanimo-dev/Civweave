name: Deploy Cerbanimo mail portal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/cerbanimo-mail/**'
      - 'scripts/verify-cerbanimo-mail-portal-v1.mjs'
      - '.github/workflows/deploy-cerbanimo-mail.yml'

permissions:
  contents: read

concurrency:
  group: cerbanimo-mail-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CERBANIMO_GMAIL_CLIENT_ID: ${{ secrets.CERBANIMO_GMAIL_CLIENT_ID }}
      CERBANIMO_GMAIL_CLIENT_SECRET: ${{ secrets.CERBANIMO_GMAIL_CLIENT_SECRET }}
      CERBANIMO_GMAIL_REFRESH_TOKEN: ${{ secrets.CERBANIMO_GMAIL_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify portal contract
        run: node scripts/verify-cerbanimo-mail-portal-v1.mjs
      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing repository secret CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing repository secret CLOUDFLARE_ACCOUNT_ID'; exit 2; }
          npx --yes wrangler@latest whoami
      - name: Deploy secure mail doorway
        run: npx --yes wrangler@latest deploy --config cloudflare/cerbanimo-mail/wrangler.jsonc
      - name: Configure optional Gmail system sender
        shell: bash
        run: |
          set -euo pipefail
          configured=0
          if [ -n "${CERBANIMO_GMAIL_CLIENT_ID:-}" ] && [ -n "${CERBANIMO_GMAIL_CLIENT_SECRET:-}" ] && [ -n "${CERBANIMO_GMAIL_REFRESH_TOKEN:-}" ]; then
            printf '%s' "$CERBANIMO_GMAIL_CLIENT_ID" | npx --yes wrangler@latest secret put CERBANIMO_GMAIL_CLIENT_ID --config cloudflare/cerbanimo-mail/wrangler.jsonc
            printf '%s' "$CERBANIMO_GMAIL_CLIENT_SECRET" | npx --yes wrangler@latest secret put CERBANIMO_GMAIL_CLIENT_SECRET --config cloudflare/cerbanimo-mail/wrangler.jsonc
            printf '%s' "$CERBANIMO_GMAIL_REFRESH_TOKEN" | npx --yes wrangler@latest secret put CERBANIMO_GMAIL_REFRESH_TOKEN --config cloudflare/cerbanimo-mail/wrangler.jsonc
            configured=1
            echo 'Cerbanimo Gmail system sender credentials synchronized.'
          else
            echo 'Gmail system-sender repository secrets are incomplete; mail portal remains available but recovery-email sending stays disabled.'
          fi
          echo "SYSTEM_MAILER_CONFIGURED=$configured" >> "$GITHUB_ENV"
      - name: Verify mail.cerbanimo.cc
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-redirs 0 https://mail.cerbanimo.cc/api/health > /tmp/mail-health.json 2>/tmp/mail-error; then
              node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/mail-health.json', 'utf8'));
          if (payload?.ok !== true || payload?.schema !== 'cerbanimo.mail-portal.v1' || payload?.provider !== 'gmail') {
            throw new Error(`Unexpected Cerbanimo Mail health payload: ${JSON.stringify(payload)}`);
          }
          const expected = process.env.SYSTEM_MAILER_CONFIGURED === '1';
          if (expected && payload.systemMailerConfigured !== true) throw new Error('Gmail system sender secrets were supplied but the mail Worker does not report them active.');
          console.log(JSON.stringify(payload));
          NODE
              exit 0
            fi
            cat /tmp/mail-error || true
            sleep 3
          done
          echo 'mail.cerbanimo.cc did not become healthy in time.'
          exit 3
