name: Verify AI Quest source authority

on:
  push:
    paths:
      - public/app/intention-planner-v141.js
      - public/app/working-campus-v156.html
      - public/app/server-ai-output-normalizer-v1.js
      - public/service-worker-local-ai-coherence-v307.js
      - public/service-worker-v203.js
      - public/service-worker.js
      - scripts/verify-ai-quest-source-authority-v2.mjs
      - .github/workflows/verify-ai-quest-source-authority-v2.yml
  pull_request:
    paths:
      - public/app/intention-planner-v141.js
      - public/app/working-campus-v156.html
      - public/app/server-ai-output-normalizer-v1.js
      - public/service-worker-local-ai-coherence-v307.js
      - public/service-worker-v203.js
      - public/service-worker.js
      - scripts/verify-ai-quest-source-authority-v2.mjs
      - .github/workflows/verify-ai-quest-source-authority-v2.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-ai-quest-source-authority-v2.mjs
