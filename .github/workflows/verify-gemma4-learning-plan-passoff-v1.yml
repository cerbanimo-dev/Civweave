name: Verify Gemma 4 Learning Plan Passoff

on:
  pull_request:
    paths:
      - 'public/app/local-ai/gemma4-weave-draft-pipeline-v1.js'
      - 'public/app/local-ai/gemma4-learning-plan-entry-authority-v1.js'
      - 'public/app/local-ai/gemma4-first-request-intake-bridge-v1.js'
      - 'public/app/local-ai/gemma4-structured-task-authority-v1.js'
      - 'public/app/persistent-system-shell-v1.html'
      - 'scripts/verify-gemma4-learning-plan-passoff-v1.mjs'
      - '.github/workflows/verify-gemma4-learning-plan-passoff-v1.yml'
  push:
    branches: [staging]
    paths:
      - 'public/app/local-ai/gemma4-weave-draft-pipeline-v1.js'
      - 'public/app/local-ai/gemma4-learning-plan-entry-authority-v1.js'
      - 'public/app/local-ai/gemma4-first-request-intake-bridge-v1.js'
      - 'public/app/local-ai/gemma4-structured-task-authority-v1.js'
      - 'public/app/persistent-system-shell-v1.html'
      - 'scripts/verify-gemma4-learning-plan-passoff-v1.mjs'
      - '.github/workflows/verify-gemma4-learning-plan-passoff-v1.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check pass-off syntax
        run: node --check public/app/local-ai/gemma4-weave-draft-pipeline-v1.js
      - name: Verify E2B draft to E4B compile handoff
        run: node scripts/verify-gemma4-learning-plan-passoff-v1.mjs
