name: One-shot Community Compute Release

on:
  push:
    branches:
      - agent/community-compute-dividend-v2
    paths:
      - '.github/workflows/one-shot-community-compute-release.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/community-compute-dividend-v2
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Advance release and align stale verifiers
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const next='1.0.134';
          const current=(await readFile('VERSION','utf8')).trim();
          if(current!=='1.0.133'&&current!==next) throw new Error(`Unexpected branch VERSION ${current}`);
          await writeFile('VERSION',`${next}\n`);
          const pkg=JSON.parse(await readFile('package.json','utf8'));
          pkg.version=next;
          await writeFile('package.json',JSON.stringify(pkg,null,2)+'\n');
          const lock=JSON.parse(await readFile('package-lock.json','utf8'));
          lock.version=next;
          if(lock.packages?.['']) lock.packages[''].version=next;
          await writeFile('package-lock.json',JSON.stringify(lock,null,2)+'\n');
          const contract=JSON.parse(await readFile('config/release-contract.json','utf8'));
          contract.canonical.current={...(contract.canonical.current||{}),version:next,path:`releases/${next}`,status:'current'};
          await writeFile('config/release-contract.json',JSON.stringify(contract,null,2)+'\n');

          async function replaceRequired(file,from,to){
            const source=await readFile(file,'utf8');
            if(!source.includes(from)) throw new Error(`${file}: expected source fragment was not found`);
            await writeFile(file,source.replace(from,to));
          }
          await replaceRequired(
            'scripts/verify-cloudflare-launch-kit-v1.mjs',
            "assert.ok(capacitySource.includes('starterPaidExpansionSeats: 9'));",
            "assert.ok(capacitySource.includes('starterCommunitySeats: 10'));\nassert.ok(capacitySource.includes('maxCommunitySeats: 16'));\nassert.ok(capacitySource.includes('maxMembers: 28'));\nassert.ok(capacitySource.includes('membershipUnitCents: 500'));\nassert.ok(capacitySource.includes('freeSeatsPerMembershipUnit: 2'));\nassert.ok(capacitySource.includes('communityBonusNeuronsPerMembershipUnit: 200'));"
          );
          await replaceRequired(
            'scripts/verify-cloudflare-launch-kit-v1.mjs',
            "assert.ok(capacitySource.includes(\"billingStatus === 'free') billingStatus = 'grace'\"));",
            "assert.ok(capacitySource.includes(\"const seatClass = billingStatus === 'paid' || billingStatus === 'grace' ? 'paid-expansion' : 'community';\"));"
          );
          await replaceRequired(
            'scripts/verify-cloudflare-launch-kit-v1.mjs',
            "const paidEmpty = capacityModule.deriveCapacity({ workersPlan:'paid', memberCount:18, communityMemberCount:18 });\nassert.equal(paidEmpty.dailyCeilingNeurons, 10000);\nassert.equal(paidEmpty.communitySeatLimit, 18);",
            "const paidEmpty = capacityModule.deriveCapacity({ workersPlan:'paid', memberCount:10, communityMemberCount:10 });\nassert.equal(paidEmpty.dailyCeilingNeurons, 10000);\nassert.equal(paidEmpty.includedDailyNeurons, 900);\nassert.equal(paidEmpty.communitySeatLimit, 10);"
          );
          await replaceRequired(
            'scripts/test-node-ai-marketplace-surface-v1.mjs',
            "  '/app/installed-entry-v146.html','/app/cw-reward-ledger-v2.js','/app/cw-reward-receivers-v2.js'",
            "  '/app/installed-entry-v146.html','/app/cw-reward-ledger-v2.js','/app/civweave-basic-value-v1.js','/app/civweave-economic-policy-v1.js','/app/civweave-basic-value-model-v1.js','/app/civweave-basic-value-review-v1.js','/app/civweave-basic-value-systems-v1.js','/app/cw-reward-receivers-v2.js'"
          );
          await replaceRequired(
            'scripts/verify-canonical-core-only-v226.mjs',
            "  '/app/civweave-systems-mesh-v251.js',\n  '/app/node-ai-mesh-v1.js',",
            "  '/app/civweave-systems-mesh-v251.js',\n  '/app/host-node-session-v1.js',\n  '/app/node-ai-mesh-v1.js',"
          );
          NODE
      - name: Materialize canonical 1.0.134 release
        run: |
          node scripts/materialize-canonical-release.mjs
          node scripts/sync-release-coherence-v220.mjs
      - name: Install Cloudflare launch verifier dependency
        run: npm install --prefix cloudflare/core --omit=dev --no-audit --no-fund
      - name: Validate community compute release
        run: |
          node scripts/test-cloudflare-host-capacity-v1.mjs
          node scripts/test-community-compute-dividend-v1.mjs
          node scripts/verify-server-ai-commerce-v301.mjs
          node scripts/verify-cloudflare-launch-kit-v1.mjs
          node --test scripts/test-node-ai-marketplace-surface-v1.mjs
          node scripts/verify-canonical-core-only-v226.mjs
          node scripts/verify-canonical-launch-release.mjs
      - name: Commit materialized release
        run: |
          rm .github/workflows/one-shot-community-compute-release.yml
          git config user.name 'civweave-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize community compute dividend release 1.0.134'
          git push origin HEAD:agent/community-compute-dividend-v2
