name: Wire Open Learning Media Launch Temp

on:
  push:
    branches:
      - agent/open-learning-media-harvest-v1
    paths:
      - .github/workflows/open-media-launch-wire-temp.yml

permissions:
  contents: write

concurrency:
  group: open-media-launch-wire-temp
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/open-learning-media-harvest-v1
          fetch-depth: 0

      - name: Sync current main and prepare release version
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          main_version=subprocess.check_output(['git','show','origin/main:VERSION'],text=True).strip()
          major,minor,patch=[int(x) for x in main_version.split('.')]
          release=f'{major}.{minor}.{patch+1}'
          Path('VERSION').write_text(release+'\n')
          package=Path('package.json'); data=json.loads(package.read_text()); data['version']=release; package.write_text(json.dumps(data,indent=2)+'\n')
          manifest=Path('public/app/manifest.webmanifest'); m=json.loads(manifest.read_text()); m['name']=f'Civweave v{release}'; manifest.write_text(json.dumps(m,indent=2)+'\n')
          print(f'Prepared Civweave {release} beyond main {main_version}')
          PY

      - name: Apply launch finalizer
        run: python scripts/finalize-open-learning-media-launch-v1.py

      - name: Validate launch service
        run: |
          python -m py_compile scripts/finalize-open-learning-media-launch-v1.py scripts/harvest-open-learning-media-v1.py scripts/filter-open-learning-media-relevance-v1.py scripts/filter-open-learning-media-pedagogy-v1.py scripts/filter-open-learning-media-selection-v1.py scripts/test-open-learning-media-harvest-v1.py
          node --check public/app/open-learning-media-cache-v1.mjs
          node --check public/app/open-learning-media-installer-v1.mjs
          node --check public/app/video-learning-contract-v1.mjs
          node --check public/service-worker-core-v208.js
          node --check public/service-worker-v203.js
          node --check public/install-v130.js
          node --check public/app/installed-entry-v146.js
          node scripts/test-open-learning-media-runtime-v1.mjs
          node scripts/test-video-learning-contract-v1.mjs
          python scripts/test-open-learning-media-harvest-v1.py
          test "$(cat VERSION)" != "$(git show origin/main:VERSION)"

      - name: Commit launch service
        run: |
          set -euo pipefail
          rm -f .github/workflows/open-media-launch-wire-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Wire launch-ready Open Learning Media service'
          git push origin HEAD:agent/open-learning-media-harvest-v1
