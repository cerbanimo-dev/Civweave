name: Wire Open Learning Media Launch Temp

on:
  push:
    branches:
      - agent/open-learning-media-harvest-v1
    paths:
      - .github/workflows/open-media-launch-wire-temp.yml

permissions:
  contents: write

concurrency:
  group: open-media-launch-wire-temp
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/open-learning-media-harvest-v1
          fetch-depth: 0

      - name: Sync current main
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main

      - name: Advance release patch beyond main
        run: |
          set -euo pipefail
          MAIN_VERSION="$(git show origin/main:VERSION)"
          IFS=. read -r MAJOR MINOR PATCH <<< "$MAIN_VERSION"
          RELEASE="$MAJOR.$MINOR.$((PATCH + 1))"
          printf '%s\n' "$RELEASE" > VERSION
          node -e "const fs=require('fs');const v=process.argv[1];const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=v;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\\n');const m=JSON.parse(fs.readFileSync('public/app/manifest.webmanifest','utf8'));m.name='Civweave v'+v;fs.writeFileSync('public/app/manifest.webmanifest',JSON.stringify(m,null,2)+'\\n');" "$RELEASE"
          echo "Prepared Civweave $RELEASE beyond main $MAIN_VERSION"

      - name: Apply reproducible launch finalizers twice
        run: |
          set -euo pipefail
          python scripts/fix-open-learning-media-learning-path-budget-v1.py
          python scripts/fix-open-learning-media-finalizer-idempotency-v1.py
          python scripts/finalize-open-learning-media-launch-v1.py
          python scripts/finalize-open-learning-media-range-v1.py
          python scripts/finalize-open-learning-media-safety-v1.py
          git diff --binary > /tmp/open-media-first.diff
          python scripts/fix-open-learning-media-learning-path-budget-v1.py
          python scripts/finalize-open-learning-media-launch-v1.py
          python scripts/finalize-open-learning-media-range-v1.py
          python scripts/finalize-open-learning-media-safety-v1.py
          git diff --binary > /tmp/open-media-second.diff
          if ! cmp -s /tmp/open-media-first.diff /tmp/open-media-second.diff; then
            echo '::group::Finalizer idempotency delta'
            diff -u /tmp/open-media-first.diff /tmp/open-media-second.diff | head -n 500 || true
            echo '::endgroup::'
            exit 1
          fi

      - name: Validate launch service
        run: |
          set -euo pipefail
          python -m py_compile scripts/fix-open-learning-media-learning-path-budget-v1.py scripts/fix-open-learning-media-finalizer-idempotency-v1.py scripts/finalize-open-learning-media-launch-v1.py scripts/finalize-open-learning-media-range-v1.py scripts/finalize-open-learning-media-safety-v1.py scripts/harvest-open-learning-media-v1.py scripts/filter-open-learning-media-relevance-v1.py scripts/filter-open-learning-media-pedagogy-v1.py scripts/filter-open-learning-media-selection-v1.py scripts/test-open-learning-media-harvest-v1.py
          node --check public/app/open-learning-media-cache-v1.mjs
          node --check public/app/open-learning-media-installer-v1.mjs
          node --check public/app/video-learning-contract-v1.mjs
          node --check public/service-worker-core-v208.js
          node --check public/service-worker-v203.js
          node --check public/install-v130.js
          node --check public/app/installed-entry-v146.js
          node scripts/test-open-learning-media-runtime-v1.mjs
          node scripts/test-video-learning-contract-v1.mjs
          python scripts/test-open-learning-media-harvest-v1.py
          test "$(cat VERSION)" != "$(git show origin/main:VERSION)"

      - name: Commit tested service changes only
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github/workflows
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Wire launch-ready Open Learning Media service'
          git push origin HEAD:agent/open-learning-media-harvest-v1
