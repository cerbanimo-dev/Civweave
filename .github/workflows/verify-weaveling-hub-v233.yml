name: Verify Weaveling hub v233

on:
  pull_request:
    paths:
      - 'public/app/weaveling-hub-v233.js'
      - 'public/app/working-campus-v156.js'
      - 'public/app/guide-chat-surface-v350.js'
      - 'public/app/guide-workspace-v242.js'
      - 'public/app/shared-guide-surface-v236.js'
      - 'scripts/verify-weaveling-hub-v233.mjs'
      - 'VERSION'
      - 'package.json'
      - '.github/workflows/verify-weaveling-hub-v233.yml'
  push:
    paths:
      - 'public/app/weaveling-hub-v233.js'
      - 'public/app/working-campus-v156.js'
      - 'public/app/guide-chat-surface-v350.js'
      - 'public/app/guide-workspace-v242.js'
      - 'public/app/shared-guide-surface-v236.js'
      - 'scripts/verify-weaveling-hub-v233.mjs'
      - 'VERSION'
      - 'package.json'
      - '.github/workflows/verify-weaveling-hub-v233.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check public/app/weaveling-hub-v233.js
          node --check public/app/working-campus-v156.js
          node --check public/app/guide-chat-surface-v350.js
          node --check public/app/guide-workspace-v242.js
          node --check scripts/verify-weaveling-hub-v233.mjs
      - name: Contract
        run: node scripts/verify-weaveling-hub-v233.mjs