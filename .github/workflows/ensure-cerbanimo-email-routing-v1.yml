name: Ensure Cerbanimo email routing

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/mail/aliases.json'
      - 'scripts/ensure-cerbanimo-email-routing-v1.mjs'
      - 'scripts/verify-cerbanimo-email-routing-v1.mjs'
      - '.github/workflows/ensure-cerbanimo-email-routing-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify alias configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-cerbanimo-email-routing-v1.mjs

  provision:
    name: Provision Cloudflare Email Routing
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify credentials are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 2; }
      - name: Ensure aliases
        run: node scripts/ensure-cerbanimo-email-routing-v1.mjs
