name: Split Commonweave Knowledge Seed Schools

on:
  workflow_dispatch:
    inputs:
      source_artifact_id:
        description: GitHub Actions artifact ID containing the full Seed 1 package
        required: false
        default: '8927846186'
  push:
    branches:
      - agent/build-commonweave-seed1
    paths:
      - .school-seed-build-trigger

permissions:
  contents: read
  actions: read

jobs:
  split-schools:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_ARTIFACT_ID: ${{ github.event.inputs.source_artifact_id || '8927846186' }}
    steps:
      - name: Check out school seed tools
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/knowledge_seed/requirements-seed1.txt

      - name: Install split dependencies
        run: python -m pip install -r tools/knowledge_seed/requirements-seed1.txt

      - name: Download full Seed 1 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/source-artifact build/source-package
          curl --fail --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o build/source-artifact.zip
          unzip -q build/source-artifact.zip -d build/source-artifact
          INNER_ZIP="$(find build/source-artifact -type f -name 'commonweave-knowledge-seed1.zip' -print -quit)"
          test -n "${INNER_ZIP}"
          unzip -q "${INNER_ZIP}" -d build/source-package
          SOURCE_DB="$(find build/source-package -type f -name 'commonweave-seed1.sqlite' -print -quit)"
          test -n "${SOURCE_DB}"
          echo "SOURCE_DB=${SOURCE_DB}" >> "${GITHUB_ENV}"
          ls -lh "${SOURCE_DB}"

      - name: Build category school seeds
        run: >-
          python tools/knowledge_seed/split_seed_schools_entry.py
          --source-db "${SOURCE_DB}"
          --output build/commonweave-category-school-seeds
          --unpack-script tools/knowledge_seed/batch_unpack_schools.py

      - name: Verify batch unpack and school databases
        run: |
          set -euo pipefail
          python build/commonweave-category-school-seeds/batch_unpack_schools.py \
            --bundle-dir build/commonweave-category-school-seeds \
            --schools all \
            --destination build/verification-unpacked
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          bundle = Path('build/commonweave-category-school-seeds')
          catalog = json.loads((bundle / 'catalog.json').read_text())
          assert len(catalog['schools']) == 11
          assert sum(s['counts']['articles'] for s in catalog['schools']) == 1001
          assert catalog['reconciliation']['crossroads_articles'] == 0
          assert catalog['reconciliation']['crossroads_titles'] == []
          for school in catalog['schools']:
              db = Path('build/verification-unpacked') / f"commonweave-school-{school['school_slug']}" / f"commonweave-school-{school['school_slug']}.sqlite"
              with sqlite3.connect(db) as connection:
                  assert connection.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
                  assert connection.execute('SELECT COUNT(*) FROM articles').fetchone()[0] == school['counts']['articles']
                  assert connection.execute('SELECT COUNT(*) FROM section_fts').fetchone()[0] == school['counts']['sections']
          print(json.dumps({
              'schools': len(catalog['schools']),
              'articles': sum(s['counts']['articles'] for s in catalog['schools']),
              'compressed_bytes': sum(s['zip_bytes'] for s in catalog['schools']),
              'legacy_overrides': catalog['reconciliation'].get('legacy_override_count', 0),
              'crossroads': catalog['reconciliation']['crossroads_titles'],
          }, indent=2))
          PY

      - name: Display school catalog
        if: always()
        run: |
          find build/commonweave-category-school-seeds -maxdepth 2 -type f -printf '%p\t%s bytes\n' | sort || true
          cat build/commonweave-category-school-seeds/catalog.json || true
          cat build/commonweave-category-school-seeds/RECONCILIATION.json || true

      - name: Upload category school seeds
        uses: actions/upload-artifact@v4
        with:
          name: commonweave-category-school-seeds
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            build/commonweave-category-school-seeds.zip
            build/commonweave-category-school-seeds.zip.sha256
            build/commonweave-category-school-seeds/README.md
            build/commonweave-category-school-seeds/catalog.json
            build/commonweave-category-school-seeds/commonweave-school-catalog.sqlite
            build/commonweave-category-school-seeds/RECONCILIATION.json
            build/commonweave-category-school-seeds/SHA256SUMS
            build/commonweave-category-school-seeds/batch_unpack_schools.py
            build/commonweave-category-school-seeds/schools/*.zip
