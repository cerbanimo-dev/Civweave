name: Materialize FellowFare Native Release
on:
  push:
    branches: [fix/fellowfare-native-v207]
    paths: ['.github/workflows/materialize-fellowfare-native-release.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fellowfare-native-v207
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize 1.0.130
        run: |
          printf '1.0.130\n' > VERSION
          npm pkg set version=1.0.130
          node scripts/materialize-canonical-release.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='config/release-contract.json';
          const value=JSON.parse(fs.readFileSync(file,'utf8'));
          value.canonical.current={version:'1.0.130',path:'releases/1.0.130',status:'current'};
          fs.writeFileSync(file,JSON.stringify(value,null,2)+'\n');
          NODE
      - name: Verify release
        env:
          CHANGED_FILES: |
            public/app/fellowfare-cabinet-v144.html
            public/app/fellowfare-native-v207.css
            public/app/fellowfare-native-host-v207.js
            public/app/services/fellowfare/fulfillment-economy-v2.js
        run: |
          node scripts/verify-fellowfare-native-v207.mjs
          node scripts/verify-fellowfare-active-v203.mjs
          node scripts/verify-version-policy.mjs 1.0.129 1.0.130
          node scripts/verify-canonical-launch-release.mjs
      - name: Commit
        run: |
          git config user.name civweave-release-bot
          git config user.email civweave-release-bot@users.noreply.github.com
          git add -A
          git commit -m 'Materialize Civweave 1.0.130 native FellowFare' || exit 0
          git push origin HEAD:fix/fellowfare-native-v207
