name: Materialize local Host steward release

on:
  push:
    branches: [fix/local-host-steward-tools]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/local-host-steward-tools
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Prepare Civweave 1.0.119
        shell: bash
        run: |
          set -euo pipefail
          current="$(tr -d '[:space:]' < VERSION)"
          if [[ "$current" == "1.0.119" ]]; then
            echo "Release already prepared."
          elif [[ "$current" == "1.0.118" ]]; then
            printf '1.0.119\n' > VERSION
            node - <<'NODE'
          import fs from 'node:fs';
          const file='package.json';
          const pkg=JSON.parse(fs.readFileSync(file,'utf8'));
          pkg.version='1.0.119';
          fs.writeFileSync(file,JSON.stringify(pkg,null,2)+'\n');
          NODE
            node scripts/materialize-canonical-release.mjs
          else
            echo "Unexpected VERSION $current" >&2
            exit 1
          fi
          rm -f .github/workflows/materialize-local-host-steward-release.yml
      - name: Commit generated release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'civweave-release-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Materialize Civweave 1.0.119 local Host steward release'
          git push origin HEAD:fix/local-host-steward-tools
