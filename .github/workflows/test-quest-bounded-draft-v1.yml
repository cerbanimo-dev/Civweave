name: Verify bounded Quest drafts

on:
  pull_request:
    paths:
      - 'public/app/local-ai/gemma4-weave-draft-pipeline-v1.js'
      - 'scripts/test-quest-bounded-draft-v1.mjs'
      - '.github/workflows/test-quest-bounded-draft-v1.yml'
  push:
    branches: [staging]
    paths:
      - 'public/app/local-ai/gemma4-weave-draft-pipeline-v1.js'
      - 'scripts/test-quest-bounded-draft-v1.mjs'
      - '.github/workflows/test-quest-bounded-draft-v1.yml'

permissions:
  contents: read

jobs:
  bounded-quest:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Quest pipeline syntax
        run: node --check public/app/local-ai/gemma4-weave-draft-pipeline-v1.js
      - name: Verify section completion checkpoints and failure preservation
        run: node scripts/test-quest-bounded-draft-v1.mjs
      - name: Verify existing Weave draft compiler contract
        run: node scripts/verify-e4b-weave-draft-pipeline-v1.mjs
