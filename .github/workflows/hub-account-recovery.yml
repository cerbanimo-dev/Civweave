name: Hub account recovery

on:
  pull_request:
    paths:
      - 'cloudflare/account-edge/**'
      - 'cloudflare/recovery-relay/**'
      - 'public/app/hub-recovery-*.js'
      - 'public/app/hub-delivery-intent-v1.js'
      - 'public/app/civweave-brand.js'
      - 'public/app/host-node-session-import-v1.js'
      - 'public/app/host-node-session-export-v1.js'
      - 'public/app/installer-online-fallback-v225.js'
      - 'scripts/verify-hub-recovery-wiring-v1.mjs'
      - 'scripts/test-hub-recovery-behavior-v1.mjs'
      - 'scripts/test-hub-recovery-relay-v1.mjs'
      - '.github/workflows/hub-account-recovery.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare/account-edge/**'
      - 'cloudflare/recovery-relay/**'
      - 'public/app/hub-recovery-*.js'
      - 'public/app/hub-delivery-intent-v1.js'
      - 'public/app/civweave-brand.js'
      - 'public/app/host-node-session-import-v1.js'
      - 'public/app/host-node-session-export-v1.js'
      - 'public/app/installer-online-fallback-v225.js'
      - 'scripts/verify-hub-recovery-wiring-v1.mjs'
      - 'scripts/test-hub-recovery-behavior-v1.mjs'
      - 'scripts/test-hub-recovery-relay-v1.mjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Hub recovery behavior
        run: node scripts/test-hub-recovery-behavior-v1.mjs
      - name: Test cross-Hub recovery proof relay
        run: node scripts/test-hub-recovery-relay-v1.mjs
      - name: Verify Hub recovery wiring
        run: node scripts/verify-hub-recovery-wiring-v1.mjs
      - name: Verify account edge bootstrap
        run: node scripts/test-cloudflare-account-bootstrap-v1.mjs
      - name: Dry-run compile recovery Workers
        run: |
          npx --yes wrangler@latest deploy --dry-run --config cloudflare/recovery-relay/wrangler.jsonc
          npx --yes wrangler@latest deploy --dry-run --config cloudflare/account-edge/wrangler.jsonc
