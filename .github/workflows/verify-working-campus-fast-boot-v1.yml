name: Verify Working Campus Fast Boot

on:
  pull_request:
    paths:
      - 'public/app/working-campus-v156.js'
      - 'public/app/working-campus-v156.part*.txt'
      - 'public/app/working-campus-v440.html'
      - 'public/app/settings-gateway-v317.js'
      - 'scripts/build-working-campus-fast-boot-v1.mjs'
      - 'scripts/verify-working-campus-fast-boot-v1.mjs'
      - 'package.json'
      - '.github/workflows/verify-working-campus-fast-boot-v1.yml'
  push:
    branches: [staging, main]
    paths:
      - 'public/app/working-campus-v156.js'
      - 'public/app/working-campus-v156.part*.txt'
      - 'public/app/working-campus-v440.html'
      - 'public/app/settings-gateway-v317.js'
      - 'scripts/build-working-campus-fast-boot-v1.mjs'
      - 'scripts/verify-working-campus-fast-boot-v1.mjs'
      - 'package.json'
      - '.github/workflows/verify-working-campus-fast-boot-v1.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check public/app/working-campus-v156.js
      - run: node scripts/build-working-campus-fast-boot-v1.mjs --check
      - run: node scripts/verify-working-campus-fast-boot-v1.mjs
