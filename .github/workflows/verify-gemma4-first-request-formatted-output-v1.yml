name: Verify Gemma 4 First Request Formatted Output

on:
  pull_request:
    paths:
      - 'public/app/local-ai/gemma4-litert-request-authority-v1.js'
      - 'public/app/local-ai/litert-gemma4-fast-runtime-v1.js'
      - 'public/app/local-ai/gemma4-structured-quest-compact-envelope-v1.js'
      - 'public/app/local-ai/gemma4-current-registry-authority-v1.js'
      - 'public/app/persistent-system-shell-v1.html'
      - 'public/app/working-campus-v440.html'
      - 'scripts/verify-gemma4-first-request-formatted-output-v1.mjs'
      - '.github/workflows/verify-gemma4-first-request-formatted-output-v1.yml'
  push:
    branches: [staging]
    paths:
      - 'public/app/local-ai/gemma4-litert-request-authority-v1.js'
      - 'public/app/local-ai/litert-gemma4-fast-runtime-v1.js'
      - 'public/app/local-ai/gemma4-structured-quest-compact-envelope-v1.js'
      - 'public/app/local-ai/gemma4-current-registry-authority-v1.js'
      - 'public/app/persistent-system-shell-v1.html'
      - 'public/app/working-campus-v440.html'
      - 'scripts/verify-gemma4-first-request-formatted-output-v1.mjs'
      - '.github/workflows/verify-gemma4-first-request-formatted-output-v1.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check runtime syntax
        run: |
          node --check public/app/local-ai/gemma4-litert-request-authority-v1.js
          node --check public/app/local-ai/litert-gemma4-fast-runtime-v1.js
          node --check public/app/local-ai/gemma4-structured-quest-compact-envelope-v1.js
          node --check public/app/local-ai/gemma4-current-registry-authority-v1.js
      - name: Verify first request ownership and formatted output
        run: node scripts/verify-gemma4-first-request-formatted-output-v1.mjs