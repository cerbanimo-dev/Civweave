name: Verify Cloudflare Launch Kit v1

on:
  pull_request:
    paths:
      - 'cloudflare/**'
      - 'config/launch-topology-v1.json'
      - 'config/host-node-transports-v1.json'
      - 'lib/node-ai-bootstrap-v1.mjs'
      - '.env.ai-wallet.example'
      - 'docs/operations/launch-kit-cloudflare-node-fabric-v1.md'
      - 'docs/finance/stripe-connect-v2-sample.md'
      - 'scripts/prepare-cloudflare-launch-kit-v1.mjs'
      - 'scripts/verify-cloudflare-launch-kit-v1.mjs'
      - 'scripts/verify-stripe-connect-v2-sample.mjs'
      - '.github/workflows/verify-cloudflare-launch-kit-v1.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'config/launch-topology-v1.json'
      - 'config/host-node-transports-v1.json'
      - 'lib/node-ai-bootstrap-v1.mjs'
      - '.env.ai-wallet.example'
      - 'docs/operations/launch-kit-cloudflare-node-fabric-v1.md'
      - 'docs/finance/stripe-connect-v2-sample.md'
      - 'scripts/prepare-cloudflare-launch-kit-v1.mjs'
      - 'scripts/verify-cloudflare-launch-kit-v1.mjs'
      - 'scripts/verify-stripe-connect-v2-sample.mjs'
      - '.github/workflows/verify-cloudflare-launch-kit-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Stripe SDK used by the Worker sample
        run: npm install --prefix cloudflare/core --omit=dev --no-audit --no-fund
      - name: Verify canonical origin entry
        run: |
          node --check cloudflare/core/src/origin-entry.mjs
          node --input-type=module -e "import {launchTopologyFor,CANONICAL_CIVWEAVE_INSTALL_ORIGIN} from './cloudflare/core/src/origin-entry.mjs'; const t=launchTopologyFor({}); if(CANONICAL_CIVWEAVE_INSTALL_ORIGIN!=='https://civweave.cc'||t.canonicalInstallOrigin!==CANONICAL_CIVWEAVE_INSTALL_ORIGIN) process.exit(1)"
      - name: Verify Cloudflare authority and node fabric
        run: node scripts/verify-cloudflare-launch-kit-v1.mjs
      - name: Verify Stripe Connect v2 sample
        run: node scripts/verify-stripe-connect-v2-sample.mjs
