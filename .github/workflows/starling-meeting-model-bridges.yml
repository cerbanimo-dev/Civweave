name: Starling meeting model bridges

on:
  pull_request:
    paths:
      - 'tools/starling/meeting-model-bridges-v1.mjs'
      - 'scripts/test-starling-meeting-model-bridges-v1.mjs'
      - '.github/workflows/starling-meeting-model-bridges.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check tools/starling/meeting-model-bridges-v1.mjs
          node --check scripts/test-starling-meeting-model-bridges-v1.mjs
      - name: Run provider and authorization contract tests
        run: node --test scripts/test-starling-meeting-model-bridges-v1.mjs
