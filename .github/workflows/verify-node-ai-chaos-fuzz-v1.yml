name: Verify Node AI Chaos Fuzz v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/node-ai-*.mjs'
      - 'lib/ai-wallet-*.mjs'
      - 'scripts/test-node-ai-*.mjs'
      - 'scripts/node-ai-process-chaos-worker-v1.mjs'
      - 'examples/node-ai-*.mjs'
      - '.env.ai-wallet.example'
      - 'package.json'
      - '.github/workflows/verify-node-ai-chaos-fuzz-v1.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  chaos-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check chaos harness and economic boundary
        run: |
          node --check scripts/test-node-ai-chaos-fuzz-v1.mjs
          node --check scripts/test-node-ai-debt-availability-v1.mjs
          node --check scripts/node-ai-process-chaos-worker-v1.mjs
          node --check scripts/test-node-ai-process-chaos-v1.mjs
          node --check scripts/test-node-ai-network-replay-v1.mjs
          node --check lib/node-ai-ledger-sqlite-v1.mjs
          node --check lib/node-ai-inference-gate-v1.mjs
          node --check lib/node-ai-inference-http-v1.mjs
      - name: Verify debt suppresses spendable availability
        run: node --test scripts/test-node-ai-debt-availability-v1.mjs
      - name: Run multi-process and SIGKILL economic chaos
        run: node --test scripts/test-node-ai-process-chaos-v1.mjs
      - name: Verify lost-response HTTP replay boundary
        run: node --test scripts/test-node-ai-network-replay-v1.mjs
      - name: Run deterministic chaos smoke
        run: node scripts/test-node-ai-chaos-fuzz-v1.mjs --seed=civweave-pr-smoke-v1 --runs=2 --operations=1000 --nodes=3 --users=6
      - name: Run 40k-operation economic chaos gate
        run: node scripts/test-node-ai-chaos-fuzz-v1.mjs --seed=civweave-pr-chaos-v1 --runs=8 --operations=5000 --nodes=4 --users=8
      - name: Re-run focused marketplace and trial contracts
        run: node --test scripts/test-node-ai-marketplace-v1.mjs scripts/test-node-ai-trial-commerce-v1.mjs
      - name: Preserve local-ledger and sandbox boundaries
        run: |
          test ! -e lib/ai-wallet-postgres-v1.mjs
          test ! -e db/migrations/001-ai-wallet-ledger.sql
          grep -q 'livePayments:false' lib/node-ai-trial-commerce-v1.mjs
          ! grep -RniE 'AI_WALLET_DATABASE_URL|@neondatabase/serverless|PostgresAiWallet|providerReserveCents|providerShareBps' lib package.json .env.ai-wallet.example --exclude='test-node-ai-marketplace-v1.mjs' --exclude='test-node-ai-http-v1.mjs'

  scheduled-soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run focused debt regression first
        run: node --test scripts/test-node-ai-debt-availability-v1.mjs
      - name: Run multi-process and SIGKILL chaos before soak
        run: node --test scripts/test-node-ai-process-chaos-v1.mjs
      - name: Verify lost-response HTTP replay before soak
        run: node --test scripts/test-node-ai-network-replay-v1.mjs
      - name: Run 240k-operation node economy soak
        run: node scripts/test-node-ai-chaos-fuzz-v1.mjs --seed=civweave-nightly-soak-v1 --runs=12 --operations=20000 --nodes=5 --users=10
