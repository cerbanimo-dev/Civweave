name: Bump Commonweave to v1.0.7

on:
  push:
    branches:
      - fix/living-school-cleanroom-v218
    paths:
      - scripts/bump-commonweave-version-v107.mjs
      - .github/workflows/bump-commonweave-version-v107.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/living-school-cleanroom-v218
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Advance every tracked release marker
        run: node scripts/bump-commonweave-version-v107.mjs
      - name: Commit v1.0.7
        run: |
          git config user.name "commonweave-release-bot"
          git config user.email "commonweave-release-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Bump Commonweave to v1.0.7"
          git push origin HEAD:fix/living-school-cleanroom-v218
