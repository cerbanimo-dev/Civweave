name: Verify Service Worker Evaluation v189

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'package.json'
      - 'package-lock.json'
      - 'public/service-worker*.js'
      - 'public/app/install*.js'
      - 'public/app/installer*.js'
      - 'public/app/system-routes-v227.js'
      - 'public/app/themed-system-nav-v178.js'
      - 'public/app/working-campus-v156.js'
      - 'public/app/required-campus-autostart-v1.js'
      - 'public/app/campus-background-download-v241.js'
      - 'public/app/document-lifecycle-v221.js'
      - 'scripts/build-service-worker-v211.mjs'
      - 'scripts/sync-release-version-assets.mjs'
      - 'scripts/sync-release-coherence-v220.mjs'
      - 'scripts/generate-prelive-metadata-v281.mjs'
      - 'scripts/verify-five-system-navigation-v227.mjs'
      - 'scripts/verify-navigation-generators-v227.mjs'
      - 'scripts/verify-service-worker-evaluation-v189.mjs'
      - 'scripts/verify-release-version-sync.mjs'
      - 'scripts/verify-release-coherence-v220.mjs'
      - 'scripts/verify-navigation-redirect-safety-v224.mjs'
      - 'scripts/verify-installed-shell-repair-v293.mjs'
      - 'scripts/verify-document-lifecycle-v221.mjs'
      - 'scripts/verify-canonical-core-only-v226.mjs'
      - 'scripts/verify-rook-assistant-package-v197.mjs'
      - 'scripts/verify-fast-interactive-runtime-v202.mjs'
      - 'scripts/verify-memory-bridge-frozen-runtime-v205.mjs'
      - 'scripts/verify-offline-campus-status-v210.mjs'
      - 'scripts/verify-offline-campus-retry-loop-v211.mjs'
      - 'scripts/smoke-installer-resume-state-v280.mjs'
      - 'scripts/smoke-installer-hardening-v281.mjs'
      - 'scripts/browser-installer-gauntlet-v281.mjs'
      - '.github/workflows/verify-service-worker-evaluation-v189.yml'
  pull_request:
    branches: [main]
    paths:
      - 'VERSION'
      - 'package.json'
      - 'package-lock.json'
      - 'public/service-worker*.js'
      - 'public/app/install*.js'
      - 'public/app/installer*.js'
      - 'public/app/system-routes-v227.js'
      - 'public/app/themed-system-nav-v178.js'
      - 'public/app/working-campus-v156.js'
      - 'public/app/required-campus-autostart-v1.js'
      - 'public/app/campus-background-download-v241.js'
      - 'public/app/document-lifecycle-v221.js'
      - 'scripts/build-service-worker-v211.mjs'
      - 'scripts/sync-release-version-assets.mjs'
      - 'scripts/sync-release-coherence-v220.mjs'
      - 'scripts/generate-prelive-metadata-v281.mjs'
      - 'scripts/verify-five-system-navigation-v227.mjs'
      - 'scripts/verify-navigation-generators-v227.mjs'
      - 'scripts/verify-service-worker-evaluation-v189.mjs'
      - 'scripts/verify-release-version-sync.mjs'
      - 'scripts/verify-release-coherence-v220.mjs'
      - 'scripts/verify-navigation-redirect-safety-v224.mjs'
      - 'scripts/verify-installed-shell-repair-v293.mjs'
      - 'scripts/verify-document-lifecycle-v221.mjs'
      - 'scripts/verify-canonical-core-only-v226.mjs'
      - 'scripts/verify-rook-assistant-package-v197.mjs'
      - 'scripts/verify-fast-interactive-runtime-v202.mjs'
      - 'scripts/verify-memory-bridge-frozen-runtime-v205.mjs'
      - 'scripts/verify-offline-campus-status-v210.mjs'
      - 'scripts/verify-offline-campus-retry-loop-v211.mjs'
      - 'scripts/smoke-installer-resume-state-v280.mjs'
      - 'scripts/smoke-installer-hardening-v281.mjs'
      - 'scripts/browser-installer-gauntlet-v281.mjs'
      - '.github/workflows/verify-service-worker-evaluation-v189.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize release assets
        run: |
          node scripts/sync-release-version-assets.mjs
          node scripts/sync-release-coherence-v220.mjs
          node scripts/generate-prelive-metadata-v281.mjs
      - name: Syntax check navigation, workers, and verifiers
        run: |
          node --check public/app/system-routes-v227.js
          node --check public/app/install-boundary-v146.js
          node --check public/app/themed-system-nav-v178.js
          node --check public/app/working-campus-v156.js
          node --check public/app/installer-state-machine-v280.js
          node --check public/app/installer-storage-guard-v281.js
          node --check public/app/required-campus-autostart-v1.js
          node --check public/app/campus-background-download-v241.js
          node --check public/service-worker.js
          node --check public/service-worker-v156.js
          node --check public/service-worker-v203.js
          node --check public/service-worker-code-coherence-v288.js
          node --check public/service-worker-core-v208.js
          node --check public/service-worker-installed-launch-v282.js
          node --check public/service-worker-installer-state-v280.js
          node --check public/service-worker-shell-integrity-v281.js
          node --check public/service-worker-shell-repair-v293.js
          node --check public/service-worker-offline-v211-override.js
          node --check public/service-worker-campus-completion-v246.js
          node --check public/service-worker-release-coherence-v220.js
          node --check public/service-worker-navigation-safety-v224.js
          node --check public/service-worker-canonical-navigation-v227.js
          node --check public/app/document-lifecycle-v221.js
          node --check scripts/build-service-worker-v211.mjs
          node --check scripts/sync-release-version-assets.mjs
          node --check scripts/sync-release-coherence-v220.mjs
          node --check scripts/generate-prelive-metadata-v281.mjs
          node --check scripts/verify-installed-shell-repair-v293.mjs
          node --check scripts/verify-five-system-navigation-v227.mjs
          node --check scripts/verify-navigation-generators-v227.mjs
          node --check scripts/verify-service-worker-evaluation-v189.mjs
          node --check scripts/verify-release-version-sync.mjs
          node --check scripts/verify-release-coherence-v220.mjs
          node --check scripts/verify-navigation-redirect-safety-v224.mjs
          node --check scripts/verify-document-lifecycle-v221.mjs
          node --check scripts/verify-canonical-core-only-v226.mjs
          node --check scripts/verify-rook-assistant-package-v197.mjs
          node --check scripts/verify-fast-interactive-runtime-v202.mjs
          node --check scripts/verify-memory-bridge-frozen-runtime-v205.mjs
          node --check scripts/verify-offline-campus-status-v210.mjs
          node --check scripts/verify-offline-campus-retry-loop-v211.mjs
          node --check scripts/smoke-installer-resume-state-v280.mjs
          node --check scripts/smoke-installer-hardening-v281.mjs
          node --check scripts/browser-installer-gauntlet-v281.mjs
      - name: Verify all 25 system-to-system routes
        run: node scripts/verify-five-system-navigation-v227.mjs
      - name: Verify generators preserve the route architecture
        run: node scripts/verify-navigation-generators-v227.mjs
      - name: Evaluate imported and additive workers together
        run: node scripts/verify-service-worker-evaluation-v189.mjs
      - name: Verify release-wide route synchronization
        run: node scripts/verify-release-version-sync.mjs
      - name: Verify release-coherent launch and cache fallback
        run: node scripts/verify-release-coherence-v220.mjs
      - name: Verify redirected navigation response safety
        run: node scripts/verify-navigation-redirect-safety-v224.mjs
      - name: Verify installed shell in-place repair
        run: node scripts/verify-installed-shell-repair-v293.mjs
      - name: Verify all five canonical boundary surfaces
        run: node scripts/verify-canonical-core-only-v226.mjs
      - name: Verify navigation-safe Working Campus boot
        run: node scripts/verify-document-lifecycle-v221.mjs
      - name: Verify offline campus downloaded counts
        run: node scripts/verify-offline-campus-status-v210.mjs
      - name: Verify resumable current-campus retry behavior
        run: node scripts/verify-offline-campus-retry-loop-v211.mjs
      - name: Verify installer pause and resume state
        run: node scripts/smoke-installer-resume-state-v280.mjs
      - name: Verify pre-live storage and shell integrity
        run: node scripts/smoke-installer-hardening-v281.mjs
      - name: Install Chromium launch harness
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run real-browser installer gauntlet
        run: node scripts/browser-installer-gauntlet-v281.mjs
      - name: Verify Rook assistant runtime packaging
        run: node scripts/verify-rook-assistant-package-v197.mjs
      - name: Verify frozen fast-runtime proxy and critical refresh
        run: node scripts/verify-fast-interactive-runtime-v202.mjs
      - name: Verify frozen memory bridge and Cerbanimo composition
        run: node scripts/verify-memory-bridge-frozen-runtime-v205.mjs
