name: Verify Service Worker Evaluation v189

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check workers and verifiers
        run: |
          node --check public/service-worker.js
          node --check public/service-worker-v156.js
          node --check public/service-worker-v203.js
          node --check public/service-worker-core-v208.js
          node --check public/service-worker-release-coherence-v220.js
          node --check public/service-worker-navigation-safety-v224.js
          node --check public/service-worker-shell-repair-v225.js
          node --check public/service-worker-critical-v199.js
          node --check public/app/document-lifecycle-v221.js
          node --check public/app/install-boundary-v146.js
          node --check public/app/working-campus-v156.js
          node --check public/app/installer-online-fallback-v225.js
          node --check public/app/fast-interactive-runtime-v192.js
          node --check public/app/weaveling-memory-bridge-v191.js
          node --check public/app/offline-campus-status-v210.js
          node --check scripts/sync-release-coherence-v220.mjs
          node --check scripts/verify-service-worker-evaluation-v189.mjs
          node --check scripts/verify-release-coherence-v220.mjs
          node --check scripts/verify-navigation-redirect-safety-v224.mjs
          node --check scripts/verify-shell-self-repair-v225.mjs
          node --check scripts/verify-document-lifecycle-v221.mjs
          node --check scripts/verify-canonical-core-only-v226.mjs
          node --check scripts/verify-rook-assistant-package-v197.mjs
          node --check scripts/verify-fast-interactive-runtime-v202.mjs
          node --check scripts/verify-memory-bridge-frozen-runtime-v205.mjs
          node --check scripts/verify-offline-campus-status-v210.mjs
          node --check scripts/verify-offline-campus-retry-loop-v211.mjs
      - name: Evaluate imported and additive workers together
        run: node scripts/verify-service-worker-evaluation-v189.mjs
      - name: Verify release-coherent launch and cache fallback
        run: node scripts/verify-release-coherence-v220.mjs
      - name: Verify redirected navigation response safety
        run: node scripts/verify-navigation-redirect-safety-v224.mjs
      - name: Verify empty shell self-repair and online fallback
        run: node scripts/verify-shell-self-repair-v225.mjs
      - name: Verify canonical Working Campus appends no global bundle
        run: node scripts/verify-canonical-core-only-v226.mjs
      - name: Verify navigation-safe Working Campus boot
        run: node scripts/verify-document-lifecycle-v221.mjs
      - name: Verify offline campus downloaded counts
        run: node scripts/verify-offline-campus-status-v210.mjs
      - name: Verify repeated discovered files leave the retry queue
        run: node scripts/verify-offline-campus-retry-loop-v211.mjs
      - name: Verify Rook assistant runtime packaging
        run: node scripts/verify-rook-assistant-package-v197.mjs
      - name: Verify frozen fast-runtime proxy and critical refresh
        run: node scripts/verify-fast-interactive-runtime-v202.mjs
      - name: Verify frozen memory bridge and Cerbanimo composition
        run: node scripts/verify-memory-bridge-frozen-runtime-v205.mjs
