name: Launch production evidence once

on:
  push:
    branches:
      - ops/launch-production-evidence-v1
    paths:
      - .github/workflows/launch-production-evidence-once.yml

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RUNTIME_BASE_SHA: ff66d202b1a59c4865d3d218eb9ffcc5f61f766a
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ops/launch-production-evidence-v1
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install deployment dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Prove runtime tree matches merged main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$RUNTIME_BASE_SHA"
          git diff --exit-code origin/main -- . ':(exclude).github/workflows/launch-production-evidence-once.yml'
          node scripts/verify-live-money-promotion-safety-v1.mjs
          node scripts/verify-cloudflare-launch-kit-v1.mjs
          node scripts/verify-server-ai-commerce-v301.mjs
      - name: Resolve canonical Cloudflare resources
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 2; }
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers={Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'content-type':'application/json'};
          async function cf(path,init={}){
            const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}${path}`,{...init,headers:{...headers,...init.headers}});
            const payload=await response.json().catch(()=>({}));
            if(!response.ok||payload.success!==true)throw new Error(`${path}: HTTP ${response.status} ${JSON.stringify(payload.errors||payload)}`);
            return payload.result;
          }
          const [databases,subdomain]=await Promise.all([cf('/d1/database?per_page=100'),cf('/workers/subdomain')]);
          const rows=Array.isArray(databases)?databases:(databases?.result||[]);
          const core=rows.find(row=>row?.name==='civweave-core');
          if(!core?.uuid)throw new Error('Canonical D1 database civweave-core was not found.');
          const workersSubdomain=String(subdomain?.subdomain||'').trim();
          if(!/^[a-z0-9-]{1,63}$/i.test(workersSubdomain))throw new Error('Cloudflare Workers subdomain could not be resolved.');
          appendFileSync(process.env.GITHUB_ENV,`CORE_D1_ID=${core.uuid}\nWORKERS_SUBDOMAIN=${workersSubdomain}\n`);
          console.log(JSON.stringify({ok:true,coreDatabase:'civweave-core',workersSubdomainResolved:true}));
          NODE
      - name: Deploy canonical core and node fabric
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-cloudflare-launch-kit-v1.mjs --d1-id="$CORE_D1_ID"
          npx wrangler deploy --config .cloudflare-launch/core.wrangler.jsonc | tee /tmp/core-deploy.log
          npx wrangler deploy --config cloudflare/node-cloud/wrangler.jsonc | tee /tmp/node-cloud-deploy.log
      - name: Deploy and verify account edge
        shell: bash
        run: |
          set -euo pipefail
          node scripts/provision-cloudflare-account-edge-v1.mjs --host-id civweave --strict --output /tmp/account-edge.json
      - name: Deploy recovery relay
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config cloudflare/recovery-relay/wrangler.jsonc | tee /tmp/recovery-relay-deploy.log
      - name: Smoke canonical Worker production endpoints
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const subdomain=process.env.WORKERS_SUBDOMAIN;
          const endpoints={
            core:`https://civweave-core.${subdomain}.workers.dev/api/launch-topology`,
            nodeCloud:`https://civweave-node-cloud.${subdomain}.workers.dev/api/node/health?nodeId=launch-evidence`,
            recoveryRelay:`https://civweave-recovery-relay.${subdomain}.workers.dev/api/health`,
          };
          const account=JSON.parse(readFileSync('/tmp/account-edge.json','utf8'));
          endpoints.accountEdge=`${account.workerOrigin}/api/fabric/capacity`;
          const evidence={schema:'civweave.production-worker-evidence.v1',runtimeBaseSha:process.env.RUNTIME_BASE_SHA,sourceRunSha:process.env.GITHUB_SHA,checkedAt:new Date().toISOString(),workers:{}};
          for(const [id,url] of Object.entries(endpoints)){
            let last;
            for(let attempt=1;attempt<=8;attempt++){
              try{
                const response=await fetch(url,{headers:{'cache-control':'no-cache'}});
                const packet=await response.json().catch(()=>({}));
                if(!response.ok)throw new Error(`HTTP ${response.status}`);
                if(id==='core'&&packet.canonicalInstallOrigin!=='https://civweave.pages.dev')throw new Error('core topology canonical origin mismatch');
                if(id==='nodeCloud'&&packet.ok!==true)throw new Error('node-cloud health is not ok');
                if(id==='recoveryRelay'&&packet.ok!==true)throw new Error('recovery relay health is not ok');
                if(id==='accountEdge'&&!Array.isArray(packet.hostNodeIds))throw new Error('account-edge capacity snapshot missing host nodes');
                evidence.workers[id]={ok:true,url,status:response.status,schema:packet.schema||null};
                last=null;break;
              }catch(error){last=error;if(attempt<8)await new Promise(r=>setTimeout(r,1500));}
            }
            if(last)throw last;
          }
          writeFileSync('/tmp/worker-production-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log(JSON.stringify(evidence,null,2));
          NODE
      - name: Create clean D1 restore target
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {appendFileSync,writeFileSync} from 'node:fs';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const name=`civweave-restore-drill-${Date.now().toString(36)}`;
          const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database`,{method:'POST',headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'content-type':'application/json'},body:JSON.stringify({name})});
          const payload=await response.json().catch(()=>({}));
          if(!response.ok||payload.success!==true||!payload.result?.uuid)throw new Error(`Temporary D1 create failed: HTTP ${response.status} ${JSON.stringify(payload.errors||payload)}`);
          const id=payload.result.uuid;
          appendFileSync(process.env.GITHUB_ENV,`RESTORE_DB_NAME=${name}\nRESTORE_DB_ID=${id}\n`);
          writeFileSync('/tmp/d1-drill.wrangler.jsonc',JSON.stringify({name:'civweave-d1-restore-drill',compatibility_date:'2026-08-13',d1_databases:[{binding:'PROD',database_name:'civweave-core',database_id:process.env.CORE_D1_ID},{binding:'RESTORE',database_name:name,database_id:id}]},null,2));
          console.log(JSON.stringify({ok:true,temporaryDatabaseCreated:true,name}));
          NODE
      - name: Export production D1 and verify offline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/civweave_d1_backup.py backup --database civweave-core --output /tmp/civweave-core.sql --config /tmp/d1-drill.wrangler.jsonc
          python3 scripts/civweave_d1_backup.py verify --input /tmp/civweave-core.sql
      - name: Restore into clean D1 and verify round trip
        shell: bash
        run: |
          set -euo pipefail
          sha="$(node -e "console.log(require('/tmp/civweave-core.sql.manifest.json').sha256)")"
          python3 scripts/civweave_d1_backup.py restore --database "$RESTORE_DB_NAME" --input /tmp/civweave-core.sql --config /tmp/d1-drill.wrangler.jsonc --expected-sha256 "$sha" --confirm-remote-restore
          python3 scripts/civweave_d1_backup.py backup --database "$RESTORE_DB_NAME" --output /tmp/civweave-restored.sql --config /tmp/d1-drill.wrangler.jsonc
          python3 - <<'PY'
          import json,sqlite3,tempfile,pathlib
          def snapshot(sql_path):
              with tempfile.TemporaryDirectory() as tmp:
                  db=pathlib.Path(tmp)/'db.sqlite3'
                  con=sqlite3.connect(db)
                  try:
                      con.executescript(pathlib.Path(sql_path).read_text())
                      tables=[r[0] for r in con.execute("SELECT name FROM sqlite_schema WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name")]
                      return {t:con.execute(f'SELECT COUNT(*) FROM "{t.replace(chr(34),chr(34)*2)}"').fetchone()[0] for t in tables}
                  finally: con.close()
          source=snapshot('/tmp/civweave-core.sql'); restored=snapshot('/tmp/civweave-restored.sql')
          if not source: raise SystemExit('Production backup contained no user tables.')
          if source!=restored: raise SystemExit(f'Clean-target restore row counts differ: source={source} restored={restored}')
          evidence={'schema':'civweave.d1-restore-drill.v1','runtimeBaseSha':'ff66d202b1a59c4865d3d218eb9ffcc5f61f766a','cleanTarget':True,'sourceDatabase':'civweave-core','temporaryTarget':True,'tableRowCounts':source,'tableCount':len(source)}
          pathlib.Path('/tmp/d1-restore-evidence.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence,indent=2))
          PY
      - name: Upload launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-production-evidence-v1
          path: |
            /tmp/worker-production-evidence.json
            /tmp/civweave-core.sql.manifest.json
            /tmp/civweave-restored.sql.manifest.json
            /tmp/d1-restore-evidence.json
            /tmp/account-edge.json
          if-no-files-found: warn
          retention-days: 90
      - name: Delete temporary D1 restore target
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RESTORE_DB_ID:-}" ]; then
            echo 'No temporary D1 database was created.'
            exit 0
          fi
          node --input-type=module <<'NODE'
          const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database/${process.env.RESTORE_DB_ID}`,{method:'DELETE',headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}});
          const payload=await response.json().catch(()=>({}));
          if(!response.ok||payload.success!==true)throw new Error(`Temporary D1 delete failed: HTTP ${response.status} ${JSON.stringify(payload.errors||payload)}`);
          console.log(JSON.stringify({ok:true,temporaryDatabaseDeleted:true}));
          NODE
