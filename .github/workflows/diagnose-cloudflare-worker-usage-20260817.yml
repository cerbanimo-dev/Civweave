name: Diagnose Cloudflare Worker Usage 2026-08-17

on:
  push:
    branches:
      - agent/diagnose-cloudflare-usage-20260817
    paths:
      - .github/workflows/diagnose-cloudflare-worker-usage-20260817.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Query actual Cloudflare request metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Query Workers request totals since UTC reset
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN || '';
          const accountTag = process.env.CLOUDFLARE_ACCOUNT_ID || '';
          if (!token || !accountTag) {
            console.error('CLOUDFLARE_DIAGNOSTIC_ERROR missing Cloudflare deployment credentials');
            process.exit(2);
          }

          const now = new Date();
          const start = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 0, 0, 0, 0));
          const query = `query GetWorkersAnalytics($accountTag: string, $datetimeStart: string, $datetimeEnd: string) {
            viewer {
              accounts(filter: {accountTag: $accountTag}) {
                workersInvocationsAdaptive(limit: 10000, filter: {
                  datetime_geq: $datetimeStart,
                  datetime_leq: $datetimeEnd
                }) {
                  sum { subrequests requests errors }
                  dimensions { scriptName status }
                }
              }
            }
          }`;

          const response = await fetch('https://api.cloudflare.com/client/v4/graphql', {
            method: 'POST',
            headers: {
              authorization: `Bearer ${token}`,
              accept: 'application/json',
              'content-type': 'application/json'
            },
            body: JSON.stringify({
              query,
              variables: {
                accountTag,
                datetimeStart: start.toISOString(),
                datetimeEnd: now.toISOString()
              }
            })
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || payload.errors?.length) {
            console.error('CLOUDFLARE_GRAPHQL_ERROR', JSON.stringify({status: response.status, errors: payload.errors || payload}));
            process.exit(3);
          }
          const rows = payload?.data?.viewer?.accounts?.[0]?.workersInvocationsAdaptive || [];
          const scripts = new Map();
          let accountRequests = 0, accountSubrequests = 0, accountErrors = 0;
          for (const row of rows) {
            const name = String(row?.dimensions?.scriptName || '(unknown)');
            const status = String(row?.dimensions?.status || 'unknown');
            const requests = Number(row?.sum?.requests || 0);
            const subrequests = Number(row?.sum?.subrequests || 0);
            const errors = Number(row?.sum?.errors || 0);
            accountRequests += requests;
            accountSubrequests += subrequests;
            accountErrors += errors;
            const item = scripts.get(name) || {script:name, requests:0, subrequests:0, errors:0, statuses:{}};
            item.requests += requests;
            item.subrequests += subrequests;
            item.errors += errors;
            item.statuses[status] = (item.statuses[status] || 0) + requests;
            scripts.set(name, item);
          }
          const ranked = [...scripts.values()].sort((a,b) => b.requests - a.requests || b.subrequests - a.subrequests);
          console.log('CLOUDFLARE_USAGE_WINDOW', JSON.stringify({from:start.toISOString(), to:now.toISOString(), returnedRows:rows.length}));
          console.log('CLOUDFLARE_ACCOUNT_TOTALS', JSON.stringify({requests:accountRequests, subrequests:accountSubrequests, errors:accountErrors}));
          console.log('CLOUDFLARE_USAGE_BY_SCRIPT');
          for (const item of ranked) console.log(JSON.stringify(item));
          NODE
