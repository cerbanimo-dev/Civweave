name: Diagnose Cloudflare Worker Usage 2026-08-17

on:
  push:
    branches:
      - agent/diagnose-cloudflare-usage-20260817
    paths:
      - .github/workflows/diagnose-cloudflare-worker-usage-20260817.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Query actual Cloudflare Pages metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Resolve Pages projects and analytics dimensions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN||'';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID||'';
          const headers={authorization:`Bearer ${token}`,accept:'application/json','content-type':'application/json'};
          const projectsResponse=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects`,{headers});
          const projectsPayload=await projectsResponse.json().catch(()=>({}));
          console.log('PAGES_PROJECTS_STATUS',projectsResponse.status);
          if(!projectsResponse.ok) console.log('PAGES_PROJECTS_ERROR',JSON.stringify(projectsPayload));
          for(const p of projectsPayload?.result||[]){
            console.log('PAGES_PROJECT',JSON.stringify({name:p.name,subdomain:p.subdomain,domains:p.domains||[],productionBranch:p.production_branch,usesFunctions:p.canonical_deployment?.uses_functions??p.latest_production_deployment?.uses_functions??null,canonical:p.canonical_deployment?{id:p.canonical_deployment.id,url:p.canonical_deployment.url,createdOn:p.canonical_deployment.created_on,usesFunctions:p.canonical_deployment.uses_functions}:null,latestProduction:p.latest_production_deployment?{id:p.latest_production_deployment.id,url:p.latest_production_deployment.url,createdOn:p.latest_production_deployment.created_on,usesFunctions:p.latest_production_deployment.uses_functions}:null}));
          }
          async function gql(query,variables={}){const r=await fetch('https://api.cloudflare.com/client/v4/graphql',{method:'POST',headers,body:JSON.stringify({query,variables})});return{status:r.status,payload:await r.json().catch(()=>({}))};}
          const accountType=await gql(`query { __type(name: "Account") { fields { name type { kind name ofType { kind name ofType { kind name } } } } } } }`);
          console.log('INTROSPECTION_ACCOUNT_STATUS',accountType.status);
          if(accountType.payload?.errors) console.log('INTROSPECTION_ACCOUNT_ERROR',JSON.stringify(accountType.payload.errors));
          const fields=accountType.payload?.data?.__type?.fields||[];
          const target=fields.find(f=>f.name==='pagesFunctionsInvocationsAdaptiveGroups');
          console.log('PAGES_ANALYTICS_FIELD_TYPE',JSON.stringify(target||null));
          function unwrap(t){while(t?.ofType)t=t.ofType;return t?.name||''}
          const groupType=unwrap(target?.type);
          if(groupType){
            const group=await gql(`query($name:String!){__type(name:$name){name fields{name type{kind name ofType{kind name ofType{kind name}}}}}}`,{name:groupType});
            console.log('PAGES_GROUP_TYPE',JSON.stringify(group.payload?.data?.__type||group.payload?.errors||null));
            const dimField=group.payload?.data?.__type?.fields?.find(f=>f.name==='dimensions');
            const dimType=unwrap(dimField?.type);
            if(dimType){const dims=await gql(`query($name:String!){__type(name:$name){name fields{name type{kind name ofType{kind name}}}}}`,{name:dimType});console.log('PAGES_DIMENSION_FIELDS',JSON.stringify(dims.payload?.data?.__type||dims.payload?.errors||null));}
          }
          NODE
