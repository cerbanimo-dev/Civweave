name: Diagnose Cloudflare Worker Usage 2026-08-17

on:
  push:
    branches:
      - agent/diagnose-cloudflare-usage-20260817
    paths:
      - .github/workflows/diagnose-cloudflare-worker-usage-20260817.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Attribute actual Pages traffic by project
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Filter Pages metrics by production script name
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN||'';
          const accountTag=process.env.CLOUDFLARE_ACCOUNT_ID||'';
          const headers={authorization:`Bearer ${token}`,accept:'application/json','content-type':'application/json'};
          const list=await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountTag}/pages/projects`,{headers});
          const packet=await list.json().catch(()=>({}));
          if(!list.ok){console.error('PROJECTS_ERROR',JSON.stringify(packet));process.exit(2)}
          const projects=(packet.result||[]).map(p=>({name:p.name,productionScriptName:p.production_script_name,previewScriptName:p.preview_script_name}));
          console.log('PAGES_SCRIPT_NAMES',JSON.stringify(projects));
          const start='2026-08-16T00:00:00.000Z',end='2026-08-17T07:00:00.000Z';
          async function query(scriptName){
            const q=`query Usage($accountTag:string,$datetimeStart:string,$datetimeEnd:string,$scriptName:string){viewer{accounts(filter:{accountTag:$accountTag}){pagesFunctionsInvocationsAdaptiveGroups(limit:10000,filter:{datetime_geq:$datetimeStart,datetime_lt:$datetimeEnd,scriptName:$scriptName}){sum{requests subrequests errors}dimensions{datetimeHour status scriptName}}}}}`;
            const r=await fetch('https://api.cloudflare.com/client/v4/graphql',{method:'POST',headers,body:JSON.stringify({query:q,variables:{accountTag,datetimeStart:start,datetimeEnd:end,scriptName}})});
            const p=await r.json().catch(()=>({}));return{status:r.status,p};
          }
          for(const project of projects){
            for(const [kind,script] of [['production',project.productionScriptName],['preview',project.previewScriptName]]){
              if(!script)continue;
              const {status,p}=await query(script);
              if(p.errors?.length){console.log('PROJECT_FILTER_ERROR',JSON.stringify({project:project.name,kind,script,status,errors:p.errors}));continue}
              const rows=p?.data?.viewer?.accounts?.[0]?.pagesFunctionsInvocationsAdaptiveGroups||[];let requests=0,subrequests=0,errors=0;const hours=[];
              for(const row of rows){const req=Number(row?.sum?.requests||0),sub=Number(row?.sum?.subrequests||0),err=Number(row?.sum?.errors||0);requests+=req;subrequests+=sub;errors+=err;hours.push({hour:row?.dimensions?.datetimeHour,status:row?.dimensions?.status,requests:req,subrequests:sub,errors:err,scriptName:row?.dimensions?.scriptName||null})}
              console.log('PROJECT_USAGE',JSON.stringify({project:project.name,kind,script,requests,subrequests,errors,hours:hours.sort((a,b)=>String(a.hour).localeCompare(String(b.hour)))}));
            }
          }
          NODE
