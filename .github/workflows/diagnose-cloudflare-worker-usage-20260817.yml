name: Diagnose Cloudflare Worker Usage 2026-08-17

on:
  push:
    branches:
      - agent/diagnose-cloudflare-usage-20260817
    paths:
      - .github/workflows/diagnose-cloudflare-worker-usage-20260817.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Discover Cloudflare Pages analytics schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Discover Pages filters and dimensions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN||'';
          const accountTag=process.env.CLOUDFLARE_ACCOUNT_ID||'';
          const headers={authorization:`Bearer ${token}`,accept:'application/json','content-type':'application/json'};
          async function gql(query,variables={}){const r=await fetch('https://api.cloudflare.com/client/v4/graphql',{method:'POST',headers,body:JSON.stringify({query,variables})});return{status:r.status,payload:await r.json().catch(()=>({}))};}
          async function introspect(name){const r=await gql(`query($name:String!){__type(name:$name){name inputFields{name type{kind name ofType{kind name}}} fields{name type{kind name ofType{kind name}}}}}`,{name});return r.payload?.data?.__type||r.payload?.errors||null;}
          const badFilter=await gql(`query($accountTag:string!){viewer{accounts(filter:{accountTag:$accountTag}){pagesFunctionsInvocationsAdaptiveGroups(limit:1,filter:{foo:"x"}){sum{requests}}}}}`,{accountTag});
          console.log('BAD_FILTER',JSON.stringify(badFilter.payload?.errors||badFilter.payload));
          const filterText=JSON.stringify(badFilter.payload?.errors||[]);
          const filterType=(filterText.match(/type ['"]?([A-Za-z0-9_]+)['"]?/)||[])[1]||'';
          console.log('FILTER_TYPE',filterType);
          if(filterType) console.log('FILTER_FIELDS',JSON.stringify(await introspect(filterType)));

          const badDimension=await gql(`query($accountTag:string!){viewer{accounts(filter:{accountTag:$accountTag}){pagesFunctionsInvocationsAdaptiveGroups(limit:1){sum{requests}dimensions{foo}}}}}`,{accountTag});
          console.log('BAD_DIMENSION',JSON.stringify(badDimension.payload?.errors||badDimension.payload));
          const dimText=JSON.stringify(badDimension.payload?.errors||[]);
          const dimType=(dimText.match(/type ['"]?([A-Za-z0-9_]+)['"]?/)||[])[1]||'';
          console.log('DIMENSION_TYPE',dimType);
          if(dimType) console.log('DIMENSION_FIELDS',JSON.stringify(await introspect(dimType)));
          NODE
