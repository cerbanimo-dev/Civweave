name: Diagnose Cloudflare Worker Usage 2026-08-17

on:
  push:
    branches:
      - agent/diagnose-cloudflare-usage-20260817
    paths:
      - .github/workflows/diagnose-cloudflare-worker-usage-20260817.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Trace periodic Pages API callers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Find periodic API callers and recursive proxies
        shell: bash
        run: |
          set -euo pipefail
          echo '=== TIMER FILES ==='
          grep -RIlE 'setInterval|setTimeout|requestAnimationFrame' public functions scripts 2>/dev/null | sort | head -n 400 || true
          echo '=== TIMER + API FILES ==='
          while IFS= read -r f; do
            if grep -Eq 'fetch\(|/api/' "$f"; then
              echo "--- $f"
              grep -nE 'setInterval|setTimeout|fetch\(|/api/' "$f" | head -n 240 || true
            fi
          done < <(grep -RIlE 'setInterval|setTimeout' public functions scripts 2>/dev/null | sort)
          echo '=== PAGES FUNCTION FETCH TARGETS ==='
          grep -RInE 'fetch\(|request\.url|new URL\(|\.origin|pages\.dev|civweave\.cc|cerbanimo\.cc' functions 2>/dev/null | head -n 1600 || true
