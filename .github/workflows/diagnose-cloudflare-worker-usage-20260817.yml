name: Diagnose Cloudflare Worker Usage 2026-08-17

on:
  push:
    branches:
      - agent/diagnose-cloudflare-usage-20260817
    paths:
      - .github/workflows/diagnose-cloudflare-worker-usage-20260817.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Trace periodic Pages API callers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Find periodic API callers and recursive proxies
        shell: bash
        run: |
          set -euo pipefail
          echo '=== TIMER FILES ==='
          rg -n -l 'setInterval|setTimeout|requestAnimationFrame' public functions scripts 2>/dev/null | sort | head -n 400 || true
          echo '=== TIMER + API CONTEXT ==='
          for f in $(rg -l 'setInterval|setTimeout' public functions scripts 2>/dev/null | sort); do
            if rg -q 'fetch\(|/api/' "$f"; then
              echo "--- $f"
              rg -n -C 4 'setInterval|setTimeout|fetch\(|/api/' "$f" | head -n 240 || true
            fi
          done
          echo '=== PAGES FUNCTION FETCH TARGETS ==='
          rg -n -C 3 'fetch\(|request\.url|new URL\(|\.origin|pages\.dev|civweave\.cc|cerbanimo\.cc' functions | head -n 1600 || true
