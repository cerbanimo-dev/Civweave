name: Diagnose Cloudflare Worker Usage 2026-08-17

on:
  push:
    branches:
      - agent/diagnose-cloudflare-usage-20260817
    paths:
      - .github/workflows/diagnose-cloudflare-worker-usage-20260817.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Inspect actual Cloudflare Pages audit history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read Pages project metadata and audit changes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN||'';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID||'';
          const headers={authorization:`Bearer ${token}`,accept:'application/json'};
          const projectsResponse=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects`,{headers});
          const projects=await projectsResponse.json().catch(()=>({}));
          console.log('CURRENT_PROJECTS');
          for(const p of projects.result||[])console.log(JSON.stringify({name:p.name,id:p.id,createdOn:p.created_on,productionScriptName:p.production_script_name,previewScriptName:p.preview_script_name,productionBranch:p.production_branch,latestDeployment:p.latest_deployment?{id:p.latest_deployment.id,createdOn:p.latest_deployment.created_on,environment:p.latest_deployment.environment,url:p.latest_deployment.url}:null,canonicalDeployment:p.canonical_deployment?{id:p.canonical_deployment.id,createdOn:p.canonical_deployment.created_on,url:p.canonical_deployment.url}:null}));

          const auditUrl=new URL(`https://api.cloudflare.com/client/v4/accounts/${account}/logs/audit`);
          auditUrl.searchParams.set('since','2026-08-15T00:00:00Z');
          auditUrl.searchParams.set('before','2026-08-17T14:15:00Z');
          auditUrl.searchParams.set('limit','1000');
          const ar=await fetch(auditUrl,{headers});
          const ap=await ar.json().catch(()=>({}));
          console.log('AUDIT_STATUS',ar.status);
          if(!ar.ok){console.log('AUDIT_ERROR',JSON.stringify(ap));process.exit(0)}
          const rows=Array.isArray(ap.result)?ap.result:[];
          console.log('AUDIT_TOTAL',rows.length);
          for(const row of rows){
            const text=JSON.stringify(row).toLowerCase();
            if(/pages|workers|script|deployment|function/.test(text))console.log('AUDIT_ROW',JSON.stringify(row));
          }
          NODE
