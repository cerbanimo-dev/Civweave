name: Diagnose Cloudflare Worker Usage 2026-08-17

on:
  push:
    branches:
      - agent/diagnose-cloudflare-usage-20260817
    paths:
      - .github/workflows/diagnose-cloudflare-worker-usage-20260817.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Test Cloudflare Pages attribution fields
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Test Pages project/deployment fields
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN||'';
          const accountTag=process.env.CLOUDFLARE_ACCOUNT_ID||'';
          const headers={authorization:`Bearer ${token}`,accept:'application/json','content-type':'application/json'};
          async function gql(label,query,variables={accountTag}){const r=await fetch('https://api.cloudflare.com/client/v4/graphql',{method:'POST',headers,body:JSON.stringify({query,variables})});const p=await r.json().catch(()=>({}));console.log(label,JSON.stringify(p.errors||p.data||p));}
          const dims=['projectName','deploymentId','environment','scriptVersion','hostname','requestPath','clientRequestPath'];
          for(const field of dims){await gql(`DIM_${field}`,`query($accountTag:string!){viewer{accounts(filter:{accountTag:$accountTag}){pagesFunctionsInvocationsAdaptiveGroups(limit:1,filter:{}){sum{requests}dimensions{${field}}}}}}`);}
          const filters=['projectName','deploymentId','environment','scriptVersion'];
          for(const field of filters){await gql(`FILTER_${field}`,`query($accountTag:string!){viewer{accounts(filter:{accountTag:$accountTag}){pagesFunctionsInvocationsAdaptiveGroups(limit:1,filter:{${field}:"civweave"}){sum{requests}dimensions{datetimeHour}}}}}`);}
          NODE
