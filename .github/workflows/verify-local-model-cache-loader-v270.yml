name: Verify local model cache loader v270

on:
  pull_request:
    paths:
      - 'public/app/local-ai/worker-v266.js'
      - 'public/app/local-ai/runtime-v266.js'
      - 'public/app/local-ai/bootstrap-v266.js'
      - 'public/app/local-ai/runtime-bridge-v266.js'
      - 'public/app/fast-interactive-runtime-v192.js'
      - 'public/app/assistant-runtime-v141.js'
      - 'scripts/verify-local-model-cache-loader-v270.mjs'
      - '.github/workflows/verify-local-model-cache-loader-v270.yml'
  push:
    branches:
      - main
    paths:
      - 'public/app/local-ai/worker-v266.js'
      - 'public/app/local-ai/runtime-v266.js'
      - 'public/app/local-ai/bootstrap-v266.js'
      - 'public/app/local-ai/runtime-bridge-v266.js'
      - 'public/app/fast-interactive-runtime-v192.js'
      - 'public/app/assistant-runtime-v141.js'
      - 'scripts/verify-local-model-cache-loader-v270.mjs'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-local-model-cache-loader-v270.mjs
      - run: node scripts/verify-local-model-download-v267.mjs
