name: Verify Civweave Map v1 package

on:
  pull_request:
    paths:
      - 'public/app/civweave-map-*.js'
      - 'public/app/civweave-map-v1-manifest.json'
      - 'public/app/shared/civweave-map-*.mjs'
      - 'public/app/federation-finder-map-v275.html'
      - 'public/app/offline-package-v208.json'
      - 'public/service-worker.js'
      - 'public/finder/index.html'
      - 'scripts/stage-maplibre-v275.mjs'
      - 'scripts/stage-federation-finder-data-v274.mjs'
      - 'scripts/build-civweave-map-v1.mjs'
      - 'scripts/build-cloudflare-pages.mjs'
      - 'scripts/build-install-artifacts.sh'
      - 'scripts/build-mobile-install-kit.mjs'
      - 'scripts/test-civweave-map-v1.mjs'
      - '.github/workflows/verify-civweave-map-v1.yml'
  push:
    branches:
      - 'agent/civweave-map-v1-launch'

concurrency:
  group: civweave-map-v1-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify launch contract
        run: node --test scripts/test-civweave-map-v1.mjs
      - name: Stage deterministic map runtimes
        run: node scripts/stage-maplibre-v275.mjs
      - name: Stage pinned federation atlas
        run: node scripts/stage-federation-finder-data-v274.mjs
      - name: Build Civweave Map v1
        run: node scripts/build-civweave-map-v1.mjs
      - name: Verify package output
        run: |
          test -s public/downloads/Civweave-Map-v1.zip
          test -s public/downloads/Civweave-Map-v1.zip.sha256
          (cd public/downloads && sha256sum -c Civweave-Map-v1.zip.sha256)
          bytes=$(stat -c %s public/downloads/Civweave-Map-v1.zip)
          test "$bytes" -lt 25165824
          echo "Civweave Map v1 package: $bytes bytes"
      - name: Upload Civweave Map v1
        uses: actions/upload-artifact@v4
        with:
          name: Civweave-Map-v1
          path: |
            public/downloads/Civweave-Map-v1.zip
            public/downloads/Civweave-Map-v1.zip.sha256
          retention-days: 30
