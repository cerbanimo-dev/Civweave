name: Materialize ESCO crosswalk release

on:
  push:
    branches:
      - agent/esco-skill-crosswalk-v1-sync

permissions:
  contents: write

jobs:
  materialize:
    if: contains(github.event.head_commit.message, 'Prepare canonical ESCO crosswalk release')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Align package version
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version=fs.readFileSync('VERSION','utf8').trim();
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.version=version;
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          NODE
      - name: Build official-source ESCO bridge
        run: node scripts/build-esco-crosswalk-v1.mjs
      - name: Verify ESCO bridge before release snapshot
        run: node scripts/verify-esco-crosswalk-v1.mjs
      - name: Materialize canonical release
        run: node scripts/materialize-canonical-release.mjs
      - name: Point canonical index at materialized release
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version=fs.readFileSync('VERSION','utf8').trim();
          const file='config/release-contract.json';
          const contract=JSON.parse(fs.readFileSync(file,'utf8'));
          contract.canonical.current={version,path:`releases/${version}`,status:'current'};
          fs.writeFileSync(file,JSON.stringify(contract,null,2)+'\n');
          NODE
      - name: Verify canonical release
        run: |
          node scripts/verify-release-contract.mjs
          node scripts/verify-canonical-launch-release.mjs
          node scripts/verify-esco-crosswalk-v1.mjs
      - name: Commit generated release assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'civweave-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Canonical ESCO release already materialized.'
            exit 0
          fi
          git commit -m 'Materialize Civweave ESCO crosswalk release'
          git push origin HEAD:${GITHUB_REF_NAME}
