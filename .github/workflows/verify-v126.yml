name: Verify Commonweave v1.0.4 Direct Startup

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-first:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install local semantic package
        run: |
          npm install --no-audit --no-fund
          for attempt in 1 2 3 4 5; do
            if npm run model:pull; then break; fi
            if [ "$attempt" = 5 ]; then
              echo 'MiniLM package could not be materialized after five attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 8))
          done
          npm run model:check
      - name: Run local-first regression suite
        run: npm run check
      - name: Simulate clean Render package preparation
        run: |
          set -euxo pipefail
          rm -rf public/app/vendor/transformers
          rm -f \
            public/app/models/all-minilm-l6-v2/config.json \
            public/app/models/all-minilm-l6-v2/special_tokens_map.json \
            public/app/models/all-minilm-l6-v2/tokenizer.json \
            public/app/models/all-minilm-l6-v2/tokenizer_config.json \
            public/app/models/all-minilm-l6-v2/vocab.txt \
            public/app/models/all-minilm-l6-v2/onnx/model_q4f16.onnx \
            public/app/models/all-minilm-l6-v2/onnx/model_quantized.onnx
          RENDER=true node scripts/prepare-start-v131.mjs | tee render-package-prepare.log
          grep -q 'Public gateway mode: preparing the complete device package' render-package-prepare.log
          grep -q 'MiniLM semantic package is ready' render-package-prepare.log
          test -s public/app/vendor/transformers/transformers.min.js
          test -s public/app/models/all-minilm-l6-v2/onnx/model_q4f16.onnx
      - name: Start public install gateway
        run: |
          RENDER=true PORT=8787 npm start > commonweave-gateway.log 2>&1 &
          echo $! > commonweave-gateway.pid
      - name: Verify direct marked package distribution
        run: |
          set -euxo pipefail
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/health > gateway-health.json; then break; fi
            sleep 1
          done
          grep -q '1.0.4-install-only-fullscreen-family-gateway' gateway-health.json
          grep -q '"appVersion":"1.0.4"' gateway-health.json
          grep -q '"localInstallRequired":true' gateway-health.json
          curl -fsS http://127.0.0.1:8787/ -o gateway.html
          grep -q 'Install the five-system Commonweave family.' gateway.html
          grep -q 'LEAN OFFLINE SOFTWARE PACKAGE' gateway.html
          ! grep -q 'Open local campus' gateway.html
          curl -fsS http://127.0.0.1:8787/install-v130.js -o gateway-installer.js
          grep -q "WORKER_REVISION='device-package-r35-direct'" gateway-installer.js
          grep -q 'Reset and retry package' gateway-installer.js
          curl -fsS http://127.0.0.1:8787/service-worker.js -o gateway-worker.js
          grep -q "CACHE_REVISION='direct-family-r35'" gateway-worker.js
          grep -q "DEVICE_REVISION='device-package-r35-direct'" gateway-worker.js
          grep -q "INSTALL_REVISION='direct-entry-r35'" gateway-worker.js
          grep -q '/app/family-ai-loader-v105.js' gateway-worker.js
          grep -q "pathname.includes('anarchadia')&&!text.includes('/app/anarchadia-local-sovereignty-v146.js')" gateway-worker.js
          curl -fsS http://127.0.0.1:8787/app/manifest.webmanifest -o gateway-manifest.json
          grep -q '/app/installed-entry-v146.html?system=commonweave' gateway-manifest.json
          for route in /loom/ /lite/ /app/realm-console-v140.html /app/fullscreen-family-v104.html; do
            code="$(curl -sS -o gateway-blocked.json -w '%{http_code}' "http://127.0.0.1:8787${route}")"
            test "$code" = '410'
            grep -q 'Installed runtime required' gateway-blocked.json
          done
          H='x-commonweave-package: install'
          curl -fsS -H "$H" http://127.0.0.1:8787/app/fullscreen-family-v104.html -o gateway-compat.html
          grep -q 'location.replace' gateway-compat.html
          ! grep -q '<iframe' gateway-compat.html
          curl -fsS -H "$H" http://127.0.0.1:8787/app/family-shell-v104.js -o gateway-family-shell.js
          grep -q "document.documentElement.dataset.familyShell='direct'" gateway-family-shell.js
          grep -q 'commonweave.family-status.v105' gateway-family-shell.js
          grep -q 'timestamp(item)>last' gateway-family-shell.js
          ! grep -q 'MutationObserver' gateway-family-shell.js
          curl -fsS -H "$H" http://127.0.0.1:8787/app/family-ai-loader-v105.js -o gateway-ai-loader.js
          grep -q 'async function ensure()' gateway-ai-loader.js
          grep -q 'CommonweaveGuideChatV153' gateway-ai-loader.js
          grep -q 'CommonweaveModelSettingsV133' gateway-ai-loader.js
          for route in \
            '/app/realm-console-v140.html?system=commonweave' \
            '/app/cabinets/living-school/index.html' \
            '/app/fellowfare-cabinet-v144.html' \
            '/app/anarchadia-console-v139.html'; do
            curl -fsS -H "$H" "http://127.0.0.1:8787${route}" -o gateway-direct-page.html
            grep -q '/app/family-ai-loader-v105.js' gateway-direct-page.html
            grep -q '/app/family-shell-v104.js' gateway-direct-page.html
            ! grep -q '/app/guide-chat-v153.js' gateway-direct-page.html
          done
          curl -fsS -D gateway-ledger-headers.txt -H "$H" http://127.0.0.1:8787/app/shared/commonweave-parity-ledger.json -o gateway-ledger.json
          grep -qi '^x-commonweave-device-package: parity-ledger' gateway-ledger-headers.txt
          grep -qi '^x-commonweave-software-family: 1.0.4' gateway-ledger-headers.txt
          ! grep -qi '^x-commonweave-cabinet-shells:' gateway-ledger-headers.txt
          curl -fsS -H "$H" http://127.0.0.1:8787/app/models/all-minilm-l6-v2/model-manifest.json -o gateway-model.json
          grep -q 'Xenova/all-MiniLM-L6-v2' gateway-model.json
          curl -fsS -H "$H" http://127.0.0.1:8787/app/models/all-minilm-l6-v2/onnx/model_q4f16.onnx -o gateway-model.onnx
          test -s gateway-model.onnx
      - name: Start local software family
        run: |
          PORT=8788 npm start > commonweave-local.log 2>&1 &
          echo $! > commonweave-local.pid
      - name: Verify direct offline software family
        run: |
          set -euxo pipefail
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8788/api/health > local-health.json; then break; fi
            sleep 1
          done
          grep -q '1.0.4-fullscreen-family-local-runtime' local-health.json
          grep -q '"appVersion":"1.0.4"' local-health.json
          curl -fsS http://127.0.0.1:8788/app/installed-entry-v146.js -o installed-entry.js
          grep -q "const sites={commonweave:'/app/realm-console-v140.html" installed-entry.js
          grep -q "fellowfare:'/app/fellowfare-cabinet-v144.html" installed-entry.js
          ! grep -q "DEFAULT_DESTINATION='/app/fullscreen-family-v104.html" installed-entry.js
          curl -fsS http://127.0.0.1:8788/app/fullscreen-family-v104.html -o compatibility.html
          grep -q 'location.replace' compatibility.html
          ! grep -q '<iframe' compatibility.html
          curl -fsS http://127.0.0.1:8788/app/family-shell-v104.js -o family-shell.js
          grep -q "document.documentElement.dataset.familyShell='direct'" family-shell.js
          grep -q 'badge.hidden=value.count<1' family-shell.js
          grep -q 'setInterval(refresh,30000)' family-shell.js
          ! grep -q 'contentDocument' family-shell.js
          curl -fsS http://127.0.0.1:8788/app/family-ai-loader-v105.js -o family-ai-loader.js
          node --check family-ai-loader.js
          grep -q '/app/assistant-runtime-v141.js' family-ai-loader.js
          for spec in \
            'commonweave:/app/realm-console-v140.html?system=commonweave' \
            'living-school:/app/cabinets/living-school/index.html' \
            'cerbanimo:/app/realm-console-v140.html?system=cerbanimo' \
            'fellowfare:/app/fellowfare-cabinet-v144.html' \
            'anarchadia:/app/anarchadia-console-v139.html'; do
            name="${spec%%:*}"; route="${spec#*:}"
            curl -fsS "http://127.0.0.1:8788${route}" -o "${name}.html"
            grep -q '/app/family-shell-v104.js' "${name}.html"
            grep -q '/app/family-ai-loader-v105.js' "${name}.html"
            ! grep -q '/app/guide-chat-v153.js' "${name}.html"
          done
          curl -fsS http://127.0.0.1:8788/app/local-object-mesh-v146.js -o local-object-mesh.js
          grep -q 'indexedDB.open' local-object-mesh.js
          grep -q 'RTCPeerConnection' local-object-mesh.js
          curl -fsS http://127.0.0.1:8788/app/cabinet-mode-v142.html -o marketing-cabinet.html
          grep -q 'cv141-art' marketing-cabinet.html
          curl -fsS http://127.0.0.1:8788/service-worker.js -o local-worker.js
          grep -q '/app/services/living-school/modules/rubric-engine.mjs' local-worker.js
          grep -q '/app/services/living-school/modules/project-gate.mjs' local-worker.js
          grep -q '/app/services/living-school/modules/cerbanimo-bridge.mjs' local-worker.js
          for retired in '/app/assets/cabinets/commonweave.webp' '/app/assets/world/town-square-home.webp' '/app/cabinet-calibrator-v144.html' '/app/shared/cabinet-shells-v129.json'; do
            ! grep -q "$retired" local-worker.js
          done
      - name: Upload direct-startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commonweave-v104-direct-startup-evidence
          path: |
            commonweave-gateway.log
            commonweave-local.log
            render-package-prepare.log
            gateway-health.json
            gateway-worker.js
            gateway-family-shell.js
            gateway-ai-loader.js
            gateway-ledger-headers.txt
            local-health.json
            installed-entry.js
            compatibility.html
            family-shell.js
            family-ai-loader.js
