name: Verify Commonweave v1.0.4 Deterministic Startup

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-first:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Verify deterministic AI boundary
        run: node scripts/verify-deterministic-ai-v175.mjs
      - name: Run repository checks
        run: npm run check
      - name: Verify instant deterministic preparation
        run: |
          set -euxo pipefail
          start_ms="$(date +%s%3N)"
          RENDER=true node scripts/prepare-start-v131.mjs | tee render-package-prepare.log
          elapsed_ms=$(( $(date +%s%3N) - start_ms ))
          grep -q 'Public gateway mode: Gateway fast start' render-package-prepare.log
          grep -q 'Deterministic local mode is the default AI route' render-package-prepare.log
          grep -q 'laboratory files are dormant' render-package-prepare.log
          test "$elapsed_ms" -lt 5000
          printf '{"renderPrepareMs":%s}\n' "$elapsed_ms" > startup-budget.json
      - name: Start public install gateway
        run: |
          RENDER=true PORT=8787 npm start > commonweave-gateway.log 2>&1 &
          echo $! > commonweave-gateway.pid
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:8787/api/health > gateway-health.json; then break; fi
            sleep 0.05
          done
          test -s gateway-health.json
      - name: Verify deterministic package distribution
        run: |
          set -euxo pipefail
          curl -fsS http://127.0.0.1:8787/ -o gateway.html
          grep -q 'DETERMINISTIC OFFLINE SOFTWARE PACKAGE' gateway.html
          grep -q 'No language model is downloaded' gateway.html
          curl -fsS http://127.0.0.1:8787/install-v130.js -o gateway-installer.js
          grep -q "WORKER_REVISION='device-package-r38-no-transformer'" gateway-installer.js
          grep -q 'deterministic · no model loaded' gateway-installer.js
          curl -fsS http://127.0.0.1:8787/service-worker.js -o gateway-worker.js
          grep -q "CACHE_REVISION='direct-family-r38-deterministic'" gateway-worker.js
          grep -q "DEVICE_REVISION='device-package-r38-no-transformer'" gateway-worker.js
          grep -q "AI_REVISION='deterministic-single-authority-v175'" gateway-worker.js
          grep -q '/app/unified-ai-settings-v175.js' gateway-worker.js
          curl -fsS http://127.0.0.1:8787/service-worker-v156.js -o gateway-additive-worker.js
          grep -q 'working-campus-additions-v175-deterministic-single-ai-settings' gateway-additive-worker.js
          curl -fsS -H 'x-commonweave-package: install' http://127.0.0.1:8787/app/model-settings-controller-v173.js -o gateway-settings-controller.js
          grep -q 'deterministic-single-authority-controller' gateway-settings-controller.js
          grep -q '/app/unified-ai-settings-v175.js' gateway-settings-controller.js
          curl -fsS -H 'x-commonweave-package: install' http://127.0.0.1:8787/app/unified-ai-settings-v175.js -o gateway-ai-settings.js
          grep -q 'Gemini API key' gateway-ai-settings.js
          grep -q 'Deterministic local mode' gateway-ai-settings.js
          curl -fsS -H 'x-commonweave-package: install' http://127.0.0.1:8787/app/family-ai-loader-v105.js -o gateway-ai-loader.js
          grep -q '/app/deterministic-mode-v175.js' gateway-ai-loader.js
          grep -q "defaultProvider:'deterministic'" gateway-ai-loader.js
          curl -fsS -H 'x-commonweave-package: install' http://127.0.0.1:8787/extensions/commonweave-additions-v156.js -o gateway-shared-tools.js
          grep -q 'Node & friends' gateway-shared-tools.js
          grep -q 'aiVault:false' gateway-shared-tools.js
      - name: Start local software family
        run: |
          PORT=8788 npm start > commonweave-local.log 2>&1 &
          echo $! > commonweave-local.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8788/api/health > local-health.json; then break; fi
            sleep 1
          done
          test -s local-health.json
      - name: Verify direct offline software family
        run: |
          set -euxo pipefail
          for spec in \
            'commonweave:/app/realm-console-v140.html?system=commonweave' \
            'living-school:/app/cabinets/living-school/index.html' \
            'cerbanimo:/app/realm-console-v140.html?system=cerbanimo' \
            'fellowfare:/app/fellowfare-cabinet-v144.html' \
            'anarchadia:/app/anarchadia-console-v139.html'; do
            name="${spec%%:*}"; route="${spec#*:}"
            curl -fsS "http://127.0.0.1:8788${route}" -o "${name}.html"
            grep -q '<script src="/app/model-settings-controller-v173.js' "${name}.html"
            grep -q '<script src="/app/family-ai-loader-v105.js' "${name}.html"
            grep -q '<script src="/app/family-shell-v104.js' "${name}.html"
          done
          curl -fsS http://127.0.0.1:8788/app/pwa-v130.js -o local-pwa.js
          grep -q 'device-package-r38-no-transformer' local-pwa.js
      - name: Upload deterministic-startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commonweave-v104-deterministic-startup-evidence
          path: |
            commonweave-gateway.log
            commonweave-local.log
            render-package-prepare.log
            startup-budget.json
            gateway-health.json
            local-health.json
            gateway.html
            gateway-installer.js
            gateway-worker.js
            gateway-additive-worker.js
            gateway-settings-controller.js
            gateway-ai-settings.js
            gateway-ai-loader.js
            gateway-shared-tools.js
