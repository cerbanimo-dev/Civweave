name: Verify Commonweave v1.0.30

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and stage local model runtime
        run: |
          npm install --no-audit --no-fund
          test -s public/app/vendor/transformers/transformers.min.js
          test -s public/app/vendor/transformers/stage-manifest.json
          test -s public/app/vendor/transformers/wasm/ort-wasm-simd-threaded.jsep.mjs
          test -s public/app/vendor/transformers/wasm/ort-wasm-simd-threaded.jsep.wasm
          grep -q 'ort-wasm-simd-threaded.jsep.mjs' public/app/vendor/transformers/stage-manifest.json
          grep -q 'ort-wasm-simd-threaded.jsep.wasm' public/app/vendor/transformers/stage-manifest.json
      - name: Run offline-first checks
        run: npm run check
      - name: Start Commonweave host
        run: |
          PORT=8787 npm start > commonweave-server.log 2>&1 &
          echo $! > commonweave-server.pid
      - name: Inspect installer, app, worker, model contract, backend, and seed routes
        run: |
          set -euxo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health > health.json; then break; fi
            sleep 1
          done
          grep -q '1.0.30-offline-mesh-cabinet-runtime' health.json
          grep -q '"appVersion":"1.0.30"' health.json
          curl -fsS http://127.0.0.1:8787/ -o installer.html
          grep -q 'Install Commonweave' installer.html
          grep -q 'install-v130.js' installer.html
          curl -fsS -D worker-headers.txt http://127.0.0.1:8787/service-worker.js -o service-worker.js
          grep -qi 'service-worker-allowed: /' worker-headers.txt
          grep -q 'commonweave-static-' service-worker.js
          grep -q 'commonweave-runtime-' service-worker.js
          grep -q "const VERSION='1.0.30'" service-worker.js
          grep -q "CACHE_REVISION='smollm2-onnx-r8'" service-worker.js
          curl -fsS http://127.0.0.1:8787/loom/ -o loom.html
          grep -q 'smollm2-fallback-runtime-v134.js' loom.html
          grep -q 'weaveling-hologram-v133.css?v=heart-r7' loom.html
          grep -q 'v130-cabinet-launcher.js' loom.html
          grep -q 'pwa-v130.js' loom.html
          curl -fsS http://127.0.0.1:8787/lite/ -o lite.html
          grep -q 'smollm2-fallback-runtime-v134.js' lite.html
          grep -q 'lite-v129-app.js' lite.html
          curl -fsS http://127.0.0.1:8787/app/models/smollm2-360m-instruct/model-manifest.json -o smollm2-manifest.json
          grep -q 'HuggingFaceTB/SmolLM2-360M-Instruct' smollm2-manifest.json
          curl -fsS http://127.0.0.1:8787/app/vendor/transformers/stage-manifest.json -o transformers-stage.json
          grep -q '@huggingface/transformers' transformers-stage.json
          grep -q 'ort-wasm-simd-threaded.jsep.mjs' transformers-stage.json
          grep -q 'ort-wasm-simd-threaded.jsep.wasm' transformers-stage.json
          curl -fsSI http://127.0.0.1:8787/app/vendor/transformers/wasm/ort-wasm-simd-threaded.jsep.mjs -o onnx-loader-headers.txt
          grep -qi 'content-type: text/javascript' onnx-loader-headers.txt
          grep -qi 'content-length:' onnx-loader-headers.txt
          curl -fsSI http://127.0.0.1:8787/app/vendor/transformers/wasm/ort-wasm-simd-threaded.jsep.wasm -o onnx-wasm-headers.txt
          grep -qi 'content-type: application/wasm\|content-type: application/octet-stream' onnx-wasm-headers.txt
          grep -qi 'content-length:' onnx-wasm-headers.txt
          curl -fsS http://127.0.0.1:8787/field/commonweave/seed -o commonweave-pocket-campus.cwseed
          test -s commonweave-pocket-campus.cwseed
          if unzip -l commonweave-pocket-campus.cwseed | grep -q 'model_q4f16.onnx'; then
            echo 'Pocket seed unexpectedly contains the 273 MB SmolLM2 graph' >&2
            exit 1
          fi
          curl -fsS http://127.0.0.1:8787/api/boot-logs > boot-logs.json
      - name: Upload offline-first evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commonweave-v130-smollm2-evidence
          path: |
            commonweave-server.log
            health.json
            installer.html
            worker-headers.txt
            service-worker.js
            loom.html
            lite.html
            smollm2-manifest.json
            transformers-stage.json
            onnx-loader-headers.txt
            onnx-wasm-headers.txt
            commonweave-pocket-campus.cwseed
            boot-logs.json
