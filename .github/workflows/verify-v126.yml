name: Verify Commonweave v1.0.31

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-first:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install local semantic package
        run: |
          npm install --no-audit --no-fund
          for attempt in 1 2 3 4 5; do
            if npm run model:pull; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo 'MiniLM package could not be materialized after five attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 8))
          done
          npm run model:check
      - name: Run local-first regression suite
        run: npm run check
      - name: Start public gateway
        run: |
          PORT=8787 npm start > commonweave-gateway.log 2>&1 &
          echo $! > commonweave-gateway.pid
      - name: Verify Render serves no campus assets
        run: |
          set -euxo pipefail
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/health > gateway-health.json; then break; fi
            sleep 1
          done
          grep -q '1.0.31-local-first-gateway' gateway-health.json
          grep -q '"appVersion":"1.0.31"' gateway-health.json
          grep -q '"appUrl":null' gateway-health.json
          grep -q '"localInstallRequired":true' gateway-health.json
          curl -fsS http://127.0.0.1:8787/ -o gateway.html
          grep -q 'Commonweave runs locally.' gateway.html
          test "$(curl -sS -o gateway-loom.json -w '%{http_code}' http://127.0.0.1:8787/loom/)" = '410'
          grep -q 'Local surface not hosted here' gateway-loom.json
          test "$(curl -sS -o gateway-worker.json -w '%{http_code}' http://127.0.0.1:8787/service-worker.js)" = '410'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"kind":"room-opened"}' http://127.0.0.1:8787/api/boot-log)" = '204'
          curl -sSI http://127.0.0.1:8787/downloads/Commonweave-Mobile-Install-Kit.zip -o gateway-download-headers.txt
          grep -qi '^location: https://github.com/cerbanimo-dev/Commonweave/' gateway-download-headers.txt
      - name: Start local campus
        run: |
          PORT=8788 npm run start:local > commonweave-local.log 2>&1 &
          echo $! > commonweave-local.pid
      - name: Verify offline campus and canonical visuals
        run: |
          set -euxo pipefail
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8788/api/health > local-health.json; then break; fi
            sleep 1
          done
          grep -q '1.0.31-local-campus-runtime' local-health.json
          grep -q '"appVersion":"1.0.31"' local-health.json
          curl -fsS http://127.0.0.1:8788/loom/ -o loom.html
          grep -q '/app/local-first-policy-v131.js' loom.html
          curl -fsS http://127.0.0.1:8788/lite/ -o lite.html
          grep -q '/app/local-first-policy-v131.js' lite.html
          curl -fsS http://127.0.0.1:8788/app/shared/commonweave-parity-runtime.js -o parity-runtime.js
          grep -q '/app/cabinet-visual-v141.html' parity-runtime.js
          if grep -q '/loom/realm/' parity-runtime.js; then
            echo 'Visual route still points to legacy scenes' >&2
            exit 1
          fi
          curl -fsS http://127.0.0.1:8788/app/cabinet-visual-v141.html -o cabinet-visual.html
          grep -q 'CANONICAL VISUAL MODE' cabinet-visual.html
          curl -fsS http://127.0.0.1:8788/app/cabinet-visual-v141.css -o cabinet-visual.css
          grep -q 'aspect-ratio:941/1672' cabinet-visual.css
          curl -fsS http://127.0.0.1:8788/app/cabinet-visual-v141.js -o cabinet-visual.js
          grep -q '/app/realm-console-v140.html' cabinet-visual.js
          grep -q '/app/anarchadia-console-v139.html' cabinet-visual.js
          curl -fsS http://127.0.0.1:8788/app/v130-cabinet-launcher.js -o cabinet-launcher.js
          grep -q 'CommonweaveParity.visualUrl' cabinet-launcher.js
          if grep -q 'showModal' cabinet-launcher.js; then
            echo 'Nested shrunken cabinet modal survived' >&2
            exit 1
          fi
          curl -fsS http://127.0.0.1:8788/service-worker.js -o service-worker.js
          grep -q "CACHE_REVISION='local-first-r20'" service-worker.js
          grep -q '/app/cabinet-visual-v141.html' service-worker.js
          if grep -q '/api/boot-log' service-worker.js; then
            echo 'Service worker still submits telemetry' >&2
            exit 1
          fi
          if grep -q 'networkFirst' service-worker.js; then
            echo 'Service worker still redownloads cabinet assets network-first' >&2
            exit 1
          fi
          curl -fsS http://127.0.0.1:8788/app/local-first-policy-v131.js -o local-first-policy.js
          grep -q 'Next: Tell me your wish or set an intention.' local-first-policy.js
          grep -q 'conversationLinkKey' local-first-policy.js
          grep -q 'legacy-telemetry-blocked' local-first-policy.js
      - name: Upload local-first evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commonweave-v131-local-first-evidence
          path: |
            commonweave-gateway.log
            commonweave-local.log
            gateway-health.json
            gateway.html
            gateway-loom.json
            gateway-worker.json
            gateway-download-headers.txt
            local-health.json
            loom.html
            lite.html
            parity-runtime.js
            cabinet-visual.html
            cabinet-visual.css
            cabinet-visual.js
            cabinet-launcher.js
            service-worker.js
            local-first-policy.js
