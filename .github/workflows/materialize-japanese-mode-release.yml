name: Materialize Japanese mode release

on:
  push:
    branches:
      - agent/japanese-mode-cerbanimo-brand
    paths:
      - '.release-materialize-japanese-mode'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/japanese-mode-cerbanimo-brand
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Reconcile current main
        run: |
          git config user.name "civweave-release-bot"
          git config user.email "civweave-release-bot@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Advance to next patch release
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const current=(await readFile('VERSION','utf8')).trim();
          const match=current.match(/^(\d+)\.(\d+)\.(\d+)$/);
          if(!match)throw new Error(`Unexpected VERSION: ${current}`);
          const version=`${match[1]}.${match[2]}.${Number(match[3])+1}`;
          await writeFile('.japanese-mode-release-version',`${version}\n`);
          await writeFile('VERSION',`${version}\n`);
          const pkg=JSON.parse(await readFile('package.json','utf8'));
          pkg.version=version;
          await writeFile('package.json',`${JSON.stringify(pkg,null,2)}\n`);
          const lock=JSON.parse(await readFile('package-lock.json','utf8'));
          lock.version=version;
          if(lock.packages?.[''])lock.packages[''].version=version;
          await writeFile('package-lock.json',`${JSON.stringify(lock,null,2)}\n`);
          const contract=JSON.parse(await readFile('config/release-contract.json','utf8'));
          contract.canonical.current={version,path:`releases/${version}`,status:'current'};
          await writeFile('config/release-contract.json',`${JSON.stringify(contract,null,2)}\n`);
          console.log(`Advancing ${current} -> ${version}`);
          NODE

      - name: Materialize canonical release
        run: node scripts/materialize-canonical-release.mjs

      - name: Apply release coherence
        run: node scripts/sync-release-coherence-v220.mjs

      - name: Verify Japanese mode and release discipline
        run: |
          node --check public/app/japanese-mode-v1.js
          node --check public/app/working-campus-return-guard-v425.js
          node scripts/verify-japanese-mode-v1.mjs
          node scripts/verify-release-contract.mjs
          node scripts/verify-version-policy.mjs --self-test
          node scripts/verify-canonical-launch-release.mjs
          node scripts/verify-release-version-sync.mjs

      - name: Commit generated release
        run: |
          VERSION="$(cat .japanese-mode-release-version)"
          rm -f .japanese-mode-release-version .release-materialize-japanese-mode .github/workflows/materialize-japanese-mode-release.yml
          git add -A
          git status --short
          git commit -m "Materialize Civweave ${VERSION} Japanese mode release"
          git push origin HEAD:agent/japanese-mode-cerbanimo-brand
